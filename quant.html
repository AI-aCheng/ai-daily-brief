<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>量化投资日报</title>
<style>
:root {
  --bg: #f3ede1;
  --bg-card: #fffdf8;
  --bg-elevated: #ece3d2;
  --text: #211c16;
  --text-secondary: #5f523f;
  --text-muted: #97876f;
  --border: #ddd1ba;
  --border-strong: #c9b99c;
  --accent: #8b2635;
  --accent-2: #1f5132;
  --serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --radius: 10px;
  --gap: 20px;
  --section-1: #b8860b;
  --section-2: #1f5132;
  --section-3: #2c4a7c;
  --section-4: #7a3b5e;
  --section-5: #8b2635;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ===== Hero ===== */
.hero {
  background:
    linear-gradient(180deg, #f7f2e8 0%, #efe7d6 100%);
  padding: 52px 24px 38px;
  text-align: center;
  position: relative;
  border-bottom: 3px solid var(--accent);
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 3px;
  background: var(--section-1);
}
.hero-content { max-width: 900px; margin: 0 auto; }
.hero-badge {
  display: inline-block;
  font-family: var(--serif);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--accent);
  border: 1px solid var(--border-strong);
  padding: 4px 16px;
  border-radius: 2px;
  margin-bottom: 18px;
}
.hero h1 {
  font-family: var(--serif);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text);
  margin-bottom: 6px;
}
.hero-date {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 30px;
}
.hero-stats {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
}
.hero-stat { text-align: center; padding: 0 32px; }
.hero-stat-number {
  font-family: var(--serif);
  font-size: 40px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.1;
}
.hero-stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.hero-stat-divider { width: 1px; height: 52px; background: var(--border-strong); }
.hero-section-stats {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 26px;
}
.hero-section-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 7px 15px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: var(--text);
}
.hero-section-chip:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
.hero-section-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.hero-section-chip .count { font-weight: 700; color: var(--accent); }

/* ===== Data note ===== */
.data-note {
  background: #fbf7ee;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 9px 16px;
  text-align: center;
  font-size: 12.5px;
}

/* ===== Anchor Nav ===== */
.anchor-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(243,237,225,0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.anchor-nav a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 16px;
  font-size: 14px;
  color: var(--text-secondary);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}
.anchor-nav a:hover, .anchor-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
.anchor-nav a .nav-dot { width: 8px; height: 8px; border-radius: 50%; }
.anchor-nav a .nav-count {
  font-size: 12px;
  background: var(--bg-elevated);
  padding: 1px 7px;
  border-radius: 10px;
  color: var(--text-muted);
}

/* ===== Main Content ===== */
.main { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
.section { margin-bottom: 54px; scroll-margin-top: 60px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
}
.section-icon {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.section-title { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.section-count {
  font-size: 13px; color: var(--text-muted);
  background: var(--bg-elevated); padding: 3px 12px; border-radius: 12px;
}

/* ===== Card Grid ===== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: var(--gap);
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 22px 22px 20px;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.card:hover { border-color: var(--border-strong); transform: translateY(-3px); box-shadow: 0 6px 22px rgba(80,60,30,0.12); }
.card[data-section="1"] { border-left-color: var(--section-1); }
.card[data-section="2"] { border-left-color: var(--section-2); }
.card[data-section="3"] { border-left-color: var(--section-3); }
.card[data-section="4"] { border-left-color: var(--section-4); }
.card[data-section="5"] { border-left-color: var(--section-5); }

.card-number {
  position: absolute;
  top: 16px; right: 18px;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  color: var(--border-strong);
  line-height: 1;
}
.card-title {
  font-family: var(--serif);
  font-size: 16.5px;
  font-weight: 700;
  line-height: 1.5;
  margin-bottom: 12px;
  padding-right: 44px;
  color: var(--text);
}
.card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; flex-wrap: wrap; }
.card-source {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--text-secondary);
  background: var(--bg-elevated); padding: 3px 10px; border-radius: 4px;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-time { font-size: 12px; color: var(--text-muted); }
.card-summary {
  font-size: 14px; color: var(--text-secondary); line-height: 1.75;
  flex-grow: 1; margin-bottom: 15px;
}
.card-link {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; font-weight: 600; color: var(--accent-2);
  text-decoration: none; transition: gap 0.2s;
}
.card-link:hover { gap: 8px; color: var(--accent); }

/* ===== Footer ===== */
.footer {
  text-align: center; padding: 38px 24px;
  border-top: 1px solid var(--border); color: var(--text-muted);
  font-size: 13px; line-height: 1.9;
}
.footer strong { color: var(--text-secondary); }
.footer a { color: var(--accent-2); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .hero { padding: 36px 16px 26px; }
  .hero h1 { font-size: 28px; }
  .hero-stat { padding: 0 18px; }
  .hero-stat-number { font-size: 30px; }
  .anchor-nav { padding: 0 8px; overflow-x: auto; justify-content: flex-start; }
  .anchor-nav a { padding: 10px 12px; font-size: 13px; }
  .main { padding: 24px 12px 60px; }
  .card-grid { grid-template-columns: 1fr; }
  .card { padding: 18px; }
}
@media (max-width: 480px) {
  .hero-section-stats { gap: 8px; }
  .hero-section-chip { padding: 6px 10px; font-size: 12px; }
  .hero-stat-divider { display: none; }
}
</style>
</head>

const BUILD_INFO = {"date": "2026-08-21", "build": "2026-08-21 08:01", "is_fallback": true, "sina_ok": true, "arxiv_ok": false};

// ===== 北京时间人话格式化（按 UTC+8，不受浏览器时区影响）=====
function fmtBeijing(iso) {
  if (!iso || !iso.includes("T")) {
    const p = (iso || "").split("-").map(Number);
    return p.length === 3 ? `${p[1]}月${p[2]}日` : iso;
  }
  const d = new Date(iso);
  let h = d.getUTCHours() + 8;
  const day = d.getUTCDate();
  const mon = d.getUTCMonth() + 1;
  const mi = String(d.getUTCMinutes()).padStart(2, "0");
  h = ((h % 24) + 24) % 24;
  return `${mon}月${day}日 ${String(h).padStart(2, "0")}:${mi}`;
}

document.getElementById("dataNoteText").textContent = BUILD_INFO.is_fallback
  ? `数据来源：新浪财经快讯、arXiv 量化金融（q-fin）实时抓取（本次部分失败，显示最近一期缓存）；「工具与平台」版块为各平台官方栏目聚合。构建于 ${BUILD_INFO.build} 北京时间。`
  : `数据来源：新浪财经快讯、arXiv 量化金融（q-fin）实时抓取，更新于 ${BUILD_INFO.date}；「工具与平台」版块为各平台官方栏目聚合。构建于 ${BUILD_INFO.build} 北京时间。`;
const total = REPORT.sections.reduce((s, x) => s + x.items.length, 0);

document.getElementById("footerTotal").textContent = total;

const heroStats = document.getElementById("heroSectionStats");
REPORT.sections.forEach(s => {
  const a = document.createElement("a");
  a.className = "hero-section-chip";
  a.href = "#sec-" + s.key;
  a.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.name} <span class="count">${s.items.length}</span>`;
  heroStats.appendChild(a);
});

const nav = document.getElementById("anchorNav");
REPORT.sections.forEach(s => {
  const a = document.createElement("a");
  a.href = "#sec-" + s.key;
  a.dataset.key = s.key;
  a.innerHTML = `<span class="nav-dot" style="background:${s.color}"></span>${s.name}<span class="nav-count">${s.items.length}</span>`;
  nav.appendChild(a);
});

const main = document.getElementById("main");
const secIndex = { market:1, strategy:2, platform:3, research:4, policy:5 };
REPORT.sections.forEach(s => {
  const idx = secIndex[s.key];
  const sec = document.createElement("section");
  sec.className = "section";
  sec.id = "sec-" + s.key;
  sec.innerHTML = `
    <div class="section-header">
      <div class="section-icon" style="background:${s.color}1a;color:${s.color}">${s.icon}</div>
      <div class="section-title">${s.name}</div>
      <div class="section-count">${s.items.length} 条</div>
    </div>
    <div class="card-grid"></div>`;
  const grid = sec.querySelector(".card-grid");
  s.items.forEach(it => {
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.section = idx;
    card.innerHTML = `
      <div class="card-number">${it.n}</div>
      <h3 class="card-title">${it.title}</h3>
      <div class="card-meta">
        <span class="card-source">🔗 ${it.source}</span>
        <span class="card-time">${fmtBeijing(it.time)}</span>
      </div>
      <p class="card-summary">${it.summary}</p>
      <a class="card-link" href="${it.url}" target="_blank" rel="noopener noreferrer">查看原文 →</a>`;
    grid.appendChild(card);
  });
  main.appendChild(sec);
});

const navLinks = [...nav.querySelectorAll("a")];
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const k = e.target.id.replace("sec-", "");
      navLinks.forEach(a => a.classList.toggle("active", a.dataset.key === k));
    }
  });
}, { rootMargin: "-45% 0px -50% 0px" });
REPORT.sections.forEach(s => obs.observe(document.getElementById("sec-" + s.key)));
</script>
