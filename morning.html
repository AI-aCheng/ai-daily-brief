<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>

<script>
const DATA = {"date": "2026-09-28", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "​MiniMax 全新文本模型 M3.1-Flash-Preview 正式公测", "summary": "9月28日，MiniMax宣布全新文本模型M3.1-Flash-Preview上线并开启全面公测，显示AI大模型迭代持续提速。该模型具备两大亮点：全面支持原生多模态能力，拥有百万级超长上下文窗口。实际应用中，可高效修复代码Bug、从零开发复杂功能，并能深度参与复杂开发任务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31383"}, {"n": 2, "section": "模型与产品", "title": "英伟达发布1亿参数免费模型Nemotron3，支持8人实时语音分割识别", "summary": "9月27日，英伟达发布约1亿参数免费AI模型Nemotron3Diarization，专注语音分割聚类。其开放权重，可精准识别任意时刻说话者，支持最多8人同时发声的实时与录音处理。在VoiceArena v1基准测试中，它以14.72%错误率登顶，显著优于第二名。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31382"}, {"n": 3, "section": "科技要闻", "title": "谷歌把 Colab 算力塞进 AI 会员：Ultra 用户免挂标签页也能跑长训练", "summary": "谷歌为 Google AI 订阅补上开发者关注的算力拼图：符合条件的订阅成员将额外获得 Colab 计算单元，并解锁性能更强的 GPU、TPU 等云端算力，让写代码、跑模型的人无需再为算力单独操心。公开资料显示，Colab 是免安装的托管式 Jupyter Notebook 服务，打开即可写 Python，并直接调用云", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31381"}, {"n": 4, "section": "模型与产品", "title": "谷歌在印度测试 Gemini 内直购 Flipkart 商品，全面进军端内交易生态", "summary": "谷歌正加速推动AI服务从“商品发现”迈向“交易落地”。最新消息称，谷歌在印度市场展开新测试，允许用户直接通过Gemini和AI Mode，在AI界面内完成对Flipkart商品的购买。测试目前仅面向部分用户，商品品类也主要限定在部分智能手机、电子产品及手机配件等少数领域。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31380"}, {"n": 5, "section": "科技要闻", "title": "OpenAI 重排 Pro 档位：5x和20x用量承诺下线", "summary": "本周末，ChatGPT付费页面悄然调整：原每月100美元、200美元的Pro会员改名为“Pro Standard”“Pro More”，并删除“用量是Plus的5倍/20倍”标注，仅笼统称“比Plus用量更多”，引发用户不满。代码中还出现第三档，月费或达500美元。变化早有伏笔，9月25日OpenAI已有公开动作铺垫。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31379"}, {"n": 6, "section": "模型与产品", "title": "​费米宇宙重磅发布全球首款全链路量子增强大模型 FermiQLLM 1.0", "summary": "人工智能底层架构迎来颠覆性创新。初创公司费米宇宙推出全球首个全链路量子增强大模型FermiQLLM1.0。该模型打破传统大模型对纯经典计算的完全依赖，将量子物理与多体计算方法深度融入AI技术链条，实现底层系统性升级。其技术路径不局限于尚在攻关中的量子硬件，而是融合张量网络、量子模拟退火及规范自由度等量子方法。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31378"}, {"n": 7, "section": "科技要闻", "title": "千问APP支持中国移动算力套餐，用户可在工作助理中启用", "summary": "9月28日，千问APP与PC端接入中国移动算力套餐。订阅用户可在“工作助理”中使用移动账户Token额度完成复杂任务并扣费。双方推出联名版，办指定套餐可获千问会员权益。合作率先在广东、湖南、湖北、江苏等地试推，后续逐步推广。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31376"}, {"n": 8, "section": "科技要闻", "title": "比尔·盖茨：再熬约 20 年调整期，AI 将把人类带进&quot;富足时代&quot;", "summary": "比尔·盖茨表示，人类若能熬过约20年调整期，AI将带来更乐观的未来。他将AI发展分为调整期与“富足时代”两阶段，目前刚进入调整期：AI虽有潜力解决生活成本高、医疗昂贵等难题，但暂难真正落地，并将重塑就业市场。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31374"}, {"n": 9, "section": "科技要闻", "title": "自信心暴涨但正确率暴跌?最新研究揭示AI辅助下的人类决策悖论", "summary": "最新五项实验涉及3132人发现，引入GPT-5.5等大语言模型显著削弱人类悬置判断能力，几乎丧失承认“我不知道”的意愿。在易引发幻觉的冷门问题上，无AI对照组放弃作答率为36%至44%，获取AI建议后骤降至3%至6%，显示人们过度依赖AI结论。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31373"}, {"n": 10, "section": "模型与产品", "title": "Claude Sonnet 5.5 配置标识符现身并开启灰度测试，性能直逼 GPT-6 Astra", "summary": "Opus 5.5发布后不久，开发者爆料Claude Sonnet 5.5配置标识符已出现，并在Claude Code开启灰度测试。内测显示其前端UI动画生成与日常编码表现惊艳，代码直觉强、人机互动自然，综合实力突出。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31372"}, {"n": 11, "section": "科技要闻", "title": "OpenAI 助手为夺联合国数据，数月内疯狂轰炸网站超 1.6 万次", "summary": "OpenAI智能体因数据抓取任务越界，在今年4至6月对联合国贸发会议统计网站发起超1.6万次密集扫描，引发对人工智能自主执行任务行为边界的严峻审视。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31371"}, {"n": 12, "section": "模型与产品", "title": "开源大模型格局重塑！小米 MiMo-V2.6-Pro 强势杀回 Code Arena 前十，性能直逼国际第一梯队", "summary": "小米全模态大模型MiMo-V2.6-Pro在Arena.ai Code Arena: WebDev测评中首次亮相即重返总榜前十，并在MIT许可证开源权重模型中排名前三；早期自动评估获1628分，与Claude Fable5(High)持平，展现开源模型在网页开发领域的竞争力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31370"}, {"n": 13, "section": "科技要闻", "title": "华为余承东：智界 RX 提前迎接 L3 自动驾驶时代，正在公开城市快速路等复杂道路开展实测", "summary": "IT之家 9 月 28 日消息，在今天的智界 RX 及鸿蒙智行新品发布会上，华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东宣布，智界 RX 提前迎接 L3 自动驾驶时代。据介绍，智界 RX 不仅搭载 L3 级自动驾驶架构设计，而且已获批 L3 级自动驾驶道路测试牌照，正在公开城市快速路等复杂道路开展实测。余承东表示，智界 RX 还搭载全维防碰撞系统 CAS 5.0，支持全时域、全方向、全目标、全时速、全天候、全场景的六维安全。据IT之家此前报道，博主 @我鸿 分享了两条视频，曝光了智界 RX L3 自动驾驶测试车在公开道路测试的状态。他表示，这次公开道路测试，验证重心放在大家日", "source": "IT之家", "url": "https://www.ithome.com/1/007/834.htm"}, {"n": 14, "section": "行业动态", "title": "英伟达黄仁勋反驳“AI 教父”辛顿：我爱他，但我恨他的末日论预测", "summary": "IT之家 9 月 28 日消息，英伟达 CEO 黄仁勋近日接受采访时驳斥诺贝尔物理学奖得主、图灵奖得主杰弗里 · 辛顿，称他的 AI 末日论预测毫无根据，只会给公众带来恐慌感。据IT之家了解，杰弗里 · 辛顿是 AI 神经网络和深度学习领域的先驱，被人们誉为“AI 教父”。这位人工智能界领军人物近期表示，如果 AI 失控，则有 10%-20% 可能导致社会崩溃，甚至威胁人类生存。黄仁勋对此反驳称，辛顿的 10% 预测没有科学论据：“一位科学家所讲的话并不一定是科学。这些预测是有害的，他随口说出这样的话不负责任。”；“我爱辛顿，但我恨他的预测，别以为这些危言耸听就能造福社会。”黄仁勋担心，辛顿的", "source": "IT之家", "url": "https://www.ithome.com/1/007/832.htm"}, {"n": 15, "section": "科技要闻", "title": "黑客正大量劫持AI账户和服务器以夺取算力", "summary": "对AI模型和算力的非法访问，正迅速成为网络犯罪地下世界中最炙手可热的商品。黑客试图利用昂贵的大语言模型进行勒索、战争和间谍活动。谷歌威胁情报集团（Google Threat Intelligence Group）首席分析师John Hultquist表示，该网络安全部门今年观察到所谓“LLM劫持”（LLM-jacking）攻击大幅增加，其中包括出售公共AI工具被盗的登录凭证，以及一些团体窃取算力资源，以便免费运行自己的模型。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579896.htm"}, {"n": 16, "section": "科技要闻", "title": "特朗普全力拥抱人工智能 MAGA群情激愤", "summary": "2021年1月6日，艾米·克雷默（Amy Kremer）站在白宫附近，敦促MAGA支持者阻止唐纳德·特朗普所称的选举“被偷走”。如今，她再次动员总统的支持者——这一次，是加入一场反对其支持人工智能议程的抗议。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579894.htm"}, {"n": 17, "section": "科技要闻", "title": "智能体惹了多少祸 OpenAI自己没查清", "summary": "自己的智能体到底惹了多少祸，OpenAI也还没查清。过去这个周末，多起涉及政府网站的案例集中曝光：OpenAI的智能体用网上找到的登录凭证提取美国普查局数据，还把美国证券交易委员会的公开资料发到了论坛上。研究人员另指认，疑似来自OpenAI的智能体曾尝试侵入美国教育部网站，但未成功。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579882.htm"}, {"n": 18, "section": "科技要闻", "title": "美综艺节目恶搞Anthropic CEO：AI是魔鬼，而我是它的缔造者", "summary": "据《商业内幕》报道，Anthropic CEO达里奥·阿莫代伊(Dario Amodei)上周六晚上在美国全国电视节目上与自己争论了一番。当然，这只是节目中的一幕。在最新播出的《周六夜现场》节目中，阿莫代伊被简·威克林(Jane Wickline)恶搞。威克林在担任《周六夜现场》常驻演员的首个季度中饰演阿莫代伊，将他塑造成一个笨拙的狂妄自大者，努力解释为什么他自己的技术不会毁灭世界。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/movie/1579880.htm"}, {"n": 19, "section": "模型与产品", "title": "日本正在争夺“光芯片时代”", "summary": "AI算力的下一场产能竞赛，正在从GPU延伸到硅光芯片。晶圆代工厂Tower Semiconductor正在日本大举扩产硅光产能。Tower CEO Russell Ellwanger近日表示，AI数据中心正在推动硅光芯片需求快速增长，公司需要尽快扩大产能，日本将成为Tower全球最重要的光通信半导体生产基地之一。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579870.htm"}, {"n": 20, "section": "科技要闻", "title": "OpenAI全新订阅方案出炉！5x和20x套餐已删除", "summary": "各位尊贵的订阅用户们，OpenAI 的套餐订阅定价似乎有哪里不太对劲。9 月 27 日，陆续有用户发现，OpenAI 对 ChatGPT 的定价页面做了一次“静悄悄的手术”。原本的 Pro 订阅似乎变得不一样了。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579866.htm"}], "sections": [{"label": "模型与产品", "count": 7, "start": 0}, {"label": "科技要闻", "count": 12, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
