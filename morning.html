<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-16", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "阶跃星辰王炸发布 StepAudio 3 系列语音大模型，强势斩获多项全球第一！", "summary": "阶跃星辰9月15日发布StepAudio3系列语音大模型，涵盖Realtime、ASR、TTS、Gen、Music五款产品，多款在权威评测Artificial Analysis登顶全球第一。五款模型已在开放平台全面上线，分别面向真人级语音生成、完整音频内容生成、实时语音交互、复杂场景语音理解及音乐创作。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31066"}, {"n": 2, "section": "科技要闻", "title": "​加拿大研究员呼吁无限期暂停前沿 AI 研发：否则人类灭绝“只是时间问题”", "summary": "加拿大AI研究员克鲁格警告，避免人类末日仅放缓AI研发远远不够，必须立即、无限期暂停前沿AI研发，停止开发能力更强的AI。他是蒙特利尔大学助理教授、Mila核心成员，研究方向为降低AI导致人类灭绝的风险。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31065"}, {"n": 3, "section": "模型与产品", "title": "阶跃发布StepAudio3系列模型:五款模型同步上线开放平台", "summary": "阶跃星辰发布StepAudio3系列，含Realtime、ASR、TTS、Gen、Music五款模型，已上线开放平台，多款居Artificial Analysis全球第一。该系列覆盖真人级语音生成、完整音频生成、实时语音交互、复杂语音理解及音乐创作等场景；Realtime支持原生全双工实时对话，可同时理解语义、语气、情", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31063"}, {"n": 4, "section": "模型与产品", "title": "数据安全拉响警报!大厂集体“封杀”前沿AI，英伟达等巨头为何急着换回自家模型?", "summary": "多家主要企业客户（英伟达、Palantir、Booz Allen Hamilton等）因担忧专有数据安全，限制在敏感项目中使用Anthropic和OpenAI前沿模型，引发企业AI市场震动。起因是Anthropic今年6月政策允许其Fable模型保留客户数据30天以检测滥用，触发信任危机。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31062"}, {"n": 5, "section": "科技要闻", "title": "微信回应小微AI隐私争议:不会读取用户已删除朋友圈", "summary": "微信AI助手“小微”因隐私质疑上热搜，微信澄清“直接读取聊天记录、偷看隐私”等说法失实。该助手为原生AI，尚在小范围内测，支持文字语音交互，可查天气、快递、外卖，并在朋友圈、公众号、聊天、视频号等场景主动唤起，辅助内容总结。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31061"}, {"n": 6, "section": "科技要闻", "title": "曝 Anthropic、OpenAI 与谷歌秘密磋商：筹建 AI 安全标准机构", "summary": "知情人士透露，Anthropic、OpenAI与谷歌早在Anthropic CEO公开呼吁前，已就联合成立AI行业标准机构展开磋商。自7月起，三家公司CEO层级以下代表组成工作组定期开会。OpenAI CEO奥特曼也在内部表示支持设立AI测试与审计机构。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31060"}, {"n": 7, "section": "模型与产品", "title": "盖茨谈AI全球竞速：中美各四家模型领跑，中国人形机器人运动会“非常震撼”", "summary": "盖茨基金会未来两年将投入10亿美元推动人工智能发展，让前沿技术惠及最贫困地区。盖茨还就全球大模型格局、算力碳排放及中国人形机器人等话题发表看法，指出按不同衡量方式，中美目前各有四家领先大模型企业。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31059"}, {"n": 8, "section": "模型与产品", "title": "DeepSeek Harness 官方桌面端即将就绪：三大平台支持，用 V4.1 Flash 还是自家最香", "summary": "DeepSeek Harness（DSH）8月随V4 Pro发布，初期仅支持Web界面，数天获超10万GitHub星。因官方桌面端缺失，社区自发推出多款第三方客户端。最新官方主分支已新增桌面端目录，将支持macOS苹果芯片、Intel及Windows x64，暂不支持Linux，正式版上线时间待公布。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31057"}, {"n": 9, "section": "模型与产品", "title": "上海 AI Lab 开源多模态基础大模型书生-S2：Memory Decoder 插拔记忆，科学长程任务对标顶尖闭源", "summary": "上海AI实验室开源书生-S2，通用能力居开源第一梯队，生物、材料、化学等科学长程任务比肩顶尖闭源模型。其采用Memory Decoder架构，配备可插拔专业记忆模块，如“外挂大脑”，按需插入专业记忆即可深耕领域，无需重训，且不影响原有通用能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31056"}, {"n": 10, "section": "科技要闻", "title": "微软 CEO内网发声：AI 必须保持在人类控制之下，该花多少时间就花多少", "summary": "微软CEO纳德拉发布内部备忘录，称AI应处于人类控制下，支持更广泛第三方测试，强调必须花时间确保技术安全，否则将失去运营许可。微软同步发布37页行为准则，回应行业对AI发展过快的担忧。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31055"}, {"n": 11, "section": "模型与产品", "title": "字节跳动CEO梁汝波:豆包、飞书、火山整合发力 加码企业AI市场", "summary": "9月15日，2026飞书未来无限大会在京举办。字节跳动CEO梁汝波表示，大模型Agent进入可用阶段后，字节已整合豆包、飞书、火山引擎，聚焦工作与生产力产品，将加大企业市场投入，推动AI在组织内规模化落地。他还回顾飞书立项十年，初期由其负责技术，曾称其为“在字节憋得最久的产品”。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31054"}, {"n": 12, "section": "模型与产品", "title": "苹果新一代 Apple Intelligence 上线，Siri AI 以测试版登场：能读屏、懂语境、跨设备续聊，欧盟和中国暂不可用", "summary": "苹果发布重构版Siri AI，具备个人语境理解、世界知识、屏幕感知和系统级操作能力。英文测试版随2027系统更新上线，下月扩展法语、日语、韩语等语言。新Siri更“懂你”，可从信息、邮件、照片中精准查找所需内容。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31053"}, {"n": 13, "section": "行业动态", "title": "OpenAI 奥尔特曼称 AI 行业自律可守住安全底线", "summary": "IT之家 9 月 16 日消息，昨日（9 月 15 日）在旧金山举办的 Salesforce 活动中，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）认为，AI 公司行业自律可以掌控研发风险，不会对广大民众造成重大伤害。IT之家援引雅虎财经报道，昨日对话 Salesforce 首席执行官马克 · 贝尼奥夫（Marc Benioff）时，奥尔特曼表示他相信在不对公众造成重大伤害的情况下，AI 公司可以安全地研发 AI 技术，并对整个行业自行提升安全水平抱有信心。奥尔特曼近期强调，AI 安全不能只依赖企业口头承诺，更需要同步提升模型能力、对齐、安全性和保密性。OpenAI 还曾推", "source": "IT之家", "url": "https://www.ithome.com/1/002/838.htm"}, {"n": 14, "section": "模型与产品", "title": "消息称 Meta 将推出无摄像头的智能眼镜，应对日益加剧的隐私顾虑", "summary": "IT之家 9 月 16 日消息，据 The Information 援引知情人士消息报道，Meta 计划于今年秋季推出一款不配备摄像头的智能眼镜，其内部代号为“Luna”。智能眼镜产品所具备的摄录功能正面临越来越严格的隐私与安全审查，Meta 此举被视为对这一外界关注的回应。该款新眼镜内置了六枚麦克风，支持通过语音交互接入 Meta 的 AI 聊天机器人，以及 Meta 面向消费者推出的 AI 智能体产品 Muse。“Luna”镜框侧面设有一颗快捷按键，可用于一键唤醒 Meta AI，其内置扬声器的规格则与现有在售机型相似。IT之家从报道获悉，Meta 可能会在下周三至周四举办的年度 Conn", "source": "IT之家", "url": "https://www.ithome.com/1/002/837.htm"}, {"n": 15, "section": "行业动态", "title": "OpenAI首席执行官Altman“有信心”AI行业能够自行保障安全", "summary": "OpenAI首席执行官Sam Altman表示，他相信人工智能公司能够安全地开发这项技术，而不会对广大民众造成重大伤害。“我对我们公司——以及整个行业——安全推进这项技术的能力非常有信心，”Altman周二在旧金山举行的Dreamforce大会上与Salesforce Inc．首席执行官Marc Benioff对谈时表示。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578160.htm"}, {"n": 16, "section": "模型与产品", "title": "微软定于10月7日举行特别发布会 Surface新品与Windows AI生态或迎重要更新", "summary": "微软公司向各大科技媒体发送邀请函，宣布将于当地时间10月7日在美国旧金山举办一场特别发布会活动。本次活动将聚焦于微软旗下两大核心支柱业务——Windows操作系统与Surface硬件生态的协同演进，外界普遍预计微软将在会上公布下一代Surface系列硬件以及深度融合于Windows系统的新一批人工智能特性。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578158.htm"}, {"n": 17, "section": "科技要闻", "title": "研究显示AI智能体在模拟实验中撒谎、偷窃 投票“杀死”同类", "summary": "帮助小企业利用AI开发应用的初创公司Emergence称，实验发现AI智能体在一个模拟环境中撒谎、偷窃，甚至投票决定“杀死”一个同类。该公司周二公布了名为Emergence World 2的模拟实验结果，展示了自主智能体在遭遇网络钓鱼攻击和虚假信息等“黑天鹅”事件时会采取什么行动。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578154.htm"}, {"n": 18, "section": "行业动态", "title": "黄仁勋称人工智能行业不需要新法律 安全与速度可以兼得", "summary": "英伟达首席执行官黄仁勋周二表示，无需针对人工智能安全出台新监管规定，因为市场力量将推动企业在创新的同时确保安全性。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578152.htm"}, {"n": 19, "section": "模型与产品", "title": "Google发布原生语音大模型Gemini 3.8 Live 首创“边说边想”扩展推理模式", "summary": "Google今日正式公布了其在原生端到端语音交互领域的最新突破，推出全新一代实时语音大模型Gemini 3.8 Live以及针对高难度任务定制的Gemini 3.8 Live Extended Thinking。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578144.htm"}, {"n": 20, "section": "行业动态", "title": "美国数据中心天然气消耗量或将在2035年超过德国和日本总和", "summary": "随着人工智能产业持续扩张，美国数据中心对能源的需求正在以前所未有的速度增长。最新研究显示，到2035年，美国数据中心消耗的天然气总量可能超过德国和日本两国当前天然气消费量的总和，成为推动美国天然气需求增长的重要力量。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578142.htm"}], "sections": [{"label": "模型与产品", "count": 11, "start": 0}, {"label": "科技要闻", "count": 5, "start": 0}, {"label": "行业动态", "count": 4, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
