<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-08-30", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "腾讯混元大模型王炸升级:770B旗舰新版Hy4preview震撼开源，直奔开源第一梯队", "summary": "腾讯混元发布旗舰模型预览版Hy4preview，总参数770B、激活参数49B，上下文长度支持1M。该模型在代码、办公、科学等真实生产力任务中表现卓越，居开源模型第一梯队，内部盲测综合表现优于同类竞品，并已在腾讯内部多领域应用。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30697"}, {"n": 2, "section": "科技要闻", "title": "微博通报孙宇晨谷爱凌聊天记录系 AI 炮制，造谣账号遭永久关闭", "summary": "微博公告称，网传孙宇晨与谷爱凌聊天记录系捏造谣言，已处置相关内容。孙宇晨前女友曾颖否认发布裸照，指全套记录为AI生成，并曝造谣者买流量推热搜、黑产痕迹明显，涉事账号全站仅关注一人。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30696"}, {"n": 3, "section": "模型与产品", "title": "蚂蚁集团携手中金公司推出首个金融增强大模型Ling-3.0-flash-Fin", "summary": "蚂蚁集团联合中金公司等发布蚂蚁百灵首个金融增强大模型Ling-3.0-flash-Fin。该模型沿用原有架构参数，经海量金融语料深度训练，显著强化投研能力，聚焦信息检索等四大核心能力，多项基准测试显示专业表现突出，通用能力同步提升。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30695"}, {"n": 4, "section": "模型与产品", "title": "腾讯混元发布开源旗舰模型Hy4preview，总参数770B、上下文1M", "summary": "腾讯混元8月28日发布开源旗舰大模型Hy4preview，总参数770B、激活参数49B，上下文1M，定位真实生产力。模型已开源至HuggingFace、GitHub、ModelScope等，并上线腾讯云TokenHub、OpenRouter，可在WorkBuddy/CodeBuddy、元宝、ima体验。其依托软工、游", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30694"}, {"n": 5, "section": "模型与产品", "title": "Anthropic重磅发布模型硬件标准MHS，AI Agent正式迈向实体操控", "summary": "Anthropic推出模型硬件标准MHS，旨在让大模型驱动的AI智能体安全、快捷操控物理设备，被视为跨越虚拟与现实的关键一步。该标准源自与霍华德·休斯医学研究所Janelia园区的合作，已向首批科研实验室和先进制造商开放预览，实际应用效率提升显著。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30693"}, {"n": 6, "section": "模型与产品", "title": "Anthropic 推出 MHS 硬件标准，首次重拳杀入物理 AI 赛道", "summary": "8月27日，Anthropic以研究预览形式推出“模型硬件标准”（MHS），被路透社、CNBC等解读为首次公开进军具身智能与物理AI领域。该标准类似MCP，作为统一控制与通信标准，为AI装“身体”，使其能操控自动驾驶、机械臂等物理设备，感知世界、执行动作并持续学习。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30692"}, {"n": 7, "section": "模型与产品", "title": "阿里发布全新 Qoder:从 AI 编程工具升级为面向所有人的智能体工作台", "summary": "阿里发布全新Qoder，将AI编程IDE升级为以Coding能力为核心底座的智能体工作台。用户用自然语言描述目标，即可由其理解上下文、制定计划、调用工具、执行并验证，全程可查看、调整或接管。该IDE全球发布一年累计用户超600万，服务超10万家企业。新版本背后是三重协作范式转移。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30691"}, {"n": 8, "section": "模型与产品", "title": "Midjourney V8.2重磅上线图像编辑模型，全功能支持指令微调与画布扩展", "summary": "Midjourney近日开放测试首款V8.2图像编辑模型，打破仅靠文本生成图像的单一模式，深度融合指令微调、多图参考、局部重绘等功能，为创作者提供更精准、可控的专业级视觉创作体验。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30690"}, {"n": 9, "section": "模型与产品", "title": "小鹏第二代VLA大模型迎来首次重大升级，综合安全能力暴增20倍", "summary": "8月27日，小鹏举办“TIME 时间”物理AI分享会，第二代VLA大模型首次重大升级，XOS6.3.0将在小鹏G9L全球首发。升级核心是让AI理解时间，从静态3D空间理解跃升至动态4D时空理解，并扩大端侧模型参数量，持续验证自动驾驶Scaling Law。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30689"}, {"n": 10, "section": "模型与产品", "title": "量子技术与AI迎来深度融合！国内首个“玄幂”量子增强大模型正式发布", "summary": "国光量超人工智能团队将前沿量子技术引入大语言模型决策与推理核心，推出面向科研学术领域的“玄幂”大模型家族。该模型在科研科普、任务路由、智能体决策等垂直任务中展现独特竞争优势，助力大语言模型突破纯经典计算物理边界。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30688"}, {"n": 11, "section": "模型与产品", "title": "谷歌升级搜索 AI 模式:支持300多家平台机票追踪与酒店预订", "summary": "谷歌8月27日升级AI模式，新增航班价格追踪、酒店预订辅助及积分/里程价格查看等功能，用户输入出行时间与目的地即可整合信息。此举推动AI模式从信息检索转向旅行规划与交易履行，加速打造全流程AI旅行代理。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30687"}, {"n": 12, "section": "科技要闻", "title": "OpenAI携手苹果前高管硬刚老东家，申请永久终止商业机密案", "summary": "8月27日，OpenAI及苹果前高管唐坦、刘畅与Jony Ive创办的io Products向法院请愿，要求“带偏见地驳回”苹果提起的商业秘密窃取诉讼，以彻底阻止其再诉。此举显示科技巨头与生成式AI新锐在顶尖人才流动和核心技术产权上的法律博弈升级，案件源于数周前苹果的诉讼。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30686"}, {"n": 13, "section": "科技要闻", "title": "少 1 个展开步骤：部分谷歌搜索测试默认进入 AI 模式，下移传统蓝链搜索结果", "summary": "IT之家 8 月 30 日消息，搜索行业媒体 Search Engine Roundtable 于 8 月 28 日报道，谷歌搜索正测试将 AI 概览直接扩展为更接近 AI Mode 的回答界面。与此前仅展示简短摘要、由用户点击“展开”后查看完整内容的方式相比，测试版本会在部分查询中默认加载较长的 AI 回答，并同时打开“尽情提问”（Ask anything）追问框。IT之家附上现有相关查询界面如下：当前 AI 概览界面该媒体指出这项变化，导致进一步下移传统带“蓝色链接”的自然搜索结果，现阶段可确认的是界面层级发生变化，尚不能据此量化对网站访问量、搜索广告展示或用户停留时长的实际影响。谷歌发言", "source": "IT之家", "url": "https://www.ithome.com/0/996/062.htm"}, {"n": 14, "section": "模型与产品", "title": "荣耀 Magic8 系列手机首发的 AI 追色功能迎升级，新增支持类“调色盘”新玩法", "summary": "IT之家 8 月 30 日消息，据荣耀研发工程师 @荣耀曹工 分享，荣耀 Magic8 系列手机上首发的 AI 追色功能，云端算法一直在持续升级。他透露，AI 追色的调节功能最近还上线了一个类似“调色盘”的新玩法，可以分“影调”和“颜色”来调整等级。另外，随着 OS 大版本和新产品推进，相机和图库在功能和设计上也一直在持续迭代上线。IT之家了解到，去年 9 月，荣耀官宣与高通联合研发的高效能端侧 AI 模型方案，带来了新一代向量化检索技术，以及更准确高效的端侧多模态感知能力。用户只需一句话驱动智能体，就可以实现“检索目标图片、关键色提取、对目标图片精准追色”的一系列动作。", "source": "IT之家", "url": "https://www.ithome.com/0/996/058.htm"}, {"n": 15, "section": "科技要闻", "title": "GTA 6确认不使用生成式人工智能 也不会加入微交易", "summary": "Rockstar确认，《GTA 6》将不会包含微交易或生成式人工智能功能，不过，升级后的《GTA Online》很可能会呈现出不同情况。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/game/1575520.htm"}, {"n": 16, "section": "科技要闻", "title": "美光员工以罢工相威胁 要求分享AI热潮红利", "summary": "随着人工智能热潮推动存储芯片需求激增，DRAM和NAND闪存制造商的利润大幅攀升。在SK海力士和三星已向员工发放丰厚奖金后，美光科技的工会成员开始质疑：公司何时才能让员工分享这波红利。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575514.htm"}, {"n": 17, "section": "科技要闻", "title": "韩国拟向全民免费开放生成式AI服务 不设词元使用上限", "summary": "韩国政府正准备向全国民众免费提供生成式人工智能服务，帮助人们处理预约就医、寻找住房、办理税务等日常事务。该计划旨在扩大本土AI系统的覆盖范围，同时加强政府在日常公共服务AI应用中的参与度。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575512.htm"}, {"n": 18, "section": "科技要闻", "title": "东芝S300 AI系列硬盘开售  8TB 2949元起", "summary": "去年末，东芝推出了S300 AI系列硬盘。这是新一代用于监控的机械硬盘（HDD），专为满足现代人工智能（AI）驱动的视频应用的要求而设计。最近一段时间，东芝开始向零售市场销售S300 AI系列硬盘，已登陆到电商平台，首批提供了8TB和10TB容量可选，带五年质保。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575510.htm"}, {"n": 19, "section": "科技要闻", "title": "马斯克回应OpenAI断供Cursor：我根本不在乎 奥特曼是骗子", "summary": "据路透社报道，对于OpenAI停止向SpaceX旗下编程公司Cursor提供AI模型一事，埃隆·马斯克(Elon Musk)周六表示，他根本不在乎。OpenAI周五宣布，计划在11月12日停止向Cursor提供其AI模型。“我们做出这一决定，是因为鉴于我们曾经历过马斯克旗下公司违反合同，我们无法确信SpaceX会按照我们的服务条款使用我们的技术。”OpenAI在一篇博客文章中表示。SpaceX在今年6月以600亿美元收购了Cursor。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575500.htm"}, {"n": 20, "section": "科技要闻", "title": "超越折纸：新算法设计出可展开的三维晶格结构", "summary": "你很可能见过霍伯曼球（Hoberman Sphere）——这种由带关节连接的杆件组成的动态晶格，只需施加一点手动力，就能收缩或展开。受到日本古老折纸艺术和剪纸艺术的启发，美国哈佛大学与日本东京大学的研究团队开发出一系列可展开结构。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1575494.htm"}], "sections": [{"label": "模型与产品", "count": 11, "start": 0}, {"label": "科技要闻", "count": 9, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
