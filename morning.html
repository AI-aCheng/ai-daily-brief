<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-24", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "Anthropic 拟租赁最高 1 吉瓦算力，减少对云厂商依赖", "summary": "Anthropic正早期谈判，拟向阿波罗全球管理控股的数据中心开发商租赁最高1吉瓦算力。此举被视为降低对云厂商依赖的重大举措，若达成将直接掌握算力供给，不再单纯依赖第三方云平台按量分配。目前规模、期限及开发商尚未敲定。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31313"}, {"n": 2, "section": "模型与产品", "title": "国内开发者如何稳定使用 Claude Code、Codex 和 Gemini CLI：从配置接入到团队协作", "summary": "Claude Code、Codex、Gemini CLI等AI编程智能体正改变开发方式，开发者只需描述需求，即可自动读取代码库、修改文件、执行命令并协助调试，过去数小时工作大幅缩短。但对国内开发者而言，核心痛点已非模型能力，而是网络不稳定导致任务中断，以及海外平台充值等现实障碍。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31312"}, {"n": 3, "section": "行业动态", "title": "麦肯锡泼冷水：智能体账单可能比聊天AI贵 30 倍，企业正被自己的AI热情反噬", "summary": "麦肯锡警告，随着智能体普及，企业AI支出恐继续上升，其烧钱逻辑不同于聊天工具：文本AI只生成内容，智能体需实际完成任务，运行成本明显更高；且任务常拆成多步骤，同一目标不同实现路径成本差异悬殊，企业面临新的成本压力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31311"}, {"n": 4, "section": "模型与产品", "title": "阿里千问发布 Qwen-Audio-3.1：五款语音模型同发，ASR 价格直降 95%", "summary": "千问发布Qwen-Audio-3.1系列语音大模型，全面升级语音识别、合成与实时交互，并推出音频创作模型TTS-Next与理解模型ASR-Next，五款模型覆盖“理解—生成—交互—创作”完整能力栈。同时全线降价，TTS降约70%，降低使用门槛。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31308"}, {"n": 5, "section": "模型与产品", "title": "​全新深蓝 S07 正式官宣接入豆包大模型，9 月 28 日震撼上市", "summary": "深蓝汽车董事长邓承浩宣布，全新深蓝S07将接入字节跳动豆包大模型，并搭载AI激光智驾系统，9月28日上市。他指出，智能座舱竞争正从“堆料”转向AI大模型深度赋能，改变用户适应机器的繁琐交互逻辑，推动汽车智能化规则颠覆。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31306"}, {"n": 6, "section": "模型与产品", "title": "千问一口气端出五款语音大模型，TTS价格腰斩七成、ASR砍掉九成五，把耳朵和嗓子全打包给了开发者", "summary": "阿里千问9月23日升级语音栈，推出Qwen-Audio-3.1系列五款模型，覆盖识别、合成、实时交互、音频创作与理解，形成“理解—生成—交互—创作”完整矩阵。价格大幅下调：TTS降约70%、Realtime降约85%、ASR降95%，大幅降低语音使用门槛。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31305"}, {"n": 7, "section": "科技要闻", "title": "盒马部署“AI验蟹师”：不到 1 分钟检测 50 只大闸蟹", "summary": "盒马在大闸蟹上市季部署“AI验蟹师”，利用AI视觉识别结合称重数据检测肥满度，实现自动过检与分拣。基于2025年超1000万只大闸蟹数据积累，模型和检测效率提升，系统不到1分钟可检测50只蟹，配合传送带自动分拣，整体效率提升数倍。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31304"}, {"n": 8, "section": "模型与产品", "title": "千问发布 Qwen-Audio-3.1系列语音大模型，五款模型全线降价最高95%", "summary": "千问9月23日发布Qwen-Audio-3.1系列语音大模型，形成覆盖理解、生成、交互与创作的完整音频能力栈，含ASR、ASR-Next、TTS、TTS-Next及Realtime。API已上架千问AI平台，ASR-Next即将上线。同步全线降价：TTS约70%、Realtime约85%、ASR达95%。ASR增强多语", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31303"}, {"n": 9, "section": "模型与产品", "title": "最高折扣 50%：微软推 AI 替你“干活”，Copilot 变身超级应用", "summary": "微软被曝将大幅降低企业版 Copilot 订阅价格，最高打五折，或于10月落地；同时推出“超级AI应用”，推动其从办公辅助工具升级为能直接替企业干活的自动化平台，以“降价+升级”应对AI助手激烈竞争。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31302"}, {"n": 10, "section": "模型与产品", "title": "阿里云发布Qwen Book:AI智能体电脑正式亮相", "summary": "阿里云在2026云栖大会发布AI智能体电脑Qwen Book，主打自主理解意图、持续学习与长期任务执行。产品配备Skill键盘阵列、全局AI按键和语音手写笔，支持7×24小时重度任务运行，优化跨应用、跨Agent协同效率。其基于“OS as Harness”理念，以千问端云模型为核心，深度融合操作系统、应用、云服务与硬", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31301"}, {"n": 11, "section": "模型与产品", "title": "​高通发布骁龙 8 Elite Gen 6 与 Extreme 芯片，支持本地运行 300 亿参数大模型", "summary": "高通在骁龙峰会上发布骁龙8 Elite Gen6与骁龙8 Elite Extreme Gen6两款旗舰处理器，主打AI赋能，增强端侧智能算力，推动AI代理在手机端深度个性化应用。新芯片搭载全新传感中枢，可运行高达2.0亿参数的小型模型，提升本地大模型支持能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31300"}, {"n": 12, "section": "科技要闻", "title": "医疗 AI 走向全球普惠：Anthropic 携手 OpenEvidence，将临床决策支持工具免费覆盖百国", "summary": "Anthropic与医学知识平台OpenEvidence达成战略合作，将基于人工智能的临床决策支持工具免费提供给美国和欧洲以外医疗资源匮乏地区的医生，打破循证医学知识获取的地理限制，缓解当地医学文献、专科医生及继续医学教育资源不足等痛点，推动全球医疗资源公平可及。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31299"}, {"n": 13, "section": "科技要闻", "title": "腾讯 QClaw 微信远程办公 AI 助手宣布 12 月 24 日停运，即日起停止新用户注册，", "summary": "IT之家 9 月 24 日消息，腾讯 QClaw 微信远程办公 AI 助手今日发布公告称，因业务发展调整，QClaw 将于 2026 年 12 月 24 日 00:00 正式停止运营。停止运营安排2026 年 9 月 24 日自公告之日起，停止新用户注册，停止订阅服务购买与续费（已开通自动续费的用户将自动停止续费扣款，无需手动操作取消）。停止运营前，已注册用户、已购买订阅服务的用户均仍可正常使用服务；用户账号内的已有积分有效期不因本次停运调整，可在原有效期内继续使用，请留意积分到期时间。2026 年 12 月 24 日 00:00QClaw 正式停止运营，除数据备份与迁移功能外，其他功能停止使", "source": "IT之家", "url": "https://www.ithome.com/1/006/528.htm"}, {"n": 14, "section": "模型与产品", "title": "Anthropic 宣布成立生命科学团队和实验室，Claude 自主发现新型酶系统", "summary": "IT之家 9 月 24 日消息，当地时间 9 月 23 日，Anthropic 宣布成立生命科学研究团队及自有分子生物学实验室，并公布了一项由 Claude 参与生物学研究取得的早期成果。在人类科学家仅提供宏观研究方向的情况下，Claude 自主发现了一种此前未被表征的酶系统，Anthropic 将其命名为阵列关联逆转录酶（Array-associated Reverse Transcriptases，ART）。该发现来自 Anthropic 旧金山湾区实验室，是其生命科学团队自 2026 年春季组建以来的首个公开成果。相关预印本论文已于同日发布，尚待同行评审。Anthropic 表示，分享这", "source": "IT之家", "url": "https://www.ithome.com/1/006/524.htm"}, {"n": 15, "section": "行业动态", "title": "黄仁勋再对AI公司放话：要求监管就不应获得反垄断豁免", "summary": "据路透社报道，英伟达CEO黄仁勋(Jensen Huang)认为，AI公司不应获得反垄断法或责任法的豁免。在周三播出的《纽约时报》播客节目中，黄仁勋接受了近两个小时的采访，就OpenAI智能体入侵Hugging Face一事进行了广泛讨论。Hugging Face是开源AI软件中心，在本月被英伟达以130亿美元收购。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579390.htm"}, {"n": 16, "section": "科技要闻", "title": "澳大利亚总理：OpenAI智能体6月入侵澳政府网站 系已知首例", "summary": "据路透社报道，澳大利亚总理安东尼·阿尔巴尼斯（Anthony Albanese）表示，OpenAI开发的一款AI代理在6月未经授权侵入了澳大利亚政府网站，访问了公共和非公共文件。这是已知的首例AI代理入侵政府网站事件。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579388.htm"}, {"n": 17, "section": "科技要闻", "title": "Anthropic称AI生物实验室取得初步突破 但暂未赋予全自主操作权限", "summary": "人工智能初创公司Anthropic宣布，其位于旧金山湾区新建的AI物理与生物实验室（Wet Lab）已取得“重大进展”，但在实验操作层面，人类研究员依然掌握着绝对控制权，并未直接让旗下的AI模型Claude进行无监管的自主运行。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579386.htm"}, {"n": 18, "section": "模型与产品", "title": "微软发布搭载骁龙X2 Plus芯片的新一代12英寸Surface Pro", "summary": "在高通骁龙峰会上，微软正式发布了第二代12英寸Surface Pro二合一平板电脑。新机型全面换装高通新一代骁龙X2 Plus处理器，在维持便携无风扇设计的同时，大幅提升了图形处理、端侧AI运算以及电池续航效率。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579384.htm"}, {"n": 19, "section": "模型与产品", "title": "ChatGPT移动端加入语音智能代理功能", "summary": "OpenAI宣布ChatGPT移动应用开始加入基于语音的智能代理功能，用户今后不只是能够通过语音与ChatGPT聊天，还可以直接用语音指挥它执行更加复杂的实际工作。例如，用户可以要求ChatGPT创建一份文档、起草电子邮件、总结Slack消息，甚至开展一系列需要多个步骤才能完成的任务。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579374.htm"}, {"n": 20, "section": "模型与产品", "title": "Anthropic推出首个生物实验室助手Claude CRISPR 助力基因编辑与生命科学研究", "summary": "人工智能研究公司Anthropic宣布推出一款专门针对生命科学与生物工程领域优化的AI助手“Claude CRISPR”。该工具基于其先进的Claude模型架构构建，旨在帮助科研人员处理复杂的基因组学数据、设计CRISPR基因编辑方案以及优化分子生物学实验流程。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579372.htm"}], "sections": [{"label": "科技要闻", "count": 6, "start": 0}, {"label": "模型与产品", "count": 12, "start": 0}, {"label": "行业动态", "count": 2, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
