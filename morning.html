<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">

  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>

<main class="stage">

<footer class="bar">

</footer>

<script>
const DATA = {"date": "2026-08-24", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "字节Seed再调整:预训练、强化学习与Agent研发全面重构", "summary": "字节跳动大模型部门Seed完成组织调整：Seed Foundation Model新设四个一级部门，负责人向吴永辉汇报。调整整合预训练数据、强化学习及模型后训练资源，B端与C端产品模型能力分开布局。其中Pretrain Data由李成刚负责，统一整合文本、编程、视觉、语音等预训练数据团队，支撑新Omni模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30537"}, {"n": 2, "section": "模型与产品", "title": "长眼！DeepSeek Flash视觉模型突发更新，支持多模态", "summary": "DeepSeek工具链升级至0.1.1-rc.1版，在V4Flash与V4Pro基础上新增视觉模型体验版V4Flash Vision-Exp。此前v0.1.0-rc.8已打通多模态能力，支持原生图片请求，/goal、/plan等指令实现图文混合输入。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30536"}, {"n": 3, "section": "模型与产品", "title": "雷鸟推出iO AI眼镜，售价2499元支持全天候AI记忆", "summary": "雷鸟创新发布全新iO系列，首款雷鸟iO定位“人类增强AI眼镜”，售价2499元，首发1996元起，支持0至1000度近视配镜，已在京东、天猫、抖音及线下渠道开售。2026年一季度雷鸟居中国及全球AR眼镜出货量第一。新品采用双目显示与蓝湖光波导，OC区透过率93%，非显示区超98%。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30535"}, {"n": 4, "section": "模型与产品", "title": "国产大模型再迎重磅升级，科大讯飞即将发布全新主力通用大模型", "summary": "科大讯飞在2026年半年度业绩说明会上透露，将于今年1024开发者节正式推出基于全国产算力的全新主力通用大模型；8月底率先发布阶段性版本，供市场和开发者提前体验，技术落地节奏已明确。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30534"}, {"n": 5, "section": "科技要闻", "title": "韩国互联网巨头Kakao董事会通过拆分方案，拟设立Kakao AI", "summary": "韩国Kakao宣布拆分：新设“Kakao AI”聚焦KakaoTalk与人工智能，原公司更名“Kakao X”负责投资、金融科技、内容和出行。重组旨在独立运营、加快AI落地并提升资本配置效率，净资产按36%和64%比例拆分。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30533"}, {"n": 6, "section": "模型与产品", "title": "OpenAI全面开源Codex Harness，AI编程智能体底层能力进一步开放", "summary": "OpenAI向开发者开放Codex Harness核心能力，该框架是Codex智能体的运行环境，负责连接模型、用户与工具，管理任务、上下文、会话及代码操作。此前已开源Codex CLI及核心代码，并持续完善Harness与App Server。其架构不仅是代码生成工具，更是完整的Agent执行框架。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30531"}, {"n": 7, "section": "模型与产品", "title": "阿里开源 Qwen-UI-Agent：真机多模态基座模型登场", "summary": "阿里巴巴推出 GUI 智能体基座模型 Qwen-UI-Agent，以真实世界为中心，覆盖移动端、电脑端、网页端及深度搜索，旨在突破模拟测试限制，实现复杂真实设备无缝操作。其在 MobileWorld 移动端测试中获 82.1% 高分，领先多个主流模型，综合性能全面超越行业旗舰。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30530"}, {"n": 8, "section": "模型与产品", "title": "Mistral推出Agentic Search，多步检索将复杂文档准确率提升至86%", "summary": "企业构建AI时，核心机密数据常埋于长文档、金融申报、法律合同等文件中。传统一次性RAG仅检索固定文本块，缺乏迭代推理，难以处理复杂长文档与跨源对比。为此，Mistral AI推出Agentic升级方案，增强推理迭代能力，破解长文档信息提取难题。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30529"}, {"n": 9, "section": "模型与产品", "title": "LFM2.5 DSpark草稿模型发布，推理速度最高飙升3. 18 倍", "summary": "Liquid AI 与 Hugging Face 发布 LFM2.5 系列 DSpark 草稿模型检查点，覆盖 1.2B、2.6B、8B-A1B 三款模型。其采用全新投机解码路径，不改变输出质量，大幅提升推理吞吐量。实测 GPU 端最高提速 3.18 倍，端侧设备也有明显加速。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30528"}, {"n": 10, "section": "模型与产品", "title": "商汤科技开源8B轻量多模态大模型：原生4K输出、全能视觉编辑", "summary": "商汤开源8B轻量级统一多模态模型SenseNova U1.5Lite，核心视觉任务表现超越同级，部分复杂排版与文字渲染媲美大规模商业模型；原生支持3-4K上下文，可同时处理主体、数量、空间关系、文字、布局、风格等多重约束。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30527"}, {"n": 11, "section": "模型与产品", "title": "SAP联合Team Liquid推出AI语音应用，助力职业电竞数据分析", "summary": "SAP与Team Liquid联合开发AI语音应用，可自动处理比赛和训练中的多声道队内语音，精准分离选手语音流，并完成转写、发言人识别和情绪分析，将零散通话转为结构化赛事数据，助力战队分析比赛、优化战术和提升选手表现。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30526"}, {"n": 12, "section": "模型与产品", "title": "从对话助手到智能办公平台，豆包推出技能、连接器与工作伙伴", "summary": "豆包工作任务模式升级，新增技能、连接器、工作伙伴三大功能，协同办公能力增强。平台已上架超200个技能与连接器，支持用户自建专属技能和标准化工作流。“技能”可沉淀个性化工作方法，如周报格式一键保存、每周复用；“连接器”打通豆包与各类办公系统，提升工作流标准化与效率。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30525"}, {"n": 13, "section": "行业动态", "title": "美国得州州长阿博特：AI 数据中心遭民众反对实属咎由自取", "summary": "IT之家 8 月 24 日消息，在得克萨斯州州长格雷格 · 阿博特看来，人工智能行业正在自食其果。阿博特当地时间周日在美国广播公司（ABC）《本周》（This Week）节目中表示，美国民众对人工智能数据中心的尖锐批评是应该的。“他们基本上是在为自己造成的问题自掘坟墓，这就是为什么他们遭到了应得的抵制。”阿博特说。科技公司依赖数据中心为其人工智能产品提供算力，但它们围绕数据中心的宣传并未奏效。在全美各地，美国人正在集结起来反对人工智能数据中心，这些设施造价高达数十亿美元，占地数百英亩。许多人担心这些庞大的设施将如何影响环境、公用事业价格、水资源和噪音水平等，有些人则只是单纯不喜欢人工智能。批评", "source": "IT之家", "url": "https://www.ithome.com/0/993/336.htm"}, {"n": 14, "section": "科技要闻", "title": "OpenAI CEO 奥尔特曼：担心人工智能会被少数强势主体掌控", "summary": "IT之家 8 月 24 日消息，OpenAI 首席执行官萨姆 · 奥尔特曼表示，他担心人工智能终有一天会被少数公司、模型或个人所控制，让绝大多数消费者在技术如何塑造世界这个问题上没有发言权。“正确的做法是，我们希望人们能够深度掌控未来，”奥尔特曼在当地时间周日发布的 David Senra 播客节目中说，“社会和模型将共同进化。”奥尔特曼说他担心的另一种可能性是人工智能挣脱人类控制者的束缚。矛盾的是，奥尔特曼表示，对后一种可能性的恐惧可能导致前一种可能性的实现。“有很多人对这些风险的严重程度感到非常紧张，被这种情绪所左右，觉得有必要保护世界，”他说，“比如，你知道的，‘我们应该用大量自由来换取", "source": "IT之家", "url": "https://www.ithome.com/0/993/333.htm"}, {"n": 15, "section": "科技要闻", "title": "OpenAI CEO萨姆·奥特曼：担忧AI被少数巨头垄断 但过度防范无异于“以自由换安全”", "summary": "OpenAI首席执行官萨姆·奥特曼近日对人工智能的未来发展表达了深切担忧。他警告称，AI技术最终可能会被少数几家公司、个别模型或极少数人所垄断，这将导致绝大多数消费者在AI如何重塑世界的进程中丧失发言权。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574624.htm"}, {"n": 16, "section": "模型与产品", "title": "从毛坯到精装 DeepSeek Harness的入门教程来了", "summary": "上周，梁叔叔终于把 DeepSeek 的专武 —— DeepSeek Harness 给端出来了。一周过去，GitHub 上的 star 数已经点到了 18 万，比之前最快的龙虾还要快。有人给它设计皮肤，什么鲸鱼娘，Windows XP，滑动变 “ 祖 ” 器，统统安排上；", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574606.htm"}, {"n": 17, "section": "模型与产品", "title": "OpenAI失控模型的受害者 AI公司Hugging Face考虑出售估值130亿美元", "summary": "据《商业内幕》报道，AI公司Hugging Face一直探索在出售公司的可能性，估值可能达到130亿美元或更高。知情人士透露，Hugging Face一直在与一家投行合作，评估潜在买家的兴趣，目前尚未达成任何交易。Hugging Face是一个平台，开发者可以在这里发布、分享和下载各种AI模型。这一谈判表明，随着AI行业日趋成熟，AI开发者平台的价值也越来越高。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574602.htm"}, {"n": 18, "section": "科技要闻", "title": "从“害羞狂奔”到1500米耐力赛 机器人一天多次刷新人类纪录", "summary": "双臂抬到脸旁，身体大幅前倾，一台身高不到1.4米的机器人以一种近乎“捂脸狂奔”的姿态冲过终点。8月23日下午和晚间，第二届世界人形机器人运动会迎来多个田径项目的决赛。其中在400米小型组决赛中，天工机器人Omni以45.66秒夺冠。因为奔跑时身体前倾、双手靠近脸部，独特的“害羞式跑姿”成为赛场上的抢镜一幕。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574598.htm"}, {"n": 19, "section": "科技要闻", "title": "美光警告算力增速超带宽3倍 AI持续发展亟需先进封装突破瓶颈", "summary": "随着人工智能大语言模型的不断演进，内存技术正逐渐成为限制AI系统性能的核心瓶颈。在2026年Hot Chips大会上，美光科技（Micron）深入探讨了高带宽内存（HBM）的发展现状，指出当前AI行业正面临日益严峻的“内存墙”问题：计算能力的增速达到每两年三倍，而HBM带宽的增速却不足两倍。这种算力与内存带宽之间的发展失衡，正迫使业界寻求更先进的封装和工艺来应对随之而来的热管理挑战。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574594.htm"}, {"n": 20, "section": "行业动态", "title": "德克萨斯州州长严辞抨击AI扩张：大干快上数据中心是“自掘坟墓”", "summary": "德克萨斯州州长格雷格·阿博特（Greg Abbott）向人工智能行业发出了迄今为止来自共和党人的最严厉警告。他表示，数据中心公司由于未能赢得社区支持，完全是“自掘坟墓”，理应承受目前的强烈抵制。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574586.htm"}], "sections": [{"label": "模型与产品", "count": 13, "start": 0}, {"label": "科技要闻", "count": 5, "start": 0}, {"label": "行业动态", "count": 2, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
