<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-12", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "外滩大会热议 AI 时代女性力量，从“为她所用”到“由她创造”", "summary": "9月11日，2026 Inclusion·外滩大会“数字木兰”大会上，卖烧饼阿姨、乡村民宿管家等普通女性现场展示了自制的AI写作助手、零代码英语学习App等产品，证明非技术背景也能拥抱AI。大会由蚂蚁集团与蚂蚁公益基金会联合发起，主题为“我们WOMEN·AI”，展现不同年龄职业女性的数字创造力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31003"}, {"n": 2, "section": "模型与产品", "title": "具身智能的“ChatGPT时刻”何时到来?百亿具身CEO与青年创业者外滩大会热议", "summary": "9月11日外滩大会上，具身智能业界与投资人围绕行业泡沫等话题讨论。嘉宾认为“泡沫感”源于产业阶段、估值与商业价值错配，行业仍处“黎明前期”；关键能力初现，但距规模化生产力仍有距离，需突破系统工程、算力和数据等瓶颈。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31002"}, {"n": 3, "section": "模型与产品", "title": "小米开源工业级目标说话人语音识别大模型 CocktailASR-1", "summary": "小米开源工业级目标说话人语音识别大模型CocktailASR-1，瞄准多人同时讲话的“鸡尾酒会难题”。该模型改变传统ASR任务输入方式，可在嘈杂环境中精准锁定并识别目标说话人语音，提升复杂场景下的识别能力，为行业提供新的解决方案。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31001"}, {"n": 4, "section": "模型与产品", "title": "支付宝“碰一下”推出无界经营，智能体“图图” 服务线下经营", "summary": "支付宝“碰一下”发布面向品牌商的无界经营智能体“图图”，依托百万级商家设备网络，连接4亿消费者与百万门店，助力品牌线下增长。继线下触点AI升级及门店智能体“晓雨”后，支付宝再次以AI重构线下经营，实现全球首个大规模线下人、货、场AI全面升级。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31000"}, {"n": 5, "section": "科技要闻", "title": "Anthropic 披露：今年已阻止多起利用 AI 研发生物武器的尝试", "summary": "《金融时报》报道，Anthropic称今年已阻止多起科学家利用其AI开展可能助研生物武器的研究，列举五起案例，涉事者绕过管控、混淆目的以规避安全防护。事件凸显AI对公共安全的潜在威胁。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30999"}, {"n": 6, "section": "模型与产品", "title": "蚂蚁集团韩歆毅宣告智能体“ChatGPT”时刻已至", "summary": "2026年外滩大会上，蚂蚁集团CEO韩歆毅表示，智能体商业的“ChatGPT时刻”已全面到来。智能体正从能力展示工具迈入真实交易阶段，成为连接用户需求与真实供给的核心商业入口。此前ChatGPT实现自然语言交互跃迁，如今智能体进一步深入商业闭环。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30997"}, {"n": 7, "section": "模型与产品", "title": "告别卡顿与机械感：OpenAI 推出全双工语音模型 GPT-Live-1", "summary": "OpenAI推出全双工语音模型GPT-Live-1，采用单一模型架构取代传统“语音转文字—推理—文字转语音”级联流程，显著降低延迟，实现类人流畅交互。该模型已上线API，面向开发者，能更稳健应对停顿、打断和话题转换等复杂对话场景。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30996"}, {"n": 8, "section": "模型与产品", "title": "DeepSeek V4.1-Flash登陆WorkBuddy，开启限时免费试用", "summary": "AI服务平台WorkBuddy宣布全面上线DeepSeek最新V4.1-Flash模型，并开启两周免费试用，降低开发者与用户体验门槛。该模型已登陆DeepSeek API，具备原生多模态支持能力，用户调用时只需将模型设置项调整为对应标识即可。此举体现大模型领域迭代持续加快。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30995"}, {"n": 9, "section": "模型与产品", "title": "OpenAI 开放 GPT-Live-1 API：每分钟 0.05 美元，把 ChatGPT 同款语音能力交给开发者", "summary": "OpenAI向开发者开放GPT-Live-1语音模型API，可将ChatGPT语音功能集成到应用中，构建全双工语音助手，支持实时听说并自然处理打断与停顿。语音前端每分钟0.05美元，后台复杂推理模型另行计费。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30994"}, {"n": 10, "section": "模型与产品", "title": "Cursor发布Projects功能，一人指挥数千个AI智能体承包大型开发", "summary": "9月10日，Cursor推出Projects（beta版），标志软件开发“第三纪元”加速到来。该功能面向功能开发、大规模迁移、完整应用构建等大型复杂任务，引入“协调者智能体”调度数千个子智能体并行执行，让开发者摆脱繁琐的智能体管理，直接指挥任务本身，核心架构围绕这一协调模式展开。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30993"}, {"n": 11, "section": "模型与产品", "title": "OpenAI 把 Codex 做成 API：Agents API 上线，托管会话与沙箱对外开放", "summary": "OpenAI正式上线Agents API，将Codex harness封装为托管REST接口，核心端点仅POST /v1/agents/sessions，需带OpenAI-Beta头。OpenAI负责会话、编排、上下文压缩与恢复，应用方提供工具和执行环境。文档提出Agent（模型+指令+工具+MCP服务器）、Envir", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30992"}, {"n": 12, "section": "模型与产品", "title": "金融领域首个智能体安全标准发布", "summary": "北京金融科技产业联盟近日发布国内首个金融智能体安全团体标准《智能体技术金融应用安全要求》。明确手机端第三方智能体未经金融机构授权，不得利用系统权限自动化读取、操作金融App界面；通过麦克风、截屏、录屏、共享屏幕等获取数据时，须遵守被调用方安全要求。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30991"}, {"n": 13, "section": "模型与产品", "title": "OpenAI 将 Habitat 从 Python 迁移至 Rust：CPU 效率提升 6 倍，服务 10 亿 ChatGPT 用户", "summary": "IT之家 9 月 12 日消息，OpenAI 今日发文，主要介绍了其在线存储平台 Habitat 如何应对产品规模的快速增长，以及从 Python 迁移至 Rust 的工程实践。OpenAI 称该平台目前每秒处理超过 7000 万次请求，每周服务超 10 亿用户，管理的数据规模超过 500PB。据介绍，Habitat 已从 2024 年的 Python 客户端库，发展为支撑旗下产品的分布式存储系统。据介绍，Habitat 最初是一个与 ChatGPT 主服务器交互的 Python 库，底层连接 Azure Cosmos DB。其目标是让产品工程师无需直接管理数据库，即可完成数据存取。系统负责数", "source": "IT之家", "url": "https://www.ithome.com/1/001/497.htm"}, {"n": 14, "section": "行业动态", "title": "IT早报 0912：央视曝光 AI 中转站低价灰产；新版充电宝 3C 认证标准落地；36.9 万起特斯拉 Model Y 高性能版上市；哪吒汽车拟获 30 亿元偿债重整...", "summary": "“IT早报”时间，大家好，现在是 2026 年 9 月 12 日星期六，今天的重要科技资讯有：1. 8.8 元买 5000 积分？央视曝光 AI 中转站低价灰产，小心你的代码被截留倒卖央视曝光二手平台大量低价 AI 工具积分实为第三方 API 中转站篡改本地配置，用户办公文档、代码等敏感信息存在被截留、倒卖风险，官方表示会严打这类违规行为。&gt;&gt; 查看详情2. 新版充电宝 3C 认证实施规则落地，已发出首批 32 张 3C 认证证书新版规则新增安全指标测试要求，细化质量管控，要求产品增加安全功能、标注完整信息与警示。2027 年 4 月 1 日起所有在售移动电源需获新版认证。&gt;", "source": "IT之家", "url": "https://www.ithome.com/1/001/495.htm"}, {"n": 15, "section": "科技要闻", "title": "美国参议院两党酝酿立法要求AI巨头化解重大已知风险", "summary": "美国参议院两党立法谈判代表正就一项重要的人工智能监管法案展开密集磋商。根据多位参议院助理及知情人士透露，该提案拟对前沿技术企业施加明确的法律责任，要求其从底层设计端打造安全的人工智能产品并化解已知的重大灾难性风险；同时，法案还探讨赋予美国联邦政府在特定极端危险情形下叫停AI模型发布的权力，并允许科技企业就此类行政干预向联邦法院提起司法挑战。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577552.htm"}, {"n": 16, "section": "行业动态", "title": "英伟达RTX 5090在德国市场遭遇空前涨价狂潮 八个月暴涨73%突破5000欧元大关", "summary": "据欧洲知名科技媒体Hardwareluxx及德国主流比价平台Geizhals的最新零售追踪数据，英伟达旗舰显卡GeForce RTX 5090在德国市场的现货挂牌价格已全面突破5000欧元大关，目前市场上甚至已无法找到任何一款标价低于5200欧元的RTX 5090现货，主流非公版型号更是大举逼近5500欧元。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577546.htm"}, {"n": 17, "section": "科技要闻", "title": "Roblox进一步开放AI游戏创作：自然语言即可做游戏 可脱离Roblox独立运行", "summary": "Roblox在年度开发者大会RDC 2026上宣布推出一系列新功能，进一步扩大人工智能在游戏创作领域的应用，同时改变平台过去高度依赖自身生态的模式。除了让用户能够利用自然语言生成游戏之外，Roblox还计划允许创作者将作品作为独立应用发布到手机、PC和游戏主机，并支持玩家直接通过网页链接进入游戏。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/game/1577542.htm"}, {"n": 18, "section": "行业动态", "title": "SpaceX与神秘客户签下每月11亿美元AI算力订单 年化合同金额超过130亿美元", "summary": "SpaceX正在快速扩张人工智能基础设施业务，并拿下了一笔规模惊人的算力订单。SpaceX首席财务官布雷特·约翰森近日透露，公司本月早些时候与一家身份未公开的客户签署了一份云计算协议。从2026年12月开始，该客户每月将向SpaceX支付约11.1亿美元，以获得AI计算基础设施的使用权。按照这一金额计算，合同年化价值将达到约133亿美元。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577522.htm"}], "sections": [{"label": "科技要闻", "count": 4, "start": 0}, {"label": "模型与产品", "count": 11, "start": 0}, {"label": "行业动态", "count": 3, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
