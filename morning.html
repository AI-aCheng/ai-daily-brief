<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-08-28", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "央视曝光 AI 相亲骗局：虚假婚介专盯中老年女性，28 人落网", "summary": "央视报道，近期出现针对中老年女性的AI相亲骗局，不法者用AI生成虚假相亲对象诈骗钱财。成都警方打掉一“AI相亲”团伙，抓获王某等28人，涉案超百万元，约50余名群众受损。手法为“AI形象+真人售后”双簧，卞女士在视频平台接触婚介后缴2000元服务费，却始终联系不上对方。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30678"}, {"n": 2, "section": "模型与产品", "title": "英伟达 129 亿美元收购 Hugging Face，开源 AI 底座归入算力帝国", "summary": "英伟达拟以129亿美元收购开源AI平台Hugging Face，其年营收约1.5亿美元、接近盈利，出价约为年收入80倍。闭源实验室正降低对英伟达硬件依赖，OpenAI联手博通自研芯片。英伟达已承诺五年投260亿美元发展开源模型，意在抢占生态。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30677"}, {"n": 3, "section": "科技要闻", "title": "公益广告行人头脚错乱、垃圾袋钻出扫帚，官方确认系 AI 生成已撤下", "summary": "山西临汾一公益广告因画面怪异被疑AI生成：行人头脚错乱、垃圾袋中“钻出”扫帚。事件曝光后，当地连夜排查并更换涉事广告，政府确认系合作广告公司用AI制作，审核只查文字未校验画面，目前已完成更换。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30674"}, {"n": 4, "section": "模型与产品", "title": "从3.3GB压缩到440MB！腾讯混元极低bit翻译模型如何做到几乎零损失？", "summary": "腾讯混元将1.8B端侧翻译模型压缩至几百兆，翻译质量几乎无损，并已落地B站直播弹幕实时翻译，支撑高并发真实业务。该模型支持33语种互译，同等尺寸下翻译质量领先。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30673"}, {"n": 5, "section": "模型与产品", "title": "Claude 桌面端 Cowork 内置浏览器上线，可独立完成网页操作", "summary": "Claude桌面版Cowork新增内置浏览器，处理网页任务时侧边栏自动开启，可自主浏览、阅读、点击和输入，无需安装扩展或额外设置。该浏览器与用户日常浏览器完全隔离，看不到标签页、书签和保存的密码；如需保持某些网站登录态，需另行处理。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30672"}, {"n": 6, "section": "模型与产品", "title": "亚马逊订单激增三倍，英伟达芯片成全球大厂“硬通货”", "summary": "近日，亚马逊与英伟达宣布深化战略合作：在数月前已部署超100万枚英伟达GPU的基础上，订单量激增三倍，计划再引入200万枚GPU，涵盖Blackwell Ultra、Rubin等最新芯片。这笔跨国合作印证AI需求井喷，也将算力背后的巨额资本博弈推向台前。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30671"}, {"n": 7, "section": "行业动态", "title": "北京开出首例AIGC商业秘密行政处罚案 拷走前公司AI软件创业罚款10万", "summary": "北京朝阳区市场监管局对全市首例AIGC领域商业秘密行政处罚案作出裁决，对私自复制并使用原单位AI软件的行为开出10万元罚单，为数字经济新业态合规划定红线。涉案权利人专注微短剧外语译制配音及AI多语种影视译制服务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30670"}, {"n": 8, "section": "模型与产品", "title": "Google升级Gemini Live接入Spark，语音直接操控Gmail与全家桶", "summary": "Google近日对语音助手Gemini Live进行重大升级，从单一自然语音对话工具迈向生产力与智能代理工作流新阶段。自2024年推出以来，已支持超40种语言，并深度打通多款Google应用。此次更新核心是全面强化任务执行、跨应用协作与个性化服务能力，推动其向智能代理转型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30669"}, {"n": 9, "section": "模型与产品", "title": "千问办公首发上线Qwen3.8-Flash，Agent正式迈入“量大管饱”时代", "summary": "千问办公平台上线Qwen3.8-Flash大模型及标准模式，全体用户可体验，具有更低积分消耗与更快Token吞吐优势。后续将形成标准与高级双模型体系，标准模式覆盖95%日常办公需求，剩余5%复杂任务由高级模式处理。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30668"}, {"n": 10, "section": "科技要闻", "title": "拷走 AI 软件去创业，北京首例 AIGC 商业秘密案罚 10 万元", "summary": "北京朝阳区市场监管局对全市首例AIGC行业商业秘密行政处罚案作出决定，对携密跳槽、私自复制使用原单位AI商业软件行为罚款10万元。该案由北京市市场监管局披露，系该领域执法破冰，形成“拷贝—破解—跨公司复用”完整证据链；权利人系出海重点企业，主营微短剧外语译制配音及AI多语种影视译制。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30667"}, {"n": 11, "section": "模型与产品", "title": "半年狂赚1180亿美元！英伟达交出“核爆级”财报，下一代AI芯片全面量产", "summary": "英伟达发布2027财年半年报及第二季度业绩，核心财务指标全线大涨。上半年营收1778.37亿美元，毛利1332.99亿美元，印证全球AI基础设施建设需求强劲，新一代硬件平台加速量产。作为AI淘金热中的“卖水人”，英伟达继续赚得盆满钵满，业绩震撼市场。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30666"}, {"n": 12, "section": "模型与产品", "title": "通义千问发布Qwen3.8-Flash-Next，提前剧透Qwen4架构", "summary": "阿里通义千问团队近日开源全新多模态MoE模型Qwen3.8-Flash-Next，作为Qwen4架构早期预览版。该模型采用高度稀疏的混合专家设计，总参数1250亿，另搭配510亿参数N-gram嵌入表和40亿参数多token预测模块，以极低计算开销实现越级性能表现。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30664"}, {"n": 13, "section": "科技要闻", "title": "Omdia 报告：2026 年 Q2 东南亚智能手机市场出货量下降 23%，创 2014 年以来最低水平", "summary": "IT之家 8 月 28 日消息，Omdia 最新研究，2026 年第二季度东南亚智能手机市场出货量同比下降 23%，至 1,930 万部，创 2014 年以来最低季度出货水平。尽管出货量大幅下滑，但市场规模表现相对更具韧性，达到 66 亿美元（IT之家注：现汇率约合 444.7 亿元人民币），平均售价（ASP）同比上涨 31%，至 342 美元（现汇率约合 2,304 元人民币）。报告显示，厂商在维持出货量与平均售价之间出现分化：三星在提价的同时实现了市场份额增长。Galaxy A07 和 A17 上市后均进行了提价，打破了新品上市后价格通常逐步下降的惯例。这推动三星在整体 200–299 美", "source": "IT之家", "url": "https://www.ithome.com/0/995/354.htm"}, {"n": 14, "section": "模型与产品", "title": "谷歌推出 Gemini Omni 1.1 Flash 视频生成 AI 模型，最高 4K 分辨率", "summary": "IT之家 8 月 28 日消息，当地时间 8 月 27 日，谷歌宣布推出 Gemini Omni 1.1 Flash 视频生成 AI 模型，最高可生成 4K 视频。IT之家附新模型亮点如下：场景扩展：用户可以直接基于已有视频，从结尾处无缝衔接并继续生成后续画面。用户可按每次 10 秒的步长逐步扩展视频，单条视频的累计最长时长可达 40 秒；指定首尾帧：只需指定镜头的起始帧与结束帧，即可实现平滑自然的转场效果与镜头运镜；生成 360p 预览：相较于 Omni 1.1 的标准 720p 分辨率，生成速度最高可提升 60%，且成本仅需原有的三分之一，适用于快速原型验证、分镜脚本迭代以及高速渲染；最高", "source": "IT之家", "url": "https://www.ithome.com/0/995/352.htm"}, {"n": 15, "section": "模型与产品", "title": "Speedo推出可拆卸智能泳镜模块 可全面追踪四种泳姿表现", "summary": "Speedo日前发布了面向Vanquisher系列泳镜的全新iQ智能模块。该模块采用可拆卸设计，能够分析自由泳、仰泳、蛙泳和蝶泳四种泳姿的运动表现，为游泳训练提供更细致的数据支持。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575296.htm"}, {"n": 16, "section": "行业动态", "title": "英伟达拟成立员工出资支持的政治行动委员会 加大政策影响力", "summary": "据路透社8月27日报道，英伟达计划成立一个由员工出资支持的政治行动委员会（PAC），以进一步提升其对美国政策制定的影响力。知情人士透露，该组织将被命名为“NVPAC”。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575294.htm"}, {"n": 17, "section": "科技要闻", "title": "伦敦医院首次借助AI完成脑肿瘤切除术 实时标记神经与血管降低手术风险", "summary": "英国伦敦一家医院近日宣布，医疗团队首次成功在人工智能系统辅助下完成脑肿瘤切除手术。手术过程中，AI会对术野实时视频进行分析，并以颜色标记关键神经和血管，帮助医生在切除肿瘤时规避可能造成严重伤害的结构。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1575292.htm"}, {"n": 18, "section": "行业动态", "title": "Meta“AI原生”组织转型受挫 大规模裁员计划因技术问题与员工反弹搁浅", "summary": "Meta今年年初曾筹划一项名为“Project OT”（组织转型）的重组计划，试图以AI智能体和更精简的团队重塑公司运作方式。然而，在员工强烈反弹以及AI工具实际产出不及预期后，这项原本可能涉及大规模裁员的方案已明显降温，Meta最终放弃了进一步推进广泛裁员的安排。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575290.htm"}, {"n": 19, "section": "行业动态", "title": "OpenAI、Google等逾百家企业联名呼吁协同应对失控AI网络威胁", "summary": "OpenAI、Anthropic、Google和微软等超过100家科技企业近日签署公开信，呼吁企业界与政府部门加强合作，共同防范由人工智能驱动的新一代网络安全威胁。联署方还包括CrowdStrike、Okta、Fortinet等网络安全公司，以及多家金融机构和互联网基础设施企业。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575288.htm"}, {"n": 20, "section": "科技要闻", "title": "Google AI Mode新增旅行服务 可追踪机票价格、协助预订酒店", "summary": "Google当地时间周四宣布，将为其对话式搜索体验AI Mode推出更多旅行规划与预订功能。用户今后可通过该服务追踪机票价格、预订酒店，并查询机票及酒店所需的积分或里程，进一步将AI Mode从信息检索工具拓展为可参与行程规划和预订流程的“AI旅行助手”。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575286.htm"}], "sections": [{"label": "科技要闻", "count": 6, "start": 0}, {"label": "模型与产品", "count": 10, "start": 0}, {"label": "行业动态", "count": 4, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
