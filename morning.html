<!doctype html>

<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>

<script>
const DATA = {"date": "2026-09-03", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "大模型服务首次登陆主流电商：智谱AI正式入驻天猫开设官方旗舰店，个人套餐月付118元起", "summary": "智谱入驻天猫开设官方旗舰店，消费者可在淘宝App直接下单购买大模型订阅服务，标志商业订阅从官网直销拓展至主流电商生态。旗舰店首推GLM Coding Plan订阅套餐，基于最新GLM-5.3，推动大模型消费走向大众化。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30785"}, {"n": 2, "section": "模型与产品", "title": "腾讯上线公益行业版WorkBuddy，15个智能体协同覆盖42条公益场景能力", "summary": "腾讯公益智能助手“公益Buddy”9月2日上线，系腾讯SSV基于WorkBuddy打造的首个公益行业AI基础设施。它整合11个场景胶囊、42条场景能力，由15个智能体协同，覆盖资助申请、票据处理、尽职调查等重复性事务，机构用户可通过“发现应用”入口体验。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30784"}, {"n": 3, "section": "模型与产品", "title": "网信办重点整治AI换脸、魔改名著等 豆包、元宝、千问、文心一言严格限制违规内容输出", "summary": "中央网信办通报“清朗·整治AI应用乱象”专项行动第二阶段成果，重点治理利用AI制作虚假信息、传播暴力低俗内容、假冒仿冒及侵害未成年人等问题。目前已清理违法信息超561万条，查处违规账号4.9万余个，处置违规网站及APP逾2400个，全面遏制AI技术滥用乱象。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30781"}, {"n": 4, "section": "模型与产品", "title": "腾讯WorkBuddy宣布开放平台能力，面向软硬件及开发者，共创AI Agent行业新标准", "summary": "9月2日，腾讯WorkBuddy开放平台上线，首批引入超百家生态伙伴，面向智能硬件、行业应用与开发者开放底层Agent能力，系国内首个打通硬件、应用、开发者三层生态的AI Agent开放平台，并首次披露开放生态战略。现场9款联名智能硬件首发，合作方包括Plaud、乐奇Rokid、影石、科大讯飞等。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30780"}, {"n": 5, "section": "模型与产品", "title": "深度医疗AI迎来关键里程碑：ChatGPT打通Epic电子健康记录系统", "summary": "OpenAI医疗版ChatGPT for Healthcare已支持与主流Epic电子健康记录系统集成，医务人员可在授权范围内调取完整病历，并借助AI总结就诊情况、优化临床流程。此前OpenAI已布局多款医疗产品，包括面向个人用户的ChatGPT Health，提供私密健康服务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30778"}, {"n": 6, "section": "模型与产品", "title": "马斯克掀起AI军备新狂飙：2.1万亿参数Grok 4.7十天后登场", "summary": "马斯克在X平台预告，未来10天内将推出Grok4.7模型，预计2026年9月12日上线。该模型参数规模达2.1万亿，较前代Grok4.6的1.5万亿增长40%，显示xAI在参数规模与性能迭代上加速冲刺。推文还提及服务速度等细节，但相关信息未完整披露。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30777"}, {"n": 7, "section": "科技要闻", "title": "网信办“清朗”第二阶段重拳整治 AI 乱象：清理违规信息 561 万余条，查处账号 4.9 万余个", "summary": "中央网信办推进“清朗·整治AI应用乱象”第二阶段，重点打击利用AI制作虚假信息、传播暴力低俗、假冒仿冒及侵害未成年人等行为。目前已清理违法违规信息561万余条，查处账号4.9万余个，处置违规网站和应用2400余个，平台与厂商同步加强内容治理。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30776"}, {"n": 8, "section": "模型与产品", "title": "豆包手机 9 月开售：命名努比亚 NaviX Ultra，号称全球首款 AI 智能体旗舰", "summary": "努比亚总裁倪飞预告，新一代豆包手机努比亚 NaviX Ultra 将于9月正式发售，定位全球首款AI智能体旗舰，已拿到入网许可，标志其从概念到量产进入最关键阶段。该机将大模型嵌入系统底层，强调并非普通“带AI功能的手机”，与市面产品有本质区别。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30775"}, {"n": 9, "section": "模型与产品", "title": "谁改了我的表格？Excel 上线 AI 变更历史，用一句话查清改了什么、改坏了什么", "summary": "微软为Excel推出“变更历史”功能，面向多人协作场景，帮助团队追溯数据修改。该功能读取已有编辑记录并结合Copilot，用户用自然语言提问即可确认数据何时被改、由谁修改，以及是否影响其他计算结果，解决多人编辑难以追踪变更的问题。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30774"}, {"n": 10, "section": "模型与产品", "title": "腾讯WorkBuddy宣布开放平台上线 全面开放Agent基座能力", "summary": "腾讯WorkBuddy开放平台上线，向智能硬件、行业应用与开发者开放底层Agent能力，首批超百家生态伙伴入驻；现场首发9款联名智能硬件，合作方含Plaud、Rokid、影石、科大讯飞等；30余个行业应用接入，覆盖金融、法律、医疗、教育等20多个领域。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30773"}, {"n": 11, "section": "模型与产品", "title": "谷歌 AI 修图工具 Pics 正式上线：Docs、Slides 里点一下图片就能改", "summary": "谷歌发布博文宣布，AI图像设计与编辑工具Google Pics正式上线，用户可通过pics.new网页版或在Docs、Slides中直接调用。它支持上传素材继续修改，无需从空白画布开始，适合制作邀请函、海报等视觉内容。该工具由Nano Banana图像生成模型驱动，曾在今年5月I/O开发者大会亮相。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30772"}, {"n": 12, "section": "模型与产品", "title": "World Labs推出全球首个多模态世界模型Atlas，像素级镜头控制拍出电影级“子弹时间”大片", "summary": "李飞飞创办的World Labs发布全球首个多模态世界模型Atlas，突破性实现像素级精确相机控制，生成图像与视频帧并完成三维空间重建。该模型从头预训练，可无缝接受相机移动等多模态输入，转化为立体三维视图，显著提升空间理解与生成能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30771"}, {"n": 13, "section": "科技要闻", "title": "探索太阳风暴早期预警：AI 提前 9.24 小时捕捉太阳活动区信号", "summary": "IT之家 9 月 3 日消息，科技媒体 SciTech 昨日（9 月 2 日）发布博文，报道称由美国新泽西理工学院（NJIT）牵头的科研团队发布最新研究，成功打造出机器学习模型 EarlyDetect，可从太阳声学活动和磁场变化中识别活动区形成前兆。IT之家援引博文介绍，太阳活动区是太阳表面磁场强烈的区域，太阳黑子通常在其中形成。活动区开始浮现可能只需数小时，但完整发展过程通常需要 1 到数天。研究人员希望利用更早的信号，为空间天气预报提供补充信息。EarlyDetect 模型采用 Transformer 架构，处理连续的太阳观测数据，分析美国国家航空航天局（NASA）太阳动力学观测台（SDO", "source": "IT之家", "url": "https://www.ithome.com/0/997/737.htm"}, {"n": 14, "section": "模型与产品", "title": "纽约时报诉 OpenAI 案升级：美国司法部首次就 AI 版权问题公开表态，主张 AI 训练属“合理使用”", "summary": "IT之家 9 月 3 日消息，美国司法部（DOJ）当地时间 9 月 1 日向曼哈顿联邦法院提交了一份“利益声明”，正式介入《纽约时报》诉 OpenAI 版权侵权案。美国司法部明确支持 OpenAI 的立场，主张 AI 公司使用受版权保护的材料训练大语言模型属于“合理使用”范畴，不构成版权侵权。这份文件由美国副司法部长斯坦利 · 伍德沃德（Stanley Woodward Jr.）等人签署。DOJ 首先从国家安全角度论证了支持 OpenAI 的必要性。他们认为，如果版权规则显著增加在美国开发大语言模型（LLM）的难度，可能损害美国 AI 产业竞争力并带来国家安全风险。“那些使在美国建立强大 AI", "source": "IT之家", "url": "https://www.ithome.com/0/997/732.htm"}, {"n": 15, "section": "科技要闻", "title": "Linux内核每个版本修复漏洞数量或将突破2000个 AI“除虫”让维护者不堪重负", "summary": "Linux内核每个版本修复的CVE漏洞数量正在快速上升，可能从Linux 7.3开始超过2000个。相比Linux 6.x时代长期维持的约500个漏洞，这一数字在Linux 7.0时已超过1000个，Linux 7.2则突破1500个。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576136.htm"}, {"n": 16, "section": "模型与产品", "title": "大型语言模型训练使用受版权保护内容的合法性仍存争议 美国政府公开支持OpenAI", "summary": "特朗普政府近日向纽约时报起诉OpenAI一案提交了一份20页法律意见书，支持OpenAI未经授权使用受版权保护材料训练大型语言模型的做法。政府在文件中表示，美国在人工智能领域保持全球竞争力和领导地位符合国家利益，不应因对合理使用原则的误解而限制人工智能的发展，否则可能阻碍创新、科学进步以及美国经济增长和社会流动。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576128.htm"}, {"n": 17, "section": "科技要闻", "title": "AI提前近9小时捕捉到太阳爆发的隐秘预警信号", "summary": "由美国新泽西理工学院牵头的研究团队开发出一种人工智能系统，能够在太阳活动区真正出现在可见表面之前，提前识别出极其微弱的预警信号。研究显示，该系统平均可以提前近九小时发现新活动区的形成迹象，为未来预测太阳风暴提供了新的可能。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1576122.htm"}, {"n": 18, "section": "模型与产品", "title": "AMD RDNA 5 GPU IP首次现身 三星2纳米Exynos 2700 SoC搭载Xclipse 970", "summary": "今天，AMD下一代RDNA 5 GPU IP首次出现在已经工作的芯片中，不过其载体并非传统显卡，而是三星的移动平台。SemiAnalysis对三星Exynos 2700 SoC进行晶圆级标注后发现，该芯片搭载了采用AMD GPU技术打造的Xclipse 970 GPU。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576116.htm"}, {"n": 19, "section": "科技要闻", "title": "印度首富押注云电脑 Reliance Jio试图让老旧设备具备AI能力", "summary": "印度企业家穆克什·安巴尼旗下的Reliance Jio宣布扩大云电脑服务JioPC的覆盖范围。该服务不再仅面向Jio宽带用户，而是向印度所有拥有互联网连接的用户开放，不受电信或宽带运营商限制。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576114.htm"}, {"n": 20, "section": "模型与产品", "title": "Google与MrBeast达成多年合作 将借助野外挑战推广Gemini与健康产品", "summary": "Google宣布与YouTube头部创作者MrBeast达成一项多年合作协议。根据安排，MrBeast将在后续视频中展示Google人工智能助手Gemini、Google Health以及Fitbit Air等产品。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/movie/1576112.htm"}], "sections": [{"label": "模型与产品", "count": 15, "start": 0}, {"label": "科技要闻", "count": 5, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
