<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>

<script>
const DATA = {"date": "2026-09-27", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "首部上星AI长剧《后西游记》幕后：没有摄影机，100%画面由Seedance生成，单集成本压到十几万", "summary": "8月31日，国内首部上星AI长剧《后西游记》登陆湖南卫视黄金档，芒果TV同步上线。该剧规划60集、每集约40分钟，由芒果TV出品、伯璟文化承制，全程无摄影机，100%由Seedance视频生成。上线一周，芒果TV正片播放量破1.5亿次。总导演李东珅长期从事纪录片创作。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31357"}, {"n": 2, "section": "模型与产品", "title": "蚂蚁inclusionAI把训练底稿摆上HuggingFace，Ling、Ring、Ming全系模型按欧盟AI法案交透明账", "summary": "蚂蚁inclusionAI在HuggingFace开设AI-Transparency仓库，公开Ling、Ring、Ming系列模型的训练内容摘要。该仓库只含文档，不发布权重和训练数据集，主动披露模型训练数据来源，覆盖Ling-2.0至3.0、Ring-2.0至2.6、Ming-Omni及两款16B-A3B多模态模型，旨", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31356"}, {"n": 3, "section": "科技要闻", "title": "OpenAI、Anthropic、Hugging Face 联合国呼吁 AI 国际协调，特朗普政府明确反对&quot;全球治理&quot;", "summary": "联合国场合，OpenAI、Anthropic、Hugging Face负责人呼吁加强AI国际协调，推动建立可比较的能力评估、安全测试与事故报告标准；特朗普政府反对借此新建全球AI治理架构，称风险不足以限制发展或让渡监管权。企业强调共同标准与快速事故报告。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31353"}, {"n": 4, "section": "模型与产品", "title": "​华为官宣小艺 Work 正式上线，首发 31 天限时免费畅享 1000 AI 点", "summary": "华为宣布小艺Work焕新上线，定位AI工作助理，面向日常办公、代码开发与创意创作，深度适配鸿蒙手机、平板和电脑，更新小艺App即可解锁。首用可享31天免费体验1000AI点。功能涵盖市场调研、文档处理、PPT制作、数据分析、内容创作及代码开发等。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31352"}, {"n": 5, "section": "模型与产品", "title": "消息称DeepSeek年化收入突破10亿美元，拟募资500亿元冲刺上交所上市", "summary": "据外媒报道，DeepSeek年化收入已突破10亿美元，较数月前不足5亿美元翻倍，主要得益于产品提价及开发者、企业端采用率持续攀升。CEO梁文峰在投资者会议上披露该数据，被视为资本市场关键节点提振信心的重要举措。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31351"}, {"n": 6, "section": "模型与产品", "title": "谷歌确认新一代旗舰 Gemini 4 即将推出：已进入后训练，有望远早于年底", "summary": "谷歌DeepMind负责人卡武克奥卢在AI峰会透露，新一代旗舰模型Gemini 4即将推出，目前已进入后训练初期，该阶段用于提升模型行为可靠性。谷歌跳过3.5 Pro，直接押注Gemini 4，计划远早于年底发布，正加速拿出早期成果。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31350"}, {"n": 7, "section": "模型与产品", "title": "高通联手 PrismML 发布 1-bit Bonsai：AI 眼镜离线识图，内存占用降到 1/4", "summary": "2026骁龙峰会上，高通与PrismML在骁龙AR1 Gen 1智能眼镜平台本地运行20亿参数1-bit量化Bonsai视觉模型，实现离线识图问答。该模型基于Bonsai 1.7B构建，精度压缩至1-bit，内存占用仅为4-bit模型四分之一，同等内存可容纳约4倍参数，显著降低存储与推理资源需求。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31349"}, {"n": 8, "section": "模型与产品", "title": "Kimi K3.1十月或压轴登场:三档推理强度、百万超长上下文，Agent与Swarm全塞进配置", "summary": "多家消息源指称，月之暗面旗舰模型Kimi K3.1正内部成型，最快2026年10月发布，将提供Low、High、Max三档推理强度。爆料人@MaxForAI在X平台披露内部JSON与API响应，发现“k3d1-agent”模型标识，含Agent模式、应用场景及配置开关，疑似提前泄露。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31348"}, {"n": 9, "section": "模型与产品", "title": "ChatGPT 移动端上新语音智能体：动动嘴就能写文档、总结邮件", "summary": "OpenAI宣布ChatGPT移动端新增语音智能体功能，用户说话即可撰写文档、总结邮件等。Pro和Plus用户可创建文档、邮件、总结Slack消息，并执行建站、做PPT、使用云端浏览器等进阶操作；Free和Go用户可用插件及已连接应用。语音对话将提供更丰富文本输出。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31347"}, {"n": 10, "section": "模型与产品", "title": "Meta Connect 发布会：Muse 全面接入 AI 眼镜，小扎要让数十亿人用上超级智能", "summary": "Meta在Connect大会发布多款AI设备，个人智能体Muse成核心。扎克伯格称要让未来属于每个人，预计Muse将服务数十亿用户。媒体指出，Meta正将AI、智能眼镜与VR硬件结合，元宇宙话题减少；多款眼镜齐发，无摄像头版本主打隐私。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31346"}, {"n": 11, "section": "科技要闻", "title": "智元第两万台远征A3 Ultra下线交付长隆，六千台半年填满，具身机器人第一次在主题乐园里常态上岗", "summary": "9月24日，智元第2万台通用具身智能机器人远征A3Ultra在横琴长隆飞船乐园下线并交付长隆，从1万台到2万台仅用约6个月，产能加速爬坡。同日，智元与长隆共建的全球首个大规模具身智能主题乐园启幕，部署超300台机器人，标志具身智能规模化落地文旅场景迈出重要一步。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31344"}, {"n": 12, "section": "科技要闻", "title": "交易额逼近 7 万亿！深度聚焦中国直播电商：AI 降本大潮下，真人主播会被取代吗？", "summary": "中国直播带货业从粗放增长转向理性成熟，年交易额近7万亿元，2025年线上零售占比超36%。行业增速放缓、竞争加剧，AI技术爆发正重塑生态，在成本优化与落地中展现显著降本增效潜力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31342"}, {"n": 13, "section": "模型与产品", "title": "IT早报 0927：微信鸿蒙版 App 安装量破 8000 万；豆包手机助手回应努比亚手机王者荣耀异常；华为大疆联名推出 Pocket 4；OpenAI 暂停最强模型训练...", "summary": "“IT早报”时间，大家好，现在是 2026 年 9 月 27 日星期日，今天的重要科技资讯有：1. 微信鸿蒙版 App 安装量正式突破 8000 万微信鸿蒙版 App 9 月 26 日再迎里程碑时刻 —— 安装量正式突破 8000 万（最新数据显示安装量为 8020 万次）。其于 2025 年 1 月正式登陆华为鸿蒙应用市场 App Gallery。此前有消息称，微信鸿蒙版 App 适配已接近尾声。&gt;&gt; 查看详情2. 努比亚 NaviX Ultra 手机《王者荣耀》使用异常，豆包手机助手回应称全程未对腾讯游戏系统进行任何操作豆包手机助手 25 日在官方社区发文，就努比亚 NaviX", "source": "IT之家", "url": "https://www.ithome.com/1/007/456.htm"}, {"n": 14, "section": "科技要闻", "title": "七彩虹源 AIR 14 UItra 轻薄本亮相：960g，X7 358H", "summary": "IT之家 9 月 27 日消息，七彩虹 (Colorful) 在本周二的英特尔技术创新与产业生态大会 (Intel Connection 2026) 上展示了尚未发布的 AIR 14 UItra 轻薄笔记本电脑。从展牌上的内容来看，这一型号基于英特尔酷睿 Ultra X7 处理器 358H，拥有全镁合金机身，质量仅有 960g。其主打“极致便携不牺牲性能”“专业创作兼顾娱乐”“硬件可自由升级”3 大核心优势，面向移动创意从业者、高频差旅商务人群、设计专业学生、轻量化数码游戏玩家等群体。", "source": "IT之家", "url": "https://www.ithome.com/1/007/452.htm"}, {"n": 15, "section": "科技要闻", "title": "中美达成“超级智能”沟通机制 两国首次建立AI重大风险联络渠道", "summary": "在人工智能竞争持续升温之际，中美两国正尝试建立新的安全协调机制。根据双方最新达成的安排，中美同意设立专门针对“超级智能”（Super Intelligence，简称SI）风险的双边沟通渠道，以加强未来在前沿人工智能领域的信息交流与风险管理。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579728.htm"}, {"n": 16, "section": "模型与产品", "title": "高通下一代旗舰芯片曝光：主频冲击5.4GHz 继续采用台积电2纳米N2P工艺", "summary": "高通刚刚发布骁龙8 Elite Gen 6和骁龙8 Elite Extreme Gen 6不久，外界关于下一代旗舰移动平台的传闻已经开始浮现。最新消息显示，高通正在开发代号为“Honu”的全新旗舰SoC，预计将继续采用台积电2纳米N2P工艺，并将CPU主频进一步提升至5.3GHz至5.4GHz区间。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579726.htm"}, {"n": 17, "section": "科技要闻", "title": "科学家首次在超冷气体中观测到“贝特串” 1931年量子预言成为现实", "summary": "一个诞生于1931年的量子力学预言，在接近一个世纪后终于被科学家成功实现。来自奥地利因斯布鲁克大学、荷兰阿姆斯特丹大学以及德国慕尼黑工业大学的研究团队宣布，他们首次在超冷原子气体中创造并直接观测到被称为“贝特串”（Bethe Strings）的特殊量子结构。这项成果不仅验证了德国物理学家汉斯·贝特近百年前提出的理论预测，也为研究量子多体系统提供了全新的实验平台。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1579724.htm"}, {"n": 18, "section": "科技要闻", "title": "科学家首次实时观测到单一声音量子的湮灭", "summary": "国际顶尖物理学研究团队在量子物理领域取得里程碑式突破，首次在实验室内实时且无破坏性地观测到了单个声子（Phonon，即声音能量的最小基本单元）从存在到完全衰减消失的全过程。这一实验成果不仅填补了宏观声波与微观量子力学之间相互转化的观测空白，也为未来量子计算架构与量子传感器的设计提供了全新的实验范式。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1579718.htm"}, {"n": 19, "section": "模型与产品", "title": "OpenAI失控Agent找DeepSeek、Kimi当外援 近百万条作案短链曝光", "summary": "OpenAI，又被扒了…近700个OpenAI智能体组团攻入Hugging Face，这事儿快有两个多月了吧。谁曾想，直到今天还在发酵？？这次，8名研究者顺着智能体留在公网的痕迹一路猛挖，从数百万个短链接中，找出了接近100万个相关URL，并还原出大量攻击载荷。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579710.htm"}, {"n": 20, "section": "模型与产品", "title": "终于，Claude Code额度用完 不再恶心砍断你代码了", "summary": "终于，Claude Code，干了件人事。就在昨天，Anthropic开发者账号@ClaudeDevs官宣：Claude Code撞上5小时用量上限时，不再一刀切断（代码改到一半，对不起，没了，爱咋咋地）。现在，它会先找一个体面的停点，把手上这一步做完，再停。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579704.htm"}], "sections": [{"label": "科技要闻", "count": 8, "start": 0}, {"label": "模型与产品", "count": 12, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}

chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
