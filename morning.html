<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-08-21", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "DeepSeek Harness重磅更新：多模态支持全面上线，意外剧透V4视觉版动向", "summary": "开源智能体工具DeepSeek Harness发布仅一周即升级，新增多模态支持，模型适配器可启用原生图片请求，引发其视觉模型将发布猜想。交互体验改进：/goal、/plan等命令支持带图发送，@引用功能优化。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30508"}, {"n": 2, "section": "模型与产品", "title": "美团搜索 3.0如何用大模型表征重构本地生活搜索底座？", "summary": "美团披露搜索3.0技术迭代：大模型推动搜索引擎迈向认知决策时代，在服务零售排序场景完成三次演进，验证语义表征在本地生活复杂场景的落地价值，实现从关键词匹配到意图理解的升级。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30507"}, {"n": 3, "section": "科技要闻", "title": "小米人形机器人首次亮相，已成功注册多枚小米铁大商标", "summary": "小米人形机器人“铁大”亮相2026世界机器人大会，身高1.70米、重66公斤，全身66个自由度且半数集中于手部。小米已申请注册多枚“小米铁大”商标，覆盖医疗园艺、健身器材、设计研究、通讯服务等类别，目前已注册成功。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30506"}, {"n": 4, "section": "模型与产品", "title": "通义千问官方点赞！Unsloth Dynamic V3 让 Qwen3.8-27B 更小更聪明，1-bit 版 8GB 内存就能跑", "summary": "通义千问官方公开致谢 Unsloth 团队，高度认可其发布的 Qwen3.8-27B GGUF 量化版本，称其“更小更聪明”。此举在开源社区引发热议，凸显本地大模型部署门槛持续降低，官方鼓励用户尝试该版本。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30504"}, {"n": 5, "section": "模型与产品", "title": "IDC发布《中国生成式AI安全评估平台报告》，蚂蚁数科位居领导者", "summary": "企业AI深入客服、运营等核心场景，安全风险更复杂。除大模型越狱、敏感信息泄露外，工具滥用、智能体越权、多智能体协同攻击等新型风险涌现。8月20日，IDC发布《中国生成式AI安全评估平台2026年厂商评估》报告，聚焦该市场。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30501"}, {"n": 6, "section": "行业动态", "title": "快手二季度营收355亿元，可灵AI商业化收入同比增长超200%", "summary": "快手2026年二季度总收入355亿元，核心商业收入同比增长7.4%，经调整净利润39亿元，净利率11%。应用日活4.12亿、月活7.97亿。AI成重要驱动力：可灵AI收入超8.5亿元，同比增长逾200%；全球用户破1亿，覆盖224个国家和地区，企业客户近5万家。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30500"}, {"n": 7, "section": "科技要闻", "title": "快递员变身AI机器人高薪工程师！京东物流首批学员正式上岗，未来5年豪掷10万个高新岗位", "summary": "京东物流智能化升级，首批快递员、仓管员、质检员在涿州技术认证培训中心完成系统培训并考核合格，正式转型为机器人维修工程师上岗，助力一线员工从体力岗迈向高技术岗。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30499"}, {"n": 8, "section": "模型与产品", "title": "王兴兴:具身智能最快2至3年迎来“ChatGPT时刻”", "summary": "宇树科技CEO王兴兴在2026世界机器人大会称，具身智能正接近“ChatGPT时刻”，最快2至3年、慢则5至10年实现突破。此前宇树科技登陆科创板，上市首日较发行价上涨460%。他还表示，判断具身智能产业爆发并非只看单一场景展示。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30498"}, {"n": 9, "section": "模型与产品", "title": "75亿美元！Stripe正式收购模型路由平台OpenRouter", "summary": "Stripe确认收购AI模型路由平台OpenRouter，交易额约75亿美元，远超其5月B轮融资时13亿美元估值，涨幅超5倍。OpenRouter为开发者提供统一入口，可按需求、复杂度、价格及可靠性等调度AI模型，是热门底层基础设施。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30497"}, {"n": 10, "section": "模型与产品", "title": "王兴兴首谈具身智能行业拐点：核心痛点在于大模型与真机如何完美对齐", "summary": "宇树科技创始人王兴兴在2026世界机器人大会主论坛发表上市后首场演讲，判断人形机器人全面爆发需跨越具身智能“ChatGPT时刻”，关键标准是机器人在80%陌生场景中仅凭人类语音或文字指令即可独立完成任务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30496"}, {"n": 11, "section": "模型与产品", "title": "OpenAI升级Codex安全防护，新增危险操作拦截与权限控制", "summary": "OpenAI升级AI编程代理Codex安全防护，以降低误删文件、覆盖数据等风险。团队调查发现，风险主要集中在临时工作目录清理环节，部分问题源于系统变量复用，如错误使用$HOME等变量，导致清理操作指向真实用户目录，带来数据安全隐患。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30495"}, {"n": 12, "section": "科技要闻", "title": "CounterPoint预估：智能眼镜与戒指将成未来增长最快品类", "summary": "CounterPoint Research预测，2026至2032年全球消费级可穿戴设备累计营收将突破1万亿美元，年复合增长率达12%。分析师指出，可穿戴设备正从日常健身延伸至预防性医疗，越来越多消费者愿为具备持续健康监测功能的高端设备支付溢价，推动市场增长。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30494"}, {"n": 13, "section": "科技要闻", "title": "消息称苹果重心转向智能眼镜：裁掉整个 VR 研发团队，影响至少 60 人", "summary": "IT之家 8 月 21 日消息，据 AppleInsider 报道，一位消息人士透露，苹果刚刚裁撤了整个负责虚拟现实（VR）研发的团队。这一举措与即将接任首席执行官的约翰 · 特努斯计划将该业务“打入冷宫”的传闻相吻合。知情人士透露，苹果已裁减了至少 60 名员工，涉及 VR 研发团队、Apple Vision 业务组及相关岗位。报道称虽然此举并不意味着 Apple Vision 团队的彻底解散，但确实释放出该业务线正在降温的明确信号。IT之家从报道获悉，苹果并未任由该产品团队陷入停滞，而是在近几个月内进行了内部架构重组。该公司当下的首要重心已全面转向 Siri AI 与智能眼镜，而非在当下技", "source": "IT之家", "url": "https://www.ithome.com/0/992/430.htm"}, {"n": 14, "section": "科技要闻", "title": "苹果收紧 Apple Music 服务，AI 生成音乐年底将强制标注", "summary": "IT之家 8 月 21 日消息，科技媒体 AppleInsider 昨日（8 月 20 日）发布博文，报道称苹果公司计划在 2026 年年底调整 Apple Music 规则，强制性要求内容供应商和唱片公司为 AI 生成音乐添加标签。消息称苹果已通过邮件方式联系音乐内容供应商，对于“大部分”由 AI 创作生成的音乐内容，强制要求提供商加入 AI Transparency Tags（AI 透明度标签）。IT之家援引博文介绍，苹果公司于 2026 年 3 月推出 AI 透明度标签，不过当时这项功能属于自愿机制，用于说明特定内容是否在人工智能帮助下“实质性生成”。苹果当时并未强制性要求，推荐内容分发", "source": "IT之家", "url": "https://www.ithome.com/0/992/428.htm"}, {"n": 15, "section": "科技要闻", "title": "移动版RTX 5090与苹果M5 Max AI对决：性能占优，但受制于显存瓶颈", "summary": "近日，在针对大语言模型（LLM）的一系列AI基准测试中，英伟达移动端RTX 5090显卡展现出强劲实力，在提示词处理与词元（Token）生成速度上大幅超越苹果最新的M5 Max芯片，最高领先幅度达133%。然而测试也同时表明，当面对更大规模的AI模型或更长的上下文时，苹果的统一内存架构优势便开始接管比赛。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574256.htm"}, {"n": 16, "section": "行业动态", "title": "NVIDIA宣布GeForce NOW云游戏服务正式支持Firefox浏览器", "summary": "NVIDIA近日宣布在其Windows平台的GeForce NOW云游戏服务中正式加入对Mozilla Firefox浏览器的支持，使其与此前已支持的Chrome、Edge和Opera共同组成了浏览器支持矩阵。尽管Firefox目前的全球浏览器市场份额约为2.5%，落后于主流的三大浏览器，但此次更新为数百万偏爱Mozilla浏览器的用户带来了便捷的云游戏访问体验。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574238.htm"}, {"n": 17, "section": "模型与产品", "title": "ChatGPT发布以来 超三分之一的新网页呈现AI创作痕迹", "summary": "皮尤研究中心于本周四发布的一项最新研究显示，自ChatGPT问世以来发布的网页中，有超过三分之一呈现出由人工智能撰写或大幅编辑的痕迹。这一发现与其他指出互联网新兴内容已被AI深度渗透的研究结果相呼应。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574234.htm"}, {"n": 18, "section": "模型与产品", "title": "Google推出“首选来源”按钮 帮助出版商应对AI带来的流量流失", "summary": "随着人工智能不断蚕食网站流量，Google于本周四向受到负面影响的出版商抛出橄榄枝。目前，Google允许读者在出版商网站上点击一个按钮，将其标记为“首选来源”，以便在Google搜索、发现和Google新闻中更频繁地优先展示该来源的内容。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574230.htm"}, {"n": 19, "section": "行业动态", "title": "数据显示OpenAI在企业用户市场正加速追赶Anthropic", "summary": "在OpenAI和Anthropic这两家人工智能巨头距离计划中的首次公开募股（IPO）并公布财务数据还有一段时间之际，外界只能通过第三方渠道窥探其商业版图的发展状况。近日，企业信用卡与支出管理服务商Ramp发布了一组出人意料的最新数据，揭示了OpenAI在美国企业用户市场中正逐步缩小与Anthropic的差距。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574224.htm"}, {"n": 20, "section": "科技要闻", "title": "微软Windows 365迎来五周年 云PC全面进军AI领域", "summary": "微软旗下的云端个人电脑平台 Windows 365 正式迎来了发布五周年纪念。为了庆祝这一里程碑，微软专门发布了一份回顾总结，详细展示了该服务多年来所落实的一系列核心功能与演变历程。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574222.htm"}], "sections": [{"label": "模型与产品", "count": 10, "start": 0}, {"label": "科技要闻", "count": 7, "start": 0}, {"label": "行业动态", "count": 3, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
