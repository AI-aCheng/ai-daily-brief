<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-04", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "奥特曼官宣：OpenAI将正式自研人形机器人，首款AI硬件与IPO进程全曝光", "summary": "OpenAI CEO奥特曼首次明确表态，将坚定不移自研人形机器人本体，并并行开发多种形态机器人及数据中心特种机器人。他认为人类物理空间适配人体结构，人形成为重要方向，显示OpenAI加速向物理世界迈进。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30813"}, {"n": 2, "section": "模型与产品", "title": "百度AI底层架构再迎重磅人事变动：原DeepSeek研究员魏浩然出任文心多模态负责人", "summary": "百度基础模型研发部在负责人孙天祥7月就任后，围绕文心大模型进行新一轮组织与技术重组。原DeepSeek研究员魏浩然携团队加入，出任文心多模态算法负责人，百度持续引入核心技术专家以加强大模型研发。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30812"}, {"n": 3, "section": "模型与产品", "title": "OpenAI宣布自研人形机器人 首款由乔纳森主导的AI终端拟于2027年发布", "summary": "OpenAI CEO奥特曼宣布将全栈自研人形机器人等本体，并研发数据中心特种机器人，相关业务整合为OpenAI Robotics团队，由拉梅什领导。规划短期协助技术工人建设基础设施，远期普及全能个人助手，深化软硬件协同；同时加速布局AI硬件生态。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30811"}, {"n": 4, "section": "科技要闻", "title": "OpenAI 首席科学家回应“AI 推理不透明”争议：复杂度没出现跳跃式增长", "summary": "OpenAI首席科学家帕乔基回应Astra“不可监控、推理不透明”争议。争议源于The Information报道：OpenAI正测试“深度循环”技术，可能使模型“思维链”推理过程更难解释与追踪，影响包括ChatGPT在内的模型透明度，引发外界对AI可解释性的担忧。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30810"}, {"n": 5, "section": "行业动态", "title": "黄仁勋在 G20 喊话：别对 AI 过度恐惧和监管，被时代抛下才是最坏结果", "summary": "英伟达CEO黄仁勋在G20创新部长级会议上呼吁各国拥抱AI基础设施与应用，警告过度恐惧或监管将错失下一轮技术革命机遇。他建议将AI视为与电力、道路、互联网同等重要的经济基础，像水电一样普及建设。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30807"}, {"n": 6, "section": "科技要闻", "title": "AI 辅助 3 周干完 12 年的活：Paint.NET 首次登陆 Linux，靠自研方案绕过 Direct2D", "summary": "开发者里克·布鲁斯特发布Paint.NET 5.2 Build 9739，首次通过Wine实验性支持Linux。最大障碍是微软Windows专属的Direct2D图形API，Paint.NET长期依赖它。因Wine对Direct2D原生支持不完善，他放弃等待，自行开发替代方案，结束长达12年的阻碍。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30806"}, {"n": 7, "section": "模型与产品", "title": "百度基础模型部大换血：北美大模型专家与前DeepSeek核心成员加盟，文心多模态迎关键升级", "summary": "百度基础模型研发部（BMU）加速人才布局：引入北美Frontier Lab研究员武钦强化文心大模型预训练，原DeepSeek研究员魏浩然转岗出任文心多模态算法负责人。此次调整正值7月上任的负责人孙天祥全力推动文心大模型升级。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30805"}, {"n": 8, "section": "模型与产品", "title": "天猫正式上线AI空间站：阿里云、智谱、Kimi、MiniMax集体入驻", "summary": "9月3日，天猫上线AI空间站（Token充值中心），首次将阿里云、智谱、Kimi、MiniMax等头部大模型订阅服务接入电商生态，让消费者像充话费一样便捷选购AI产品，标志国内大模型服务消费级普及进入新节点。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30804"}, {"n": 9, "section": "模型与产品", "title": "博通预测Anthropic与OpenAI将超越谷歌跃居AI定制芯片前两大客户", "summary": "博通总裁陈福阳预测，随着大模型厂商算力争夺白热化，Anthropic与OpenAI将超越谷歌，成为博通AI ASIC业务前两大核心客户。其中Anthropic预计2027至2028年成长为最大XPU定制芯片客户，OpenAI紧随其后列第二。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30803"}, {"n": 10, "section": "科技要闻", "title": "AI 绩效评估从&quot;用量&quot;转向&quot;产出&quot;：Meta 弃用采用率仪表盘与 Token 指标", "summary": "Meta高管备忘录明确，不会用AI采用率仪表盘或Token使用量评估工程师影响力。目前公司93%代码修改由AI代理辅助完成，AI已深度嵌入工程流程，但强调采用AI本身并非最终目标。此举回应科技行业为推广AI而设置考核指标的通行做法。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30802"}, {"n": 11, "section": "模型与产品", "title": "Anthropic 发布 Claude Fable5.1:具备更强 Agent 编码能力，最高降本45%", "summary": "Anthropic发布新一代模型Claude Fable5.1及限制性变体Mythos5.1，提升智能体编码与科研逻辑能力并优化推理成本。Fable5.1向公有云全量开放API，Mythos5.1仅限网络安全与生命科学项目使用；二者为首批内置AI文本水印的Claude产品，Fable5.1在智能体任务中表现强劲。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30801"}, {"n": 12, "section": "模型与产品", "title": "百度引入北美大模型专家，原DeepSeek研究员出任文心多模态负责人", "summary": "百度基础模型研发部（BMU）完成关键人才布局：负责人孙天祥9月3日宣布，从北美某Frontier Lab引入资深研究员武钦，强化文心大模型预训练能力；原DeepSeek研究员魏浩然正式转岗至BMU，任文心多模态算法负责人，其团队此前开源Unlimited OCR模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30800"}, {"n": 13, "section": "模型与产品", "title": "微软最强转录 AI 模型：MAI-Transcribe-2 登场，60 语种平均词错误率 5.2%", "summary": "IT之家 9 月 4 日消息，微软昨日（9 月 3 日）发布博文，宣布推出 MAI-Transcribe-2，宣称是其最快、最准确、最便宜的 AI 语音转文字模型。在定价方面，MAI-Transcribe-2 上市时限时收费 0.10 美元（IT之家注：现汇率约合 0.67 元人民币） / 小时，优惠持续至 2026 年年底。性能方面，MAI-Transcribe-2 是微软最强的转录模型，相比较市场上其它主流模型，在准确率、速度和价格方面存在优势。在 FLEURS 测试集中，MAI-Transcribe-2 支持强制指定语言和自动推断语言两种模式，平均词错误率均为 5.2%。同一测试中，Ge", "source": "IT之家", "url": "https://www.ithome.com/0/998/241.htm"}, {"n": 14, "section": "模型与产品", "title": "英伟达 RTX Spark N1X 超级芯片在移动端提供 5120 核 GPU + 18 核 CPU 低配", "summary": "IT之家 9 月 4 日消息，根据 NVIDIA（英伟达）官网更新，其面向 Windows on Arm PC 的 RTX Spark N1X 超级芯片处理器在笔记本电脑端提供 2 档配置，而桌面主机上则仅有“满血”高配。可以看到，RTX Spark N1X 面向移动端提供了 5120 核 GPU + 18 核 CPU 的低配，GPU 规模较 6144 核高配缩减 1/6、CPU 则较 20 核高配减少 2 个核心（IT之家注：NVIDIA 尚未公布 CPU 具体配置）。值得注意的是，早期电商泄露就提到了两个配置的 N1X，不过那时是以 \"675\" \"650\" 这样的数字代号呈现。相关阅读：《", "source": "IT之家", "url": "https://www.ithome.com/0/998/240.htm"}, {"n": 15, "section": "模型与产品", "title": "OpenAI正式发布GPT-6 Astra 号称操作电脑水平超越人类", "summary": "OpenAI正式推出了代号为“Astra”的下一代旗舰大模型GPT-6。据外媒报道，OpenAI宣称该模型在计算机操作能力（Computer Use）上已经超越普通人类用户，不仅在操作速度与准确度上更胜一筹，还能自主在复杂的多应用与多系统环境中高效执行多步骤任务。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576320.htm"}, {"n": 16, "section": "模型与产品", "title": "英伟达公布RTX Spark“N1X”芯片规格 20核与18核双版本", "summary": "在柏林国际电子消费品展览会（IFA）上，英伟达正式公布了面向消费级RTX Spark PC平台的首款高整合SoC——“N1X”的详细规格与上市计划。作为英伟达进军完整个人电脑计算平台的核心产品，N1X将基于Arm架构的Grace CPU与最新的Blackwell RTX GPU架构融为一体，并计划于今年10月通过各大OEM合作伙伴正式上市。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576318.htm"}, {"n": 17, "section": "科技要闻", "title": "AI吞噬海量数据引爆“复古”需求 磁带存储出货量暴涨57%再迎繁荣", "summary": "在人工智能对海量数字数据近乎贪婪的需求推动下，诞生于上世纪90年代的传统存储介质——磁带，如今不仅没有被淘汰，反而迎来了强劲的复兴热潮。此前，已停摆的DOGE项目曾试图以所谓“效率”为由全面淘汰磁带存储，然而市场的实际走向却给出了截然相反的答案。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576316.htm"}, {"n": 18, "section": "模型与产品", "title": "Google深度整合Gemini语音交互功能 全面登陆Gmail、Docs与Keep", "summary": "Google宣布为其Workspace办公生态推出一系列基于Gemini的人工智能语音新功能，正式将对话式语音交互深度整合进Gmail、Google Docs和Google Keep三大核心产品。用户未来无需繁琐地手动打字输入，直接通过语音对话即可完成邮件检索、文档起草以及结构化笔记整理等多项复杂任务。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576310.htm"}, {"n": 19, "section": "模型与产品", "title": "信赖Gemini做登山攻略致被困 预估8小时登顶实耗16小时 三名登山者深夜遇险获救", "summary": "除了求医问药，户外登山显然也是人们“绝不该轻易盲信AI”的领域之一。近日，几名年轻登山者在攀登美国加利福尼亚州锡斯基尤县的沙斯塔山（Mount Shasta）时，就因过分依赖GoogleAI聊天机器人Gemini而险些酿成大祸。原本AI预测只需8个小时即可完成的行程，最终让他们耗费了整整两倍的时间才到达山顶，并导致全员陷入严重困境。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576308.htm"}, {"n": 20, "section": "行业动态", "title": "OpenAI、Anthropic等多家AI公司正遭遇服务中断", "summary": "据Downdetector上的用户报告以及各公司状态页面显示，多家AI公司正遭遇服务中断。OpenAI表示，其ChatGPT和Codex目前正出现问题。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576306.htm"}], "sections": [{"label": "科技要闻", "count": 5, "start": 0}, {"label": "模型与产品", "count": 13, "start": 0}, {"label": "行业动态", "count": 2, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
