<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>

<script>
const DATA = {"date": "2026-09-11", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "AI新经济，在这里看见丨2026外滩大会首日观察", "summary": "2026外滩大会开幕，主题转向“共创AI新经济”。过去三年AI讨论多聚焦参数、算力、模型能力与跑分超越人类，如今关注点正从技术竞赛转向AI实际工作对经济带来的真实影响。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30972"}, {"n": 2, "section": "科技要闻", "title": "275万网友用阿福减重超500万斤:AI或引爆健康消费  体脂秤血糖", "summary": "AI+健康产业迎来风口。外滩大会论坛披露，蚂蚁阿福“科学减重一亿斤”行动吸引275万网友打卡75天，依托健康AI与硬件融合累计减重超500万斤，用户数达1.5亿，并带动体脂秤、健康食品等消费走热，华为、鱼跃、乐刻等企业参与布局。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30971"}, {"n": 3, "section": "模型与产品", "title": "​Anthropic向欧盟网络安全局敞开大门，Mythos5 模型迎合规大考", "summary": "人工智能合规监管获实质进展：Anthropic向欧盟网络安全机构开放Mythos模型访问权限，标志该前沿大模型在进入欧洲市场及应对当地监管方面迈出关键一步。此举基于双方深入沟通协商，欧盟委员会发言人托马斯·雷格尼尔确认已进行建设性沟通。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30970"}, {"n": 4, "section": "模型与产品", "title": "DeepSeek Harness 0.1.5 更新：适配 V4.1 Flash，新增文件上传与侧边栏预览", "summary": "DeepSeek Harness v0.1.5发布，与DeepSeek V4.1 Flash深度结合，针对标准、程序化工具调用及极简模式专项优化。新增文件上传与侧边栏预览，插件扩展入口标准化，并支持保留KV Cache更新系统提示。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30969"}, {"n": 5, "section": "模型与产品", "title": "ChatGPT 语音模式升级：Pro 可调用 GPT-6 Astra，每日限额规则大改", "summary": "OpenAI语音产品负责人宣布，ChatGPT语音模式支持用户自选模型与推理深度，Pro套餐可调用GPT-5.6 Sol或GPT-6 Astra；涉及网络搜索或复杂推理时自动调用指定模型。语音转交底层文本模型处理计为一条消息。四档套餐额度及三档语音智能等级同步公布。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30968"}, {"n": 6, "section": "科技要闻", "title": "刘震云、马毅谈AI时代:机器拿走共性，人更要守住个性", "summary": "外滩大会圆桌对话上，作家刘震云与港大教授马毅从文学和科技视角探讨AI对创造、教育、就业及人际关系的影响。二人态度乐观：刘震云称AI绝非洪水猛兽；马毅认为关键不在用不用AI，而在人类如何重塑自身价值与定位。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30967"}, {"n": 7, "section": "科技要闻", "title": "千问新款 AI 眼镜 N1“保密式”亮相：首次支持虹膜识别，不带显示屏", "summary": "千问新款AI眼镜N1亮相2026外滩大会AI支付展区，外观被黑色材料包裹，细节暂不可知。该产品首次引入虹膜识别，误识率低于百万分之一，可在复杂环境眼动追踪收银设备，佩戴即可核身；因不带显示屏，定价或较S1更低。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30963"}, {"n": 8, "section": "行业动态", "title": "AMD：超 20 款锐龙 AI Max+ PRO 495 设备即将上市，迷你主机成绝对主力", "summary": "AMD锐龙AI Max沙龙透露，超20款基于锐龙AI Max+ PRO495平台的设备将上市，多数为迷你主机；惠普例外，将推基于“Gorgon Halo”的ZBook Ultra移动工作站。已知机型包括铭凡N5MAX-P495、MS-S1MAX-P495、极摩客EVO-X5Pro和联想ThinkCentre X Ult", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30962"}, {"n": 9, "section": "模型与产品", "title": "告别配音“对不上嘴”！亚马逊Prime Video重磅上线AI口型同步技术", "summary": "亚马逊Prime Video全面上线AI口型同步功能，可精准对齐演员嘴部动作与真人配音音轨，解决跨语言配音时画面与声音脱节的痛点。该功能率先应用于德国剧集《贵族高中：我们之间的鸿沟》。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30961"}, {"n": 10, "section": "科技要闻", "title": "加州签署多项 AI 安全法案，罕见获得 OpenAI 与 Anthropic 同时背书", "summary": "美国加州州长纽森签署一揽子人工智能监管法案，要求前沿大模型强化安全风险评估、透明度披露，并防范灾难性网络攻击；万亿参数级模型上线前须通过红队演练和第三方审计。该立法罕见获得OpenAI、Anthropic等硅谷头部AI企业公开背书支持。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30960"}, {"n": 11, "section": "模型与产品", "title": "蚂蚁集团CEO韩歆毅：蚂蚁将推出激励政策加快智能体供需生态建", "summary": "9月10日，2026外滩大会主论坛举行“当Agent成为交易主体”圆桌，蚂蚁集团CEO韩歆毅、万事达卡CPO Jorn Lambert、OPPO CPO刘作虎、阿里首席科学家周靖人探讨智能体进入消费、交易与支付场景的产业变化。韩歆毅称，智能体供需未形成正循环：用户想用，商家缺成熟服务，商家也看不到用户在用。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30958"}, {"n": 12, "section": "模型与产品", "title": "DeepSeek V4.1 Flash 正式发布：552B MoE 新架构，全面超越 V4 Pro", "summary": "深度求索发布DeepSeek V4.1 Flash，为全新结构系列最小模型，具备原生多模态视觉理解。新结构旨在提升能力上限、推理速度与吞吐，并可扩展至更大参数。该模型为552B参数MoE，采用Causal-Encoder-Decoder不对称结构：输入激活仅8B，输出激活16B，HBM需求降至1/4，显著降低成本。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30957"}, {"n": 13, "section": "科技要闻", "title": "苹果 watchOS 27 RC 更新日志：新增 Siri Modular 表盘、优化智能叠放", "summary": "IT之家 9 月 11 日消息，科技媒体 9to5Mac 昨日（9 月 10 日）发布博文，分享了苹果 watchOS 27 RC 候选版本的完整更新日志，正式版将于下周二 9 月 15 日推送，为 Apple Watch 带来 Siri、Apple Intelligence、智能叠放和系统体验等多项更新。IT之家附上 watchOS 27 RC 更新日志内容如下：Siri AI更强大、更具对话能力的 Siri 将陆续向用户开放，可结合个人情境理解、App 操作、屏幕内容感知及广泛知识，协助用户更快查找信息、完成任务。全新 Siri 语音体验提供更自然、更富表现力的声音，用户可调整表达风格和语", "source": "IT之家", "url": "https://www.ithome.com/1/001/086.htm"}, {"n": 14, "section": "模型与产品", "title": "IT早报 0911：雷军称小米未来 5 年投 2000 亿元研发；启境回应媒体群误发小米澎程攻防内容；DeepSeek V4.1 Flash 发布；美的回应洗衣机 19 小时耗 411MB 流量...", "summary": "“IT早报”时间，大家好，现在是 2026 年 9 月 11 日星期五，今天的重要科技资讯有：1. 雷军回应新华社报道小米“底层技术自研打开科技创新空间”：未来 5 年，计划投入 2000 亿元研发费用新华社 9 月 10 日发文报道了小米玄戒三芯、小米澎程系列新车的发布，称底层技术自研打开科技创新空间。小米创办人、董事长兼 CEO 雷军 9 月 10 日发文回应，称在硬核科技上，会持续加大研发投入。未来 5 年，计划投入 2000 亿元研发费用。&gt;&gt; 查看详情2. 启境汽车回应媒体群误发“小米澎程攻防”相关内容：并非策划攻击、拉踩友商一张启境 GX7 媒体群的群聊截图最近在网络平", "source": "IT之家", "url": "https://www.ithome.com/1/001/082.htm"}, {"n": 15, "section": "科技要闻", "title": "中国在远离大城市的地方构建AI未来", "summary": "彭博社9月8日报道，原题：中国正在远离大城市的地方构建AI未来  乌兰察布位于草原之上，看起来不太像典型的科技中心城市。但这座位于中国内蒙古自治区的城市，已置身于中国将算力从拥挤的东部大城市迁往西部地区的行动最前线，因为西部地区拥有广阔空间和低价绿色能源。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577402.htm"}, {"n": 16, "section": "科技要闻", "title": "Astra需求激增，OpenAI暂停Pro新用户订阅", "summary": "据TechCrunch报道，由于新模型Astra带来的需求超出预期，OpenAI已暂停月费200美元的Pro套餐新用户订阅，以缓解基础设施压力。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577400.htm"}, {"n": 17, "section": "科技要闻", "title": "美国防部高官驳斥AI“末日论” 称担忧源于对变革的恐惧", "summary": "美国国防部高官近日公开驳斥AI可能毁灭人类的“末日论”，认为相关担忧源于对变革的恐惧，并重申Anthropic仍属国防部认定的供应链风险。据媒体当地时间9月10日报道，美国国防部首席技术官、负责研究与工程的副部长Emil Michael当天公开回应近期不断升温的AI风险担忧。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577394.htm"}, {"n": 18, "section": "科技要闻", "title": "加州正式签署系列严苛新法 限制AI聊天机器人并强化未成年人网络保护", "summary": "面对生成式人工智能对未成年人心理健康的潜在冲击与沉迷风险，美国加利福尼亚州州长加文·纽森（Gavin Newsom）正式签署了一组开创性的网络与AI安全法案。该揽子法规在全美范围内率先对向未成年人提供服务的AI聊天机器人设定了严格的功能红线，同时全面升级了针对社交平台算法诱导与数据收集的法定问责机制，标志着加州在保护未成年人免受高侵入性数字技术侵害方面再度树立了全美最严格的监管标杆。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577388.htm"}, {"n": 19, "section": "行业动态", "title": "民间Mod成功让英伟达RTX 20系Turing显卡运行原生DLSS帧生成", "summary": "继早前技术社区成功将DLSS技术移植到前代显卡之后，全球PC硬件与游戏Mod圈再度迎来重大突破，有民间开发者成功攻破了英伟达官方对DLSS帧生成（Frame Generation）技术的硬件代际封锁，首次让基于“图灵”（Turing）微架构的GeForce RTX 20系列显卡直接运行起英伟达自家的DLSS帧生成管线。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577384.htm"}, {"n": 20, "section": "模型与产品", "title": "Google正式推出面向Windows平台的Gemini原生桌面应用程序", "summary": "Google公司正式宣布向全球Windows操作系统用户推出Gemini人工智能助手的原生桌面客户端应用程序。这一长期受PC用户期待的举措，标志着Google不再将Gemini的桌面访问体验局限于网页浏览器标签页之内，而是选择直接切入全球最大的桌面计算操作系统底层生态，正面迎战已深度植入Windows平台的微软Copilot以及OpenAI早前上线的ChatGPT桌面客户端。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577380.htm"}], "sections": [{"label": "科技要闻", "count": 10, "start": 0}, {"label": "模型与产品", "count": 8, "start": 0}, {"label": "行业动态", "count": 2, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
