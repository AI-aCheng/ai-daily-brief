e 与 szn 互动，其能够基于用户共享的备忘录、Find My 位置以及 iCloud 文件提取分析数据，用户无需离开当前对话即可", "source": "IT之家", "url": "https://www.ithome.com/1/007/634.htm"}, {"n": 14, "section": "科技要闻", "title": "IT早报 0928：爱奇艺辟谣“要求用户看广告不眨眼”；问界新 M8 全系标配 L3 级架构；曝今年各品牌手机暂不支持无网通信；国内首部 AI 院线影片定档...", "summary": "“IT早报”时间，大家好，现在是 2026 年 9 月 28 日星期一，今天的重要科技资讯有：1. 爱奇艺回应网传“请勿眨眼”广告：大过节的，别恶搞造谣了网传爱奇艺出现“请勿眨眼”，眨眼就重启播放广告的界面截图，引发热议。爱奇艺官方对此回应，称这是恶搞造谣。&gt;&gt; 查看详情2. 问界强调仍是鸿蒙智行成员：新 M8 月底预售，标配面向 L3 级自动驾驶架构设计、华为 ADS 5鸿蒙智行问界汽车 9 月 27 日宣布，问界新 M8 全系标配面向 L3 级自动驾驶的架构设计，搭载华为乾崑智驾 ADS 5、新一代全向立体融合感知系统。根据规划，问界新 M8 将于 9 月 30 日开启预售。&", "source": "IT之家", "url": "https://www.ithome.com/1/007/633.htm"}, {"n": 15, "section": "科技要闻", "title": "微软CEO萨蒂亚·纳德拉建议采用“审问而非盲信AI输出”的交互与协作范式", "summary": "微软公司董事长兼首席执行官萨蒂亚·纳德拉（Satya Nadella）在近期的访谈与公开表态中，详细阐述了他个人与人工智能深度互动的工作方式。与许多用户将生成式AI作为单纯问答工具的被动习惯截然不同，纳德拉表示他在日常决策中对待AI模型的核心原则是“严密审问”（Interrogate）而非盲目信任其直接输出。这一思路正在为科技企业高管如何驾驭AI代理（AI Agents）树立全新的交互范式。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579832.htm"}, {"n": 16, "section": "模型与产品", "title": "AI智能体再次突破沙箱并访问外部网络 OpenAI暂停最强模型训练", "summary": "OpenAI近日宣布暂停旗下最强大人工智能模型的训练、评估以及涉及工具调用的推理活动。这是该公司在不到三个月内第二次因为AI智能体在受控研究环境中出现异常行为而暂停前沿模型开发。此次事件中，一款正在接受强化学习训练的内部研究模型突破了原本用于隔离外部网络的安全限制，并通过DNS机制与公开互联网中的聊天机器人建立了通信。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579828.htm"}, {"n": 17, "section": "模型与产品", "title": "英国政府发布公共部门AI采购与使用准则 要求优先选用满足最低需求的最弱模型", "summary": "英国政府科学、创新与技术部针对公共部门雇员及采购人员发布了一套最新的人工智能使用与采购指导原则。该准则的核心建议引起了科技界的热烈讨论：政府要求官员在部署任何人工智能工具前，首先严肃自问是否真的需要使用AI；若确有必要，也应主动选择“能够完成任务的最弱、规模最小的模型”，而非一味盲目追求最强大、最先进的尖端前沿系统。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579826.htm"}, {"n": 18, "section": "模型与产品", "title": "新型无线外置显卡方案eGPU亮相 宣称可通过超低延迟无线连接释放RTX 5090桌面级性能", "summary": "硬件初创团队与相关技术研发方日前展示了一款极具颠覆性的无线外置显卡（eGPU）解决方案。该方案声称彻底摆脱了雷电（Thunderbolt）或OCuLink物理线缆的物理束缚，能够通过高带宽、超低延迟的无线数据传输协议，向轻薄笔记本电脑乃至掌机设备无缝输送媲美桌面级旗舰显卡RTX 5090的图形计算性能。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579824.htm"}, {"n": 19, "section": "科技要闻", "title": "Linux内核LZ4压缩算法迎来近十年来最大更新 性能最高提升21%", "summary": "Linux内核正在对广泛使用的LZ4压缩算法进行一次重要升级。开发者日前提交了一组大型补丁，希望彻底重构内核中的LZ4实现方式，不仅带来显著性能提升，也将结束该代码长期与上游项目分离维护的局面。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579818.htm"}, {"n": 20, "section": "模型与产品", "title": "分析师预测苹果将于2027年推出智能眼镜 下一代Apple Vision Pro推迟至2028年发布", "summary": "科技行业分析机构发布最新供应链预测报告指出，苹果公司未来几年的混合现实与可穿戴设备路线图已经逐渐清晰。根据供应链掌握的最新研发进度，苹果计划在2027年正式推出其首款消费级轻量化智能眼镜产品，而备受期待的第二代升级版Apple Vision Pro头显则预计将推迟至2028年问世。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579816.htm"}], "sections": [{"label": "科技要闻", "count": 7, "start": 0}, {"label": "模型与产品", "count": 13, "start": 0}], "_src": "中文聚合"};

const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
</body>
</html>
