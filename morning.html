<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-15", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "蓝虫具身发布模块化人形机器人“小白”，0. 98 万元起售", "summary": "西安交大科技成果转化企业蓝虫具身9月14日发布新一代模块化人形机器人Mantis Standard“小白”，起售价仅0.98万元，打破传统高价门槛。该产品定位为可灵活变形的具身智能平台，底盘、手臂、腰部、头部采用标准模块设计，支持多种形态组合，引发业界广泛关注。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31038"}, {"n": 2, "section": "模型与产品", "title": "GPT-6 Astra展现恐怖统治力：模拟售货机一年狂揽1.5万美元，成绩碾压Claude近3倍", "summary": "Andon Labs的Vending-Bench2测试中，AI代理用500美元模拟经营自动售货机一年。GPT-6Astra平均余额达15515美元，最差一轮也超Claude Fable5.1最好成绩，首次登顶，优势体现在供应链管理和规则执行力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31035"}, {"n": 3, "section": "模型与产品", "title": "Suno发布v6音乐模型：联合华纳、BMG 共创，自然语言就能改歌、混音、采样", "summary": "Suno CEO Mikey Shulman发布新一代音乐模型v6，联合华纳音乐、BMG、Believe等共同打磨，称为实现“让更多人享受创作音乐”愿景迄今最大一步。v6首次以模型套件形式推出，含三个定位不同的成员：旗舰v6面向Pro/Premier用户，强调可靠、精确，跨流派稳定输出精修成品；另含v6-wild等模型", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31033"}, {"n": 4, "section": "模型与产品", "title": "宇树人形机器人G1+发布:电机、视觉、交互与续航全面增强 标准版售价9.5万元", "summary": "宇树科技发布人形机器人G1+，围绕运动、感知、智能三大维度升级6项：新增2自由度颈部，俯仰约-25°至36°、偏航±110°；优化电机输出与散热、视觉触觉、续航及远场语音。标准版含税售价9.5万元，EDU版未公布，延续高性价比定位。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31032"}, {"n": 5, "section": "科技要闻", "title": "奥尔特曼支持给 AI“控速”：不是叫停技术进步，而是别让能力跑在对齐前面", "summary": "OpenAI首席执行官奥尔特曼表态支持人工智能“控速”发展，避免尖端模型能力超出人类可控范围，与Anthropic CEO阿莫迪观点相近。他承认转向安全会付出一定代价，但有助于维持外界信心，证明美国企业在研发日益强大的AI时能够恪守责任。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31031"}, {"n": 6, "section": "模型与产品", "title": "ElevenLabs发布Music v2.5音频模型，同步开放APP与API访问", "summary": "ElevenLabs于3日发布生成式音乐模型ElevenMusic v2.5，通过移动应用和API向全球开放。新版提升音频饱满度与自然感；在47,885对样本盲测中，多数听众偏好v2.5，在R&B、灵魂乐、嘻哈、摇滚、管弦乐等曲风上表现更佳。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31030"}, {"n": 7, "section": "科技要闻", "title": "Anthropic CEO 呼吁前沿 AI 限速，奥特曼与马斯克接连站台", "summary": "Anthropic CEO达里奥·阿莫迪呼吁放缓前沿AI发展，提出以“可核验性”为核心的三步方案：企业引入驻场第三方评估、美国与盟友协同、全球协作。他认为AI递归式自我改进已出现，6至12个月后智能体或借僵尸网络控制互联网，因此须放慢能力提升，将时间投入可靠性、对齐、可解释性与测试评估。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31029"}, {"n": 8, "section": "模型与产品", "title": "DeepSeek-V4.1-Flash上线千问AI平台，API与Token Plan同步开放", "summary": "DeepSeek-V4.1-Flash上线千问AI平台，开放API与Token Plan。开发者可经标准API接入，或在Qoder、千问APP、Codex等工具调用，用于代码、文档、视觉理解与智能体任务。该模型为轻量旗舰，552B MoE非对称架构，输入激活约8B、输出约16B，原生支持图文理解，上下文最长100万to", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31028"}, {"n": 9, "section": "模型与产品", "title": "百图生科牵手华大智造：联合构建专属细胞大模型，押注&quot;设备+模型+智能体&quot;一体化", "summary": "百图生科与华大智造达成战略合作，共建细胞大模型，提升细胞状态建模与扰动响应预测能力，并打造高质量数据基础设施，探索“设备+模型+智能体”一体化产品模式，加速AI4S进程。华大智造提供测序与自动化硬件入口，百图生科负责AI建模，双方分工互补。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31027"}, {"n": 10, "section": "模型与产品", "title": "爆料称 DeepSeek 下一波大模型将至：3 万亿参数，性能剑指 GPT-6 Astra", "summary": "DeepSeek本周发布V4.1 Flash，架构变化巨大但未升大版本号。V4.1 Pro已确定，具体升级未公布，性能上限或较高，但鉴于前代Pro不及预期，外界期待不宜过高。另有Code 2.0被曝即将发布，主打电脑控制，后续还有更多大模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31026"}, {"n": 11, "section": "模型与产品", "title": "OpenAI 推出 Agents API：把 Codex 拆成云端服务，&quot;造 Agent&quot; 变成一次 API 调用", "summary": "OpenAI发布四项更新，涵盖智能体、语音、数据与金融。其中Agents API最受关注，将Codex能力拆解为云端服务，以“能力即服务”降低智能体开发门槛，标志其从卖单一模型转向构筑开发者生态，是Codex布局的关键落地。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31025"}, {"n": 12, "section": "模型与产品", "title": "京东在 JDD 上甩出可交互视听世界模型：EchoWM 开源，长视频生成同步冲到 10 分钟以上", "summary": "京东在JDD大会上发布JoyAI-Echo两项进展：音视频生成模型升级至1.5，持续生成超10分钟；开源可交互视听世界模型EchoWM，融合原生视听生成与用户控制，让AI内容从“能看”走向“能进、能探索”。长视频采用音视频Memory Bank架构，支持多镜头生成。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31024"}, {"n": 13, "section": "科技要闻", "title": "Meta 对 Instagram 应用 AI 修图功能新增付费限制，需订阅 Meta One 会员使用", "summary": "IT之家 9 月 15 日消息，据外媒 Business Insider 报道，Instagram 近期开始对部分 AI 修图功能加入付费限制，用户在使用 AI 修图达到一定程度后，应用便会要求用户订阅 Meta One Core 会员才能继续使用更多 AI 效果，否则需要等到明天再试。IT之家注意到，Meta 于今年 5 月公布 Meta One 订阅服务，每月收费 7.99 美元（IT之家注：现汇率约合 53.7 元人民币），该会员主要提供一系列 AI 权益和应用内个性化功能，例如用户可以在不实际打开对方动态的情况下预览 Instagram Stories，使用复古版 Instagram ", "source": "IT之家", "url": "https://www.ithome.com/1/002/366.htm"}, {"n": 14, "section": "模型与产品", "title": "Anthropic Claude Opus 5.2 灰度测试曝光：响应更快，告别“偷懒”", "summary": "原标题：《突发！Opus 5.2 深夜上线，RSI 真来了？》今天清晨，Opus 5.2 悄悄上线了。许多开发者发现，新一代神级模型 Claude Opus 5.2，已经在 Claude Code 中开启灰度测试！而且，此前一份内部风险报告显示，Anthropic 正在动用「核武器级别」的未发布模型 Model 2。它接管了公司大部分代码编写，将替代 85% 研究团队。传说中的 RSI，真的来了。Opus 5.2 悄悄上线：不仅跳级，还治好了「偷懒病」昨晚，X 上的开发者们沸腾了。越来越多的 Claude 用户发现：在 Claude Code 中调用 Opus 5 时，它的表现和网页版 Opu", "source": "IT之家", "url": "https://www.ithome.com/1/002/365.htm"}, {"n": 15, "section": "科技要闻", "title": "苹果Siri AI历经延期后正式开放测试", "summary": "苹果公司周一发布了新版iPhone操作系统iOS 27，其中包括重新设计的Siri AI个人助理。就在最新款iPhone本周正式上市前，苹果率先向用户开放了这款全新Siri的测试版本。据苹果介绍，Siri AI是一款能力大幅提升、交互更加自然的智能助手，具备理解个人上下文、掌握广泛的全球信息、感知屏幕内容以及执行更多跨系统应用操作等能力。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577978.htm"}, {"n": 16, "section": "模型与产品", "title": "苹果正式发布iOS 27：Siri迎来重大AI升级 性能提升并新增多项智能功能", "summary": "苹果于当地时间9月14日正式向全球用户推送iOS 27，这是苹果今年面向iPhone推出的最大规模系统更新之一。iOS 27在延续上一代Liquid Glass设计语言的基础上，对系统界面、性能以及人工智能能力进行了大幅升级，其中最受关注的变化是全新的Siri AI。与此同时，苹果还加入了更多Apple Intelligence功能，并进一步改善照片、隔空投送、快捷指令、“查找”等系统功能。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577954.htm"}, {"n": 17, "section": "行业动态", "title": "OpenAI罕见支持英国出台强制性AI监管法案 呼吁趁“政治窗口期”尽快立法", "summary": "OpenAI近日公开呼吁英国政府制定具有法律约束力的人工智能监管框架，要求对最先进的前沿人工智能模型实施强制性安全规则。这一表态标志着全球领先AI企业对于监管态度出现新的变化，也让英国围绕人工智能治理的讨论进一步升温。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577946.htm"}, {"n": 18, "section": "模型与产品", "title": "三星与高通联手推进2.1D先进封装：无需硅中介层 带来AI芯片高性能互连能力", "summary": "三星与高通正在进一步扩大双方在半导体领域的合作范围，双方已经围绕2.1D先进封装技术展开合作，目标是为下一代高性能计算和人工智能芯片提供更高密度、更高速率的芯片互连方案。此次合作也被视为三星进一步完善先进封装技术体系、争夺AI芯片封装市场的重要一步。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577942.htm"}], "sections": [{"label": "模型与产品", "count": 13, "start": 0}, {"label": "科技要闻", "count": 4, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
