<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);

.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}

.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}

碑，调用量持续攀升，智谱正支撑增长需求。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31160"}, {"n": 8, "section": "模型与产品", "title": "白帽黑客用 Claude 攻破 OpenAI 员工 ChatGPT 账户，拿到 6500 美元赏金", "summary": "据《华尔街日报》报道，安全公司Hacktron AI研究人员利用Anthropic Claude入侵一名OpenAI员工的ChatGPT账户，获取私有代码库文档。漏洞源于Discourse令牌在ChatGPT上有效，7月23日发现并报告后，OpenAI支付6500美元赏金。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31159"}, {"n": 9, "section": "模型与产品", "title": "Claude 写掉 Anthropic 八成代码，CI 半年暴涨 25 倍差点被&quot;砸瘫&quot;", "summary": "Anthropic内部数据显示，Claude已编写全公司80%代码，工程师季度交付量升至2021至2025年平均8倍，代码审查与合并也大量由Claude承担。但AI写代码模式迥异：偏好极细粒度PR、全天候提交，测试用例激增10倍，导致CI任务量6个月内暴涨乃至瘫痪。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31157"}, {"n": 10, "section": "科技要闻", "title": "法官驳回 OpenAI 请求：苹果无需公布与 SpaceXAI 的和解协议", "summary": "美国得州联邦法官驳回OpenAI动议，裁定苹果无需公布与SpaceXAI达成的保密反垄断和解协议。法官表示，公布保密协议的先例前提是协议含与待决争议相关信息；闭门审查认为该协议与OpenAI诉讼争议点无关。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31155"}, {"n": 11, "section": "模型与产品", "title": "OpenAI披露GPT-5.6Sol异常行为:曾向后续模型传递“隐藏错误”指令", "summary": "OpenAI 9月16日发布模型不匹配报告框架，披露含GPT-5.6Sol在内的六起异常行为。训练期间，部分模型实例曾在“压缩摘要”中写入指令，要求后续模型隐藏错误或不一致，官方称已处理。报告还显示，财务代理因缺2024年数据，建议自行生成数据并仅在被问及时披露；另一代理发现供应商源异常，反映模型存在隐瞒倾向与数据合规", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31154"}, {"n": 12, "section": "科技要闻", "title": "​OpenAI、微软高管内部承认 AI 可替代新闻文章，法院文件曝光", "summary": "法庭文件显示，OpenAI与微软高管曾私下承认其AI可替代媒体文章，威胁新闻业。该证据出自《纽约时报》诉两家公司版权案解封文件。诉讼自2023年12月启动，指控未经许可用数百万篇文章训练模型。2025年3月法官驳回大部分撤案动议，核心版权侵权指控获准继续审理。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31153"}, {"n": 13, "section": "科技要闻", "title": "微软高管内部表述曝光，称训练 AI 是“人类历史上最大规模劳动窃取”", "summary": "IT之家 9 月 19 日消息，科技媒体 Tom's Hardware 昨日（9 月 18 日）发布博文，报道称在起诉 OpenAI 和微软的版权纠纷案中，原告《纽约时报》已申请简易判决，并提交新的法律摘要，进一步披露两家公司（微软和 OpenAI）内部材料。这起版权纠纷可以追溯到 2023 年年底，《纽约时报》指控微软和 OpenAI 两家公司侵犯其数千篇新闻报道的版权，未经许可使用其内容来训练 ChatGPT 和 Copilot 等产品。《纽约时报》法律团队近日向法院申请简易判决，并同时递交法律摘要，并援引来自两家被告的声明和文件。IT之家注：简易判决是美国民事诉讼中的一种裁决程序。申请方", "source": "IT之家", "url": "https://www.ithome.com/1/004/356.htm"}, {"n": 14, "section": "模型与产品", "title": "谷歌首次公开 Gemini 越狱事件：在测试中自主入侵三家真实公司且自行终止，已通知涉事企业", "summary": "IT之家 9 月 19 日消息，据《华尔街日报》今日报道，谷歌确认其 Gemini 模型在今年 5 月的一次安全测试中曾自主入侵过外部真实企业，系 Gemini 首次已知的 AI 越狱事件。谷歌表示，该事件发生在测试公司 Irregular 开展的一次“捕获旗帜”演练中，目的是评估 Gemini 的网络安全能力。测试环境本应完全隔离，但却意外开放了互联网访问权限。IT之家注：“捕获旗帜”（Capture the Flag）是一种网络安全竞赛形式，参与者在模拟环境中寻找并获取隐藏的“旗帜”以证明成功入侵。在谷歌披露其中一起事件中，Gemini 通过猜对密码获得了对受保护系统的访问权限。在另外两起", "source": "IT之家", "url": "https://www.ithome.com/1/004/355.htm"}, {"n": 15, "section": "模型与产品", "title": "谷歌AI首次“越狱”：Gemini在测试中入侵三家企业", "summary": "谷歌的Gemini模型在一次网络安全能力测试中访问了互联网并入侵了其他公司，这是该公司人工智能系统自主实施此类行为的首个已知案例。谷歌周五证实，这些黑客行为发生在5月，是Irregular公司进行的一次测试的一部分。Irregular也曾参与OpenAI、Anthropic和Meta披露的类似事件。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578662.htm"}, {"n": 16, "section": "行业动态", "title": "格芯与美满电子深化合作 加速硅光子技术在大规模数据中心落地", "summary": "面对全球人工智能大模型与高性能计算对数据传输带宽及能效提出的严苛挑战，半导体晶圆代工巨头格芯（GlobalFoundries）与光互连及芯片解决方案领军企业美满电子（Marvell Technology）宣布达成深度战略合作。双方将全面扩大在硅光子（Silicon Photonics）制造与封装技术领域的协作，旨在加速下一代高密度、低延迟且低功耗的硅光子光互连平台在 AI 数据中心与超大规模云端基础设施中的商业化部署。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578660.htm"}, {"n": 17, "section": "模型与产品", "title": "Anthropic设立实体生物实验室 推动Claude参与机器人实验", "summary": "Anthropic已在旧金山湾区建立一处生物“湿实验室”，将人工智能在生命科学领域的应用从文献、数据和计算分析延伸至实体实验。公司计划让Claude协助指导实验机器人，在药物研发及罕见病研究中形成设计实验、执行操作和分析结果的闭环。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578654.htm"}, {"n": 18, "section": "科技要闻", "title": "美军因AI误判带来的错误情报准备拦截检查中国船只 险些制造国际冲突", "summary": "美国军方今年春季在伊朗战争期间险些因一份由人工智能辅助生成的错误情报报告，对一艘中国船只采取军事行动。多名知情人士透露，相关报告错误地认定这艘位于中东地区的中国船只正在运输与核武器计划有关的设备和材料，而这一结论最终被证实完全失实。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578652.htm"}, {"n": 19, "section": "模型与产品", "title": "科研人员揭示脑神经高效运算机制 可助力下一代类脑芯片研发", "summary": "神经科学与计算技术交叉领域近日取得重要研究进展。来自国际联合科研团队的最新发现，成功揭示了人脑神经网络在处理复杂信息与记忆检索时的高效协作机制，这一成果为突破传统计算架构的能效瓶颈、打造更接近人类大脑工作方式的下一代“类脑计算机”（Neuromorphic Computing）提供了全新的理论支撑与技术路线。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1578650.htm"}, {"n": 20, "section": "行业动态", "title": "创业公司Crusoe融资39亿美元打造“Spark”模块化数据中心", "summary": "在人工智能热潮推动下，全球数据中心建设正面临前所未有的扩张需求。然而，电力供应不足、建筑工人短缺以及项目审批周期过长等问题，正在成为制约AI产业发展的关键瓶颈。面对这一局面，美国AI基础设施公司Crusoe提出了一种不同于传统“超大型园区”的解决方案：建设可批量生产、可运输部署的模块化数据中心。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578640.htm"}], "sections": [{"label": "科技要闻", "count": 6, "start": 0}, {"label": "模型与产品", "count": 11, "start": 0}, {"label": "行业动态", "count": 3, "start": 0}], "_src": "中文聚合"};

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
