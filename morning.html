<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

nBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1573382.htm"}, {"n": 6, "section": "行业动态", "title": "英伟达Vera Rubin平台量产推高需求 TLC NAND现货价格回升至21美元", "summary": "随着英伟达（NVIDIA）Vera Rubin平台的量产规模不断扩大，其对供应链的影响已开始在TLC NAND现货市场等环节显现。经历了6月份的低谷后，512Gb TLC NAND的现货价格目前已强势回升至21美元，而QLC的价格则保持平稳。业内分析指出，这一价格上涨趋势完全符合逻辑，主要由英伟达技术升级及市场需求增长两大因素驱动。 阅读全文 ]]>", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1573376.htm"}, {"n": 7, "section": "科技要闻", "title": "新型互动应用“Your AI Slop Bores Me”走红 让人类假扮AI体验反向乐趣", "summary": "一款名为“Your AI Slop Bores Me”的新奇网页应用巧妙地让人们通过角色扮演体验了一把当“人工智能”的乐趣，在胡言乱语、讲冷笑话或处理各种奇葩请求中开怀大笑。 阅读全文 ]]>", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1573366.htm"}, {"n": 8, "section": "模型与产品", "title": "马斯克旗下xAI面临新指控 一女子称其继父利用Grok将其童年照篡改为露骨图像", "summary": "一名化名为“简·多伊4号”（Jane Doe 4）的女子近日加入了一项针对埃隆·马斯克旗下xAI公司的诉讼。该诉讼最初由三名田纳西州青少年发起，指控该公司的人工智能聊天机器人Grok在生成儿童性虐待材料方面起到了推波助澜的作用。 阅读全文 ]]>", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1573364.htm"}, {"n": 9, "section": "模型与产品", "title": "英国7月通胀料回升至2.9% 英国央行警惕AI芯片与能源双重冲击", "summary": "未来一周，英国消费者物价数据将成为市场焦点。受人工智能引发的存储芯片短缺、能源成本走高影响，英国央行将保持警惕。", "source": "环球市场播报", "url": "https://finance.sina.com.cn/stock/usstock/c/2026-08-16/doc-ininnkfv8014779.shtml"}, {"n": 10, "section": "模型与产品", "title": "韩国股市回暖卖空规模却不降反升 投资者疑虑芯片行业是否见顶", "summary": "周日公布的数据显示，尽管韩国股市从芯片及人工智能相关个股暴跌引发的行情崩盘中大幅反弹，但股票卖空规模仍在持续走高。", "source": "环球市场播报", "url": "https://finance.sina.com.cn/stock/usstock/c/2026-08-16/doc-ininnkfu1216181.shtml"}, {"n": 11, "section": "行业动态", "title": "英伟达正洽谈向软银支持的SB Energy最高投资30亿美元 服务OpenAI巨型数据中心建设", "summary": "据知情人士透露，英伟达正洽谈向SB Energy最高投资30亿美元。SB Energy由软银集团扶持，该公司正在为OpenAI推进俄亥俄州大型数据中心项目。", "source": "环球市场播报", "url": "https://finance.sina.com.cn/stock/usstock/c/2026-08-16/doc-ininnkfu1213779.shtml"}, {"n": 12, "section": "行业动态", "title": "业绩太 “炸裂”！AI巨头营收暴增14倍，有望刷新全球史上最大规模IPO纪录", "summary": "来源：华夏时报 AI巨头Anthropic的业绩太“炸裂”了。 据最新消息，全球AI巨头Anthropic第二季度营收已超过115亿美元，同比增长1361%。", "source": "市场资讯", "url": "https://finance.sina.com.cn/wm/2026-08-16/doc-ininnkfw9964936.shtml"}, {"n": 13, "section": "行业动态", "title": "英伟达洽谈向SB Energy投资30亿美元，系OpenAI数据中心交易组成部分", "summary": "据知情人士透露，英伟达正洽谈向SB Energy最高投资30亿美元。SB Energy由软银集团支持，负责为OpenAI开发俄亥俄州大型数据中心项目。", "source": "环球市场播报", "url": "https://finance.sina.com.cn/7x24/2026-08-16/doc-ininmtkf0249840.shtml"}, {"n": 14, "section": "行业动态", "title": "高毅、景林美股调仓曝光！一个加仓存储龙头，一个清仓英伟达", "summary": "知名私募最新美股持仓浮出水面。 近日，高毅资产旗下海外基金2026年二季度美股持仓通过美国证券交易委员会（SEC）官网披露。数据显示，截至二季度末...", "source": "券商中国", "url": "https://finance.sina.com.cn/stock/t/2026-08-16/doc-ininmpac1943804.shtml"}, {"n": 15, "section": "科技要闻", "title": "以色列正试图操控人工智能关于加沙议题的输出内容", "summary": "以色列已发起一场公关宣传活动，目的是引导ChatGPT等人工智能系统在回答有关以色列、加沙以及以色列国防军相关问题时的表述倾向。", "source": "环球市场播报", "url": "https://finance.sina.com.cn/7x24/2026-08-15/doc-ininmhum0412804.shtml"}], "sections": [{"label": "科技要闻", "count": 5, "start": 0}, {"label": "行业动态", "count": 7, "start": 0}, {"label": "模型与产品", "count": 3, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(it.n).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（IT之家/cnBeta/新浪科技），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
</body>
