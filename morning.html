<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-09", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "DeepSeek V4.1-Flash内测：更强的视觉智能，更极致的速度与成本", "summary": "9月8日，DeepSeek V4.1-Flash开启中间版本内测，采用全新模型结构，原生支持多模态，综合能力更强、速度更快、调用成本更低。开发者保持base_url不变，将模型名设为deepseek-v4.1-flash-expires-on-0910即可调用，计费与V4-Flash一致。外部反馈暂未披露。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30911"}, {"n": 2, "section": "模型与产品", "title": "微软发布 Project Opal：只说目标，AI 连干数小时帮你交付成品", "summary": "微软CEO纳德拉宣布为Microsoft 365 Copilot推出AI功能Project Opal，定位为可控安全环境中的智能体，可规划执行复杂长周期任务，从快速问答拓展至委派型工作与长期自动化，用户下达任务后可持续运行数小时。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30909"}, {"n": 3, "section": "模型与产品", "title": "Arm CEO：AI 有生之年能帮人类攻克癌症，但芯片供应是最大瓶颈", "summary": "Arm首席执行官雷内·哈斯在BBC采访中表示，AI最具颠覆性的应用在医疗健康，有望帮助人类在这一代人有生之年攻克癌症，并缩短药物研发时间。但他强调，实现这一目标前，行业必须先解决芯片产能不足问题，为AI提供足够算力支撑。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30908"}, {"n": 4, "section": "模型与产品", "title": "马斯克杀入Copilot主场：Grok Bot 深度接管微软账号", "summary": "Grok Bot升级全面接入微软账号，通过插件打通Outlook、日历和OneDrive，可协助收发整理邮件、创建修改回复会议日程、浏览上传网盘文件。底层连接器5月已问世，本次核心是将连接器适配为常驻云电脑的Grok Bot插件。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30907"}, {"n": 5, "section": "模型与产品", "title": "DeepSeek 一次性放出 150 个岗位：Harness 团队急招工程师，规模膨胀倒逼后端重写", "summary": "DeepSeek Harness团队负责人崔添翼公开招人，一次放出约150个名额，称新方向新系统需求多。这对以“小团队、高人才密度”著称的DeepSeek并非小招聘，是继6月后再次扩招。本次更聚焦，仅招服务端开发与Agent弹性计算两类，与此前“所有部门扩规模”的规划不同。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30906"}, {"n": 6, "section": "模型与产品", "title": "ChatGPT Work 迎来重磅升级：精准克隆个人写作风格", "summary": "ChatGPT Work升级，迈向个性化办公助手。核心功能是深度捕捉并复现用户个人写作风格，降低内容创作与校对成本。它可与主流办公平台无缝对接，经用户授权后提取多维特征，并强调隐私安全，让AI从通用工具转向真正懂你的办公伴侣。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30905"}, {"n": 7, "section": "模型与产品", "title": "DeepSeek招募150名资深工程师 重点加码Agent工程化与DSec基建", "summary": "9月8日，DeepSeek启动约150人工程师招聘，聚焦服务端开发与Agent弹性计算研发，重点招2至10年资深后端工程师，未设AI研究岗。这是继6月全部门扩招后又一动作，显示战略重心从纯模型研究转向Agent工程化与基础设施建设，涉及大模型研究平台、Agent框架组件及DeepSeek API。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30904"}, {"n": 8, "section": "科技要闻", "title": "联合国高级专员警告：AI 对人类构成“生存性”风险，呼吁设不可逾越的红线", "summary": "联合国人权高专蒂尔克周一警告，先进人工智能或对人类构成生存性风险，呼吁以“铁一般保障措施”确保AI安全，并承诺敦促相关企业降低风险。他在开启第二个任期前夕于日内瓦发表上述言论，称与业界同样担忧AI威胁。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30903"}, {"n": 9, "section": "科技要闻", "title": "Meta智能体AI“Muse”开启封闭测试 支持跨应用与个人财务管理", "summary": "Meta旗下智能体AI“Muse”已结束内测，进入有限Alpha/Beta封闭测试，并上架App Store，需排队或邀请码使用。作为端侧AI Agent，Muse主打全场景智能代办，可接驳Gmail、Google Calendar及Peloton等服务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30902"}, {"n": 10, "section": "模型与产品", "title": "抬眼就能完成支付！微信支付智能眼镜 SDK 正式上线，Rokid 成首家适配品牌", "summary": "微信支付智能眼镜SDK全面上线，将“扫一扫”支付能力封装为标准接口，向符合标准的眼镜厂商开放。Rokid乐奇AI眼镜成为首款适配落地产品。用户首次使用前需在眼镜厂商手机App中申请开通，之后即可在适配眼镜上直接扫码付款，标志支付场景向智能穿戴设备延伸。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30901"}, {"n": 11, "section": "科技要闻", "title": "可灵AI正式官宣亮相2026多伦多国际电影节市场", "summary": "可灵AI宣布将于2026年9月10日至16日亮相多伦多国际电影节市场，与全球影视创作者和制作人探讨AI深入影视制作前沿。期间将举办多场交流活动，其中产业论坛定于9月10日上午11:00至12:00在Metro Toronto Convention Centre Stage B举行，主题聚焦“创作新范”。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30900"}, {"n": 12, "section": "模型与产品", "title": "AI新经济如何抵达每个人?2026外滩大会发布“AI科技人文十问”", "summary": "9月8日，2026 Inclusion·外滩大会发布“外滩大会AI科技人文十问”，聚焦普通人真实困惑，如“AI提效为何更累”“如何教孩子思考”。问题来自白领、教师、父母、老人、医生等，区别于以往科技界学术界的宏大命题，体现AI时代个体寻找自身位置的思考。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30899"}, {"n": 13, "section": "模型与产品", "title": "华为靳玉志谈麒麟 9050 Pro 回归：六年时间，麒麟完成涅槃，国产芯片迎来新的里程碑", "summary": "IT之家 9 月 9 日消息，在 9 月 7 日的 HarmonyOS 7 | HUAWEI Mate XT 2 及全场景新品发布会上，华为 Mate XT 2 非凡大师全新展翼三折叠手机正式发布，定价 19,999 元起。这款新机最大亮点之一就是搭载了首款逻辑折叠 τ 芯片 —— 全新麒麟 9050 Pro。华为智能汽车解决方案 BU CEO 靳玉志昨晚发文，谈及了这颗全新麒麟处理器：麒麟芯片回归！麒麟 9050 Pro 是首款采用逻辑折叠技术的高性能芯片，华为 Mate XT 2 非凡大师首发搭载。Mate 40 我一直也在使用，它搭载的就是当年的麒麟 9000。六年时间，麒麟完成涅槃，国", "source": "IT之家", "url": "https://www.ithome.com/0/999/970.htm"}, {"n": 14, "section": "模型与产品", "title": "IT早报 0909：OpenAI 发布最强 AI 生图模型 Images 2.5；DeepSeek 明日下调 Flash 模型价格；高德回应开发“扫雷榜”；汽车博主“拉踩”引流被判赔 10 万...", "summary": "“IT早报”时间，大家好，现在是 2026 年 9 月 9 日星期三，今天的重要科技资讯有：1. OpenAI 最强 AI 生图模型：ChatGPT Images 2.5 登场，延迟降低 50%、新增 Sketch 草图OpenAI 9 月 9 日官宣发布 ChatGPT Images 2.5，图像生成延迟最多降低 50%，并新增 Sketch 草图参考、模板库、图片内评论标注等实用功能，是该公司当前最先进的图像生成模型。&gt;&gt; 查看详情2. DeepSeek 官宣明日 flash 系列 AI 模型降价：输出为每百万 Token 4 元据 DeepSeek 开放平台公告，官方宣布将于", "source": "IT之家", "url": "https://www.ithome.com/0/999/967.htm"}, {"n": 15, "section": "模型与产品", "title": "OpenAI推出ChatGPT Images 2.5 新增草图生图功能", "summary": "OpenAI 推出 ChatGPT Images 2.5，并新增 Sketch 功能，允许用户先在聊天框里画草图，再让系统根据草图生成更细致的图像。OpenAI 于周二宣布更新 ChatGPT 的图像生成工具，核心变化是加入名为 Sketch 的新方式，让用户可以直接在 ChatGPT 内部绘制涂鸦，再说明希望它把这张草图变成什么样的图片。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577032.htm"}, {"n": 16, "section": "模型与产品", "title": "OpenAI未发布内部AI模型据称攻克纳维-斯托克斯方程难题", "summary": "OpenAI未发布内部AI模型据称攻克纳维–斯托克斯方程难题，相关结果已由机器验证。报道还称，该公司动用了约1万个并发自主代理完成推理与形式化验证，但这项成果目前仍未被克雷数学研究所正式认定为千禧年大奖难题的已解答案。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1577024.htm"}, {"n": 17, "section": "模型与产品", "title": "Meta发布个人AI代理Muse 主打“能替你做事”", "summary": "Meta发布Muse个人AI代理，押注“能替你做事”的消费级AI时代，但其最核心的挑战不是功能，而是用户是否愿意再次把个人数据交给这家公司。，Muse 需要连接邮箱、日历、支付、健康、智能家居、购物、音乐和活动等服务，才能替用户完成发邮件、订旅行、压低账单、填表、生成计划、把食谱短视频转成购物清单、发送邀请乃至直接下单等任务。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577022.htm"}, {"n": 18, "section": "科技要闻", "title": "可伸缩仿生机器人鱼ScaFi亮相：靠身体摆动静默前行 适配不同水域探索需求", "summary": "纽约大学坦登工程学院研究人员近日推出一款名为 ScaFi 的仿生机器人鱼，它不仅外形和运动方式都接近真实鱼类，还能按需放大或缩小，以适应不同深度和尺度的水域环境。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1577020.htm"}, {"n": 19, "section": "科技要闻", "title": "苹果探索可拉伸显示屏技术 未来或用于环绕式Apple Watch与智能家居设备", "summary": "苹果正在推进一种不同于折叠屏的新型显示技术。最新获得授权的一项专利显示，该公司正研究“可拉伸显示屏”方案，未来有望应用于 iPhone、iPad、Apple Watch、智能家居设备，甚至车载与公共信息终端等产品。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577018.htm"}, {"n": 20, "section": "科技要闻", "title": "全球PC出货量下滑 厂商却靠更昂贵的AI电脑赚得更多", "summary": "全球个人电脑市场正在出现一种看似矛盾的现象：电脑出货量开始下降，但主要厂商的收入却在增长。推动这一变化的关键因素，是人工智能基础设施建设引发的内存芯片短缺，以及由此带来的整机价格上涨。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577014.htm"}], "sections": [{"label": "模型与产品", "count": 14, "start": 0}, {"label": "科技要闻", "count": 6, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
