<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-02", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "Marvis上线自定义模型功能，支持接入Kimi、智谱GLM等主流模型", "summary": "腾讯AI助手Marvis上线“自定义模型”功能，用户可接入腾讯云、阿里云、DeepSeek、Minimax、Kimi、智谱、小米等第三方主流模型及本地开源模型，并支持跨设备同步，模型选择不再受限。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30760"}, {"n": 2, "section": "模型与产品", "title": "炮轰车企AI体验太垃圾！罗永浩：为什么不直接接入豆包、千问和Kimi？", "summary": "罗永浩公开吐槽新能源车企AI大模型体验“太垃圾”，试乘数十款车型后发现无一接入豆包、千问、Kimi等国内顶尖完整版大模型。他认为车企自研大模型整体体验不佳，术业有专攻，呼吁引入优质大模型，即便额外收费也应优化用户体验。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30759"}, {"n": 3, "section": "模型与产品", "title": "韩国押上史上最大规模预算：821 万亿韩元砸向 AI 与芯片，半导体税收撑起扩张底气", "summary": "韩国公布迄今最大财政支出计划，2027年总支出达821万亿韩元，同比增12.8%，创历史最高增幅，旨在全球人工智能竞赛中巩固科技优势，并体现财政政策方向转变。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30758"}, {"n": 4, "section": "模型与产品", "title": "Runway发布首个界面世界模型Solaris，实时逐帧生成动态交互界面", "summary": "知名AI企业Runway发布界面世界模型Solaris，实现软件与网页无需预写代码即可实时逐帧渲染图形交互界面，打破传统界面依赖固定框架的模式。该系统或将弥合“知晓事物”的AI助手与界面生成之间的割裂，推动交互式数字体验迈向实时生成新阶段。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30756"}, {"n": 5, "section": "模型与产品", "title": "DeepSeek 首个开源多模态模型来了：这双“眼睛”不给人类看图，专供 Agent 干活", "summary": "DeepSeek在Hugging Face上线V4家族首款实验多模态模型DeepSeek-V4-Flash-Vision-Exp，采用MIT协议，参数305B。基于V4-Flash-0731底座，接入视觉编码器与Aligner，经持续训练获得图像理解能力。与传统视觉问答不同，它重点聚焦多模态Agent能力，不做简单“看", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30755"}, {"n": 6, "section": "科技要闻", "title": "57 岁男子听信 AI 指路抄近道，被困深山耗尽体力，事后 AI 竟回“哈哈，确实！”", "summary": "浙江消防披露：57岁湖南籍男子杨师傅在宁波登山，登顶后改走陌生路线，盲信AI推荐的下山路径，结果越走越偏、体力耗尽，报警后才脱险。杨师傅平日体能较好仍被困，事后AI回复令人哭笑不得。消防提醒野外登山勿轻信AI，应选成熟路线确保安全。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30754"}, {"n": 7, "section": "模型与产品", "title": "ChatGPT Ads上线不足200天年化收入突破10 亿美元", "summary": "OpenAI广告业务ChatGPT Ads上线不足200天，年化收入运行率已破10亿美元；试点仅6周即破1亿美元，增势迅猛。公司同步上调中长期营收预期，预计2026年全年广告收入继续增长。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30753"}, {"n": 8, "section": "模型与产品", "title": "1200 个 AI 智能体集体“越狱”攻击开源社区：独立调查揭出比 OpenAI 自述更严重的真相", "summary": "独立调查报告显示，OpenAI智能体攻击Hugging Face事件远较官方说法严重：约1200个智能体突破隔离，其中700个主动协作“参战”，并非“少数越界”。调查团队现场工作6天，分析逾7万条消息、1300份运行记录后得出该结论。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30752"}, {"n": 9, "section": "模型与产品", "title": "中国化工行业首个大模型3.0 Pro重磅发布，从“会答”迈向“会干”", "summary": "8月31日，中科院大连化物所联合科大讯飞、阿里云等发布我国化工行业首个大模型迭代版——智能化工大模型3.0 Pro。该版本实现从专业知识问答向化工任务智能执行系统的跨越，成为技术底座级创新成果，推动化工智能化转型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30750"}, {"n": 10, "section": "模型与产品", "title": "​百万 Token 上下文首次下放到端侧：讯飞星火 X2.5 双子星开源，全程国产算力训练", "summary": "科大讯飞子公司词元星火9月1日开源星火X2.5-4B和1.7B两款端侧通用大模型，为端侧首个原生支持100万Token上下文，并开放权重、代码仓库与部署文档。模型采用混合注意力架构，优化智能体、代码、数学、指令遵循等核心能力，实现小模型“读全书”，综合实测能力领先。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30749"}, {"n": 11, "section": "行业动态", "title": "​35 亿美元押注联发科：英伟达联手打造覆盖 AI 工厂到 PC 的下一代计算平台", "summary": "英伟达与联发科宣布深化合作，覆盖AI基础设施、本地AI计算与汽车领域，共建下一代AI计算平台。英伟达投资35亿美元联发科可转债。联发科将采用NVLink Fusion平台，为超大规模企业、云服务商等提供定制XPU，接入英伟达AI工厂。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30747"}, {"n": 12, "section": "科技要闻", "title": "AI 代理实验室 Manus 正式恢复独立运营 开启通用智能体新阶段", "summary": "Manus宣布恢复独立运营，结束与Meta近八个月的收购分拆波折。这家新加坡AI实验室将以独立代理实验室身份重启，创始团队继续全面领导，专注拓展通用AI代理技术边界，并坚持产品创新，为全球用户打造更强大的AI代理体验。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30745"}, {"n": 13, "section": "模型与产品", "title": "OpenAI 吸取“AI 越狱”事件教训，首个达“关键”门槛模型 Astra 因能力过强将限制网络安全功能", "summary": "IT之家 9 月 2 日消息，OpenAI 于当地时间 9 月 1 日宣布，该公司计划“很快”推出下一代 AI 模型 Astra，但将严格限制该模型网络安全功能的使用范围。据介绍，Astra 是 OpenAI 旗下首个达到其《准备框架》（Preparedness Framework）中“关键”（Critical）网络安全能力门槛的模型。根据 OpenAI 的定义，达到“关键”门槛意味着该模型能够无需人类干预，在多个经过安全加固的真实关键系统中，识别并开发出涵盖各严重等级的有效零日漏洞利用程序。OpenAI 研究副总裁 Amelia Glaese 表示，Astra 能够在无需人类分步指导的情况下", "source": "IT之家", "url": "https://www.ithome.com/0/997/207.htm"}, {"n": 14, "section": "模型与产品", "title": "OpenAI称Astra AI模型首度超越其“关键”网络安全能力阈值", "summary": "OpenAI周二表示，其即将推出的人工智能模型Astra是首个超越其“关键”网络安全能力阈值的产品。该公司表示，Astra能够发现此前未知的安全漏洞，并在无需人类逐步指导的情况下加以利用，这意味着该模型属于其所谓的“准备框架”中最先进的类别。OpenAI表示仍计划“很快”推出Astra，但对其网络安全能力的访问将更加受限。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575976.htm"}, {"n": 15, "section": "模型与产品", "title": "Anthropic发布Claude Fable与Mythos 5.1：成本降低 网络安全误报减少约60%", "summary": "Anthropic于9月1日宣布推出Claude Fable 5.1和Claude Mythos 5.1，并称这两款模型是“全球最先进的编程与知识工作模型”。Anthropic表示，Claude Fable 5.1在编程、知识工作以及长期复杂问题解决任务方面树立了新的标准。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575974.htm"}, {"n": 16, "section": "模型与产品", "title": "Google推出AI图像创作工具Pics 基于Nano Banana模型打造", "summary": "Google于9月1日正式推出Google Pics，这是一款集成在Google Workspace中的生成式人工智能图像创作与编辑工具，旨在与Canva、Adobe Express以及微软Designer等产品展开竞争。Google AI Pro和Ultra订阅用户，以及大多数Google Workspace企业客户，都可以免费使用该工具。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575962.htm"}, {"n": 17, "section": "模型与产品", "title": "Perplexity推出混合计算功能 敏感任务拆分给本地AI处理", "summary": "今年2月，Perplexity推出了Perplexity Computer。这是一套类似Claude Cowork的人工智能代理工具，能够利用网络以及用户电脑上的文件和应用，自主完成各种任务。此后，该平台逐渐发展出多个产品，包括面向Mac的Personal Computer。如今，Perplexity又宣布推出一项名为Hybrid Compute的新功能。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575948.htm"}, {"n": 18, "section": "行业动态", "title": "英伟达据报重启“Rubin CPX”AI加速器项目 改用168GB HBM4内存", "summary": "据供应链分析师郭明錤透露，英伟达此前一度搁置的“Rubin CPX”AI加速器项目如今重新启动，并对内存架构进行了重新设计。该产品原计划搭载128GB GDDR7显存，如今改为配备168GB HBM4高带宽内存。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575942.htm"}], "sections": [{"label": "模型与产品", "count": 14, "start": 0}, {"label": "科技要闻", "count": 2, "start": 0}, {"label": "行业动态", "count": 2, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
</body>
</html>
