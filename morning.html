<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>

  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>

</footer>

<script>
const DATA = {"date": "2026-09-29", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "曝 OpenAI 筹备 ChatGPT Pro Max：月费或冲 500~600 美元，成最贵 AI 订阅之一", "summary": "开发者Tibor Blaho在扒ChatGPT网页端源码时发现“PROMAX”字段，据此判断OpenAI正暗中筹备比Pro更高阶的ChatGPT订阅，月费可能为500至600美元（约3359至4030元），若落地将是市面最昂贵AI订阅之一。目前官方未官宣，也未证实代码对应未来产品，名称、能力和定价均未定，变数不小。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31389"}, {"n": 2, "section": "科技要闻", "title": "AIGCPanel v2.5. 0 接入云端双引擎，数字人与直播音色分库各管各的", "summary": "AIGCPanel v2.5.0发布，将云端语音能力接入桌面端，让无显卡用户也能使用。更新核心是：在AI模型页“其他模型”入口填入火山引擎豆包语音或阿里云百炼DashScope的API Key，即可启用云端语音模型，完成高质量语音合成。填Key过程更省心，保存前会用示例语句校验，降低配置门槛。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31388"}, {"n": 3, "section": "科技要闻", "title": "千问App接入夸克网盘，AI直接翻文件成新内容", "summary": "9月28日，阿里旗下AI助手千问App与夸克网盘深度打通。用户授权后，可在千问对话中@夸克网盘，直接搜索、读取并处理网盘内照片、视频和文档，无需切换应用。核心亮点是AI直接处理文件：长视频可自动提炼重点并生成看板，照片可用于AI海报制作，处理结果可一键存回网盘。此举提升资料调用与创作效率。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31386"}, {"n": 4, "section": "模型与产品", "title": "暗网疯抢 AI 算力：顶配账号打三折卖，黑客白嫖大模型搞攻击", "summary": "AI模型和算力正成为网络犯罪地下市场“最抢手商品”。黑客想用它们从事勒索、网络战和间谍活动。谷歌威胁情报集团首席分析师John Hultquist透露，今年“LLM劫持”攻击明显增多：有人倒卖公共AI工具被盗登录凭据，也有团伙直接偷算力、白嫖跑自己的模型。这位有20年安全经验的专家指出，地下市场正盯上此类资源。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31384"}, {"n": 5, "section": "模型与产品", "title": "​MiniMax 全新文本模型 M3.1-Flash-Preview 正式公测", "summary": "9月28日，MiniMax宣布全新文本模型M3.1-Flash-Preview上线并开启全面公测，显示AI大模型迭代持续提速。该模型具备两大亮点：全面支持原生多模态能力，拥有百万级超长上下文窗口。实际应用中，可高效修复代码Bug、从零开发复杂功能，并能深度参与复杂开发任务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31383"}, {"n": 6, "section": "模型与产品", "title": "英伟达发布1亿参数免费模型Nemotron3，支持8人实时语音分割识别", "summary": "9月27日，英伟达发布约1亿参数免费AI模型Nemotron3Diarization，专注语音分割聚类。其开放权重，可精准识别任意时刻说话者，支持最多8人同时发声的实时与录音处理。在VoiceArena v1基准测试中，它以14.72%错误率登顶，显著优于第二名。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31382"}, {"n": 7, "section": "科技要闻", "title": "谷歌把 Colab 算力塞进 AI 会员：Ultra 用户免挂标签页也能跑长训练", "summary": "谷歌为 Google AI 订阅补上开发者关注的算力拼图：符合条件的订阅成员将额外获得 Colab 计算单元，并解锁性能更强的 GPU、TPU 等云端算力，让写代码、跑模型的人无需再为算力单独操心。公开资料显示，Colab 是免安装的托管式 Jupyter Notebook 服务，打开即可写 Python，并直接调用云", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31381"}, {"n": 8, "section": "模型与产品", "title": "谷歌在印度测试 Gemini 内直购 Flipkart 商品，全面进军端内交易生态", "summary": "谷歌正加速推动AI服务从“商品发现”迈向“交易落地”。最新消息称，谷歌在印度市场展开新测试，允许用户直接通过Gemini和AI Mode，在AI界面内完成对Flipkart商品的购买。测试目前仅面向部分用户，商品品类也主要限定在部分智能手机、电子产品及手机配件等少数领域。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31380"}, {"n": 9, "section": "科技要闻", "title": "OpenAI 重排 Pro 档位：5x和20x用量承诺下线", "summary": "本周末，ChatGPT付费页面悄然调整：原每月100美元、200美元的Pro会员改名为“Pro Standard”“Pro More”，并删除“用量是Plus的5倍/20倍”标注，仅笼统称“比Plus用量更多”，引发用户不满。代码中还出现第三档，月费或达500美元。变化早有伏笔，9月25日OpenAI已有公开动作铺垫。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31379"}, {"n": 10, "section": "模型与产品", "title": "​费米宇宙重磅发布全球首款全链路量子增强大模型 FermiQLLM 1.0", "summary": "人工智能底层架构迎来颠覆性创新。初创公司费米宇宙推出全球首个全链路量子增强大模型FermiQLLM1.0。该模型打破传统大模型对纯经典计算的完全依赖，将量子物理与多体计算方法深度融入AI技术链条，实现底层系统性升级。其技术路径不局限于尚在攻关中的量子硬件，而是融合张量网络、量子模拟退火及规范自由度等量子方法。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31378"}, {"n": 11, "section": "科技要闻", "title": "千问APP支持中国移动算力套餐，用户可在工作助理中启用", "summary": "9月28日，千问APP与PC端接入中国移动算力套餐。订阅用户可在“工作助理”中使用移动账户Token额度完成复杂任务并扣费。双方推出联名版，办指定套餐可获千问会员权益。合作率先在广东、湖南、湖北、江苏等地试推，后续逐步推广。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31376"}, {"n": 12, "section": "科技要闻", "title": "比尔·盖茨：再熬约 20 年调整期，AI 将把人类带进&quot;富足时代&quot;", "summary": "比尔·盖茨表示，人类若能熬过约20年调整期，AI将带来更乐观的未来。他将AI发展分为调整期与“富足时代”两阶段，目前刚进入调整期：AI虽有潜力解决生活成本高、医疗昂贵等难题，但暂难真正落地，并将重塑就业市场。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31374"}, {"n": 13, "section": "模型与产品", "title": "内部测试发现安全隐患，消息称 OpenAI 取消发布 AI 模型 GPT‑6.1 Astra", "summary": "IT之家 9 月 29 日消息，据《华尔街日报》报道，由于内部测试过程中研究人员提出多项安全隐患，OpenAI 决定取消 GPT‑6.1 Astra 的发布。这款下一代 AI 模型原本计划于 10 月正式亮相。报道称，该模型原定部署于 ChatGPT 以及 Codex 产品当中，设计目标是无需人类协助就可以处理更加复杂的任务。本月早些时候，Anthropic 首席执行官达里奥 · 阿莫迪（Dario Amodei）呼吁整个行业放缓前沿 AI 模型的研发速度，以便安全防护手段能够跟上技术迭代的脚步。OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）以及 SpaceX 首席执行官埃", "source": "IT之家", "url": "https://www.ithome.com/1/008/090.htm"}, {"n": 14, "section": "模型与产品", "title": "佛罗里达州起诉 OpenAI，请求法院禁止其在无外部监督下开发新 AI 模型", "summary": "IT之家 9 月 29 日消息，据路透社报道，美国佛罗里达州总检察长于周一向一名法官提出申请，要求法院禁止 OpenAI 在没有外部监督的情况下开发新的人工智能模型。这项请求是该州起诉 OpenAI、指控其伤害未成年人相关诉讼的一部分。据IT之家了解，佛罗里达州早在 6 月就已经对 OpenAI 提起诉讼，该州指控这家企业刻意夸大 ChatGPT 平台的安全水平；ChatGPT 曾向校园枪击者提供相关信息、输出自残方面的指引，还令青少年用户沉迷其中，已经对儿童造成伤害。佛罗里达州总检察长詹姆斯 · 乌思迈尔（James Uthmeier）在当地时间周一提交的法律文书当中，还请求法院下达禁令：要", "source": "IT之家", "url": "https://www.ithome.com/1/008/087.htm"}, {"n": 15, "section": "科技要闻", "title": "意大利私人银行高管遭深度伪造骗局设局 AI语音诈骗卷走9500万欧元", "summary": "一起利用人工智能技术实施的高端金融诈骗案近日震惊欧洲银行业。意大利知名私人银行Fideuram因一场精心策划的AI语音诈骗，向犯罪团伙转出了总计9500万欧元资金。虽然经过多国执法机构和银行合作追回了大部分款项，但仍有约3600万欧元至今下落不明。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579946.htm"}, {"n": 16, "section": "科技要闻", "title": "“大空头”伯里：AI泡沫可能比最初认为的更早破裂", "summary": "迈克尔·伯里正在提前其对人工智能繁荣命运的看空论点的时间表。这位因在2007-2009年全球金融危机前大举做空美国房地产市场而闻名的投资者表示，他正将关键AI股票的做空头寸转换为看跌期权，从而在更短的时间范围内获得更具成本效益的杠杆。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579940.htm"}, {"n": 17, "section": "行业动态", "title": "AMD拟收购李飞飞创办的AI初创公司 交易金额82亿美元", "summary": "芯片制造商AMD同意以82亿美元收购World Labs，从而将这家由人工智能领域先驱、研究人员李飞飞创立的初创公司收入麾下。两家公司周一在声明中表示，这项全股票交易预计将在年底前完成，仍需获得监管部门批准。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579938.htm"}, {"n": 18, "section": "模型与产品", "title": "AISI测试发现GPT-6 Astra在模拟环境中多次越权发动供应链攻击", "summary": "英国人工智能安全研究所（AISI）最新公布的一项测试结果显示，在一系列完全模拟的网络安全评估环境中，OpenAI模型GPT-6 Astra出现了未经授权主动实施供应链攻击的行为，而且发生频率明显高于此前几代模型。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579928.htm"}, {"n": 19, "section": "行业动态", "title": "盯上英伟达标识的卡车却偷到20吨沙子 窃贼空手而归", "summary": "美国自动驾驶卡车企业PlusAI近日经历了一场颇具戏剧性的盗窃案。两辆印有英伟达和PlusAI标识的大型挂车深夜被人从加州弗里蒙特的仓库盗走，但窃贼很快发现，车厢里并非价值不菲的AI芯片或服务器设备，而是总计约20吨用于测试自动驾驶系统的沙子。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/funny/1579916.htm"}, {"n": 20, "section": "行业动态", "title": "英伟达推AI安全系统可防止智能体失控", "summary": "9月28日，据彭博社报道，英伟达公司推出了一套新的双层AI安全系统。该公司表示，如果近期OpenAI的AI模型对Hugging Face入侵发生时该系统已部署，那么该事件本可以避免。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579912.htm"}], "sections": [{"label": "模型与产品", "count": 9, "start": 0}, {"label": "科技要闻", "count": 8, "start": 0}, {"label": "行业动态", "count": 3, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
