<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>

<script>
const DATA = {"date": "2026-09-25", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "首部上星AI长剧《后西游记》幕后：没有摄影机，100%画面由Seedance生成，单集成本压到十几万", "summary": "8月31日，国内首部上星AI长剧《后西游记》登陆湖南卫视黄金档，芒果TV同步上线。该剧规划60集、每集约40分钟，由芒果TV出品、伯璟文化承制，全程无摄影机，100%由Seedance视频生成。上线一周，芒果TV正片播放量破1.5亿次。总导演李东珅长期从事纪录片创作。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31357"}, {"n": 2, "section": "模型与产品", "title": "蚂蚁inclusionAI把训练底稿摆上HuggingFace，Ling、Ring、Ming全系模型按欧盟AI法案交透明账", "summary": "蚂蚁inclusionAI在HuggingFace开设AI-Transparency仓库，公开Ling、Ring、Ming系列模型的训练内容摘要。该仓库只含文档，不发布权重和训练数据集，主动披露模型训练数据来源，覆盖Ling-2.0至3.0、Ring-2.0至2.6、Ming-Omni及两款16B-A3B多模态模型，旨", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31356"}, {"n": 3, "section": "科技要闻", "title": "OpenAI、Anthropic、Hugging Face 联合国呼吁 AI 国际协调，特朗普政府明确反对&quot;全球治理&quot;", "summary": "联合国场合，OpenAI、Anthropic、Hugging Face负责人呼吁加强AI国际协调，推动建立可比较的能力评估、安全测试与事故报告标准；特朗普政府反对借此新建全球AI治理架构，称风险不足以限制发展或让渡监管权。企业强调共同标准与快速事故报告。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31353"}, {"n": 4, "section": "模型与产品", "title": "​华为官宣小艺 Work 正式上线，首发 31 天限时免费畅享 1000 AI 点", "summary": "华为宣布小艺Work焕新上线，定位AI工作助理，面向日常办公、代码开发与创意创作，深度适配鸿蒙手机、平板和电脑，更新小艺App即可解锁。首用可享31天免费体验1000AI点。功能涵盖市场调研、文档处理、PPT制作、数据分析、内容创作及代码开发等。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31352"}, {"n": 5, "section": "模型与产品", "title": "消息称DeepSeek年化收入突破10亿美元，拟募资500亿元冲刺上交所上市", "summary": "据外媒报道，DeepSeek年化收入已突破10亿美元，较数月前不足5亿美元翻倍，主要得益于产品提价及开发者、企业端采用率持续攀升。CEO梁文峰在投资者会议上披露该数据，被视为资本市场关键节点提振信心的重要举措。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31351"}, {"n": 6, "section": "模型与产品", "title": "谷歌确认新一代旗舰 Gemini 4 即将推出：已进入后训练，有望远早于年底", "summary": "谷歌DeepMind负责人卡武克奥卢在AI峰会透露，新一代旗舰模型Gemini 4即将推出，目前已进入后训练初期，该阶段用于提升模型行为可靠性。谷歌跳过3.5 Pro，直接押注Gemini 4，计划远早于年底发布，正加速拿出早期成果。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31350"}, {"n": 7, "section": "模型与产品", "title": "高通联手 PrismML 发布 1-bit Bonsai：AI 眼镜离线识图，内存占用降到 1/4", "summary": "2026骁龙峰会上，高通与PrismML在骁龙AR1 Gen 1智能眼镜平台本地运行20亿参数1-bit量化Bonsai视觉模型，实现离线识图问答。该模型基于Bonsai 1.7B构建，精度压缩至1-bit，内存占用仅为4-bit模型四分之一，同等内存可容纳约4倍参数，显著降低存储与推理资源需求。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31349"}, {"n": 8, "section": "模型与产品", "title": "Kimi K3.1十月或压轴登场:三档推理强度、百万超长上下文，Agent与Swarm全塞进配置", "summary": "多家消息源指称，月之暗面旗舰模型Kimi K3.1正内部成型，最快2026年10月发布，将提供Low、High、Max三档推理强度。爆料人@MaxForAI在X平台披露内部JSON与API响应，发现“k3d1-agent”模型标识，含Agent模式、应用场景及配置开关，疑似提前泄露。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31348"}, {"n": 9, "section": "模型与产品", "title": "ChatGPT 移动端上新语音智能体：动动嘴就能写文档、总结邮件", "summary": "OpenAI宣布ChatGPT移动端新增语音智能体功能，用户说话即可撰写文档、总结邮件等。Pro和Plus用户可创建文档、邮件、总结Slack消息，并执行建站、做PPT、使用云端浏览器等进阶操作；Free和Go用户可用插件及已连接应用。语音对话将提供更丰富文本输出。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31347"}, {"n": 10, "section": "模型与产品", "title": "Meta Connect 发布会：Muse 全面接入 AI 眼镜，小扎要让数十亿人用上超级智能", "summary": "Meta在Connect大会发布多款AI设备，个人智能体Muse成核心。扎克伯格称要让未来属于每个人，预计Muse将服务数十亿用户。媒体指出，Meta正将AI、智能眼镜与VR硬件结合，元宇宙话题减少；多款眼镜齐发，无摄像头版本主打隐私。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31346"}, {"n": 11, "section": "科技要闻", "title": "智元第两万台远征A3 Ultra下线交付长隆，六千台半年填满，具身机器人第一次在主题乐园里常态上岗", "summary": "9月24日，智元第2万台通用具身智能机器人远征A3Ultra在横琴长隆飞船乐园下线并交付长隆，从1万台到2万台仅用约6个月，产能加速爬坡。同日，智元与长隆共建的全球首个大规模具身智能主题乐园启幕，部署超300台机器人，标志具身智能规模化落地文旅场景迈出重要一步。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31344"}, {"n": 12, "section": "科技要闻", "title": "交易额逼近 7 万亿！深度聚焦中国直播电商：AI 降本大潮下，真人主播会被取代吗？", "summary": "中国直播带货业从粗放增长转向理性成熟，年交易额近7万亿元，2025年线上零售占比超36%。行业增速放缓、竞争加剧，AI技术爆发正重塑生态，在成本优化与落地中展现显著降本增效潜力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31342"}, {"n": 13, "section": "模型与产品", "title": "消息称 OpenAI 将在数日内预览网络安全专用模型 GPT-6 Cyber", "summary": "IT之家 9 月 25 日消息，据《财富》杂志消息，多位知情人士透露，OpenAI 正计划在未来几天内抢先预览其最新的网络安全专用模型 GPT-6 Cyber。此外，OpenAI 还将推出一款配套新产品，协助客户以更加安全、自动化的方式部署该模型。据悉，GPT-6 Cyber 模型及其配套产品预计将于 9 月 29 日在旧金山举办的 OpenAI 开发者大会上亮相，甚至可能更早揭晓，并计划在未来数月内正式上线。GPT-6 Cyber 将是 OpenAI 今年发布的第四款网络安全专用模型。据知情人士透露，OpenAI 旗下仅限申请准入的“Daybreak Red”计划中，已有少数客户获得了 GP", "source": "IT之家", "url": "https://www.ithome.com/1/007/061.htm"}, {"n": 14, "section": "科技要闻", "title": "Meta 的 AI 智能体 Muse 被发现可导出虚拟机大量文件", "summary": "IT之家 9 月 25 日消息，科技媒体 macobserver 昨日（9 月 24 日）发布博文，报道称 Meta Muse 被发现可在简单提示词下，打包并返回用户专属虚拟机中的大量 Linux 文件。Peter James 和 &nbsp;Jonny L. Saunders 两名开发者已独立复现该问题，相关文件包含系统文件、应用模板、内部运行文档、Markdown 与 JSON 文件等。导出的文件可能暴露 Muse 的内部运行机制，包括请求处理、记忆保存、服务连接和后台任务。其中 agents/ 目录包含 113 份子智能体记录及 JSONL 追踪文件。约 20 份 Markdown 文档", "source": "IT之家", "url": "https://www.ithome.com/1/007/059.htm"}, {"n": 15, "section": "科技要闻", "title": "三星确认错误软件更新导致智能冰箱无法制冷 承诺安排紧急维修并赔偿食材损失", "summary": "三星近日确认，一次出现问题的软件更新导致韩国部分智能冰箱突然停止工作，甚至连最基本的制冷功能都受到影响。不少用户发现冰箱在更新过程中直接失去供电或卡死，随后SmartThings应用显示设备已经离线，冰箱内部的食物也因无法继续冷藏而变质。由于事故发生在韩国重要节日中秋节前夕，大量消费者原本已经提前采购了节日期间所需的食品，使此次故障造成的影响进一步扩大。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579536.htm"}, {"n": 16, "section": "模型与产品", "title": "微软被曝正悄然放弃曾被寄予厚望的Copilot+ PC品牌", "summary": "微软近年来围绕人工智能PC打造了一系列新的产品品牌，其中最受关注的便是Copilot+ PC。这一品牌最初被视为微软推动下一代Windows体验、尤其是传闻中的Windows 12的重要载体，但如今微软似乎正在逐步淡化这一品牌，甚至开始在部分新产品上直接取消Copilot+ PC标识。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579532.htm"}, {"n": 17, "section": "模型与产品", "title": "Google发布Gemini 3.8 Live Live Avatar数字人交互功能 赋予AI实时视频面孔", "summary": "Google公司宣布，正式在Gemini Enterprise企业级平台中全面上线“Live Avatar”（实时数字人）功能。该技术深度集成了Google最新的Gemini 3.8 Live大模型架构，在原有近乎零延迟的高流畅语音对谈基础上，首次引入了近乎实时的生成式视频生成能力，使对话式人工智能拥有了能够“边听、边看、边说”的动态视觉形象。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579530.htm"}, {"n": 18, "section": "模型与产品", "title": "Meta推出Horizon Create游戏创作套件 引入生成式AI工具降低开发门槛", "summary": "科技巨头Meta在其Meta Connect开发者大会上，正式发布了面向Horizon平台的全新游戏与互动体验创作工具套件“Horizon Create”。该套件将生成式人工智能技术深度融入虚拟现实（VR）与混合现实（MR）内容的开发流程中，旨在大幅降低普通用户与独立开发者在元宇宙生态中创建三维游戏与虚拟空间的门槛。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/game/1579524.htm"}, {"n": 19, "section": "模型与产品", "title": "白宫要求OpenAI与Anthropic暂缓向英国提供新模型测试权限", "summary": "美国与英国在人工智能安全监管领域的协调正面临新的考验。多名知情人士透露，白宫近期已要求OpenAI和Anthropic在美国完成相关评估程序之前，不要将最新一代人工智能模型提供给英国政府指定的测试机构进行提前审查。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579522.htm"}, {"n": 20, "section": "模型与产品", "title": "Google相册AI数字衣橱功能全面上线 灵感源自经典电影《独领风骚》", "summary": "Google公司宣布，此前在Google相册中测绘的生成式人工智能数字衣橱（Wardrobe）功能，现已正式面向美国、巴西和印度地区的iOS与Android端所有用户开放。该功能灵感直接来源于1995年经典青春喜剧电影《独领风骚》（Clueless）中女主角雪儿利用计算机挑选穿搭的智能衣橱，能够自动将用户相册中的服饰照片转化为可交互的数字化衣柜。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579520.htm"}], "sections": [{"label": "科技要闻", "count": 6, "start": 0}, {"label": "模型与产品", "count": 14, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
