<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-22", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "Anthropic与字节扎堆AI制药，下一个Coding风口卡在了数据这道坎上", "summary": "AI制药赛道升温，圈外巨头入局：Anthropic自建湿实验室，与诺和诺德、百时美施贵宝合作并收购Coefficient Bio；字节跳动分拆的新生实验室完成首轮融资。目前AI主要加速新药早期研发，压缩候选分子筛选和实验迭代时间，但烧钱多、风险高的后续环节仍待突破。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31241"}, {"n": 2, "section": "模型与产品", "title": "微软花 12 万美元让 AI 重写 Copilot 运行时：43 万行 TS 变 80 万行 Rust，快 15.9 倍", "summary": "微软用AI代理将GitHub Copilot运行时从TypeScript全量移植到Rust，仅花约12万美元token成本和一名工程师三周。该运行时支撑Copilot CLI、App、SDK及云Agent，覆盖VS Code、Visual Studio、Excel、Outlook、PowerPoint等微软产品。原Ty", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31240"}, {"n": 3, "section": "模型与产品", "title": "月之暗面推出Kimi Code Desktop桌面端，把AI编程Agent直接搬上macOS和Windows", "summary": "月之暗面推出Kimi Code Desktop，同步上线macOS与Windows版，将智能编程能力从浏览器移至本地桌面。用户通过对话驱动AI Agent自动读写代码、运行命令、完成整套任务，减少手动切换。客户端强化可视化界面，支持桌面端项目管理与操作，更贴合开发者日常使用。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31239"}, {"n": 4, "section": "科技要闻", "title": "法国兴业银行押注 AI：预计最多省下 6 亿欧元成本", "summary": "法国兴业银行称，AI应用扩大将带来可观降本空间，潜在规模约5亿至6亿欧元，其中已规划到2029年实现约3.5亿欧元降本。该行与Anthropic战略合作，分批部署Claude模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31238"}, {"n": 5, "section": "科技要闻", "title": "百度文库网盘宣布AI办公出海，库库AI全球月活超4000万", "summary": "9月21日百度AI Day上，百度文库网盘宣布加速AI办公出海及全球品牌升级。通用智能体“库库AI”全球月活超4000万；海外平台Oreate AI升级为库库AI海外版“Kooko”，海外用户一年破千万。库库AI前身GenFlow于2025年4月上线，一年迭代至4.0。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31236"}, {"n": 6, "section": "模型与产品", "title": "开发者实锤OpenAI广告追踪链条：ChatGPT账号正悄悄绑定你的全网浏览足迹", "summary": "安全研究者曝光OpenAI借内部广告平台bazaar搭建跨站追踪链路：用户打开ChatGPT时生成随机标识符并绑定账号JWT，写入名为__obi的跨站cookie；当用户访问嵌入OpenAI广告像素的第三方网站时，该cookie可追踪其浏览行为，引发隐私担忧。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31234"}, {"n": 7, "section": "模型与产品", "title": "阿里换帅Qwen团队：刘大一恒接掌通义千问大模型，云栖大会前亮相", "summary": "阿里巴巴任命资深AI研究员刘大一恒为通义千问大语言模型团队负责人。知情员工透露，Qwen团队今年历经多轮组织重组，此次任命厘清管理层架构，核心AI产品线有了明确一把手。任命时点正值云栖大会本周二开幕，显得颇为微妙。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31233"}, {"n": 8, "section": "模型与产品", "title": "Claude Opus 5.5 已在内测：连跳两级直逼 GPT-6，价格还打骨折", "summary": "爆料称Claude Opus 5.5（代号claude-wafer-eap）已开启内测，或于本周二突然发布，版本跳过5.2。其定价为每百万Token输入4美元、输出20美元，低于现役Opus 5的5/25美元，被视为直接对标GPT-6。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31232"}, {"n": 9, "section": "模型与产品", "title": "Claude Opus 5. 5 疑遭内测泄露：跳级直冲GPT-6，百万Token价格腰斩至 4 美元", "summary": "Anthropic或跳过Opus5.2，被曝内测代号claude-wafer-eap的Opus5.5，最快本周二发布；定价每百万Token输入4美元、输出20美元，直指GPT-6，性能传超Astra。另有Claude Fable5.2暗中筹备，IPO前动作密集。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31231"}, {"n": 10, "section": "模型与产品", "title": "阿宝上线「鱼来」摸鱼AI系统，将碎片化休息纳入智能管理", "summary": "支付宝AI助手阿宝推出摸鱼AI辅助系统“鱼来”，将AI能力从事务管理拓展至状态管理，重新定义打工人碎片化休息。首批释放500尾鱼苗，用户对阿宝说“鱼来”随机召唤鱼，选出“命定之鱼”并设置每日摸鱼提醒，全程三步完成。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31230"}, {"n": 11, "section": "模型与产品", "title": "登顶国际Data Agent榜单，OceanBase超过多项GPT、Claude方案", "summary": "OceanBase团队Data Agent方案登顶国际数据智能体基准DAB，准确率90.62%居首，为首个突破90%的参评方案。该方案基于国产数据库OceanBase与国产大模型GLM-5.2构建，优于多项基于GPT、Claude等海外模型的方案，内部代号Scout，能力将融入OceanBase DataPilot。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31229"}, {"n": 12, "section": "科技要闻", "title": "Siri AI 和解开放申请：符合条件的美国 iPhone 用户每台可领 25 美元", "summary": "苹果因Siri AI功能延期在美遭集体诉讼，和解网站已上线，符合条件美国iPhone用户可申请赔偿。今年5月苹果同意支付2.5亿美元（约16亿元人民币）和解，但未承认指控，称是为避免诉讼成本与风险。每台设备赔25美元。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31228"}, {"n": 13, "section": "科技要闻", "title": "AI 编程平台 Bitrig 宣布为苹果 iPhone Duo 引入支持，提供交互式 3D 模拟器供开发者测试应用", "summary": "IT之家 9 月 22 日消息，据外媒 9to5Mac 报道，随着苹果上周发布 Xcode 27.1 Beta 1 并加入 iPhone Duo 应用开发支持，如今一款 AI 编程平台 Bitrig 也宣布支持构建和测试 iPhone Duo 应用。据介绍，Bitrig 最初是一款面向“氛围编程”（vibe coding）的应用，用户可以通过文字或语音提示生成原生 SwiftUI 应用，并直接在 iPhone 上的 Bitrig 应用中运行。此后，该平台不断扩展功能，推出 Mac 版应用，加入完整的 Xcode 工具链、内置 iPhone 模拟器以及真机测试功能，同时支持将项目导出至 Xcod", "source": "IT之家", "url": "https://www.ithome.com/1/005/513.htm"}, {"n": 14, "section": "科技要闻", "title": "索尼 SIE 申请“AI 自修复系统”专利：利用人工智能实时生成诊断固件以修复 PlayStation 游戏机故障", "summary": "IT之家 9 月 22 日消息，据专利聚合网站 Patentlyze 披露，索尼 SIE 近日提交一项基于 AI 的 PlayStation 自动诊断和修复系统专利，该系统可以持续监测联网的 PlayStation 设备，在发现软件问题后由 AI 服务器实时生成针对性的诊断固件，并将其直接部署到出现故障的主机上，从而减少用户联系客服的需求。IT之家参考专利描述，该系统的目标之一是减少保修申请、客服工单以及传统故障排查过程中需要用户反复操作的步骤。当系统检测到主机存在问题后，AI 模型不会简单调用预先编写好的修复方案，而是根据具体故障生成相应的修复代码，并进一步判断问题能否自动处理。如果无法解决", "source": "IT之家", "url": "https://www.ithome.com/1/005/501.htm"}, {"n": 15, "section": "模型与产品", "title": "索尼公布主机自修复专利 可用大语言模型生成固件修复代码", "summary": "最近索尼公布了一项硬件自修复系统专利，计划利用大语言模型为PlayStation等设备生成定制固件代码，自动诊断并处理软件故障。该方案旨在减少送修、客服处理及人工排查步骤，但专利公开并不意味着相关功能已经投入使用。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/game/1579092.htm"}, {"n": 16, "section": "科技要闻", "title": "“一个电话或能避免悲剧”：OpenAI因枪击案遭起诉", "summary": "据彭博社报道，加拿大不列颠哥伦比亚省已在美国加州对OpenAI提起诉讼，指控该公司本可以利用ChatGPT日志向警方发出警告，从而避免今年早些时候发生在该省的一起大规模枪击事件。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579088.htm"}, {"n": 17, "section": "科技要闻", "title": "日本拟最早2027年在国际空间站举办AI机器人竞赛", "summary": "据《日经亚洲》（Nikkei Asia）报道，日本计划最早于2027年在国际空间站举办一场人工智能机器人竞赛，参赛团队将通过人工智能控制空间站内的机器人，以培养下一代太空工程师。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579086.htm"}, {"n": 18, "section": "科技要闻", "title": "AI写代码，人类按回车：一篇500万浏览热帖引发争论", "summary": "据Business Insider报道，一位软件工程师关于AI编程的帖子在社交平台X上走红，引发一场争论：AI coding是让开发者更高效，还是把他们变成只会按按钮的人。这位X用户名为“v0xium”，因担心遭到雇主不满而要求匿名。他说，自己在一家未披露名称的公司担任新职务，工作变得“吞噬灵魂”，因为Claude Code生成了从产品规格、测试到工单和报告的一切。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579084.htm"}, {"n": 19, "section": "模型与产品", "title": "xAI发布Grok 4.7：专攻编程与知识工作 价格降至竞品一半", "summary": "马斯克旗下人工智能公司xAI正式发布新一代大模型Grok 4.7，并将其定位为目前最强大的编程与知识工作模型。公司表示，新模型不仅在复杂任务处理能力上实现提升，同时维持与前代产品相同的运行速度和价格体系，并以更低成本向市场发起竞争。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579080.htm"}, {"n": 20, "section": "行业动态", "title": "欧盟拟推行数据中心能效与水效强制披露制度", "summary": "欧盟委员会已提出一项新规草案，拟要求欧洲境内的各大数据中心公开披露其能源与水资源的使用效率，以应对人工智能技术蓬勃发展所带来的巨大资源消耗与环境隐忧。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579078.htm"}], "sections": [{"label": "科技要闻", "count": 9, "start": 0}, {"label": "模型与产品", "count": 10, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
