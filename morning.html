<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>

<script>
const DATA = {"date": "2026-09-17", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "科大讯飞发布 Spark-Audio-1.0-Preview：全国产算力训练，覆盖 99 种语言、202 种方言", "summary": "科大讯飞发布语音基座大模型Spark-Audio-1.0-Preview，基于全国产算力训练，降低供应链风险。模型支持文本和语音输入、文本输出，具备语音转写、多语言翻译、多方言识别、环境音识别、说话人识别、情感分析及音频问答等能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31103"}, {"n": 2, "section": "模型与产品", "title": "讯飞星火语音基座大模型上线：0.65B 编码器配 30B MoE，纯国产算力训练", "summary": "科大讯飞上线语音基座大模型Spark-Audio-1.0-Preview，基于全国产化算力训练。传统音频处理多采用级联方案，先转文字再理解，存在信息丢失（忽略语气、情绪、背景环境音）和链路割裂（语音转写、声纹识别等环节分离）两大短板，影响场景判断完整性。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31102"}, {"n": 3, "section": "模型与产品", "title": "千问 Qwen3.8-27B 登顶 Hugging Face，成该平台史上最受欢迎开源模型", "summary": "9月16日，阿里千问Qwen3.8-27B在Hugging Face最受欢迎开源大模型榜单登顶，超越FLUX.1、DeepSeek-R1、Kimi-K3、Meta-Llama-3等。该榜以开发者点赞为评选口径，反映真实偏好，而非跑分或参数规模，成社区史上最受欢迎开源模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31101"}, {"n": 4, "section": "科技要闻", "title": "硅谷科技巨头安保人员计划罢工：谷歌、OpenAI、Anthropic 等办公室或受影响", "summary": "据《商业内幕》报道，为OpenAI、谷歌、Anthropic等科技公司加州办公室提供安保的员工计划本周罢工。他们已于15日提交72小时罢工通知，自18日凌晨4:30起拒绝接班。工会SEIU-USWW称，涉事企业还包括亚马逊、微软、Salesforce、Meta、英伟达等，或影响多家科技巨头办公场所安保。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31100"}, {"n": 5, "section": "行业动态", "title": "Anthropic 签下澳大利亚首份数据中心协议：锁定 2.16 吉瓦容量，2027 年投运", "summary": "Anthropic签署澳大利亚首份数据中心租赁协议，锁定2.16吉瓦容量，计划2027年投运，选址距布里斯班约250公里的农田。继OpenAI后，其成为又一家布局大洋洲的AI巨头，看重当地电力与土地，并借此分散训练与推理的算力版图。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31099"}, {"n": 6, "section": "模型与产品", "title": "Cloudflare 上线新设置：允许搜索引擎爬取，同时拒绝 AI 训练", "summary": "Cloudflare推出“Disallow AI Training”设置，允许网站继续被搜索引擎收录，同时拒绝内容用于AI训练。苹果、谷歌、微软已承诺遵守。启用后，标记为“可问责”的搜索/AI混合爬虫仍可抓取，其他AI训练爬虫被拦截，但可能影响搜索排名。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31098"}, {"n": 7, "section": "模型与产品", "title": "AI智能体手机进入量产商用阶段:努比亚NaviX Ultra正式开售 搭载豆包手机助手", "summary": "努比亚NaviX Ultra上市，搭载豆包手机助手消费者版，标志AI智能体手机进入规模化量产商用。主打“听得懂、能干活、记得住、够安全”，支持一键唤醒、连续语音、复杂任务自主执行、个人记忆。配指纹AI按键，通话接入Seed全双工语音大模型，可随时打断、连续对话，支持闽南语、客家话等方言。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31097"}, {"n": 8, "section": "模型与产品", "title": "DeepSeek V4.1Flash助力《生化危机7》安卓模拟运行，帧率提升50%", "summary": "网友借助DeepSeek V4.1 Flash模型与Hermes Agent工具，对《生化危机7》纹理进行AI调优，使一加12R（骁龙8Gen2）帧率从约20FPS升至30FPS，提升50%。AI通过USB连接Mac监控性能，指出I/O和内存带宽为瓶颈，并建议压缩纹理分辨率。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31095"}, {"n": 9, "section": "模型与产品", "title": "​谷歌发布多语言 AI 新战略，让全球每种语言都能被听见与理解", "summary": "谷歌发布全球语言智能新成果：AI支持超300种语言，覆盖71亿人口、86%比例。谷歌称语言大模型不应只做文本翻译，还需理解语气、情感与文化细微差别；同时指出传统语音识别多步刚性管线存在局限。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31094"}, {"n": 10, "section": "模型与产品", "title": "Claude 发布重大升级：43 项全能工作流与 27 个巨头应用深度打通", "summary": "Anthropic于2026年9月15日升级中小企业版Claude，新增43项高效工作流及27个主流商业软件深度集成，推动AI从后台辅助转为核心业务驱动力。今年5月曾首推智能连接器与预置工作流，此次升级进一步扩展生态，助力中小企业增长。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31092"}, {"n": 11, "section": "模型与产品", "title": "vivo 正式发布智能体大模型矩阵，并重磅预研 30B MoE 端侧大模型", "summary": "vivo发布智能体大模型矩阵，涵盖语音、端侧、云侧等四款核心模型，全面赋能终端智能化体验。同时预研蓝心30B MoE端侧大模型，探索万亿级能力落地手机，提升多模态理解、长链推理与复杂任务自主执行，并同步推进软件与系统生态建设。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31091"}, {"n": 12, "section": "模型与产品", "title": "​豆包大模型 2.1 Pro 0915 版本重磅发布：Agent 交付更稳、多模态 Coding 全面进化", "summary": "9月16日，火山引擎宣布豆包大模型2.1Pro升级至0915版本，API全量上线火山方舟；豆包客户端同步更新，用户可选新版体验。TRAE已接入，Doubao-Seed-Evolving也升级同版本，企业无需更换API接口。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31090"}, {"n": 13, "section": "模型与产品", "title": "比亚迪董秘李黔：未来会继续在半导体领域投入和发力，中国首款车规级 4nm 智驾芯片璇玑 A3 已开启规模化量产", "summary": "IT之家 9 月 17 日消息，据界面新闻报道，9 月 16 日，比亚迪在比亚迪绍兴赛车场举办高管面对面股东交流会，比亚迪集团董事会秘书、投资处总经理李黔表示，半导体是比亚迪非常重要的能力之一，芯片种类覆盖 13 大类，567 款车规芯片产品，从最早的功率半导体到模拟芯片，再到今年向逻辑芯片的拓展。比亚迪半导体拥有芯片设计、晶圆制造、封装测试全链路设计与制造的能力。他透露，未来比亚迪在半导体领域，无论是设计还是生产，都还会持续突破。随着汽车智能化的发展，整车半导体的价值量也会显著提升，因此比亚迪未来还会继续在半导体领域投入和发力。今年推出的璇玑 A3 芯片是中国首款车规级 4nm 智驾芯片，目", "source": "IT之家", "url": "https://www.ithome.com/1/003/363.htm"}, {"n": 14, "section": "科技要闻", "title": "马斯克突然对苹果撤诉？OpenAI 怀疑有鬼，法官下令披露背后协议", "summary": "北京时间 9 月 17 日，据科技网站 9to5mac 报道，美国联邦法官马克 · 皮特曼 (Mark Pittman) 要求埃隆 · 马斯克 (Elon Musk) 旗下公司提供细节，披露是否存在协议促使其撤销了对苹果的反垄断指控。本周早些时候，X 和 SpaceXAI 提交了一项动议，表示在去年针对苹果和 OpenAI 提起的诉讼中，自愿撤回针对苹果的指控，并且不再次提出。根据最初的起诉书，X 和 SpaceXAI 指控苹果和 OpenAI 串通，阻止竞争性 AI 应用在 App Store 上获得曝光度，原因是他们达成了将 ChatGPT 整合进 Siri 和 Apple Intelli", "source": "IT之家", "url": "https://www.ithome.com/1/003/359.htm"}, {"n": 15, "section": "模型与产品", "title": "微软10月特别活动将展示OneDrive融合Copilot AI生态", "summary": "微软公司近日宣布，将于10月8日举办一场聚焦云存储与生成式人工智能融合的特别线上发布会活动。本次活动将以“Copilot + OneDrive”为核心主题，系统性展示微软如何将前沿人工智能技术全面下沉并嵌入其云存储服务体系，推动 OneDrive 从传统的静态文件存储工具向智能化、强交互的个人与工作生产力中枢演进。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578304.htm"}, {"n": 16, "section": "模型与产品", "title": "Anthropic整合Claude产品线：聊天、协作与文档创作板块全面合并", "summary": "人工智能公司Anthropic近日宣布对Claude产品体系进行重大调整。原本独立存在的Claude Cowork将不再作为单独功能入口存在，而是直接并入Claude聊天界面。未来用户无需再判断某项任务应该交给聊天模式还是协作模式处理，Claude将根据任务内容自动选择最合适的工作方式。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578298.htm"}, {"n": 17, "section": "模型与产品", "title": "iOS 27.2 Beta发布 开放AI健康助手 Apple Watch数据转化为个性化健康建议", "summary": "苹果在最新发布的iOS 27.2开发者测试版中，首次向开发者开放全新设计的健康应用。这次更新被认为是近年来Health应用最大规模的一次改版，苹果正尝试借助Apple Intelligence将用户长期积累的健康数据转化为更具实际意义的分析和建议。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578296.htm"}, {"n": 18, "section": "行业动态", "title": "微软不会停止建设数据中心 将采取措施平衡社区经济收益与环境", "summary": "随着人工智能热潮推动数据中心建设进入前所未有的扩张阶段，微软正在面临越来越明显的环境和社区压力。尽管围绕数据中心用电、用水、土地以及噪音等问题的争议不断升温，微软并没有放缓基础设施建设的计划，而是试图通过一系列措施降低数据中心对当地社区造成的影响，并让数据中心建设带来的经济收益更多回馈当地。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578294.htm"}, {"n": 19, "section": "科技要闻", "title": "德勤调查发现英国雇员正在背着老板偷偷使用AI", "summary": "德勤一项调查显示，近十分之一的英国雇员使用过雇主禁止或者会反对的AI工具，凸显员工与管理层在使用这项技术问题上的矛盾日益加深。调查发现，63%的员工在工作中使用过AI工具，表明许多人希望借助AI来改善工作表现或加快处理繁琐任务。与此同时，在2.5万名受访者中，也有63%的人担心管理层可能认为AI能够取代他们。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578290.htm"}, {"n": 20, "section": "行业动态", "title": "RTX 5090保修申请因序列号褪色遭拒 英伟达售后服务引发争议", "summary": "一位GeForce RTX 5090 Founders Edition显卡用户近日在网络论坛披露，自己的保修申请被英伟达拒绝，而原因竟是显卡金属挡板上的实体序列号已经褪色到无法辨认。这一事件迅速引发硬件爱好者和玩家社区关注，也让RTX 50系列显卡的产品标识设计成为讨论焦点。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578284.htm"}], "sections": [{"label": "模型与产品", "count": 14, "start": 0}, {"label": "科技要闻", "count": 3, "start": 0}, {"label": "行业动态", "count": 3, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};

chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
