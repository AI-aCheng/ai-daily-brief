<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>

  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>

</header>

  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">

</footer>

<script>
const DATA = {"date": "2026-09-10", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "AI Coding诞生新吉尼斯纪录：9岁孩子夺冠，外滩黑客松上万人用AI做应用", "summary": "9月9日外滩大会，外滩黑客松·AI Coding大赛创吉尼斯世界纪录，成为“线上生成式AI编程马拉松大赛中开发最多应用”，系国内首个以AI Coding为主题挑战世界纪录的赛事。赛事吸引上万名参赛者，完成上万件AI应用，近七成未满18岁，最小仅6岁，最终由9岁选手夺冠。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30937"}, {"n": 2, "section": "科技要闻", "title": "2026外滩大会AI艺术节亮相：AI在上海开唱、办展，探索人机共创新边界", "summary": "9月9日，2026 Inclusion·外滩大会在上海开幕，首次设立AI艺术节，涵盖AI概念艺术展、影像展映、音乐会三大单元，持续至12日，将线上AI创作引入线下。其中《纠缠，而后日以作夜》为国内首个智能体导览AI概念艺术展，汇聚20余位中外艺术家，1985年作品《AARON at T》受关注。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30936"}, {"n": 3, "section": "模型与产品", "title": "谷歌重磅福利：Gemini每日简报功能向全体免费用户全面开放", "summary": "谷歌宣布Gemini“每日简报”功能即日起向所有免费用户开放，此前该功能仅限付费订阅用户。它可在每天清晨生成综合摘要，帮助用户快速梳理待办事项、未回复邮件等关键信息，提升日常效率。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30935"}, {"n": 4, "section": "科技要闻", "title": "2026外滩大会探营：当AI开始干活，一种新经济正在形成", "summary": "2026年9月9日至12日，外滩大会在上海黄浦世博园区举行，主题为“共创AI新经济”，超300家企业参展。大会显示，AI新经济已从概念走向现实，正真实融入商业、产业和百姓日常生活，入场即可感受到AI无处不在。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30934"}, {"n": 5, "section": "模型与产品", "title": "Meta 推出个人 AI 智能体 Muse：跑在云端虚拟机上，扎克伯格称“不会失控”", "summary": "Meta推出AI智能体Muse，可代替用户执行多种任务。它运行在专用云端虚拟计算机，将向美国18岁及以上用户开放，支持iOS、安卓、网页及WhatsApp，未来将登陆Instagram、Facebook并整合进Meta AI眼镜。Muse由新模型Muse Spark 1.3驱动，能调用Meta旗下应用及Ticketma", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30933"}, {"n": 6, "section": "模型与产品", "title": "OpenAI 称正与三星合作开发下一代芯片，双方合作持续深化", "summary": "OpenAI韩国区总经理称，与三星电子在下一代芯片联合生产与研发上合作成果显著。三星是全球应用ChatGPT规模最大的企业之一，韩国内外员工在研发、营销、销售等工作中广泛使用，双方正推进更快速的芯片技术研发。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30932"}, {"n": 7, "section": "科技要闻", "title": "Anthropic顶尖大牛愤然离职：AI失控倒计时，人类正在饮鸩止渴", "summary": "Anthropic资深研究员Jacob Coxon因认为AI行业无序狂飙，毅然辞职并退出人工智能领域，引发科技界震荡，凸显大模型高速演进背后的安全危机。Coxon年仅27岁，数学背景深厚，曾在OpenAI任职。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30931"}, {"n": 8, "section": "模型与产品", "title": "冲击科创板！DeepSeek 传已聘请中信证券筹备年内 IPO，估值剑指 5000 亿", "summary": "DeepSeek已聘请中信证券筹备科创板上市，计划年内递交IPO申请、明年挂牌。募资将主要用于扩大算力基础设施、加大前沿大模型与芯片自研投入，并强化核心研发人才激励。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30929"}, {"n": 9, "section": "模型与产品", "title": "联通联手魅族发布“小魔方”AI 手机：4 英寸方屏仅 99 克，主打全语音交互", "summary": "中国联通联合魅族发布“小魔方”AI原生终端，搭载云智OS，采用4英寸小方屏、重99克，主打全语音操控、AI服务、智能通话及端云协同。可点咖啡、控制智能家居；利用端侧摄像头与大模型实现“AI看世界”识别现实，通话支持翻译和速记。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30928"}, {"n": 10, "section": "模型与产品", "title": "三星与Mistral达成合作 全面赋能芯片设计与制造", "summary": "韩法总统峰会期间，三星电子宣布与法国AI初创Mistral AI合作，将其尖端服务与解决方案整合进半导体业务，赋能芯片设计与制造。Mistral AI成立于2023年，由前谷歌DeepMind与Meta核心员工创立，拥有Mistral Large等高性能大语言模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30927"}, {"n": 11, "section": "科技要闻", "title": "京东启动“物理 AI 加速计划”：要建全球最大物理世界运营中心", "summary": "在京东JDD大会上，曹鹏表示物理AI正迈向规模化落地，竞争焦点从模型、本体单点转向算力、数据与场景的体系化竞争。京东AI不只在论文中，更在生产、仓库、配送等全供应链流程中打磨，并围绕超级供应链建设正式启动。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30926"}, {"n": 12, "section": "模型与产品", "title": "曹操出行联合豆包上线 AI 打车服务，首批落地北京、杭州、苏州", "summary": "曹操出行与豆包联合推出AI打车服务，已在北京、杭州、苏州上线。用户在豆包内咨询路线、地点、餐饮娱乐等本地生活信息时，系统可依据对话内容生成出行方案，并直接衔接曹操出行打车服务。曹操出行表示，后续双方将拓展智能车控等AI出行功能，向更多城市复制，并探索Robotaxi服务能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30925"}, {"n": 13, "section": "模型与产品", "title": "小米 18 Fold 中折叠手机今日首销：首发玄戒 O3 芯片，10999 元起", "summary": "IT之家 9 月 10 日消息，小米 18 Fold 中折叠手机发布于 9 月 7 日，将于今日 10:00 正式开售，售价 10999 元起：12GB+256GB：10999 元12GB+512GB：11999 元16GB+512GB：12999 元16GB+1TB（LPDDR6）：14999 元16GB+1TB 陶瓷特别版（LPDDR6）：15999 元京东小米 Xiaomi 18 Fold &nbsp;暖金白 12GB+256GB10999 元直达链接小米 18 Fold 配备 5.38″ 外屏 + 7.58″ 内屏，内外屏采用约√2:1 标准纸张比例，支持 LTPO 1-120Hz 刷", "source": "IT之家", "url": "https://www.ithome.com/1/000/570.htm"}, {"n": 14, "section": "模型与产品", "title": "OpenAI 悄然收紧 ChatGPT 广告政策，禁止 Adobe 等竞品投放 AI 生图与音频广告", "summary": "IT之家 9 月 10 日消息，OpenAI 最近刚刚推出了 ChatGPT Images 2.5 图像生成模型以及 ChatGPT Live 语音功能。据 The Information 今日报道，OpenAI 近期悄然更新了其广告政策，禁止竞争对手在 ChatGPT 平台内投放特定生成式 AI 产品类别的广告，尤其是针对图像和音频生成工具的商业广告。OpenAI 已通知部分商业合作伙伴，将不再接受仅图像生成和语音生成类产品的广告活动审批。这项新规此前并未对外披露，也尚未更新至 OpenAI 官方广告政策页面。Adobe 美洲媒体高级总监 Doug Wyatt 证实了这一消息。Adobe 曾", "source": "IT之家", "url": "https://www.ithome.com/1/000/568.htm"}, {"n": 15, "section": "模型与产品", "title": "芯片成本飙升逼迫苹果上调iPhone 17、17e及iPhone Air官方售价", "summary": "伴随全新旗舰硬件周期的开启，苹果公司做出了其智能手机销售史上极为罕见的激进定价调整。在刚刚落幕的秋季发布会之后，苹果不仅打破了历年来旧款机型顺延降价100美元的固有行业惯例，反而宣布逆势全面上调仍在现役销售序列中的iPhone 17、iPhone 17e以及iPhone Air的官方零售价格。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577228.htm"}, {"n": 16, "section": "模型与产品", "title": "苹果秋季发布会五大核心看点：开辟折叠屏硬件新赛道 依托AI重构移动计算体验", "summary": "在备受瞩目的秋季新品发布会上，苹果公司正式揭开了其首款折叠屏智能手机iPhone Duo的神秘面纱，并同步推出了搭载2纳米制程A20 Pro芯片的iPhone 18 Pro系列、全面集成实时翻译的AirPods 5以及全新一代Apple Watch阵容。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577226.htm"}, {"n": 17, "section": "模型与产品", "title": "苹果正式发布iPhone 18 Pro系列 强化系统级端侧AI 售价小幅调高", "summary": "苹果公司正式发布了备受全球瞩目的全新一代高端旗舰智能手机iPhone 18 Pro与iPhone 18 Pro Max。两款新机型不仅首发搭载了基于台积电突破性2纳米尖端制程工艺打造的A20 Pro芯片，全面开启了深度融合系统底层的全新端侧生成式人工智能攻势，同时在产品起步规格、存储阶梯布局以及发售价格策略上也迎来了深远的结构性调整。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577208.htm"}, {"n": 18, "section": "模型与产品", "title": "苹果发布首款2纳米工艺移动芯片A20 Pro 强化运行先进端侧AI模型", "summary": "苹果在9月9日举行的新品发布会上正式公布A20 Pro芯片，并确认这款芯片将搭载于iPhone 18 Pro和iPhone 18 Pro Max。A20 Pro采用全新的2纳米制程技术，是苹果首款基于该工艺打造的智能手机芯片，标志着手机处理器正式进入更先进的制程阶段。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577206.htm"}, {"n": 19, "section": "模型与产品", "title": "微软与美国教师工会达成学校AI隐私协议 禁止用师生数据训练模型", "summary": "微软宣布与美国教师联合会（AFT）及其纽约市分支纽约市教师联合会（UFT）达成新的学校人工智能安全与隐私标准。根据协议，采用该标准的学区可将相关条款写入合同并获得法律约束力，其中包括不得利用学生或教育工作者的数据训练 AI 模型、尽量减少数据收集、以通俗语言向家庭说明工具运作方式、禁止部署 AI 陪伴型产品，以及对“高风险”决定实施人工审核。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577204.htm"}, {"n": 20, "section": "模型与产品", "title": "苹果A20 Pro芯片核心规格泄露 主频或飙至4.9GHz", "summary": "随着苹果下一代旗舰芯片研发进入关键阶段，关于iPhone 18 Pro系列核心动力心脏的详细技术规格被外媒与半导体供应链深度曝光。最新泄露的工程基准数据显示，基于台积电最新2纳米先进制程工艺打造的苹果A20 Pro芯片在频率极限、图形架构以及内存带宽等维度均实现了爆发式跃升，其中CPU主频据称最高可飙升至创纪录的4.9GHz，其图形核心更迎来大幅升级，综合内存带宽甚至逼近了苹果桌面级M3芯片的水准。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1577202.htm"}], "sections": [{"label": "科技要闻", "count": 5, "start": 0}, {"label": "模型与产品", "count": 15, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
