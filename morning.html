<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-08-16", "generatedAt": "", "items": [{"n": 1, "section": "论文研究", "title": "AutoDesign: Meta-Harness Optimization for Long-Horizon Agentic Design", "summary": "Transforming multimodal sources into condensed and structured media outputs can be fundamentally co…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13560v1"}, {"n": 2, "section": "论文研究", "title": "OmniScientist: An Omni-Modal Omni-Discipline AI Scientist", "summary": "Recent advances in foundation models have enabled AI scientists to automate increasingly complete r…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13558v1"}, {"n": 3, "section": "论文研究", "title": "HumanTracker: Towards Comprehensive and Human-Aligned Motion Tracking Benchmark", "summary": "Humanoid motion tracking is central to teleoperation and whole-body imitation, yet evaluation often…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13555v1"}, {"n": 4, "section": "论文研究", "title": "QuoteBench: How Matched Scores Can Hide Command-Path Failures", "summary": "LLM coding agents issue Bash commands through interfaces that may serialize, wrap, and reparse mode…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13547v1"}, {"n": 5, "section": "论文研究", "title": "LittleLearner: Language Models Under Pedagogically Controlled Knowledge Exposure", "summary": "Modern language models are trained on heterogeneous web-scale text corpora. Consequently, studying …", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13545v1"}, {"n": 6, "section": "论文研究", "title": "SAEVerbalizer: Generating Explanations for Sparse Autoencoder Features via Representation Verbalization", "summary": "Sparse autoencoders (SAEs) are proposed to extract numerous features from large language model (LLM…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13538v1"}, {"n": 7, "section": "论文研究", "title": "Vero: Can AI Agents Build Formally Verified Software Repositories?", "summary": "AI agents are increasingly used for programming, but do not provide any guarantee on the correctnes…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13522v1"}, {"n": 8, "section": "论文研究", "title": "The data geometry of masking diffusion: Certified-optimal schedules via unmasking growth complexity", "summary": "We study masking diffusion for discrete sampling and introduce a path-resolved measure of data geom…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13520v1"}, {"n": 9, "section": "论文研究", "title": "DFM Mimir v1: An Open HRM Delivering Frontier Performance at 1B Parameters Using Only Permissible Post-Training Data", "summary": "Current large language model development relies on massive, often non-permissible datasets, creatin…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13517v1"}, {"n": 10, "section": "论文研究", "title": "Measuring Task-Agnostic Training Data Influence Across Language Model Pretraining", "summary": "Measuring training data influence consistently across language model pretraining is challenging. It…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13515v1"}, {"n": 11, "section": "论文研究", "title": "Intern-S2-Preview: Scientific Agentic Foundation Model", "summary": "Scientific discovery increasingly requires AI systems that can reason over scientific evidence of h…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13505v1"}, {"n": 12, "section": "论文研究", "title": "AlayaWorld: Interactive Long-Horizon World Modeling - Full Technical Report (v1.1)", "summary": "This report presents an improved version of AlayaWorld. While the backbone architecture, chunk-wise…", "source": "arXiv", "url": "https://arxiv.org/abs/2608.13492v1"}, {"n": 13, "section": "论文研究", "title": "Maglev: Sliding Recurrent Memory", "summary": "We introduce , a recurrent Transformer architecture with fixed-size memory that generalizes sliding…", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.02870"}, {"n": 14, "section": "论文研究", "title": "Thought-Level Beam Search for Reasoning", "summary": "Test-time compute scaling is a primary driver of performance in large reasoning models (LRMs), but …", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.08020"}, {"n": 15, "section": "论文研究", "title": "RibAssist 3D: Biplanar Rib-Fracture Detection, Addressing, and Selective 3D Localization from CT-Derived Projections", "summary": "Rib fractures are common and time-consuming to localize on computed tomography (CT). We ask whether…", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.06914"}, {"n": 16, "section": "论文研究", "title": "Context-Matched Distillation: Teacher Causality for Autoregressive Video Distillation", "summary": "Interactive autoregressive video generation demands both low-latency rollouts and precise online co…", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.13391"}, {"n": 17, "section": "论文研究", "title": "From Inaudible Inputs to Model Failures: Low-Frequency Safety Risks in LALMs", "summary": "Large audio-language models (LALMs) have demonstrated strong capabilities in understanding diverse …", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.09158"}, {"n": 18, "section": "论文研究", "title": "Mitigating Gender Bias in English to Romanian Machine Translation", "summary": "Machine translation (MT) systems often fail to correctly translate gender, especially when converti…", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.08606"}, {"n": 19, "section": "论文研究", "title": "Hybrid-Policy Self-Editing for Composable Unstructured Knowledge Editing", "summary": "Large language models (LLMs) achieve remarkable performance across natural language tasks, yet they…", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.11660"}, {"n": 20, "section": "论文研究", "title": "Specification-first convergence with an AI coding agent: a case study of dismantling a core architectural invariant across 189 files in a 717k-line codebase with no test oracle and no human code review", "summary": "This paper reports a single, fully instrumented case study of a large-scale architectural refactori…", "source": "HuggingFace", "url": "https://huggingface.co/papers/2608.12440"}], "sections": [{"label": "论文研究", "count": 20, "start": 0}]};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = true;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(it.n).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ 实时数据源暂不可用，当前显示最近一期缓存（'+(DATA.date||'')+'）。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
</body>
</html>
