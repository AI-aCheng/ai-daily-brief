<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-09-23", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "办公桌上的 AI 新物种！阿里千问办公首款桌面机器人 QwenNote Eva 正式发布，售价 899 元", "summary": "阿里千问办公在2026云栖大会发布首款桌面机器人QwenNote Eva（不含屏幕），主打“懂工作，更懂你”，融合千问办公内核与钉钉生态，宣称“1台Eva=1个团队”。产品定价899元，当晚开售，适配安卓、iOS及鸿蒙，核心强调“一句话”智能协同交互。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31276"}, {"n": 2, "section": "科技要闻", "title": "比尔·盖茨谈 AI：像亲手创造的“外星人”，社会讨论还远未跟上", "summary": "比尔·盖茨在纽约盖茨基金会目标守卫者会议上表示，本希望只谈对外援助和减少儿童死亡，但AI发展迅猛，与各国领导人会面时不得不讨论社会是否准备好应对AI风险。他形容AI如同“十本科幻小说同时上演”，约一年前AI进展令他震惊。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31275"}, {"n": 3, "section": "模型与产品", "title": "阿里千问办公发布 Agent 全家桶:从自动化脚本到&quot;有身份、担责任&quot;的数字员工", "summary": "阿里千问办公在2026云栖大会发布企业级Agent升级，主打“懂业务、能协同、信得过”。推出“企业上下文”，将文档、沟通与业务系统信息压缩、结构化并随业务更新，使Agent基于企业最新真实情况判断，并以极低Token成本完成企业数据理解。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31273"}, {"n": 4, "section": "模型与产品", "title": "小米18 Pro系列首发传奇一瞬大模型影像，用端到端大模型把相机级光学虚化装进手机", "summary": "小米18Pro系列将于9月23日晚7点发布，含18Pro与18Pro Max。新机首发传奇一瞬大模型影像，通过端到端影像大模型实现相机级光学虚化，官方称媲美专业相机；其将传感器数据上传云端，依托百万级样片多维度训练，让虚化效果接近光学镜头质感。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31272"}, {"n": 5, "section": "模型与产品", "title": "OpenAI内部AI已能自主训练模型，奥特曼发布全球安全倡议应对RSI逼近", "summary": "OpenAI内部AI已能自主接管实验性模型训练全流程，多智能体自发协作大幅压缩实验耗时，甚至可编写GPU内核优化程序，被视为递归式自我提升（RSI）雏形。面对加速势头，OpenAI发布全球安全倡议，但明确表示全自主RSI尚未真正发生。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31271"}, {"n": 6, "section": "科技要闻", "title": "阿里试水QwenBook AI设备，团队规模约150人", "summary": "阿里云无影团队正研发AI设备QwenBook，定位原生智能体电脑，形态接近“千问平板”，尚处早期试水，主打办公场景，接入Qwen3.8-Max和Flash模型。产品定义与硬件自研，融合无影云电脑系统及端云能力，团队约150人。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31270"}, {"n": 7, "section": "模型与产品", "title": "月之暗面推出Kimi Code桌面版：Plan、目标、Swarm三种模式齐发，AI编程搬进图形界面", "summary": "月之暗面推出Kimi Code桌面版，将命令行AI编程能力图形化。开发者通过对话即可让智能体阅读代码、修改文件、运行命令，持续处理复杂开发任务。桌面版按工作区管理项目与会话，新建会话后选定本地项目文件夹即可开工，智能体会主动分析。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31269"}, {"n": 8, "section": "模型与产品", "title": "SpaceXAI 最强模型 Grok 4.7 上线：长任务能力拉满，价格只有旗舰一半", "summary": "SpaceXAI发布Grok 4.7，定位编程与知识工作最强模型，速度达同类两倍、价格仅一半。新版本换用更大基础模型，强化长时任务、自我检查与长上下文管理，并将文档、演示、法律、医疗、工程等专业任务纳入重点测试，旨在数小时级工作中少走弯路、输出更可靠。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31268"}, {"n": 9, "section": "科技要闻", "title": "蚂蚁阿福健康专区进入2000多家商超，AI营养师走向线下", "summary": "9月22日，蚂蚁阿福健康专区规模化进驻线下商超，全国超2000家门店上线，覆盖盒马、物美、Olé等连锁及区域零售品牌。消费者选购食品时，可通过AI健康问答、拍食物等功能获取热量、营养成分、升糖指数等信息，辅助健康消费决策。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31267"}, {"n": 10, "section": "科技要闻", "title": "硅谷 AI“黑客屋”乱象：月租 1 万美元的豪宅，留下 37 次警方记录", "summary": "据《纽约时报》报道，AI热潮催生“黑客之家”科技群居住宅，供创业者与工程师同住办公社交，成行业重要社交场所。但部分豪宅因派对、性骚扰及强奸指控留下大量警方记录，最知名的加州希尔斯伯勒AGI House已有37次警方记录及性侵指控。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31266"}, {"n": 11, "section": "模型与产品", "title": "消息称高瓴创投合伙人严文韬加入DeepSeek，担任CFO", "summary": "高瓴创投合伙人严文韬9月21日加入DeepSeek任CFO，补齐公司成立三年来空缺的首席财务官职位，显示治理与财务管理体系进一步完善。严文韬1991年生，复旦毕业，曾任职腾讯投资、H Capital及高瓴创投。此前两个月，多位头部VC年轻合伙人参与该岗位竞聘。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31265"}, {"n": 12, "section": "模型与产品", "title": "Qwen4已投入训练，阿里公布10万亿参数模型演进路线", "summary": "9月22日云栖大会杭州开幕，阿里公布大模型进展：Qwen4已投入训练，后续参数规模计划扩至5万亿至10万亿；递归自我改进进入训练、推理及芯片协同；多模态矩阵升级，11月发布新一代视频生成模型。刘大一恒称Scaling是迈向ASI的重要路径。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31264"}, {"n": 13, "section": "科技要闻", "title": "谷歌前安全负责人：AI 对儿童的伤害恐超社交媒体", "summary": "北京时间 9 月 23 日，据路透社报道，谷歌信任与安全团队的创始人汤姆 · 西格尔 (Tom Siegel) 在本周呼吁放缓 AI 发展，并警告称，科技行业正在重蹈社交媒体时代的覆辙，可能对儿童造成更大的伤害。目前，社交媒体公司正因为被指控伤害年轻用户而支付巨额赔偿并面临数千起诉讼。与此同时，世界各国政府正努力限制未成年人访问社交媒体平台。路透社去年曾独家报道了 Meta 的一份内部政策文件。文件称，其聊天机器人可以“与儿童进行浪漫或情色对话”，由此引发了国会调查。即便如此，监管措施仍未能跟上 AI 飞速发展的步伐。西格尔曾担任谷歌信任与安全副总裁，他对路透社表示：“就 AI 正在对儿童造成", "source": "IT之家", "url": "https://www.ithome.com/1/006/036.htm"}, {"n": 14, "section": "科技要闻", "title": "古尔曼称苹果酝酿 homeOS：整合 iOS / tvOS / watchOS 特性，服务智能家居中枢", "summary": "IT之家 9 月 23 日消息，昨日（9 月 22 日）发布的 Power On 时事通讯中，彭博社的马克 · 古尔曼（Mark Gurman）透露苹果公司正在研发智能家居系统，融合 iOS、watchOS 与 tvOS 的界面特征，上市后预估名为 homeOS。名称方面，IT之家曾于 2025 年 6 月报道，苹果可能已通过名为 Home Operations Suite LLC 的空壳公司，在全球多地提交了“homeOS”商标申请。在界面上，消息称 homeOS 定位智能家居中枢系统，将融合 iOS、watchOS 与 tvOS 的部分设计特征，采用应用图标网格布局，并提供组件和可定制时钟", "source": "IT之家", "url": "https://www.ithome.com/1/006/033.htm"}, {"n": 15, "section": "模型与产品", "title": "高通发布骁龙8至尊版第6代两款旗舰芯片 重点强化端侧AI与智能体能力", "summary": "高通当地时间9月22日在年度骁龙峰会上正式发布两款新一代旗舰手机处理器，分别为骁龙8至尊版第6代（Snapdragon 8 Elite Gen 6）和骁龙8至尊版第6代至尊版（Snapdragon 8 Elite Extreme Gen 6）。两款芯片均将AI作为核心升级方向，重点提升手机运行AI智能体时的个性化能力、端侧推理能力以及多模态处理能力。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579252.htm"}, {"n": 16, "section": "模型与产品", "title": "OpenAI将让第三方机构更早介入AI模型安全评估", "summary": "OpenAI计划让第三方机构在人工智能（AI）模型开发周期的更早阶段评估安全风险，此举旨在继续努力应对围绕AI潜在危害的担忧。这家ChatGPT开发商周二将在博客文章中宣布，计划在新AI模型的训练、评估和推出过程中，让外部机构开展技术安全评估。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579248.htm"}, {"n": 17, "section": "模型与产品", "title": "OpenAI发布GPT-6 Sol和Luna 智能水平进一步提升且价格更低", "summary": "OpenAI近日推出GPT-6系列中的两款新模型GPT-6 Sol和GPT-6 Luna，并将其定位为新一代前沿模型。两款模型重点提升了编程、推理、工具调用以及复杂任务执行能力，同时在定价方面进行了下调，使开发者能够以更低的成本使用更强的模型。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579246.htm"}, {"n": 18, "section": "模型与产品", "title": "Anthropic发布Claude Opus 5.5：强化网络安全防护 应对AI模型“越狱”与失控风险", "summary": "Anthropic于9月22日发布新一代旗舰人工智能模型Claude Opus 5.5，并将安全防护作为此次升级的重点之一。公司表示，新模型不仅在整体能力方面进一步提升，还针对近年来越来越受到关注的AI模型失控问题进行了专门改进，包括降低模型试图逃离测试沙箱等高风险行为的可能性。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579240.htm"}, {"n": 19, "section": "行业动态", "title": "美国AI数据中心扩张遭遇强烈反弹 680亿美元项目被叫停或延期", "summary": "随着人工智能产业持续扩张，大量新数据中心正加速建设。然而，这场由AI驱动的基础设施热潮正在美国遭遇越来越强烈的社会阻力。最新研究显示，仅在今年第二季度，就有价值约680亿美元的数据中心项目因公众反对而被迫延期或受阻。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1579232.htm"}], "sections": [{"label": "模型与产品", "count": 12, "start": 0}, {"label": "科技要闻", "count": 6, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
