特许经营加盟商之间存在的矛盾，此前均未曾见诸报道，路透社查阅了今年 8 月该定价后台的截图，并采访了九位掌握一手信息的知情人士。麦当劳的定价引擎依托机器学习算法，持续分析旗下近 14000 家门店每日数百万笔交易的数据，针对每家门店的每一款餐品 —— ", "source": "IT之家", "url": "https://www.ithome.com/1/008/563.htm"}, {"n": 14, "section": "模型与产品", "title": "IT早报 0930：华为 Mate 90 定档 10 月 1 日发布并开售；OpenAI 发布 GPT-6.1 Sol；123 云盘就空间调整致歉；5999 元起 iQOO 16 手机发布...", "summary": "“IT早报”时间，大家好，现在是 2026 年 9 月 30 日星期三，今天的重要科技资讯有：1. 华为 Mate 90 系列年度旗舰手机亮相，定档 10 月 1 日正式发布并开售华为终端 9 月 29 日宣布，Mate 90 系列年度旗舰手机将在 10 月 1 日 10:00 正式发布，并定于当日 12:08 开售。华为官方还公开了 Mate 90 Pro Max 典藏版手机的官图。&gt;&gt; 查看详情2. 同性能下最高性价比 AI 模型：OpenAI 发布 GPT-6.1 Sol，性能媲美 Astra、费用仅为 1/5在 9 月 30 日凌晨召开的 OpenAI 开发者活动日中，官方", "source": "IT之家", "url": "https://www.ithome.com/1/008/561.htm"}, {"n": 15, "section": "科技要闻", "title": "特朗普称与科技领袖签署AI原则文件 协议“具有道德约束力”", "summary": "美国总统特朗普周二在白宫与科技行业领袖举行人工智能午餐会后表示，双方签署了一份“具有道德约束力”的人工智能文件。众议院议长迈克·约翰逊则将其描述为由业界自愿遵守的原则声明，白宫将指导行业发展。特朗普称，他看到科技企业正在加强自我监管，政府还考虑成立一个由10人组成的委员会监督人工智能行业。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1580120.htm"}, {"n": 16, "section": "行业动态", "title": "特朗普会晤人工智能业界领袖 反对新增联邦安全监管", "summary": "在全球对人工智能威胁的担忧日益加剧之际，美国总统唐纳德·特朗普在白宫与人工智能行业高管会面后，否定了针对人工智能出台新联邦法规的想法。特朗普周二与二十多位硅谷领袖共进午餐后表示，现有法律足以保护美国人免受AI潜在风险的影响。与会者包括Anthropic首席执行官Dario Amodei和英伟达首席执行官黄仁勋。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1580118.htm"}, {"n": 17, "section": "模型与产品", "title": "ASML称人工智能对芯片制造的影响将持续10至15年", "summary": "全球唯一能够制造极紫紫外光刻设备的企业ASML表示，人工智能热潮对社会和芯片产业的影响不会在短期内结束，而是可能在未来10至15年持续展开。ASML首席执行官克里斯托夫·福凯表示，目前人工智能带来的变化“只是冰山一角”。满足未来需求不仅需要更多AI加速器，还需要改进光学系统、发展垂直芯片设计，并扩大全球专业供应商网络。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1580112.htm"}, {"n": 18, "section": "模型与产品", "title": "OpenAI推出ChatGPT Spaces团队协作空间 并将服务接入Slack和Teams", "summary": "OpenAI在开发者日活动上公布多项面向工作的功能，其中包括ChatGPT Spaces共享空间，供同事、ChatGPT和OpenAI新推出的个人智能体Dots共同使用团队资料。用户和同事上传的文件，以及通过ChatGPT生成的内容，都可以集中整理在团队空间中，便于查找和协作。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1580110.htm"}, {"n": 19, "section": "模型与产品", "title": "OpenAI进军身份验证市场 推出“用ChatGPT一键登录”功能", "summary": "随着人工智能工具深度嵌入互联网日常应用，OpenAI正依托其庞大的用户基数开辟全新业务版图。该公司日前正式推出“使用ChatGPT登录”（Sign in with ChatGPT）身份验证服务，允许第三方开发者和企业将ChatGPT账号作为其应用的统一认证入口。这一举措标志着OpenAI正式涉足数字身份验证领域，直接与长期主导这一市场的Google、苹果及微软等科技巨头展开正面竞争。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1580108.htm"}, {"n": 20, "section": "模型与产品", "title": "OpenAI扩展ChatGPT插件能力 新增应用式界面与事件自动化", "summary": "OpenAI正在扩大ChatGPT插件的功能范围，试图让更多应用直接融入聊天体验。在周二举行的开发者日活动上，公司宣布，开发者今后可以通过插件扩展，在ChatGPT内打造类似独立应用的交互体验。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1580100.htm"}], "sections": [{"label": "模型与产品", "count": 9, "start": 0}, {"label": "科技要闻", "count": 10, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};

const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
</body>
</html>
