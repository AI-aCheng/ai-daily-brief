<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晨报</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --brown:#93795c;
  --line:#ece7df; --muted:#c3b8a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:600;letter-spacing:3px}
.sub{margin-top:7px;font-size:12.5px;color:var(--brown);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--brown)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--brown);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;transition:.2s}
.chip b{font-weight:600;margin-left:3px}
.chip:hover{border-color:var(--brown)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 10px 34px rgba(70,58,45,.07);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#efe9e1;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px}
.src{margin-top:16px;font-size:13px;color:var(--brown);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#3a362f}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--brown);
  text-decoration:none;border-bottom:1px solid var(--brown);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--brown);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--brown);color:#fff;border-color:var(--brown)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#fff;color:var(--brown)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--brown);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--brown);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:var(--brown);
  padding:9px;background:#f2ebe1;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晨报</div>
  <div class="sub">与你共读今日 AI</div>
  <div style="margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div style="margin-top:8px;font-size:12px;color:var(--brown);letter-spacing:1px;">AI资讯 · 大模型 · Agent · 智能体 · 效率工具</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;">每日自动更新 · 与你共读今日 AI</span></div>
</footer>

<div class="fallback-note" id="fallbackNote" style="display:none"></div>

<script>
const DATA = {"date": "2026-08-26", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "马斯克把Grok语音系统搬上星链：日均处理1.5万通电话、周成交3000笔订单", "summary": "马斯克旗下SpaceX星链项目近期大规模部署Grok语音系统，全面用于客户支持与销售业务。该系统作为特斯拉及xAI生态核心AI产品，在落地中展现较高实用价值与处理效率，SpaceX AI团队披露的运营数据印证其已承担大量日常客服与销售任务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30609"}, {"n": 2, "section": "模型与产品", "title": "Meta数周内推出Hatch AI智能体，Watermelon模型10月亮相", "summary": "Meta拟数周内推出消费级AI智能体平台Hatch，并于10月发布下一代模型Watermelon，被视为扎克伯格推动AI商业化、拓展广告外收入的关键布局。Hatch基于OpenClaw打造，定位从传统对话式AI转向能自主执行任务的智能助手。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30607"}, {"n": 3, "section": "模型与产品", "title": "谷歌 Gemini 迎来深度界面升级，新增通知中心与智能筛选", "summary": "谷歌正在对Gemini应用进行深度界面与功能升级，涵盖聊天管理、通知系统、搜索筛选和AI代理能力扩展。新版将置顶聊天从“最近”列表独立，置于侧边栏顶部；搜索入口统一移至侧边栏顶端。此次调整优化日常交互体验，推动Gemini加速向综合性AI平台转型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30605"}, {"n": 4, "section": "科技要闻", "title": "ARIA 重拳封杀纯 AI 歌曲：人类创作主唱才能上榜，AI 辅助仍可准入", "summary": "澳大利亚唱片业协会25日决定，自下周一起禁止完全由AI生成的歌曲进入官方排行榜。导火索为AI翻制麦当娜名曲《Like a Prayer》连续16周跻身前20、一度升至第2。新规要求歌曲须由人类创作、主唱并演奏主要乐器，纯AI作品不得上榜或参评。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30604"}, {"n": 5, "section": "模型与产品", "title": "老板电器 AI 烹饪眼镜明年 3 月开售：搭载&quot;食神&quot;大模型", "summary": "老板电器新一代AI烹饪眼镜预计明年3月发布，将真正面向消费者销售。新品较前代约89克更轻盈，显示由全彩改为单色，充电改为换电方案；搭载“食神”AI烹饪大模型，具备厨房场景AI算法与厨电联动逻辑，算法来自成都团队，光波导模组由谷东智能提供。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30603"}, {"n": 6, "section": "模型与产品", "title": "ChatGPT重磅上线自定义贴纸功能，完美打通两大社交巨头", "summary": "OpenAI近日为ChatGPT上线自定义贴纸功能，用户可通过上传照片、输入提示词或迁移视觉风格等方式制作个性化贴纸。该功能内置智能抠图与图像修复技术，可自动生成背景干净的透明贴纸，进一步拓展了AI在社交内容创作领域的应用边界。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30602"}, {"n": 7, "section": "模型与产品", "title": "微软CEO纳德拉:企业不能依赖单一AI模型，否则可能无法生存", "summary": "微软CEO纳德拉警告，企业若依赖单一AI模型恐难生存。他强调企业自身知识、提示词、交互记录及AI使用产生的元数据是核心资产，应掌握在企业手中，避免被绑定于某一家供应商或模型。与消费场景不同，企业须确保知识资产留在内部，并随着AI深入业务流程加以保护。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30601"}, {"n": 8, "section": "模型与产品", "title": "GPT-5.6重磅登陆Kiro！AI原生编码迎来性价比革命，开发效率实现质的飞跃", "summary": "OpenAI与开发平台Kiro合作，将GPT-5.6模型家族（含Sol、Terra、Luna）嵌入软件规划、构建、审查、测试全流程。新模型每Token产出效率大幅提升，性能更强、性价比更高，并能按需处理复杂任务。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30600"}, {"n": 9, "section": "模型与产品", "title": "纳德拉示警企业：别把&quot;Token 资本&quot;押注单一模型，当心命运被外包", "summary": "微软CEO纳德拉警告，企业若依赖单一AI模型，易将知识与思考能力“外包”给厂商，甚至丧失独立生存力。他认同使用AI等于向厂商贡献数据、思维与愿景，被用于改进模型。企业应把“Token资本”留在内部，与消费者免费换数据不同，持续创造的知识须自主掌控。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30599"}, {"n": 10, "section": "模型与产品", "title": "大模型成最大“抄袭者”？全球最大生活指南百科 WikiHow 正式起诉 OpenAI 侵权", "summary": "WikiHow向美国曼哈顿联邦法院起诉OpenAI，指控其未经许可抓取逾1.1万篇教程文章训练ChatGPT及GPT系列模型，涉嫌侵犯至少1200项已注册版权。WikiHow是全球最大协作式“怎么做”生活指南平台。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30598"}, {"n": 11, "section": "科技要闻", "title": "高盛合伙人警钟：华尔街把推理外包给 AI，或养出&quot;不会思考&quot;的一代", "summary": "高盛合伙人Chris Churchman警告，华尔街快速普及AI或削弱金融从业者思考能力。他指出，把推理外包给模型将导致“认知能力萎缩”，使人无法从第一性原理思考。他类比导航取代记忆，担忧算法包揽分析会使银行家丧失分析力，而华尔街正将AI深植交易。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30597"}, {"n": 12, "section": "模型与产品", "title": "字节跳动发布AI办公智能体“豆包工作”，打通飞书生态重构企业生产力", "summary": "字节跳动推出AI Agent产品“豆包工作”，具备自主任务规划、跨工具调用与虚拟桌面操控能力，并深度整合飞书生态。它面向办公场景提供端到端智能方案，支持目标拆解、工具调度和长流程任务持续推进，推动AI办公从辅助生成迈向全流程自主执行。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30596"}, {"n": 13, "section": "科技要闻", "title": "数码考古：微软首款智能手机问世比苹果 iPhone 早约 5 年", "summary": "IT之家 8 月 26 日消息，科技媒体 Windows Latest 昨日（8 月 25 日）发布“数码考古”博文，回顾了微软首款智能手机，于 2002 年 10 月 28 日在英国发布的 Orange SPV，比苹果初代 iPhone 亮相（2007 年）早约 5 年时间。该媒体指出在安卓和苹果 iOS 主导移动市场之前，微软曾在移动软件领域占据明显优势。微软自 20 世纪 90 年代末起，微软把 Windows CE（Windows 嵌入式操作系统）打造为高度模块化的系统。它能够运行在多种硬件架构上，硬件厂商也能根据不同设备深度定制系统。IT之家援引博文介绍，Windows CE 的应用", "source": "IT之家", "url": "https://www.ithome.com/0/994/321.htm"}, {"n": 14, "section": "模型与产品", "title": "谷歌杀入法律 AI 赛道，推出专用 Gemini 工具", "summary": "IT之家 8 月 26 日消息，Alphabet 旗下谷歌周二扩展了其 Gemini Enterprise 人工智能平台，推出面向律师和律所的新工具，进一步加剧了科技公司争夺法律行业 AI 需求的竞争。谷歌表示，Gemini Enterprise for Legal 将帮助律所利用 AI 处理日常工作以及复杂任务，让律师能够将更多精力投入到价值更高的专业服务，同时确保数据的安全性和保密性。Gemini Enterprise for Legal 新增的插件支持与法律软件和数据平台集成，并提供一系列 AI 智能体。谷歌称，这些 AI 智能体能够处理专业化的法律及行政工作，无需大量人工监督。Alph", "source": "IT之家", "url": "https://www.ithome.com/0/994/319.htm"}, {"n": 15, "section": "科技要闻", "title": "德国自动驾驶出租车市场再迎新玩家 Waymo计划进军慕尼黑", "summary": "Alphabet旗下自动驾驶公司Waymo当地时间周二宣布，计划在德国慕尼黑推出无人驾驶出租车服务。这是该公司数月前在德国设立实体后，进一步推进欧洲业务布局的重要动作。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574956.htm"}, {"n": 16, "section": "行业动态", "title": "英伟达DLSS 4.5光线重建开放早期体验 全系RTX显卡可用", "summary": "在2026年科隆游戏展期间，英伟达继续扩展其DLSS技术栈，正式推出采用第二代Transformer模型的DLSS 4.5光线重建技术。该功能现已通过NVIDIA App以早期体验形式上线，覆盖GeForce RTX 20系列及之后发布的全部RTX显卡。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574954.htm"}, {"n": 17, "section": "科技要闻", "title": "研究发现TikTok算法设计令年轻人更难区分可信建议与误导性信息", "summary": "英国伯明翰大学一项最新研究指出，TikTok的平台设计可能让年轻人更难以批判性地判断所接触的心理健康内容，也更难区分可信建议与误导性信息。在英格兰，目前有超过55万名儿童和年轻人正等待接受心理健康治疗。伯明翰大学的研究发现，TikTok上的心理健康内容虽然触达广泛，但平台本身的内容呈现和推荐机制，可能放大年轻人在信息辨识方面面临的困难。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/science/1574950.htm"}, {"n": 18, "section": "模型与产品", "title": "OpenAI\"Jalapeño\"芯片跑分公开 推理性能超越英伟达旗舰GPU", "summary": "OpenAI于本周二发布博文称，其自研人工智能芯片\"Jalapeño\"（辣椒）在完成任务效率和响应速度方面均优于当前其他人工智能系统。在与媒体记者的通气会上，OpenAI硬件副总裁Richard Ho表示，Jalapeño实现了\"两者兼得\"，同时具备更低的延迟和更高的吞吐量，而以往的人工智能系统通常需要在这两项指标之间做出取舍。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574946.htm"}, {"n": 19, "section": "模型与产品", "title": "Google拓展Gemini企业版AI平台 深耕法律服务市场", "summary": "Google宣布扩展其Gemini Enterprise人工智能平台，专门为律师事务所和执业律师推出全新工具，这一举措进一步加剧了科技公司在满足法律行业AI需求方面的激烈竞争 。Google表示，新推出的Gemini Enterprise for Legal产品将帮助律师事务所借助人工智能处理日常及复杂事务，使律师能够将精力集中于更高价值的服务，同时确保数据的安全性与保密性 。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574942.htm"}, {"n": 20, "section": "模型与产品", "title": "OpenAI封禁涉嫌参与秘密舆论行动的俄罗斯ChatGPT账号", "summary": "OpenAI已封禁一批来自俄罗斯、被用于支持网络虚假信息传播活动的ChatGPT账号。该公司表示，这些账号参与了一项隐蔽的线上影响力行动，试图借助人工智能生成内容、塑造特定叙事并掩盖操作者的真实来源。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574940.htm"}], "sections": [{"label": "模型与产品", "count": 14, "start": 0}, {"label": "科技要闻", "count": 5, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#b5674a", "产品发布/更新": "#4f6f8f", "行业动态": "#5d7a5d", "论文研究": "#b08a3c", "技巧与观点": "#7b6a9b"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#8a6d4f';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晨报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
