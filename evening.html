<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>AI 晚报</title>
<style>
:root{
  --bg:#0f1117; --card:#1a1d29; --ink:#e8e8ef; --accent:#a29bfe;
  --line:#2d2f3e; --muted:#6b6d7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,#1a1530 0%,#0f1117 55%,#0c1230 100%)}
.brand{font-size:22px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(90deg,#ffffff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin-top:7px;font-size:12.5px;color:var(--accent);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--accent)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--accent);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#161927;transition:.2s}
.chip b{font-weight:600;margin-left:3px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 14px 40px rgba(0,0,0,.55);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#2a2d3e;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px;color:#f1f1f5}
.src{margin-top:16px;font-size:13px;color:var(--accent);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#b6b8c4}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--accent);
  text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#161927;color:var(--accent);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--accent);color:#0f1117;border-color:var(--accent)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#161927;color:var(--accent)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--accent);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--accent);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:#cdcfe0;
  padding:9px;background:#232636;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>

<header class="top">

</footer>

<script>
const DATA = {"date": "2026-09-05", "generatedAt": "", "items": [{"n": 1, "section": "科技要闻", "title": "马斯克女儿拍广告把机器人当狗遛，还怒怼 AI 抢人类饭碗", "summary": "马斯克22岁女儿薇薇安·威尔逊出任西班牙品牌Desigual 2026秋季代言人，广告主题“天生叛逆”。片中她戏谑挑战AI，给造型参考特斯拉人形机器人的DESI 84下达离谱指令：当高尔夫球座、当宠物遛、命令割草，还有床上互动桥段。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30850"}, {"n": 2, "section": "行业动态", "title": "以色列-荷兰AI独角兽Wonderful斩获5.5亿美元C轮融资，估值直冲50亿美元", "summary": "以色列-荷兰AI初创公司Wonderful完成5.5亿美元C轮融资，估值飙升至50亿美元。不到六个月前其估值约20亿美元，实现翻倍以上增长。本轮吸引知名机构持续加码。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30849"}, {"n": 3, "section": "科技要闻", "title": "海外三大 AI 集体宕机近 4 小时，智谱发文“我们还在线”并开启夜间免费", "summary": "美国头部AI服务集体宕机约3小时40分。ChatGPT、Claude、Grok出现异常，谷歌Gemini、微软Copilot也收到大量中断报告。故障于美东时间9月3日上午9点23分左右集中爆发，Claude系列模型率先报错，峰值时OpenAI收到超3.7万份故障报告。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30847"}, {"n": 4, "section": "行业动态", "title": "智能戒指厂商Oura正式提交IPO申请，9个月营收增至12亿美元", "summary": "智能戒指厂商Oura提交IPO申请，截至6月30日过去9个月营收12亿美元，高于去年同期6.97亿；预计2024年营收约5亿、2025年约10亿、2026年近20亿。过去一年售出约360万枚戒指，付费会员约500万，留存率约85%，售价350至400美元。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30846"}, {"n": 5, "section": "科技要闻", "title": "AI生成菜单陷入“完美美学”，食物图片出现恐怖谷效应", "summary": "生成式AI进入餐饮菜单设计，但其同质化“完美美学”引发视觉问题。餐厅用AI生成的菜品图常过度对称、光滑精致，部分食物结构异常，被消费者称为“恐怖谷效应”。专家认为这与AI模型从海量数据中学习模式、追求平均化生成的训练机制有关。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30845"}, {"n": 6, "section": "模型与产品", "title": "Google DeepMind发布气象大模型WeatherNext 3，实现每小时刷新与5公里高精度全球预报", "summary": "谷歌DeepMind与谷歌研究院联合发布全球天气AI模型WeatherNext3，突破传统气象AI在局部地形分辨率和初始化延迟上的瓶颈，直接接入实时静止卫星拼图实现每小时初始化，并以原始气象站观测数据训练，全方位提升预报精度。其核心架构沿用WeatherNext2的概率型功能生成网络（FGN）网格T。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30844"}, {"n": 7, "section": "行业动态", "title": "英伟达129亿美元收购Hugging Face，黄仁勋给出最新承诺", "summary": "英伟达宣布以129.303亿美元（约870.92亿元人民币）收购开源AI平台Hugging Face，引发科技圈关注。CEO黄仁勋发文阐释收购逻辑与未来规划。Hugging Face作为全球开源模型开发者重要聚集地，已汇聚超1800万名开发者与研究者。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30843"}, {"n": 8, "section": "模型与产品", "title": "未发布GPT Image 2.5多项升级引关注，以假乱真引爆新期待", "summary": "未发布的GPT Image 2.5引发科技圈关注，版本号从猜测的2.1跃升至2.5，彰显迭代速度与技术野心。该模型被疑为LMArena匿名模型luna-lisa-alpha，多项生图能力全面飞跃，生成速度较前代更快，画面表现亦有显著提升。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30842"}, {"n": 9, "section": "科技要闻", "title": "Vara获全球首个自主乳腺癌筛查AI认证", "summary": "德国Vara公司乳腺癌筛查AI获欧盟MDR IIb类CE认证，成为全球首个可自主分诊的筛查AI。该AI可将明显正常的乳腺X光检查直接排除，无需放射科医生阅片，其余病例仍由医生复核。目前仅限有组织的群体筛查，不适用于有症状患者或诊断性检查。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30840"}, {"n": 10, "section": "模型与产品", "title": "谷歌9月4日起停用Google Assistant，Gemini全面接棒", "summary": "谷歌确认，安卓手机Google Assistant将于9月4日起逐步停止服务，用户将迁移至Gemini。谷歌已邮件通知，迁移预计数周，部分用户或延后，最终均将失去访问权限。原计划2025年底停用，因完善Gemini而推迟，现认为Gemini已具备全面接棒条件。此次调整还影响智能手表等设备。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30839"}, {"n": 11, "section": "行业动态", "title": "AI 数据中心新贵 Crusoe 融资 30 亿美元：估值 300 亿，刚签下 130 亿美元大单", "summary": "数据中心开发商Crusoe完成30亿美元新融资，估值达300亿美元，客户包括Meta、微软和OpenAI。本轮由Atreides Management与Valor Equity Partners联合领投，穆巴达拉资本参投。距上次融资仅10个月，估值从100亿美元翻三倍。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30838"}, {"n": 12, "section": "模型与产品", "title": "全球AI集体大罢工：海外多款主力大模型突发瘫痪超3小时，国内大模型淡定在线", "summary": "9月3日美东时间上午9点23分左右，ChatGPT、Claude、Grok、谷歌Gemini、微软Copilot等海外主流AI服务集体宕机，持续约3小时40分钟，给海外用户办公与技术调用造成困扰。与海外集体掉线形成鲜明对比，国内AI大模型同一时间未出现类似故障。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30837"}, {"n": 13, "section": "科技要闻", "title": "两家美国媒体起诉 OpenAI 和微软，指控其 AI 训练侵犯版权", "summary": "IT之家 9 月 5 日消息，据路透社报道，《西雅图时报》与《新闻日报》于本周五（9 月 4 日）正式起诉 OpenAI 与微软。两家美国媒体指控 OpenAI 与微软未经授权擅自复制其新闻报道，用于训练旗下 AI。该诉讼已提交至美国纽约南区联邦地区法院。起诉书指出，OpenAI 和微软抓取了两家媒体的网站内容，其中包含付费墙背后的专属内容；随后，这些文章被直接整合入训练数据集，用于训练和驱动 ChatGPT、微软 Copilot 以及必应的 AI 检索等功能。两家媒体表示，涉案公司的 AI 产品不仅能完整复现报道中的原文段落，还能进行高度雷同的文本改写，并直接为用户提供综合答案。这极大削弱了", "source": "IT之家", "url": "https://www.ithome.com/0/998/805.htm"}, {"n": 14, "section": "科技要闻", "title": "奥尔特曼自曝是“超级果粉”，为苹果起诉 OpenAI 而感到难过", "summary": "IT之家 9 月 5 日消息，据《商业内幕》今天（5 日）报道，OpenAI CEO 萨姆 · 奥尔特曼一直是苹果的超级拥趸，但苹果起诉 OpenAI，让他的这份喜爱受到了“一次考验”。奥尔特曼在接受科技记者亚历克斯 · 希思采访时坦言：“我算是苹果的超级铁粉，所以这件事让我很难过。”今年 7 月，苹果对 OpenAI 提起诉讼，指控 OpenAI 为窃取苹果严密保护的商业秘密，在机构层面有组织地实施了一系列不当行为。OpenAI 否认对其他公司的商业秘密感兴趣，并称这起诉讼有负苹果“对最细微之处都反复推敲”的一贯声誉。奥尔特曼表示，自己最初听说苹果起诉 OpenAI 时，还以为肯定出了非常严", "source": "IT之家", "url": "https://www.ithome.com/0/998/790.htm"}, {"n": 15, "section": "模型与产品", "title": "OpenAI强力新模型 GPT-6一天攻破5道至今未解数学难题", "summary": "OpenAI正式推出品牌史上能力最强大模型GPT-6 Astra，官方将这款模型定义为全球智能水平最高、对齐效果最优的生成式AI模型。其训练工作在美国德州Stargate超算基地完成，动用超过10万张GPU完成预训练，也是OpenAI首次大规模使用前代模型参与监督训练的旗舰产品。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576556.htm"}, {"n": 16, "section": "模型与产品", "title": "GPT-6 Astra还没正式开放 大家怎么把庆功宴都办完了", "summary": "GPT-6 还没正式开放，怎么全网已经替它把庆功宴都办完了？这场面虽然有点夸张，但这香槟可能还真开对了。4 号凌晨，在经历了服务器爆炸，熬夜等待三小时之后，OpenAI 终于发布了被他们寄予厚望的最新模型：GPT-6 Astra。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576550.htm"}, {"n": 17, "section": "科技要闻", "title": "互联网最古老的恐惧 被AI复活了", "summary": "2006 年底，一只熊猫毁了数百万人的电脑。那只熊猫手捧三支香，面带微笑，出现在每一个被感染文件的图标上。「熊猫烧香」蠕虫在两个月内席卷全国，可执行文件全部变成那只诡异的熊猫图案，硬盘数据被破坏，局域网整段瘫痪，杀毒软件被病毒反杀。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576544.htm"}, {"n": 18, "section": "科技要闻", "title": "曾被黑客用于攻破人工智能系统的“ASCII走私”隐身术 正被垃圾邮件制造者大肆利用", "summary": "一项最初在人工智能越狱与提示词注入攻击中名噪一时的隐匿技术——“ASCII走私”（ASCII Smuggling），如今被大规模滥用于垃圾邮件与网络钓鱼活动。微软安全研究团队披露，网络攻击者正借由这一手段绕过主流电子邮件网关与反垃圾邮件系统，向数以百万计的邮箱投递诈骗信息。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576534.htm"}, {"n": 19, "section": "模型与产品", "title": "微软反驳侵权指控：Copilot极少复现《纽约时报》及作家著作内容", "summary": "在应对由新闻出版商及图书作家发起的联合版权侵权诉讼中，微软公司向法庭提交了最新辩护材料，坚称其人工智能聊天机器人 Copilot 几乎从不逐字复制或实质性复现《纽约时报》等媒体的报道及受版权保护的文学作品。这一表态旨在为微软与 OpenAI 构筑坚实的“合理使用”法律防线，并推动法庭尽早通过即决判决结束相关案件的审理。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576532.htm"}, {"n": 20, "section": "行业动态", "title": "NVIDIA DLSS 5未来将支持RTX 40系列 但玩家无法获得完整控制权限", "summary": "在DLSS 5正式上线仅数小时后，英伟达对这项备受争议的新一代AI渲染技术作出了重要调整。公司确认，虽然DLSS 5目前仍将优先面向GeForce RTX 50系列显卡推出，但未来也将正式支持上一代RTX 40系列产品，结束了外界此前对于该技术将永久限定于新硬件平台的猜测。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1576530.htm"}], "sections": [{"label": "科技要闻", "count": 8, "start": 0}, {"label": "行业动态", "count": 5, "start": 0}, {"label": "模型与产品", "count": 7, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#ff6b6b", "产品发布/更新": "#4dabf7", "行业动态": "#51cf66", "论文研究": "#ffd43b", "技巧与观点": "#b197fc"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#a29bfe';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晚报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
