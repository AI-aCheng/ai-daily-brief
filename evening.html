.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}

.empty{color:var(--muted);font-size:15px;padding:60px 0}

": "https://news.aibase.com/zh/news/30573"}, {"n": 8, "section": "模型与产品", "title": "小米发布玄戒O3/O100/D100三款自研AI芯片，搭建人车家全生态算力底座", "summary": "小米发布首颗端侧大模型AI加速芯片玄戒O100，采用6nm晶圆级垂直堆叠与混合键合工艺，键合间距1.4微米，带宽达1.22TB/s，较传统旗舰手机提升16倍，端侧推理速度最高330TPS，显著增强端侧大模型吞吐与推理能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30572"}, {"n": 9, "section": "行业动态", "title": "“AI行业GitHub”寻求出售，Hugging Face估值或超130亿美元", "summary": "8月24日，据美国《商业内幕》报道，全球最大AI开源社区Hugging Face正考虑整体出售，潜在交易估值或达130亿美元以上。公司正与银行合作评估潜在竞标者意向，但尚未达成交易。Hugging Face成立于2016年，由克莱芒·德朗格、朱利安·肖蒙和托马斯·沃尔夫创立，总部位于纽约，公开模型数量已接近300万个。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30571"}, {"n": 10, "section": "模型与产品", "title": "韶音OpenFit 2 AI耳机震撼首发：融合千问大模型， 48 小时超长续航定义智能音频新体验", "summary": "韶音OpenFit2 AI耳机今日开售，首发价1398元。该产品延续开放式声学优势，深度融合千问AI大模型，主打舒适佩戴与智能交互，单只耳机约9克，标志开放式耳机进入大模型时代。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30570"}, {"n": 11, "section": "模型与产品", "title": "2026CSDI：AGI前夜，属于懂Agent、更懂模型的长期深耕企业", "summary": "WAIC2026上，大模型与生成式AI参展主体共130家，其中83家主打AI Agent或智能应用，基础大模型企业仅18家。行业模型发布减少、Agent演示增多，焦点从“模型多聪明”转向“创造多少真实价值”。AI竞争基本单位正从单一模型转向整套体系，进入系统与组织能力比拼阶段。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30569"}, {"n": 12, "section": "模型与产品", "title": "阿里达摩院肝癌AI模型登上《自然·医学》：两个月揪出 15 例漏诊肿瘤", "summary": "阿里达摩院联合盛京医院等研发的肝癌AI模型DAMO LiON登上《自然·医学》。该模型通过增强CT识别微小肝脏癌变，擅长发现肝转移。真实世界前瞻试验辅助阅片超1万名患者，发现15例原本漏诊的恶性肿瘤，病灶多仅约1厘米。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30568"}, {"n": 13, "section": "科技要闻", "title": "何小鹏：不远的将来，会努力将第一个高阶人形机器人带入真正的现实", "summary": "IT之家 8 月 24 日消息，小鹏官宣机器人业务首轮融资超 9 亿美元后，小鹏集团董事长、CEO 何小鹏发文称：感谢所有投资人、鹏友和同学们的信任和支持不远的将来，小鹏会努力将第一个高阶人形机器人带入到真正的现实，TA 会和市面上所有看到的机器人都不一样。更拟人，更安全，不用遥控器，可自然交互，有自己的记忆，真正创造价值，不是演示而是真正量产，走到现实。据悉，此轮融资刷新中国具身智能行业单轮私募股权融资纪录。小鹏 IRON 计划在 2026 年底进入量产阶段，从小鹏的门店和园区开始落地商业场景应用，并于 2027 年面向中国及海外市场正式上市和交付。相关阅读：《刷新中国机器人私募融资纪录：小", "source": "IT之家", "url": "https://www.ithome.com/0/993/681.htm"}, {"n": 14, "section": "行业动态", "title": "刷新中国机器人私募融资纪录：小鹏机器人业务完成首轮超 9 亿美元融资，IRON 计划年底进入量产阶段", "summary": "IT之家 8 月 24 日消息，小鹏汽车今日宣布，小鹏机器人业务完成首轮超 9 亿美元（IT之家注：现汇率约合 60.56 亿元人民币）融资，投后估值超 63 亿美元（现汇率约合 423.93 亿元人民币），刷新中国具身智能行业单轮私募股权融资纪录。官方透露，本轮融资由 IDG 资本领投，高榕创投参投，同时获得腾讯和阿里巴巴两家战略投资者的支持；小鹏集团继续控股机器人业务。募集资金主要用于小鹏机器人业务的软硬件研发、物理 AI 模型训练迭代、高质量数据采集、全链条量产基地建设及全球商业化拓展。IT之家获悉，小鹏 IRON 计划在 2026 年底进入量产阶段，从小鹏的门店和园区开始落地商业场景应", "source": "IT之家", "url": "https://www.ithome.com/0/993/649.htm"}, {"n": 15, "section": "行业动态", "title": "AI基础设施持续投入 2027年内存收入将突破1万亿美元", "summary": "商业与技术洞察公司Gartner预测，2026年全球半导体收入将达到1.6万亿美元，较2025年的8090亿美元增长92%；2027年预计进一步增至1.9万亿美元。Gartner研究总监Ben Lee表示，AI基础设施持续投入叠加内存涨价周期，共同推动行业进入本质上全新的增长阶段。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574724.htm"}, {"n": 16, "section": "模型与产品", "title": "萨博展示A3-001超音速“忠诚僚机”自主战斗机概念全尺寸模型", "summary": "萨博在瑞典林雪平马尔门空军基地举办的瑞典武装部队周年航空展上，展示了公司A3-001超音速“忠诚僚机”自主战斗机概念的全尺寸模型，展示了斯堪的纳维亚军事航空的未来。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574722.htm"}, {"n": 17, "section": "科技要闻", "title": "雅虎借AI重塑品牌 欲以“互联网OG”身份吸引Z世代", "summary": "雅虎首席执行官吉姆·兰佐恩表示，作为互联网早期先驱，雅虎的品牌认知度在信任度下滑的当下正成为独特优势，公司正凭借这一“复古”标签吸引Z世代年轻用户，同时通过推出自研AI工具和消费产品谋求增长。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574716.htm"}, {"n": 18, "section": "行业动态", "title": "美国与欧洲之间 由AI驱动的投资差距持续扩大", "summary": "多项预测数据显示，自疫情结束后的六年里，美国商业投资增速有望达到欧洲的三倍以上，凸显两大经济体之间由人工智能催生的差距正在不断拉大。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574714.htm"}, {"n": 19, "section": "模型与产品", "title": "阿里巴巴达摩院推出肝癌AI模型：可识别1厘米微小肿瘤", "summary": "8月24日，阿里巴巴达摩院联合中国医科大学附属盛京医院等机构研发出肝癌诊断AI模型“DAMO LiON”，可通过CT影像识别微小的肝脏癌变病灶。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1574706.htm"}, {"n": 20, "section": "科技要闻", "title": "阿里达摩院肝癌AI两个月发现15例漏诊", "summary": "阿里巴巴达摩院联合中国医科大学附属盛京医院等机构研发出肝癌诊断AI模型DAMO LiON，可通过CT影像识别微小的肝脏癌变病灶。在两个月的真实世界前瞻临床试验中，该AI模型发现了15例原本被遗漏的恶性肿瘤，绝大部分为1厘米左右的病灶，帮助患者得到及时的手术或药物治疗。相关论文登上国际顶级学术期刊《自然·医学》（Nature Medicine）。", "source": "cnBeta", "url": "https://www.cnbeta.com. dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
