<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 晚报</title>
<style>
:root{
  --bg:#0f1117; --card:#1a1d29; --ink:#e8e8ef; --accent:#a29bfe;
  --line:#2d2f3e; --muted:#6b6d7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,#1a1530 0%,#0f1117 55%,#0c1230 100%)}
.brand{font-size:22px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(90deg,#ffffff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin-top:7px;font-size:12.5px;color:var(--accent);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--accent)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--accent);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#161927;transition:.2s}
.chip b{font-weight:600;margin-left:3px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 14px 40px rgba(0,0,0,.55);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#2a2d3e;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px;color:#f1f1f5}
.src{margin-top:16px;font-size:13px;color:var(--accent);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#b6b8c4}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--accent);
  text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#161927;color:var(--accent);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--accent);color:#0f1117;border-color:var(--accent)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#161927;color:var(--accent)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--accent);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--accent);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:#cdcfe0;
  padding:9px;background:#232636;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AI 晚报</div>
  <div class="sub">今日 AI 复盘</div>
  <div class="meta"><b id="dateHuman"></b> · 共 <b id="totalCount">0</b> 条</div>
  <div class="chips" id="chips"></div>
</header>

<main class="stage">
  <button class="nav-btn" id="prev" aria-label="上一张">&#8249;</button>
  <div class="card-wrap" id="cardWrap"></div>
  <button class="nav-btn" id="next" aria-label="下一张">&#8250;</button>
</main>

<footer class="bar">
  <div class="progress" id="progress"></div>
  <div class="dots" id="dots"></div>
  <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:1px;">📌 关注公众号「AI阿程Harness实录」<br><span style="font-weight:400;font-size:12px;letter-spacing:.5px;color:#8a8f98;">每日自动更新 · 今日 AI 复盘</span></div>
</footer>

<script>
const DATA = {"date": "2026-08-13", "generatedAt": "2026-08-13T00:00:25.517Z", "items": [{"n": 1, "section": "模型发布/更新", "title": "xAI 发布 Grok 4.6，强化长时运行智能体能力", "summary": "xAI 今日发布 Grok 4.6，在 Grok 4.5 基础上重点强化长时运行智能体及更复杂的交互式与视觉工作能力。该模型在多项智能体编码与知识工作基准上达到前沿水平，在 Artificial Analysis Intelligence Index（九项基准综合分）上追平 GPT-5.6 Sol。", "source": "xAI：News（网页）", "url": "https://x.ai/news/grok-4-6"}, {"n": 2, "section": "模型发布/更新", "title": "阿里开放 Qwen3.8-2.4T-A95B 模型权重：2.4T MoE、激活 95B、原生 256K 上下文", "summary": "阿里 Qwen 团队正式开放 Qwen3.8-2.4T-A95B 模型权重，这是 Qwen-Max 级别模型首次开源。模型总参数 2.4T，每个 Token 激活 95B，原生支持 262,144 Token 上下文并可扩展至 1,010,000 Token。", "source": "IT之家（RSS）", "url": "https://www.ithome.com/0/989/001.htm"}, {"n": 3, "section": "模型发布/更新", "title": "LTX-2.5 模型登场：AI 生成 10 秒 720P 视频仅需 6.8 秒，原生集成 ComfyUI", "summary": "LTX 推出 LTX-2.5 模型，原生集成 ComfyUI，在 2 张英伟达 GB200 配置下生成 10 秒 720P 视频仅需 6.8 秒。LTX-2.5 Fast 以每秒 0.09 美元生成带音频 720p 视频，10 秒片段成本 0.90 美元；年度经常性收入低于 1,000 万美元的组织可免费使用。", "source": "IT之家（RSS）", "url": "https://www.ithome.com/0/988/766.htm"}, {"n": 4, "section": "模型发布/更新", "title": "微软首发自研推理模型MAI-Thinking-1", "summary": "我们的首个推理模型 MAI-Thinking-1 从零开始构建，现已在 Microsoft Foundry 上线。为团队点赞！更多详情如下。", "source": "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)", "url": "https://x.com/mustafasuleyman/status/2087570047967408396"}, {"n": 5, "section": "产品发布/更新", "title": "OpenRouter 推出实时网页搜索基准测试：如何为智能体选择引擎、深度与模型", "summary": "OpenRouter 发布实时排行榜，系统评测模型、搜索引擎、搜索方法与预算四类配置组合。数据显示，将搜索预算从 1 轮增至 25 轮可使 BrowseComp 得分近乎翻倍，成本仅增 2.5-7 倍；模型选择比引擎更重要，平均分差 15 分 vs 10 分。失败率高的任务应降低搜索深度以控制成本。", "source": "OpenRouter：Announcements（RSS）", "url": "https://openrouter.ai/blog/announcements/web-search-benchmark"}, {"n": 6, "section": "产品发布/更新", "title": "Claude in Chrome 侧边栏升级为 Claude Cowork 会话", "summary": "Claude in Chrome 浏览器扩展的侧边栏现已升级为 Claude Cowork 会话，对话会保存至历史记录，技能和连接器可在浏览器中工作，且任务可在桌面、网页和移动端应用间无缝切换。", "source": "Claude：Blog（网页）", "url": "https://claude.com/blog/cowork-chrome-side-panel"}, {"n": 7, "section": "产品发布/更新", "title": "SGLang 与 Miles 为 Qwen3.8-2.4T-A95B 提供 Day-0 支持", "summary": "SGLang 与 Miles 在发布首日即支持 Qwen3.8-2.4T-A95B，这是 Qwen 最大的开源模型，总参数 2.4T，每 token 激活 95B，采用混合注意力架构。", "source": "LMSYS：Blog（Chatbot Arena 团队）", "url": "https://www.lmsys.org/blog/2026-08-12-qwen3-8-day0-support"}, {"n": 8, "section": "产品发布/更新", "title": "WhatsApp 如何用端到端加密与可验证性构建 Scam Alert 诈骗提醒功能", "summary": "WhatsApp 推出可选功能 Scam Alert，通过端到端加密保护下在设备端运行机器学习模型，识别潜在诈骗消息，且消息内容不会离开设备或自动上报。该功能遵循仅设备端处理、无自动上报、用户控制三大原则，模型权重公开供独立验证，遥测数据经差分隐私聚合处理。目前已在 Beta 版有限推出，并邀请安全研究社区参与测试。", "source": "Meta Engineering Blog（RSS）", "url": "https://engineering.fb.com/2026/08/12/security/how-were-building-scam-alert-whatsapp"}, {"n": 9, "section": "产品发布/更新", "title": "Claude Code v2.1.229 发布：新增远程会话恢复、插件市场命令源及多项修复", "summary": "Claude Code v2.1.229 发布，新增远程控制会话恢复、自托管 runner 的服务器端 hook 支持，以及插件市场命令源。修复了长响应流式输出丢失、窄终端渲染崩溃、Windows 扩展路径崩溃等问题。改进工作流扇出以复用缓存提示前缀，并调整 /commit-push-pr 对危险 git/gh 命令不再自动批准。", "source": "Claude Code：GitHub Releases（RSS）", "url": "https://github.com/anthropics/claude-code/releases/tag/v2.1.229"}, {"n": 10, "section": "行业动态", "title": "Research Gold 号称“100%人类撰写、绝不使用AI”，实则全程由AI驱动", "summary": "面向医学研究者的网站 Research Gold 宣称其服务“100%由人类撰写、绝不使用AI”，并列出多名博士审稿人。但调查发现，这些审稿人系AI生成、并不存在；部分真实方法学家的身份和照片未经许可被挪用。致电该公司时，自称“Sarah”的AI助手坚称自己是真人，邮件与聊天回复也均为AI生成。", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "url": "https://www.404media.co/company-offering-100-human-written-never-ai-peer-review-is-entirely-ai"}, {"n": 11, "section": "行业动态", "title": "RingCentral 如何用 ChatGPT Work 和 Codex 构建 AI 原生工作流", "summary": "RingCentral 通过全员发放 ChatGPT Work 和 Codex，推动从工程到运营的 AI 原生开发，其 AI-Native Challenge 让数千名员工（含非技术人员）交付了可运行项目。", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "url": "https://openai.com/index/ringcentral"}, {"n": 12, "section": "论文研究", "title": "空货架还是丢钥匙？Google 研究：Recall 是参数化事实性的瓶颈", "summary": "Google Research 提出知识画像框架，发现前沿 LLM（如 Gemini3、GPT-5）的事实编码接近饱和，但回忆（recall）能力不足，多数事实错误源于“丢钥匙”而非“空货架”。该框架将事实分为编码失败、回忆失败等五类画像，并配套推出 WikiProfile 基准，含 2,150 条维基百科事实，每条配 10 个问题，用于分别探测编码、回忆与识别能力。", "source": "Google Research：Blog（网页）", "url": "https://research.google/blog/empty-shelves-or-lost-keys-recall-is-the-bottleneck-for-parametric-factuality"}, {"n": 13, "section": "论文研究", "title": "Anthropic 联合独立研究者发布工人再培训项目证据综述", "summary": "Anthropic 与独立研究者 David Roodman 合作发布报告，基于 56 项美国随机研究和欧洲实验证据，评估工人再培训项目应对 AI 劳动力市场冲击的效果。", "source": "Anthropic：Research（发表成果 · 网页）", "url": "https://www.anthropic.com/research/reviewing-the-evidence-on-worker-retraining-programs"}, {"n": 14, "section": "技巧与观点", "title": "零基础用户半天上手AI的12步实操流程", "summary": "文章给出一套零基础用户半天上手AI的12步实操流程：准备内存不低于16G的电脑，订阅ChatGPT并安装Codex或使用WorkBuddy，用语音输入法以【背景、痛点、需求】框架向AI交代任务，经苏格拉底提问澄清需求后投喂文件让AI直接完成，最后沉淀为可复用Skill。文中建议Codex选GPT-5.6 Sol最高模型，WorkBuddy选Kimi K3。", "source": "公众号：数字生命卡兹克", "url": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685084&idx=1&sn=0899296dbc140eeb745f7a99f9d5ed9c"}, {"n": 15, "section": "技巧与观点", "title": "DeepSeek V4 Pro与Grok 4.6同日发布，双双逼近Claude Fable 5体验", "summary": "DeepSeek V4 Pro正式版与Grok 4.6在2小时内先后发布，均为1.6T/1.5T参数模型，逼近Claude Fable 5体验。", "source": "公众号：数字生命卡兹克", "url": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685175&idx=1&sn=64c383b5b757945397894270c5f38301"}, {"n": 16, "section": "技巧与观点", "title": "AutoGPT 如何用 AGENTS.md 和技能门控管理 AI 生成的拉取请求", "summary": "AutoGPT 维护者发现，AI 智能体不会主动阅读文档，因此将指令放在 AGENTS.md 和技能文件中，并置于代码目录旁。他们通过强制 PR 模板、测试计划、CI 覆盖率门槛和 CLA 签名等门控机制，将智能体提交的 PR 从“不可用”转变为“可用但不符合路线图”。其中 CLA 签名因需浏览器和 OAuth 流程，被用作区分人类与智能体的“人类探测器”。", "source": "GitHub Blog", "url": "https://github.blog/open-source/maintainers/your-contributors-are-ai-first-now-is-your-project"}, {"n": 17, "section": "技巧与观点", "title": "我写了一本 AI 教科书——AI 还要多久才能写得更好？", "summary": "作者在完成一本 RLHF 教科书后反思，LLM 在长文非虚构写作上进展停滞，GPT 4.5 和 Kimi K2 等写作强模型已显老旧，而编码、数学等任务已接近超人水平。模型能改错字、做编辑，但组织整章内容时仍混乱且易出错，作者认为这阻碍了模型自主解决开放科学问题。", "source": "Nathan Lambert：Interconnects（RSS）", "url": "https://www.interconnects.ai/p/i-wrote-an-ai-textbook-how-long-until"}, {"n": 18, "section": "技巧与观点", "title": "OpenRouter 工具调用指南：一次编写循环，切换模型字符串即可跨模型运行", "summary": "OpenRouter 发布工具调用指南，展示如何用同一套代码在 Claude、GPT 和开源权重模型间切换，仅需更改模型字符串。指南涵盖定义工具、发送请求、读取 tool_calls 响应、执行函数并返回结果的完整循环，支持 OpenAI 兼容的 JSON schema，并提供 cURL、Python 和 JavaScript/TypeScript 示例。", "source": "OpenRouter：Announcements（RSS）", "url": "https://openrouter.ai/blog/tutorials/tool-calling"}, {"n": 19, "section": "技巧与观点", "title": "LangChain 详解：什么是 AI 智能体？", "summary": "AI 智能体是在大语言模型循环中自主运行的系统，通过反复调用模型、观察结果并调整下一步行动来完成复杂任务。工作流（workflow）则是对固定步骤的预编排，两者互补：工作流保证确定性，智能体提供灵活性。理解二者差异是构建可靠、可投入生产的自主系统的关键。", "source": "LangChain：Blog（RSS）", "url": "https://www.langchain.com/blog/what-is-an-agent"}, {"n": 20, "section": "技巧与观点", "title": "OpenAI 研究：企业如何用 ChatGPT 和 Codex 落地智能体 AI", "summary": "OpenAI 研究揭示企业采用智能体 AI 的方式，以及前沿企业如何在 AI 应用上拉开差距。企业正通过 ChatGPT 和 Codex 将 AI 从辅助转向执行，头部公司已率先将智能体投入实际业务流程。", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "url": "https://openai.com/index/how-enterprises-put-ai-to-work"}], "sections": [{"label": "模型发布/更新", "count": 4, "start": 1}, {"label": "产品发布/更新", "count": 5, "start": 5}, {"label": "行业动态", "count": 2, "start": 10}, {"label": "论文研究", "count": 2, "start": 12}, {"label": "技巧与观点", "count": 7, "start": 14}]};
const SECTION_COLORS = {"模型发布/更新": "#ff6b6b", "产品发布/更新": "#4dabf7", "行业动态": "#51cf66", "论文研究": "#ffd43b", "技巧与观点": "#b197fc"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function colorOf(sec){return SECTION_COLORS[sec]||'#a29bfe';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晚报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(it.n).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
