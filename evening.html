*{box-sizing:border-box;margin:0;padding:0}

.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}

背后是三重协作范式转移。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30691"}, {"n": 8, "section": "模型与产品", "title": "Midjourney V8.2重磅上线图像编辑模型，全功能支持指令微调与画布扩展", "summary": "Midjourney近日开放测试首款V8.2图像编辑模型，打破仅靠文本生成图像的单一模式，深度融合指令微调、多图参考、局部重绘等功能，为创作者提供更精准、可控的专业级视觉创作体验。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30690"}, {"n": 9, "section": "模型与产品", "title": "小鹏第二代VLA大模型迎来首次重大升级，综合安全能力暴增20倍", "summary": "8月27日，小鹏举办“TIME 时间”物理AI分享会，第二代VLA大模型首次重大升级，XOS6.3.0将在小鹏G9L全球首发。升级核心是让AI理解时间，从静态3D空间理解跃升至动态4D时空理解，并扩大端侧模型参数量，持续验证自动驾驶Scaling Law。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30689"}, {"n": 10, "section": "模型与产品", "title": "量子技术与AI迎来深度融合！国内首个“玄幂”量子增强大模型正式发布", "summary": "国光量超人工智能团队将前沿量子技术引入大语言模型决策与推理核心，推出面向科研学术领域的“玄幂”大模型家族。该模型在科研科普、任务路由、智能体决策等垂直任务中展现独特竞争优势，助力大语言模型突破纯经典计算物理边界。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30688"}, {"n": 11, "section": "模型与产品", "title": "谷歌升级搜索 AI 模式:支持300多家平台机票追踪与酒店预订", "summary": "谷歌8月27日升级AI模式，新增航班价格追踪、酒店预订辅助及积分/里程价格查看等功能，用户输入出行时间与目的地即可整合信息。此举推动AI模式从信息检索转向旅行规划与交易履行，加速打造全流程AI旅行代理。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30687"}, {"n": 12, "section": "科技要闻", "title": "OpenAI携手苹果前高管硬刚老东家，申请永久终止商业机密案", "summary": "8月27日，OpenAI及苹果前高管唐坦、刘畅与Jony Ive创办的io Products向法院请愿，要求“带偏见地驳回”苹果提起的商业秘密窃取诉讼，以彻底阻止其再诉。此举显示科技巨头与生成式AI新锐在顶尖人才流动和核心技术产权上的法律博弈升级，案件源于数周前苹果的诉讼。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/30686"}, {"n": 13, "section": "行业动态", "title": "华硕成立物理 AI 事业群，人形机器人计划 9 月上路", "summary": "IT之家 8 月 28 日消息，据中国台湾地区媒体《经济日报》今天报道，华硕近日正式成立物理 AI（Physical AI）事业群，抢占机器人商机。与此同时，该公司 AIOT 物联网事业群将启动新变革，9 月 1 日起重组更名为“物理 AI 解决方案事业群”（IT之家注：PAS BG）。据报道，华硕本次组织调整，是为了践行董事长施崇棠 2024 年推出的 All in AI 战略，旨在将华硕转型为最全面的 AI 公司。华硕共同执行长许先越和胡书宾今日在内部信中指出，随着 AI 迈向真实世界系统，华硕正迈出重要一步，希望在下一波创新浪潮中保持领先地位。据悉，PAS BG 将由张权德、许佑嘉共同领", "source": "IT之家", "url": "https://www.ithome.com/0/995/763.htm"}, {"n": 14, "section": "模型与产品", "title": "丹麦政府推出紧急方案引导学生合理使用 AI，遏制“AI 作弊”行为", "summary": "IT之家 8 月 28 日消息，据 CCTV 国际时讯报道，在今年夏天的考试季，丹麦多所高中 AI 作弊案例明显增多。随着生成式人工智能（AI）进入校园，学生利用 AI 完成作业甚至在考试中作弊的问题，给传统教育和考试制度带来新挑战。为此，丹麦政府日前推出紧急方案，通过增加口头答辩、监控学生考试电脑屏幕等方式，遏制 AI 作弊。根据方案，每年约有 9000 名学生除了完成专业书面作业外，还将增加口头答辩。同时政府还呼吁在笔试期间对学生电脑屏幕进行监控，通过网络过滤限制访问未经允许的内容。此外，政府还鼓励学生在校内受控环境下完成书面作业。虽然 AI 用于“作弊”给学校带来了挑战，但是不管是学校本", "source": "IT之家", "url": "https://www.ithome.com/0/995/684.htm"}, {"n": 15, "section": "行业动态", "title": "特朗普政府设立新型 AI监管机构的行政令陷入停滞", "summary": "据两名看过草案的知情人士透露，特朗普政府近几周在内部传阅一份行政令草案，提议为顶尖大模型 AI 企业设立一家行业自律监管组织。起草这份行政令，是朝着落地该监管机构迈出的重要一步，但项目仍面临重大阻碍。这份行政令想要定稿，还需要包括总统在内的一众高级官员的认可；另外三名知情人士表示，近期相关推进工作已经陷入停滞。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575402.htm"}, {"n": 16, "section": "模型与产品", "title": "听了Claude一句话5000万美元没转出去 真有这么神？", "summary": "昨晚有个帖子传得挺广：面对一笔5000万美元的转账，有人去问了Claude，Claude说不要转。钱最终没有转出去。按他的说法，Claude替他省下了5000万美元。不过从他的叙述看，他在问Claude之前就已经不想转。AI没替他做决定，只是给他本来的想法加了个台阶。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575394.htm"}, {"n": 17, "section": "模型与产品", "title": "大模型“吃”了全网的语料 “合理使用”与侵权的边界如何划清？", "summary": "当大模型厂商竞相为千亿算力基建烧钱时，一颗更为隐秘的“版权暗雷”正在逼近。8月中旬，苹果拟付数亿美元采购新闻语料的消息传出，一时激起内容行业千层浪。近两年，围绕AI训练语料的版权诉讼已在全球蔓延。新闻界，《纽约时报》起诉OpenAI和微软公司，指控两家企业未经授权使用数以百万计文章训练ChatGPT等大模型。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575380.htm"}, {"n": 18, "section": "科技要闻", "title": "微博通报：孙宇晨谷爱凌聊天记录系AI，造谣账号已关闭", "summary": "8月28日，微博社区观察员官方账号“围脖侠”发表处置通报，网传的孙宇晨和谷爱凌的相关聊天记录属于不实谣言，系违规用户通过AI工具等方式炮制的虚假息和低俗内容，目前该账号已受到关闭账号的处置。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575378.htm"}, {"n": 19, "section": "科技要闻", "title": "AI时代真人脸更值钱 一银行职员3天卖脸7次赚2500元", "summary": "近日，一位在银行上班的年轻人在人脸交易平台上“挂牌”了自己的肖像，而短短3天内，他的脸被广告公司买走7次，收入近2500元。随着AI短剧与广告爆发，一个名为新爪的人脸授权平台将目光瞄准了这片蓝海，把真人的脸，变成明码标价的数字资产进行撮合分账。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575374.htm"}, {"n": 20, "section": "行业动态", "title": "OpenAI、微软、Anthropic等逾百家企业呼吁紧急强化网络防御", "summary": "随着人工智能模型在网络安全任务上的能力迅速提升，科技行业领袖警告称，网络防御人员为应对下一代网络威胁所剩的准备时间已十分有限。OpenAI近期推出的GPT-5.6-Cyber，在漏洞利用链、身份验证绕过和权限提升等高级网络安全请求中完成率达到95%。该公司此前还透露，即将推出的Astra模型将具备更强的网络安全能力。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1575370.htm"}], "sections": [{"label": "模型与产品", "count": 13, "start": 0}, {"label": "科技要闻", "count": 4, "start": 0}, {"label": "行业动态", "count": 3, "start": 0}], "_src": "中文聚合"};

chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
</script>
