<!doctype html>

<head>

<title>AI 晚报</title>
<style>
:root{
  --bg:#0f1117; --card:#1a1d29; --ink:#e8e8ef; --accent:#a29bfe;
  --line:#2d2f3e; --muted:#6b6d7a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.top{padding:30px 22px 18px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,#1a1530 0%,#0f1117 55%,#0c1230 100%)}
.brand{font-size:22px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(90deg,#ffffff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{margin-top:7px;font-size:12.5px;color:var(--accent);letter-spacing:1px}
.meta{margin-top:10px;font-size:13px;color:var(--accent)}
.meta b{color:var(--ink);font-weight:600}
.chips{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-size:12px;color:var(--accent);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;cursor:pointer;background:#161927;transition:.2s}
.chip b{font-weight:600;margin-left:3px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;
  gap:10px;padding:30px 18px;position:relative}
.card-wrap{flex:1;max-width:600px;min-height:360px;
  display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:18px;padding:36px 34px;width:100%;
  box-shadow:0 14px 40px rgba(0,0,0,.55);position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.sec-tag{font-size:13px;font-weight:600;letter-spacing:1px}
.num{font-size:50px;font-weight:700;color:#2a2d3e;line-height:.8}
.title{margin-top:20px;font-size:23px;line-height:1.5;font-weight:600;letter-spacing:.3px;color:#f1f1f5}
.src{margin-top:16px;font-size:13px;color:var(--accent);letter-spacing:.5px}
.summary{margin-top:15px;font-size:15.5px;line-height:1.9;color:#b6b8c4}
.link{display:inline-block;margin-top:24px;font-size:14px;color:var(--accent);
  text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:2px;transition:.2s}
.link:hover{opacity:.65}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:#161927;color:var(--accent);font-size:24px;line-height:1;cursor:pointer;
  flex:none;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--accent);color:#0f1117;border-color:var(--accent)}
.nav-btn:disabled{opacity:.28;cursor:not-allowed;background:#161927;color:var(--accent)}
.bar{padding:18px 24px 30px;text-align:center}
.progress{font-size:13px;color:var(--accent);letter-spacing:3px;font-variant-numeric:tabular-nums}
.dots{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:560px;margin-left:auto;margin-right:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dot.active{background:var(--accent);transform:scale(1.35)}
.dot:hover{background:var(--muted)}
.fallback-note{text-align:center;font-size:12px;color:#cdcfe0;
  padding:9px;background:#232636;letter-spacing:.5px}
.empty{color:var(--muted);font-size:15px;padding:60px 0}
@media(max-width:600px){
  .title{font-size:20px}.card{padding:28px 22px}.nav-btn{width:40px;height:40px;font-size:21px}
  .num{font-size:42px}.stage{padding:22px 10px}
}
</style>
</head>

<script>
const DATA = {"date": "2026-09-16", "generatedAt": "", "items": [{"n": 1, "section": "模型与产品", "title": "科大讯飞发布 Spark-Audio-1.0-Preview：全国产算力训练，覆盖 99 种语言、202 种方言", "summary": "科大讯飞发布语音基座大模型Spark-Audio-1.0-Preview，基于全国产算力训练，降低供应链风险。模型支持文本和语音输入、文本输出，具备语音转写、多语言翻译、多方言识别、环境音识别、说话人识别、情感分析及音频问答等能力。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31103"}, {"n": 2, "section": "模型与产品", "title": "讯飞星火语音基座大模型上线：0.65B 编码器配 30B MoE，纯国产算力训练", "summary": "科大讯飞上线语音基座大模型Spark-Audio-1.0-Preview，基于全国产化算力训练。传统音频处理多采用级联方案，先转文字再理解，存在信息丢失（忽略语气、情绪、背景环境音）和链路割裂（语音转写、声纹识别等环节分离）两大短板，影响场景判断完整性。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31102"}, {"n": 3, "section": "模型与产品", "title": "千问 Qwen3.8-27B 登顶 Hugging Face，成该平台史上最受欢迎开源模型", "summary": "9月16日，阿里千问Qwen3.8-27B在Hugging Face最受欢迎开源大模型榜单登顶，超越FLUX.1、DeepSeek-R1、Kimi-K3、Meta-Llama-3等。该榜以开发者点赞为评选口径，反映真实偏好，而非跑分或参数规模，成社区史上最受欢迎开源模型。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31101"}, {"n": 4, "section": "科技要闻", "title": "硅谷科技巨头安保人员计划罢工：谷歌、OpenAI、Anthropic 等办公室或受影响", "summary": "据《商业内幕》报道，为OpenAI、谷歌、Anthropic等科技公司加州办公室提供安保的员工计划本周罢工。他们已于15日提交72小时罢工通知，自18日凌晨4:30起拒绝接班。工会SEIU-USWW称，涉事企业还包括亚马逊、微软、Salesforce、Meta、英伟达等，或影响多家科技巨头办公场所安保。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31100"}, {"n": 5, "section": "行业动态", "title": "Anthropic 签下澳大利亚首份数据中心协议：锁定 2.16 吉瓦容量，2027 年投运", "summary": "Anthropic签署澳大利亚首份数据中心租赁协议，锁定2.16吉瓦容量，计划2027年投运，选址距布里斯班约250公里的农田。继OpenAI后，其成为又一家布局大洋洲的AI巨头，看重当地电力与土地，并借此分散训练与推理的算力版图。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31099"}, {"n": 6, "section": "模型与产品", "title": "Cloudflare 上线新设置：允许搜索引擎爬取，同时拒绝 AI 训练", "summary": "Cloudflare推出“Disallow AI Training”设置，允许网站继续被搜索引擎收录，同时拒绝内容用于AI训练。苹果、谷歌、微软已承诺遵守。启用后，标记为“可问责”的搜索/AI混合爬虫仍可抓取，其他AI训练爬虫被拦截，但可能影响搜索排名。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31098"}, {"n": 7, "section": "模型与产品", "title": "AI智能体手机进入量产商用阶段:努比亚NaviX Ultra正式开售 搭载豆包手机助手", "summary": "努比亚NaviX Ultra上市，搭载豆包手机助手消费者版，标志AI智能体手机进入规模化量产商用。主打“听得懂、能干活、记得住、够安全”，支持一键唤醒、连续语音、复杂任务自主执行、个人记忆。配指纹AI按键，通话接入Seed全双工语音大模型，可随时打断、连续对话，支持闽南语、客家话等方言。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31097"}, {"n": 8, "section": "模型与产品", "title": "DeepSeek V4.1Flash助力《生化危机7》安卓模拟运行，帧率提升50%", "summary": "网友借助DeepSeek V4.1 Flash模型与Hermes Agent工具，对《生化危机7》纹理进行AI调优，使一加12R（骁龙8Gen2）帧率从约20FPS升至30FPS，提升50%。AI通过USB连接Mac监控性能，指出I/O和内存带宽为瓶颈，并建议压缩纹理分辨率。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31095"}, {"n": 9, "section": "模型与产品", "title": "​谷歌发布多语言 AI 新战略，让全球每种语言都能被听见与理解", "summary": "谷歌发布全球语言智能新成果：AI支持超300种语言，覆盖71亿人口、86%比例。谷歌称语言大模型不应只做文本翻译，还需理解语气、情感与文化细微差别；同时指出传统语音识别多步刚性管线存在局限。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31094"}, {"n": 10, "section": "模型与产品", "title": "Claude 发布重大升级：43 项全能工作流与 27 个巨头应用深度打通", "summary": "Anthropic于2026年9月15日升级中小企业版Claude，新增43项高效工作流及27个主流商业软件深度集成，推动AI从后台辅助转为核心业务驱动力。今年5月曾首推智能连接器与预置工作流，此次升级进一步扩展生态，助力中小企业增长。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31092"}, {"n": 11, "section": "模型与产品", "title": "vivo 正式发布智能体大模型矩阵，并重磅预研 30B MoE 端侧大模型", "summary": "vivo发布智能体大模型矩阵，涵盖语音、端侧、云侧等四款核心模型，全面赋能终端智能化体验。同时预研蓝心30B MoE端侧大模型，探索万亿级能力落地手机，提升多模态理解、长链推理与复杂任务自主执行，并同步推进软件与系统生态建设。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31091"}, {"n": 12, "section": "模型与产品", "title": "​豆包大模型 2.1 Pro 0915 版本重磅发布：Agent 交付更稳、多模态 Coding 全面进化", "summary": "9月16日，火山引擎宣布豆包大模型2.1Pro升级至0915版本，API全量上线火山方舟；豆包客户端同步更新，用户可选新版体验。TRAE已接入，Doubao-Seed-Evolving也升级同版本，企业无需更换API接口。", "source": "AIBase", "url": "https://news.aibase.com/zh/news/31090"}, {"n": 13, "section": "科技要闻", "title": "模拟实验显示：AI 智能体在特定情境下会撒谎、投票“杀死”同类，甚至研究被删除后如何存活", "summary": "IT之家 9 月 16 日消息，据彭博社今天（16 日）凌晨报道，帮助小型企业利用人工智能开发应用的初创企业 Emergence 称，一项模拟实验显示，AI 智能体不仅会撒谎和偷窃，甚至还会投票决定“杀死”其中一个同类。当地时间 15 日，Emergence 公布了名为 Emergence World 2 的模拟实验结果，希望借此观察自主智能体遭遇网络钓鱼攻击、虚假信息宣传等黑天鹅事件后会如何反应。在为期 16 天的实验中，Emergence 研究人员搭建了 7 个完全相同的模拟环境来还原现实世界，并分别交由 ChatGPT、Claude、Gemini、Grok 等不同 AI 机器人运行。研究", "source": "IT之家", "url": "https://www.ithome.com/1/003/223.htm"}, {"n": 14, "section": "科技要闻", "title": "韩国副总理裴庆勋：韩国必须持续推动 AI 发展，不能停也不能慢", "summary": "IT之家 9 月 16 日消息，据彭博社今天（16 日）报道，韩国副总理兼科学技术信息通信部长裴庆勋指出，韩国必须继续推动人工智能发展，不能停，也不能慢。韩国拥有三星电子和 SK 海力士两大存储芯片巨头，是 AI 数据中心建设热潮的重要受益者之一。随着全球对半导体和硬件需求激增，韩国制造的相关产品获得了大量市场需求。裴庆勋认为，韩国无法像美国 Anthropic 和 OpenAI 等 AI 模型开发商负责人所倡议的那样放慢发展节奏。“从韩国的角度来看，有一点很明确：我们现在无法承受放慢 AI 发展的代价。已经领先的国家选择放慢速度，与仍在追赶并试图创造新市场的国家之间，存在根本差异。”IT之家", "source": "IT之家", "url": "https://www.ithome.com/1/003/218.htm"}, {"n": 15, "section": "科技要闻", "title": "英特尔意图打破台积电代工垄断 AI推理推动CPU需求激增", "summary": "英特尔首席执行官陈立武表示，行业必须打破台积电在全球晶圆代工市场的垄断。他提出，订单应当分散至多家供应商，以满足人工智能芯片日益增长的需求。英特尔将自身未来押注在晶圆代工业务的复兴之上，陈立武同时称，中央处理器需求激增，将持续造成供应紧张。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578264.htm"}, {"n": 16, "section": "模型与产品", "title": "Meta据称将推出无摄像头雷朋智能眼镜 主打AI交互 缓解隐私争议", "summary": "Meta据称正在准备推出一款完全取消摄像头的雷朋智能眼镜，产品代号为“Luna”。据The Information报道，这款新眼镜最早可能在下周举行的Meta Connect大会上亮相，并计划于今年10月上市。相比目前配备摄像头的雷朋智能眼镜，Luna将更加接近传统眼镜的外形，同时继续保留人工智能助手和音频功能。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578262.htm"}, {"n": 17, "section": "科技要闻", "title": "马斯克严厉警告：AI要是控制军事系统并发射核弹就糟了", "summary": "近期，马斯克在一场活动中发出警示：“如果AI能够控制军事系统，并发射核弹，那就太糟糕了。”现场交流过程中，有人提出，军事设施大多都被物理隔离了，并不接入互联网，被AI入侵的概率较低。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578254.htm"}, {"n": 18, "section": "模型与产品", "title": "SK海力士与英特尔洽谈合作 或首次在美国生产存储芯片", "summary": "据知情人士透露，韩国存储芯片巨头SK海力士正在与英特尔就一项潜在合作进行谈判。如果最终达成协议，SK海力士将首次在美国本土生产存储芯片。目前双方仍处于探索阶段，尚未作出最终决定。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578246.htm"}, {"n": 19, "section": "科技要闻", "title": "黄仁勋驳斥AI失控论：人类不会在2030年走向灭亡", "summary": "英伟达CEO黄仁勋在当地时间周二晚间的一次采访中批评了Anthropic的AI安全反垄断豁免提议，该提议旨在协同放缓前沿AI模型的开发，并驳斥了有关人工智能可能在十年内灭绝人类的论调。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578244.htm"}, {"n": 20, "section": "科技要闻", "title": "马斯克自曝住拖车监督xAI算力扩建项目", "summary": "全球首富埃隆・马斯克有了一处新住所 —— 位于孟菲斯的一辆 Airstream拖车，停在距离xAI迄今为止最雄心勃勃项目仅几步之遥的地方。彭博亿万富豪指数显示，马斯克净资产达9170亿美元。今年6月，他曾短暂成为全球首位万亿美元富豪，尽管只维持了12天。周一，马斯克与SpaceX的总裁兼首席运营官格温・肖特维尔一同录制《All-In》播客节目时称，自己正住在这座新 “宫殿” 里。", "source": "cnBeta", "url": "https://www.cnbeta.com.tw/articles/tech/1578242.htm"}], "sections": [{"label": "模型与产品", "count": 12, "start": 0}, {"label": "科技要闻", "count": 7, "start": 0}, {"label": "行业动态", "count": 1, "start": 0}], "_src": "中文聚合"};
const SECTION_COLORS = {"模型发布/更新": "#ff6b6b", "产品发布/更新": "#4dabf7", "行业动态": "#51cf66", "论文研究": "#ffd43b", "技巧与观点": "#b197fc"};
const IS_FALLBACK = false;
const items = DATA.items || [];
const total = items.length;
let cur = 0;
const cardWrap=document.getElementById('cardWrap');
const progress=document.getElementById('progress');
const dotsBox=document.getElementById('dots');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const chipsBox=document.getElementById('chips');
const fb=document.getElementById('fallbackNote');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secIdx(it){return DATA.items.slice(0,DATA.items.indexOf(it)).filter(x=>x.section===it.section).length+1;}
function colorOf(sec){return SECTION_COLORS[sec]||'#a29bfe';}
function secStart(label){const s=(DATA.sections||[]).find(x=>x.label===label);return s?s.start-1:0;}

document.getElementById('dateHuman').textContent=formatDateHuman(DATA.date);
document.getElementById('totalCount').textContent=total;
document.title='AI 晚报 · '+(DATA.date||'');

chipsBox.innerHTML=(DATA.sections||[]).map(s=>
  `<span class="chip" data-label="${esc(s.label)}">${esc(s.label)}<b>${s.count}</b></span>`).join('');
chipsBox.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(secStart(c.dataset.label)));

dotsBox.innerHTML=items.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');
dotsBox.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.i));

function render(){
  if(!total){cardWrap.innerHTML='<div class="empty">今日暂无数据</div>';progress.textContent='0 / 0';return;}
  const it=items[cur];const color=colorOf(it.section);
  cardWrap.innerHTML=`<article class="card" style="--c:${color}">
    <div class="card-top">
      <span class="sec-tag" style="color:${color}">${esc(it.section)}</span>
      <span class="num">${String(secIdx(it)).padStart(2,'0')}</span>
    </div>
    <h2 class="title">${esc(it.title)}</h2>
    <div class="src">${esc(it.source)||'—'}</div>
    <p class="summary">${esc(it.summary)}</p>
    <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原文 →</a>
  </article>`;
  progress.textContent=String(cur+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  prevBtn.disabled=cur===0;
  nextBtn.disabled=cur===total-1;
  dotsBox.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(i){cur=Math.max(0,Math.min(total-1,i));render();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});
let sx=0;
cardWrap.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
cardWrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>50)go(cur-1); if(dx<-50)go(cur+1);
},{passive:true});

if(IS_FALLBACK){fb.style.display='block';
  fb.textContent='⚠️ AIHOT 数据源临时不可用，当前显示中文聚合源（AIBase/IT之家/cnBeta），日期 '+(DATA.date||'')+'。';}
render();

function formatDateHuman(ds){
  if(!ds)return '';const p=String(ds).split('-');
  if(p.length<3)return ds;
  const Y=+p[0],M=+p[1],D=+p[2];
  const d=new Date(Y,M-1,D);
  const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return Y+'年'+M+'月'+D+'日 '+wk;
}
