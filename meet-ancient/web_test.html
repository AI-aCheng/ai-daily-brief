<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遇见古人 · 测试版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
  min-height: 100vh; color: #e2e8f0;
  display: flex; justify-content: center;
}
#app { width: 100%; max-width: 480px; padding: 32px 20px 60px; }
.view { display: none; }
.view.active { display: block; }
/* 首页 */
.hero { text-align: center; margin-top: 40px; }
.hero h1 { font-size: 44px; color: #f5c76a; letter-spacing: 8px; text-shadow: 0 0 30px rgba(245,199,106,.4); }
.hero p { margin-top: 12px; color: #94a3b8; letter-spacing: 3px; font-size: 14px; }
.hero-line { margin: 24px auto 0; width: 120px; height: 2px; background: linear-gradient(90deg, transparent, #f5c76a, transparent); }
.stats { display: flex; justify-content: space-around; margin-top: 44px; padding: 24px 10px; background: rgba(30,41,59,.6); border: 1px solid rgba(245,199,106,.2); border-radius: 16px; }
.stat { text-align: center; }
.stat b { display: block; font-size: 30px; color: #f5c76a; }
.stat span { font-size: 12px; color: #cbd5e1; margin-top: 4px; display: block; }
.desc { margin-top: 28px; background: rgba(30,41,59,.6); border-radius: 16px; padding: 20px; font-size: 14px; line-height: 1.9; color: #cbd5e1; }
.desc b { color: #f5c76a; }
.gender-card { margin-top: 28px; background: rgba(30,41,59,.6); border: 1px solid rgba(245,199,106,.2); border-radius: 16px; padding: 18px; }
.gender-title { text-align: center; color: #f5c76a; font-weight: bold; font-size: 15px; }
.gender-opts { display: flex; justify-content: space-around; margin-top: 14px; }
.g-opt { width: 40%; padding: 12px 0; border-radius: 12px; border: 2px solid rgba(148,163,184,.3); background: rgba(15,23,42,.5); text-align: center; color: #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; }
.g-opt.g-active { border-color: #f5c76a; background: rgba(245,199,106,.12); color: #f5c76a; font-weight: bold; }
.g-icon { font-size: 18px; }
.btn { display: block; width: 100%; margin-top: 36px; padding: 16px; border: none; border-radius: 50px; background: linear-gradient(90deg, #f5c76a, #e6a84b); color: #0f172a; font-size: 18px; font-weight: bold; letter-spacing: 4px; cursor: pointer; }
.foot { text-align: center; margin-top: 16px; font-size: 12px; color: #64748b; }
/* 答题 */
.topbar { display: flex; align-items: center; justify-content: space-between; }
.topbar .pct { color: #f5c76a; font-size: 14px; }
.bar { margin-top: 10px; height: 6px; background: rgba(148,163,184,.2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #f5c76a, #e6a84b); border-radius: 3px; transition: width .3s; }
.q-card { margin-top: 28px; background: rgba(30,41,59,.7); border: 1px solid rgba(245,199,106,.15); border-radius: 18px; padding: 28px 22px; min-height: 120px; display: flex; align-items: center; }
.q-card p { font-size: 17px; font-weight: bold; line-height: 1.7; color: #f1f5f9; }
.options { margin-top: 26px; }
.option { display: flex; align-items: center; background: rgba(30,41,59,.5); border: 1px solid rgba(148,163,184,.25); border-radius: 14px; padding: 15px 14px; margin-bottom: 14px; cursor: pointer; transition: all .2s; }
.option:hover { border-color: rgba(245,199,106,.5); }
.option.chosen { border-color: #f5c76a; background: rgba(245,199,106,.12); }
.opt-mark { width: 32px; height: 32px; line-height: 32px; text-align: center; border-radius: 50%; background: rgba(245,199,106,.15); color: #f5c76a; font-weight: bold; margin-right: 14px; flex-shrink: 0; font-size: 14px; }
.opt-text { font-size: 14.5px; line-height: 1.6; }
.back { text-align: center; margin-top: 14px; color: #94a3b8; font-size: 14px; cursor: pointer; visibility: hidden; }
/* 加载 */
.loading { text-align: center; padding-top: 180px; }
.ring { width: 60px; height: 60px; margin: 0 auto; border: 5px solid rgba(245,199,106,.2); border-top-color: #f5c76a; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { margin-top: 24px; color: #94a3b8; font-size: 14px; }
/* 结果 */
.attention-warn { display: none; margin-bottom: 20px; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.7; color: #fbbf24; }
.r-head { text-align: center; padding: 30px 0 24px; border-bottom: 1px solid rgba(148,163,184,.2); }
.r-label { font-size: 13px; color: #94a3b8; letter-spacing: 3px; }
.type-badge { display: inline-block; margin-top: 12px; padding: 4px 18px; border-radius: 20px; background: rgba(59,130,246,.15); border: 1px solid rgba(96,165,250,.5); color: #93c5fd; font-size: 13px; letter-spacing: 1px; }
.main-note { margin-top: 16px; width: 100%; background: rgba(30,41,59,.7); border: 1px solid rgba(245,199,106,.25); border-radius: 12px; padding: 14px; font-size: 12.5px; line-height: 1.8; color: #cbd5e1; text-align: left; display: none; }
.r-name { display: block; margin-top: 10px; font-size: 52px; font-weight: bold; color: #f5c76a; text-shadow: 0 0 40px rgba(245,199,106,.35); }
.r-role { margin-top: 8px; font-size: 13px; color: #cbd5e1; }
.r-pct { display: inline-block; margin-top: 14px; padding: 6px 22px; border-radius: 20px; background: rgba(245,199,106,.15); border: 1px solid rgba(245,199,106,.4); color: #f5c76a; font-weight: bold; font-size: 15px; }
.r-summary { margin-top: 14px; font-size: 14px; line-height: 1.7; color: #e2e8f0; padding: 0 10px; }
.section { margin-top: 28px; }
.section h3 { color: #f5c76a; font-size: 16px; margin-bottom: 14px; }
.line { display: flex; margin-bottom: 10px; }
.ln { width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: rgba(245,199,106,.15); color: #f5c76a; font-size: 12px; font-weight: bold; margin-right: 12px; flex-shrink: 0; margin-top: 3px; }
.line span:last-child { font-size: 14px; line-height: 1.7; flex: 1; }
.analysis { font-size: 14px; line-height: 1.9; background: rgba(30,41,59,.6); border-radius: 14px; padding: 16px; }
.other { display: flex; align-items: center; background: rgba(30,41,59,.5); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: all .2s; }
.other:hover { border: 1px solid rgba(245,199,106,.4); background: rgba(30,41,59,.8); }
.o-name { font-weight: bold; width: 90px; color: #f1f5f9; }
.o-info { flex: 1; font-size: 12px; color: #94a3b8; }
.o-pct { color: #f5c76a; font-weight: bold; font-size: 13px; }
.o-arrow { color: #64748b; font-size: 18px; margin-left: 8px; }
.hint { font-size: 12px; color: #64748b; font-weight: normal; }
/* 详情弹层 */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, .8); z-index: 100; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 40px 16px; }
.modal.show { display: flex; }
.modal-card { background: #1e293b; border: 1px solid rgba(245,199,106,.3); border-radius: 18px; padding: 26px 20px 30px; max-width: 480px; width: 100%; }
.modal-head { text-align: center; padding-bottom: 16px; border-bottom: 1px solid rgba(148,163,184,.2); }
.d-name { display: block; font-size: 40px; font-weight: bold; color: #f5c76a; }
.d-role { margin-top: 6px; font-size: 13px; color: #cbd5e1; }
.d-pct { display: inline-block; margin-top: 10px; padding: 4px 18px; border-radius: 18px; background: rgba(245,199,106,.15); border: 1px solid rgba(245,199,106,.4); color: #f5c76a; font-size: 13px; font-weight: bold; }
.d-summary { margin-top: 10px; font-size: 13px; line-height: 1.7; color: #e2e8f0; }
.share-box { margin-top: 28px; background: rgba(30,41,59,.6); border: 1px dashed rgba(245,199,106,.3); border-radius: 14px; padding: 14px; font-size: 13px; color: #cbd5e1; text-align: center; }
/* 另一个性别的你 */
.alt-card { background: rgba(30,41,59,.6); border: 1px solid rgba(245,199,106,.3); border-radius: 14px; padding: 16px; }
.alt-head { display: flex; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.alt-name { font-size: 18px; font-weight: bold; color: #f5c76a; margin-right: 10px; }
.alt-info { font-size: 12px; color: #94a3b8; }
.alt-note { font-size: 13.5px; line-height: 1.9; color: #e2e8f0; }
.actions { margin-top: 26px; }
.btn-ghost { display: block; width: 100%; margin-top: 12px; padding: 14px; border: 1px solid rgba(245,199,106,.4); border-radius: 50px; background: transparent; color: #f5c76a; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <!-- 首页 -->
  <div id="home" class="view active">
    <div class="hero">
      <h1>遇 见 古 人</h1>
      <p>测一测，你像历史上的谁？</p>
      <div class="hero-line"></div>
    </div>
    <div class="stats">
      <div class="stat"><b>30</b><span>道情景选择题</span></div>
      <div class="stat"><b>100</b><span>位精选历史名人</span></div>
      <div class="stat"><b>3</b><span>分钟找到另一个你</span></div>
    </div>
    <div class="desc"><b>📜 玩法</b><br>回答 30 个贴近现实的选择题（每次随机抽题，反复测不重复），系统将从 <b>100 位家喻户晓的历史名人</b>中，匹配出和你最像的那一位——你们的共同点、TA 的人生成败，以及你可以学到或规避的东西。</div>
    <button class="btn" onclick="start()">开始测试</button>
    <div class="foot">答案没有对错，凭直觉选择即可</div>
  </div>

  <!-- 答题 -->
  <div id="quiz" class="view">
    <div class="topbar"><span class="pct" id="q-progress">1 / 30</span></div>
    <div class="bar"><div class="bar-fill" id="q-bar-fill"></div></div>
    <div class="q-card"><p id="q-text"></p></div>
    <div class="options" id="q-options"></div>
    <div class="back" id="q-back" onclick="goBack()">‹ 上一题</div>
  </div>

  <!-- 加载 -->
  <div id="loading" class="view">
    <div class="loading">
      <div class="ring"></div>
      <p>正在穿越时空，寻找与你最像的古人…</p>
    </div>
  </div>

  <!-- 结果 -->
  <div id="result" class="view">
    <div class="attention-warn" id="r-attention"></div>
    <div class="r-head">
      <div class="r-label">与你最像的古人</div>
      <div class="type-badge" id="r-title"></div>
      <span class="r-name" id="r-name"></span>
      <div class="r-role" id="r-role"></div>
      <div><span class="r-pct" id="r-pct"></span></div>
      <div class="r-summary" id="r-summary"></div>
    </div>
    <div class="section"><h3>🤝 你们的共同点</h3><div id="r-common"></div></div>
    <div class="section"><h3 id="r-analysis-title"></h3><div class="analysis" id="r-analysis"></div></div>
    <div class="section"><h3>💡 给你的启示</h3><div id="r-lesson"></div></div>
    <div id="r-same"></div>
    <div class="section"><h3>🧭 还有谁与你相似 <span class="hint">(点开看看)</span></h3><div id="r-others"></div></div>
    <div class="share-box" id="r-share-text"></div>
    <div class="actions">
      <button class="btn" onclick="drawCardH5()">生成分享卡片</button>
      <button class="btn" onclick="navigator.clipboard ? navigator.clipboard.writeText(document.getElementById('r-share-text').textContent).then(()=>alert('已复制分享文案！')) : alert(document.getElementById('r-share-text').textContent)">复制分享文案</button>
      <button class="btn-ghost" onclick="start()">再测一次</button>
    </div>
  </div>

  <!-- 分享海报弹层 (H5 测试版) -->
  <div id="cardModal" class="modal">
    <div class="modal-card">
      <img id="cardImg" style="width:100%;border-radius:10px;display:block" alt="分享卡片">
      <button class="btn" onclick="document.getElementById('cardModal').style.display='none'" style="margin-top:14px">关 闭</button>
    </div>
  </div>
  <canvas id="cardCanvas" width="750" height="1334" style="display:none"></canvas>

  <!-- 相似古人详情弹层 -->
  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <span class="d-name" id="d-name"></span>
        <div class="d-role" id="d-role"></div>
        <span class="d-pct" id="d-pct"></span>
        <div class="d-summary" id="d-summary"></div>
      </div>
      <div class="section"><h3>🤝 你们的共同点</h3><div id="d-common"></div></div>
      <div class="section"><h3 id="d-analysis-title"></h3><div class="analysis" id="d-analysis"></div></div>
      <div class="section"><h3>💡 给你的启示</h3><div id="d-lesson"></div></div>
      <button class="btn-ghost" onclick="closeDetail()">关 闭</button>
    </div>
  </div>
</div>

function drawCardH5() {
  const top = matches[0]
  if (!top) { alert('请先完成测试'); return }
  const a = top.ancient
  const c = document.getElementById('cardCanvas')
  const ctx = c.getContext('2d')
  const W = 750, H = 1334
  // 背景渐变 (深色科技风)
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#0f172a'); g.addColorStop(0.6, '#1e293b'); g.addColorStop(1, '#0f172a')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  // 鎏金边框
  ctx.strokeStyle = 'rgba(245,199,106,0.7)'; ctx.lineWidth = 4
  ctx.strokeRect(26, 26, W - 52, H - 52)
  ctx.textAlign = 'center'
  // 顶部
  ctx.fillStyle = '#94a3b8'; ctx.font = '30px sans-serif'
  ctx.fillText('遇 见 古 人', W / 2, 130)
  ctx.strokeStyle = 'rgba(245,199,106,0.4)'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(W / 2 - 110, 160); ctx.lineTo(W / 2 + 110, 160); ctx.stroke()
  // 称号
  ctx.fillStyle = '#f5c76a'; ctx.font = '54px sans-serif'
  ctx.fillText(a.title || '', W / 2, 400)
  // 古人名
  ctx.fillStyle = '#ffffff'; ctx.font = '92px sans-serif'
  ctx.fillText(a.name || '古人', W / 2, 540)
  // 时代
  ctx.fillStyle = '#94a3b8'; ctx.font = '32px sans-serif'
  ctx.fillText(a.era || '', W / 2, 610)
  // 匹配度
  ctx.fillStyle = '#f5c76a'; ctx.font = '42px sans-serif'
  ctx.fillText('匹配度 ' + pct(top.score, 0) + '%', W / 2, 690)
  // 简介 (最多3行)
  ctx.fillStyle = '#cbd5e1'; ctx.font = '28px sans-serif'
  const summary = a.summary || ''
  const lines = []
  for (let i = 0; i < summary.length; i += 22) lines.push(summary.slice(i, i + 22))
  lines.slice(0, 3).forEach((l, i) => ctx.fillText(l, W / 2, 790 + i * 48))
  // 中部金线
  ctx.strokeStyle = 'rgba(245,199,106,0.5)'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(W / 2 - 170, 990); ctx.lineTo(W / 2 + 170, 990); ctx.stroke()
  // 引导关注
  ctx.fillStyle = '#94a3b8'; ctx.font = '26px sans-serif'
  ctx.fillText('长按识别 · 测测你像哪位古人', W / 2, 1050)
  ctx.fillStyle = '#64748b'; ctx.font = '22px sans-serif'
  ctx.fillText('关注公众号「AI阿程Harness实录」', W / 2, 1090)
  // 小程序码
  const img = new Image()
  img.onload = () => {
    ctx.drawImage(img, W / 2 - 105, H - 280, 210, 210)
    document.getElementById('cardImg').src = c.toDataURL('image/png')
    document.getElementById('cardModal').style.display = 'flex'
  }
  img.onerror = () => {
    document.getElementById('cardImg').src = c.toDataURL('image/png')
    document.getElementById('cardModal').style.display = 'flex'
  }
  img.src = 'data:image/png;base64,' + MINI_CODE_B64

rio":"【注意力检测】以下哪个是水果？","attention":true,"correctIndex":1,"options":[{"text":"白菜","tags":{}},{"text":"苹果","tags":{}},{"text":"土豆","tags":{}},{"text":"大米","tags":{}},{"text":"豆腐","tags":{}},{"text":"黄瓜","tags":{}}]}];
const ANCIENTS = [{"id":"laozi","name":"老子","era":"春秋·楚","region":"中国","role":"思想家/道家始祖","tags":{"出世":5,"独善":4,"顺应":4,"务虚":3},"outcome":"retreat","summary":"道家创始人，《道德经》作者，看透乱世后辞官西行，骑青牛出函谷关，不知所踪。","common":["你和他一样喜欢独处思考，人多的场合反而消耗你","你俩都信奉顺其自然，不硬刚，先看势","你和他一样觉得名利是累赘，精神自由比什么都重要"],"analysis":"老子活得通透。他看透了周朝礼崩乐坏，觉得争来争去没意义，索性辞官西行。他不跟世界硬碰硬，而是顺应规律、以柔克刚，把心力都用在悟道上。别人争权夺利，他写出一部《道德经》流传两千年。他的归隐不是逃避，是换了个赛道赢，而且赢得最长久。","lesson":["遇到拧巴的事先问自己：这事值得我耗心力吗？不值得就放下","学他\"上善若水\"——处理冲突别硬顶，绕过去或者等一等","每天留半小时独处，不刷手机，就发呆或写日记，判断力会变强"],"gender":"male","type":"隐士","title":"独善其身的隐士"},{"id":"kongzi","name":"孔子","era":"春秋·鲁","region":"中国","role":"思想家/教育家","tags":{"入世":5,"理想":5,"兼济":4,"坚韧":3,"重情":2},"outcome":"retreat","summary":"儒家创始人，周游列国十四年不被重用，晚年退而修书教学，弟子三千，成万世师表。","common":["你和他一样有救世情怀，看到不合理的事就想管","你俩都认死理，认定对的事，撞了南墙也要再撞一次","你和他一样重视关系，觉得人情和道义比利益重要"],"analysis":"孔子一生想当官推行仁政，可惜诸侯都想要霸道，没人听他的。他失败在理想太超前，时代接不住。他带着弟子周游列国，风餐露宿，在陈蔡之间还断过粮。但他没崩溃，五十多岁开始办学，把政治理想转成教育事业，最后成了万世师表。他的路告诉我们：此路不通，就把本事换个地方用。","lesson":["职业路线走不通时别死磕，学他把积累变成另一条路（比如教人、写书）","坚持理想没错，但要像他一样接受\"时机未到\"，先扎根积累","对人对事多点\"仁者爱人\"，长期看人缘就是资源"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"zhuangzi","name":"庄子","era":"战国·宋","region":"中国","role":"哲学家/文学家","tags":{"出世":5,"随性":4,"独处":4,"务虚":3,"乐观":2},"outcome":"retreat","summary":"道家代表人物，楚王请他为相被他拒绝，一生逍遥自在，著《庄子》十万言。","common":["你和他一样讨厌被安排，越是被催越不想干","你俩都觉得升职加薪不如心里舒坦重要","你和他一样喜欢一个人待着，脑子里戏很多"],"analysis":"庄子把\"有用没用\"看得很透：做官看似风光，其实是给君王当工具。他宁可做泥巴里打滚的乌龟，也不要庙堂上的虚名。楚王请他当宰相，他钓鱼都不抬头，还调侃说自己宁愿做自由自在的泥龟。他选择归隐不是混日子，而是用最少的欲望换最大的自由，所以一辈子没被人拿捏过。","lesson":["面对\"别人都这样\"的压力，问自己：这是我想要的，还是别人塞给我的？","学他的\"无用之用\"——有些事看似没用，长远看最养人（比如发呆、读书）","卷不动的时候给自己一个\"庄子时刻\"：关掉消息，去公园坐一小时"],"gender":"male","type":"隐士","title":"独善其身的隐士"},{"id":"quyuan","name":"屈原","era":"战国·楚","region":"中国","role":"诗人/政治家","tags":{"理想":5,"抗争":4,"重情":3,"豪放":2},"outcome":"tragic","summary":"楚国贵族、三闾大夫，主张联齐抗秦遭排挤，两度流放，秦破郢都后投汨罗江殉国。","common":["你和他一样理想主义，宁折不弯，不肯跟看不惯的事同流合污","你俩都太重感情，被辜负一次能记很久","你和他一样认准了方向就全力投入，九头牛拉不回来"],"analysis":"屈原栽在太纯粹。他眼里只有楚国安危，不懂政治要妥协，写《离骚》骂奸臣，结果被靳尚、子兰这些人联手排挤，两次流放。楚怀王不听他的联齐抗秦，楚国一步步被秦国吞掉。理想碎了，故国没了，他选择投江殉道。不是他不够强，是敌人太多、队友太蠢。","lesson":["坚持原则要有，但学点\"曲线救国\"，硬刚之前先保住自己的位置","别把全部身家押在一个组织或一段关系上，留好后路","情绪崩溃时找人聊聊，学他写诗那样把痛苦写出来，别闷在心里"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"xiangyu","name":"项羽","era":"秦末","region":"中国","role":"军事家/西楚霸王","tags":{"豪放":5,"自信":4,"固执":3,"重情":2},"outcome":"tragic","summary":"楚国名将之后，巨鹿之战破釜沉舟，推翻秦朝后自封西楚霸王，兵败垓下，乌江自刎。","common":["你和他一样天生自信，觉得自己能搞定一切","你俩都讲义气重感情，对兄弟掏心掏肺","你和他一样脾气上来就硬刚，很少迂回"],"analysis":"项羽打仗是天才，巨鹿之战以少胜多，但政治上是小学生。他刚愎自用，范增的话听不进去；心慈手软，鸿门宴放走刘邦；赢了之后分封天下，把刘邦扔到蜀地还觉得没事。刘邦却一路低头装孙子攒实力。垓下一战，四面楚歌，他宁可自刎也不肯过江东。他败给的不是刘邦，是自己的性格。","lesson":["优势再大也别轻敌，对手示弱的时候往往在攒大招","听劝！至少留一个敢跟你说真话的人，他的话要听完再决定","赢了别飘，分蛋糕的时候就要想好明天谁是你的敌人"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"liubang","name":"刘邦","era":"西汉","region":"中国","role":"开国皇帝/政治家","tags":{"变通":5,"谋略":4,"务实":4,"现实":3,"社交":2},"outcome":"success","summary":"出身亭长，起兵反秦，楚汉相争击败项羽，建立汉朝，史称汉高祖。","common":["你和他一样能屈能伸，该低头时绝不硬撑","你俩都现实得很，面子不如里子重要","你和他一样会来事，三教九流都聊得来"],"analysis":"刘邦成功就一个字：用。他自己带兵打不过项羽，但他会用人——韩信打仗、张良出主意、萧何管后勤，全给他卖命。他不要面子，逃命时能把儿女踹下车；他够现实，称帝前该装孙子就装孙子。项羽还在讲贵族体面的时候，他已经把规则玩明白了，所以最后坐上龙椅的是他，不是战神项羽。","lesson":["承认自己不是全能选手，把专业的事交给专业的人，功劳分出去","面子是成功最大的障碍，关键时刻能放下身段的人赢","建立你的\"朋友圈\"，关键时刻谁拉你一把，靠的是平时攒的人情"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"hanxin","name":"韩信","era":"西汉","region":"中国","role":"军事家/大将","tags":{"谋略":5,"隐忍":4,"自信":3,"重情":2},"outcome":"tragic","summary":"汉初三杰之一，明修栈道暗度陈仓、背水一战，助刘邦定天下，后被吕后所杀。","common":["你和他一样能忍，被欺负了先记着，等自己强大了再说","你俩都是技术流，靠硬本事吃饭","你和他一样觉得\"我立了功就该有回报\""],"analysis":"韩信是打仗的天花板，背水一战、十面埋伏都是他的作品。但他不懂政治：打下齐国就伸手要\"假齐王\"，刘邦心里记了一笔；天下太平了还摆老资格，觉得没他不行。功高震主还不知收敛，最后被吕后和萧何设局，死在长乐宫。他不是输在能力，是输在不会自保。","lesson":["立了大功更要低调，功劳越大越要主动让利，别等老板来收你","谈条件要讲时机和方式，别在最得意的时候伸手要价","看清\"狡兔死走狗烹\"的规律，功成之后想好退路"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"zhangliang","name":"张良","era":"西汉","region":"中国","role":"谋士/政治家","tags":{"谋略":5,"隐忍":4,"变通":3,"出世":2},"outcome":"success","summary":"汉初三杰之一，运筹帷幄决胜千里，助刘邦建汉后急流勇退，得善终。","common":["你和他一样想得多、看得远，别人走一步你想三步","你俩都沉得住气，机会没到就安心等着","你和他一样知道什么时候该收手，不贪"],"analysis":"张良成功在\"知进退\"。他是韩国贵族，国破家亡后刺秦失败，逃到下邳，桥上给老人捡鞋，一忍就是几年，换来《太公兵法》。辅佐刘邦时他专出主意不抢风头，刘邦称帝后功臣一个个被杀，他主动说\"我身体不好，要修仙去了\"，提前退出牌桌，保住了命，成了汉初功臣里少有的善终者。","lesson":["能力强的人更要学会藏锋，功劳让给别人一点，安全留给自己","把\"退出\"也当成一种策略：看清局势不对，果断离场不恋战","沉得住气的人赢在最后，机会来之前先修炼自己的\"兵法\""],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"fanli","name":"范蠡","era":"春秋·越","region":"中国","role":"谋士/商人","tags":{"变通":5,"谋略":4,"务实":4,"隐忍":2},"outcome":"success","summary":"助勾践灭吴后急流勇退，化名陶朱公经商，三聚三散，被尊为商圣。","common":["你和他一样懂得审时度势，风向不对立刻掉头","你俩都是实干派，想清楚了就立刻动手","你和他一样不贪恋位置，该走的时候走得干脆"],"analysis":"范蠡是人生赢家的模板。勾践卧薪尝胆时，他陪着演了二十年戏；灭吴之后，他看出勾践\"可共患难不可共富贵\"，立刻辞职跑路，还劝文种也走，文种不听，后来果然被杀。他跑到齐国改名换姓做生意，三次成为巨富又三次散财。进能定国，退能致富，全靠拎得清。","lesson":["看清楚这段关系能不能长久，能共苦不能同甘的人，早点撤","职业赛道可以切换：你的核心能力（眼光、判断力）在哪个行业都值钱","钱是工具不是目的，学会散财，反而能守住财"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"shangyang","name":"商鞅","era":"战国·秦","region":"中国","role":"政治家/改革家","tags":{"革新":5,"务实":4,"固执":3,"理性":3},"outcome":"tragic","summary":"主持秦国变法，让秦国由弱变强，触怒旧贵族，秦孝公死后遭车裂。","common":["你和他一样看问题只看效率，人情世故靠边站","你俩都是改革派，最烦\"以前就是这样\"这句话","你和他一样认准的事就执行到底，谁来拦都不好使"],"analysis":"商鞅变法确实成功，秦国二十年就从弱国变强国，但他的成功方式太狠：立木为信、连坐，得罪了所有旧贵族，连太子犯法都要处罚太子的老师。秦孝公活着时没人敢动他，孝公一死，被压了二十年的贵族立刻反扑，给他安了谋反的罪名车裂。他赢在变法，死在不会给自己留缓冲。","lesson":["改革要猛，但也要团结一部分人，别把所有人都变成你的敌人","权力是别人给的，别把靠山当永恒——靠山倒之前先布局","得罪人的事可以做，但要让老板和老板的继承人都离不开你"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"qinshihuang","name":"秦始皇","era":"秦","region":"中国","role":"皇帝/政治家","tags":{"自信":5,"革新":4,"务实":3,"奢靡":2},"outcome":"success","summary":"十三岁即位，横扫六国一统天下，书同文车同轨，中国第一位皇帝。","common":["你和他一样目标感极强，认准的事不惜代价也要做成","你俩都讨厌拖泥带水，要干就干大的","你和他一样觉得过程不重要，结果说了算"],"analysis":"秦始皇的成功在于把\"统一\"两个字执行到了极致：灭六国、废分封、统一文字货币度量衡，每一件都是震动千年的大事。他自信到认为自己是\"始皇帝\"，一切都要按他的意志来。代价是严刑峻法、大兴土木，百姓活不下去，他死后三年秦朝就亡了。他赢了一辈子，输在没给帝国留缓冲。","lesson":["做成大事需要\"霸总\"般的执行力，但也要听进反对的声音","拼得太狠要注意身体和团队状态，透支换来的成功不可持续","制度设计要留弹性，把一切绷到极限，早晚会断"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"suwu","name":"苏武","era":"西汉","region":"中国","role":"使节/忠臣","tags":{"坚韧":5,"重义":5,"独处":3,"固执":2},"outcome":"success","summary":"出使匈奴被扣十九年，牧羊北海持节不屈，终归汉朝，白发善终。","common":["你和他一样认死理，答应的事、认定的人，打死不松口","你俩都耐得住寂寞，一个人也能过得好","你和他一样觉得\"原则\"比\"舒服\"重要"],"analysis":"苏武十九年怎么熬过来的？匈奴让他投降，他不降，被扔到北海放公羊，说公羊下崽才放他回去。没吃的就挖野鼠洞里的草籽，天天握着汉朝的节杖，节上的旄毛都掉光了。李陵来劝他，他说\"臣事君，犹子事父\"。十九年后匈奴换了新单于，才放他回长安。他赢在把\"不降\"两个字守到了最后。","lesson":["真正难的事都是熬出来的，把目标拆成\"今天先撑过去\"","孤独是常态不是惩罚，学会一个人也能把日子过扎实","守住底线的人短期吃亏，长期看是最大的信用资产"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"simaqian","name":"司马迁","era":"西汉","region":"中国","role":"史学家/文学家","tags":{"坚韧":5,"直率":4,"自省":3,"重义":3},"outcome":"tragic","summary":"太史令，因替李陵辩护受宫刑，忍辱负重十四年写成《史记》，流传千古。","common":["你和他一样见不得朋友受委屈，会站出来说话","你俩都倔，认准的事再难也要做完","你和他一样爱较真，写东西查资料必须搞明白"],"analysis":"司马迁本来顺风顺水，李陵兵败投降匈奴，满朝都在骂，他站出来说了句公道话，汉武帝火了，把他下狱判了死刑。没钱赎罪，只能接受宫刑——对一个士大夫来说比死还屈辱。但他没死，因为他想写《史记》的愿望比尊严更重。他把自己活成了\"人固有一死，或重于泰山，或轻于鸿毛\"的注脚。","lesson":["替人说话之前先掂量自己的处境，仗义执言也要讲究策略","遭遇重大挫折时，给自己一个必须活下去的理由（作品、家人、目标）","把屈辱写成作品、变成生产力，是最好的复仇方式"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"huoqubing","name":"霍去病","era":"西汉","region":"中国","role":"将领/军事家","tags":{"冒险":5,"自信":4,"豪放":3,"务实":2},"outcome":"success","summary":"十七岁随军出征，六战匈奴封狼居胥，官至大司马，二十四岁英年早逝。","common":["你和他一样敢闯，机会来了先冲再说","你俩都觉得自己行，而且真的行","你和他一样讨厌磨叽，要干就干得漂亮"],"analysis":"霍去病是天才型选手：十七岁带八百骑兵深入匈奴腹地，十九岁打河西走廊，二十出头就封狼居胥山，把匈奴主力打到漠北。他打仗从来不走常规路线，专挑匈奴想不到的地方突袭。汉武帝宠他，给他盖豪宅他不要，说\"匈奴未灭，何以家为\"。可惜天妒英才，二十四岁病逝，但功业已经封神。","lesson":["年轻就是本钱，趁敢闯的时候多试错，错了成本低，成了收益大","创新打法的前提是基本功过硬，他的\"奇袭\"背后是极强的骑兵素养","有\"匈奴未灭何以家为\"式的目标，人就不会被眼前的小事拖住"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"wangzhaojun","name":"王昭君","era":"西汉","region":"中国","role":"和亲使者/宫女","tags":{"坚韧":4,"抗争":3,"重情":3,"顺应":2},"outcome":"tragic","summary":"入宫五年未见皇帝，自请和亲出塞，换来汉匈五十年和平，终身未归故土。","common":["你和她一样，受了委屈不声张，自己默默扛","你俩都心软，顾全大局的时候常常委屈自己","你和她一样，认命但又不完全认命"],"analysis":"王昭君是宫里最冤的倒霉蛋：她不肯贿赂画师毛延寿，画像被画丑，入宫五年连皇帝面都没见过。匈奴来求亲，宫女都不敢去，她赌气自请出塞——结果一见面汉元帝后悔了，但反悔来不及。她嫁到草原，丈夫死了又按匈奴风俗嫁给继子，想家想到写《怨词》。她换来了和平，也搭上了一生的幸福。","lesson":["职场里\"不会表现\"就是吃亏，该展示自己的时候别清高","赌气做的重大决定最危险，先冷静三天再签字","善良要有边界，顾全大局之前先问自己：我的底线在哪里"],"gender":"female","type":"守成者","title":"稳守基业的守成者"},{"id":"caocao","name":"曹操","era":"东汉末","region":"中国","role":"政治家/军事家/诗人","tags":{"谋略":5,"变通":4,"务实":4,"豪放":2},"outcome":"success","summary":"挟天子以令诸侯，灭袁绍统一北方，奠定曹魏基业，谥号魏武帝。","common":["你和他一样反应快，机会稍纵即逝你总能抓住","你俩都是结果导向，过程和手段可以灵活","你和他一样有霸气，天生想当那个拍板的人"],"analysis":"曹操的成功在于\"既会用权，又会用人\"。他挟天子令诸侯，占了名分；招揽荀彧、郭嘉，唯才是举，连杀他儿子的张绣都肯收。官渡之战以少胜多，靠的是果断烧粮、听取奇谋。他也失败过，赤壁一把火烧掉统一天下的机会，但回去立刻稳地盘、搞屯田，把北方经营成铁桶。输了能马上止损，是他最厉害的地方。","lesson":["用人的时候别记仇，能力优先，恩怨放后面","失败之后第一件事是止损和复盘，别陷在情绪里","\"名分\"很重要，做事之前先想清楚自己站在什么立场上"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"liubei","name":"刘备","era":"三国·蜀","region":"中国","role":"开国皇帝/政治家","tags":{"重情":5,"坚韧":5,"重义":4,"隐忍":2},"outcome":"success","summary":"织席贩履出身，三顾茅庐得诸葛亮，白手起家建立蜀汉，史称昭烈帝。","common":["你和他一样重情重义，朋友的事就是自己的事","你俩都是\"打不死的小强\"，失败再多也不放弃","你和他一样会哭会示弱，但心里特别有主意"],"analysis":"刘备的起点低到尘埃里：卖草鞋出身，四十多岁还在寄人篱下，投靠过公孙瓒、陶谦、曹操、袁绍、刘表。但他有个大杀器——仁义和真诚，关羽、张飞、诸葛亮都死心塌地跟他。三顾茅庐请出诸葛亮，赤壁之后终于有了地盘，六十岁称帝。他赢在：能力可以不够，但让人愿意跟你干。","lesson":["真诚是最稀缺的领导力，你对人掏心窝，人才会跟你共患难","起点低不可怕，可怕的是放弃，他四十多岁还在\"创业\"","学会示弱和借力，找比你强的人帮你，别什么都自己扛"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"zhugeliang","name":"诸葛亮","era":"三国·蜀","region":"中国","role":"政治家/军事家/丞相","tags":{"谋略":5,"谨慎":4,"自律":4,"理想":3,"务实":2},"outcome":"fail","summary":"隆中对定三分，辅佐刘备建立蜀汉，六出祁山北伐未成，病逝五丈原。","common":["你和他一样事必躬亲，交给你的事你放心不下别人","你俩都是完美主义者，细节控","你和他一样有使命感，认定的事鞠躬尽瘁"],"analysis":"诸葛亮是三国最强CEO，但接手的是个烂摊子：刘备白帝城托孤后，蜀汉人才凋零，国力最弱。他明知\"益州疲敝\"，还是六出祁山硬打，因为\"汉贼不两立\"的理想不允许他躺平。他太谨慎，魏延的奇袭子午谷计划不用；他太劳累，事无巨细亲自抓，五十四岁累死在五丈原。他不是败给司马懿，是败给了实力差距和不肯放手的性格。","lesson":["学会授权！事必躬亲的人累死自己还拖慢团队","再完美的计划也要看资源，实力悬殊时保存实力比硬拼聪明","理想要有，但要给理想设个止损线，别把自己燃尽"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"guanyu","name":"关羽","era":"三国·蜀","region":"中国","role":"将领/武圣","tags":{"重义":5,"自信":4,"固执":3,"直率":2},"outcome":"tragic","summary":"万人敌虎将，温酒斩华雄、水淹七军威震华夏，大意失荆州后败走麦城被杀。","common":["你和他一样把\"义气\"看得比命重，答应的事一定办","你俩都自尊心强，受不得半点轻慢","你和他一样认准了就不回头，九头牛拉不动"],"analysis":"关羽是战神也是灾星。他忠义无双，千里走单骑，但性格太傲：孙权想联姻，他骂\"虎女焉能嫁犬子\"，把盟友得罪了；诸葛亮让他\"北拒曹操，东和孙权\"，他全忘了。结果曹操和孙权联手，荆州被吕蒙偷了，他退到麦城，突围时被擒杀。他的死不是武力不够，是傲慢堵死了所有退路。","lesson":["再强也别得罪能帮你的人，盟友比对手更需要维护","傲慢是能力者的隐形杀手，越是顺风局越要低头看路","战略方针（和谁联合、防谁）要反复对表，别让情绪替你做主"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"zhouyu","name":"周瑜","era":"三国·吴","region":"中国","role":"将领/军事家","tags":{"谋略":5,"自信":4,"冒险":3,"豪放":2},"outcome":"tragic","summary":"江东大都督，赤壁之战火烧曹军奠定三分天下，正欲攻蜀时病逝巴丘，年仅三十六。","common":["你和他一样才华外露，到哪儿都是主角","你俩都是完美主义者，容不下瑕疵","你和他一样有野心，不甘心只做第二"],"analysis":"周瑜不是演义里被气死的小心眼，正史里的他雅量高致，赤壁之战是他一手策划的：三万联军火攻曹操几十万大军，一战定三分。他最大的遗憾是命短：孙权刚同意他西征取蜀，他走到巴丘就病逝，三十六岁。他的悲剧不是性格，是老天不给时间——才华顶配，续航不足。","lesson":["身体是1，才华是后面的0，再忙也要保重自己","有野心是好事，但把大目标拆成小阶段，别想一口吞下","关键时刻敢押注（火烧赤壁），但押注前把退路想清楚"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"simayi","name":"司马懿","era":"三国·魏","region":"中国","role":"政治家/军事家","tags":{"隐忍":5,"谋略":5,"谨慎":3,"变通":2},"outcome":"success","summary":"隐忍半生，装病十年骗过曹爽，高平陵之变夺权，为晋朝奠基。","common":["你和他一样沉得住气，别人跳脚的时候你面无表情","你俩都是\"扮猪吃老虎\"的高手","你和他一样活得久、等得起，相信笑到最后才笑得最好"],"analysis":"司马懿的成功学就两个字：能忍。曹操请他，他装病；曹爽排挤他，他装病装了十年，连士兵泼水到他脸上都不动。等曹爽陪皇帝出城扫墓，他立刻发动高平陵之变，一夜之间夺了曹魏大权。他赢在把\"等\"字用到了极致：不争一时，争一世，对手的警惕心一松，就是他的天下。","lesson":["竞争是长跑，活得久、稳得住，比冲得快更管用","示弱可以当武器，但要让对手看到你的\"弱\"，而不是真暴露软肋","出手要快准狠：要么不动，动就要一击致命"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"jikang","name":"嵇康","era":"三国·魏","region":"中国","role":"文学家/音乐家","tags":{"随性":5,"出世":4,"直率":4,"独处":2},"outcome":"tragic","summary":"竹林七贤之首，不与司马氏合作，遭钟会构陷，被司马昭处死，《广陵散》绝。","common":["你和他一样讨厌装模作样，看不惯就当面怼","你俩都想要自由，最烦被人管着","你和他一样有才华，但懒得用才华去换名利"],"analysis":"嵇康的死是性格写好的剧本。司马昭想拉拢他，他避而不见；好友山涛推荐他做官，他直接写《与山巨源绝交书》，把司马氏骂了个遍。钟会去拜访他，他光着膀子打铁，全程不理人，把钟会得罪透了。钟会回去就进谗言，司马昭借\"言论放荡\"的罪名杀了他。临刑前他弹了一曲《广陵散》，说\"从此绝矣\"。","lesson":["有个性可以，但要分清哪些场合能怼、哪些人不能得罪","拒绝别人的拉拢要给对方台阶，撕破脸的成本往往比想象中大","才华横溢的人更要学会自我保护，别让才华变成催命符"],"gender":"male","type":"隐士","title":"独善其身的隐士"},{"id":"taoyuanming","name":"陶渊明","era":"东晋","region":"中国","role":"诗人/隐士","tags":{"出世":5,"随性":4,"抗争":3,"独处":2},"outcome":"retreat","summary":"不为五斗米折腰，辞官归隐，采菊东篱下，写下《桃花源记》。","common":["你和他一样受不了职场那一套，应酬和拍马屁让你窒息","你俩都向往简单生活，一屋两人三餐四季就很好","你和他一样，不开心的工作给再多钱也不想干"],"analysis":"陶渊明当过几次小官，每次都干不长。最后一次做彭泽县令，上司来检查，下属让他穿正装迎接，他说\"我不能为五斗米向乡里小儿折腰\"，当天就辞职。别人觉得他傻，丢了铁饭碗，他却从此种豆南山、喝酒写诗，把日子过成了别人羡慕的样子。他的归隐不是失败，是主动选择了性价比最高的人生。","lesson":["工作让你长期内耗，就有资格换，\"稳定\"买不来开心","降低物欲是获得自由的捷径：需要的越少，能拿捏你的就越少","培养一个能安放自己的爱好（种花、写字、做饭），那是你的桃花源"],"gender":"male","type":"隐士","title":"独善其身的隐士"},{"id":"wangxizhi","name":"王羲之","era":"东晋","region":"中国","role":"书法家/官员","tags":{"坚韧":4,"随性":4,"自律":3,"自省":2},"outcome":"success","summary":"书圣，临池学书练黑一池水，写就天下第一行书《兰亭集序》，官至右军将军。","common":["你和他一样，认准的事能日复一日地练","你俩都追求\"完美的一笔\"，差一点都不行","你和他一样有才气，但不端着，随性得很"],"analysis":"王羲之的天才一半是天分一半是死磕：他练字练到把池水都染黑了，走路都在比划，衣服都戳破了。东床坦腹——人家来相亲他躺床上吃饼，结果老丈人反而看上他的真性情。他做官做到右军将军，五十多岁称病辞官，游山玩水写字到老。他赢在：既有硬功夫，又有真性情，两条腿走路。","lesson":["任何\"天赋\"背后都是大量重复，把基本功练到肌肉记忆","保持真性情，不装不端，反而更招人喜欢和信任","到了一定阶段要学会急流勇退，用热爱滋养后半生"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"libai","name":"李白","era":"唐","region":"中国","role":"诗人/侠客","tags":{"豪放":5,"理想":4,"自信":4,"随性":3},"outcome":"fail","summary":"诗仙，斗酒诗百篇，一生想当大官却仕途坎坷，赐金放还、流放夜郎，诗名千古。","common":["你和他一样自信爆棚，觉得自己天生我材必有用","你俩都受不了约束，朝九晚五对你来说是酷刑","你和他一样，高兴了就想找人喝酒吹牛"],"analysis":"李白一辈子想当宰相，但除了给唐玄宗写写歌词，基本没实权。他性格太狂，让高力士脱靴，把权贵得罪光了，最后被\"赐金放还\"。安史之乱他跟错老板（永王），差点被杀，流放夜郎。他仕途一败涂地，但把才华全倒进了诗里，成了千古诗仙。他用现实告诉我们：不适合当官的人，硬挤官场就是浪费时间。","lesson":["认清自己的赛道：在A领域碰壁，不代表你在B领域不行","才华要展示给对的人看，狂要有狂的资本和分寸","把精力投到你的长板上，别在不擅长的规则里内耗"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"dufu","name":"杜甫","era":"唐","region":"中国","role":"诗人/官员","tags":{"兼济":5,"理想":4,"悲观":3,"坚韧":2},"outcome":"tragic","summary":"诗圣，一生颠沛流离，亲历安史之乱，写尽民间疾苦，客死湘江舟中。","common":["你和他一样心系天下，看到别人的苦自己先难受","你俩都容易想太多，半夜睡不着替别人操心","你和他一样，越是艰难越能咬牙往前走"],"analysis":"杜甫年轻时也阔过，安史之乱把一切打碎了：逃难、被俘、饿肚子，孩子都饿死过一个。他当过最大的官是左拾遗，还因为替朋友说话被贬。但他没停止写诗，\"朱门酒肉臭，路有冻死骨\"，一字一句都是时代的伤口。最后在湘江的船上病逝，五十九岁。他不是被谁害的，是被整个乱世和一颗太软的心拖垮的。","lesson":["共情能力强是天赋，但记得先照顾好自己，别让心太累","逆境里先保命保家，理想可以等安稳了再追","把苦难写成作品、记录下来，那是你留给世界最珍贵的东西"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"baijuyi","name":"白居易","era":"唐","region":"中国","role":"诗人/官员","tags":{"务实":4,"变通":4,"兼济":3,"乐观":3},"outcome":"success","summary":"新乐府运动领袖，写诗老妪能解，官至刑部尚书，晚年洛阳养老，享年七十五。","common":["你和他一样接地气，说话办事不端着","你俩都懂得调整心态，被打击了能自己把自己哄好","你和他一样有社会责任感，但不会把自己搭进去"],"analysis":"白居易的聪明在于\"想得开\"。他年轻时热血，写《卖炭翁》揭露社会黑暗，结果被贬江州。一般人就消沉了，他倒好，在江州写《琵琶行》、修白堤、种花养鱼，把贬谪生活过成了度假。后来一路升到刑部尚书，晚年退休在洛阳香山，活到七十五岁。同样是诗人，他跟杜甫的区别就是：忧国忧民，但绝不亏待自己。","lesson":["事业低谷期学他：换个环境也能活出质量，别用痛苦惩罚自己","写东西做内容，先让\"老奶奶能听懂\"，传播力比文采重要","有社会责任感很好，但记得给自己留白，可持续的善良才是善良"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"xuanzang","name":"玄奘","era":"唐","region":"中国","role":"高僧/翻译家","tags":{"坚韧":5,"冒险":5,"理想":4,"独处":2},"outcome":"success","summary":"孤身西行五万里取经，历时十七年，带回佛经六百五十七部，译经传法，创立唯识宗。","common":["你和他一样，认准的目标八头牛拉不回来","你俩都敢走人少的路，不怕孤独","你和他一样觉得\"求知的苦\"比\"平庸的舒服\"值得"],"analysis":"玄奘取经不是《西游记》里那样有孙悟空保护，他是偷渡出去的——朝廷当时禁止出境，他混在灾民里才走出玉门关，穿过八百里沙漠，差点渴死，又翻过雪山，路上被抢劫、被抓、被挽留，走了十七年、五万里，终于带着经书回来。唐太宗让他做官他不做，专心译经十九年。他赢在：目标极其单纯，执行力极其可怕。","lesson":["真正的大目标要敢于出发——别等条件全齐了才动身","把困难当成取经路上的关卡，一关一关过，总会到灵山","学成归来要\"译经\"——把学到的东西输出、分享，价值才最大化"],"gender":"male","type":"隐士","title":"独善其身的隐士"},{"id":"wuzetian","name":"武则天","era":"唐","region":"中国","role":"皇帝/政治家","tags":{"谋略":5,"自信":5,"坚韧":4,"革新":3},"outcome":"success","summary":"中国唯一女皇帝，从才人到天后再到皇帝，开创殿试武举，上承贞观下启开元。","common":["你和她一样目标感极强，想要的东西会一步步拿","你俩都扛得住非议，别人怎么说你不太在乎","你和她一样有手腕，但也会对自己狠"],"analysis":"武则天的路是地狱难度：女人想当皇帝，整个时代都在反对。她从才人熬到皇后，从皇后到天后，再废儿子自己上，每一步都踩着刀尖。她任用酷吏镇压反对者，也开创殿试、武举，提拔底层人才，把国家治理得井井有条。她赢在：目标清晰、手段狠辣、心态强大，而且确实有治国的本事——光有野心没有能力，她早死了八百回。","lesson":["想打破天花板，先把自己的能力练到无可替代，再谈野心","反对声越大越要稳：一步一步来，让时间消化阻力","手段要硬，但成果要实——她能坐稳，是因为国家确实变好了"],"gender":"female","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"lishimin","name":"李世民","era":"唐","region":"中国","role":"皇帝/政治家","gender":"male","tags":{"隐忍":5,"谋略":4,"革新":3,"兼济":2},"outcome":"success","summary":"唐朝第二位皇帝，玄武门之变后登基，开创贞观之治，被尊为'天可汗'。","common":["你和他一样心里有杆秤，大事上沉得住气，不轻易亮底牌","你俩都是目标感很强的人，认准的事愿意下笨功夫等时机","你和他一样听得进批评，别人说得对，你愿意改"],"analysis":"李世民能成功，靠的是隐忍加果决。他跟随父亲起兵立下大功，却被哥哥压着，他没硬拼，而是隐忍蓄力，抓住时机发动玄武门之变登基。上台后他反而更谦虚，把曾经的对手魏征当镜子，虚心纳谏、轻徭薄赋，让百姓休养。内政清明、边境安宁，二十多年攒出贞观之治。这说明：赢得一时不算赢，赢完还收着用权力才是真本事。","lesson":["遇事先分清'能忍'和'该忍'，他忍是为了等更好的出手时机，不是怂","赢的时候别飘，学他赢了之后反而更谦虚、更愿意听意见","用人的最高境界是让对的人干对的事，别什么都自己扛"],"type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"yangguifei","name":"杨贵妃","era":"唐","region":"中国","role":"贵妃/舞蹈家","gender":"female","tags":{"奢靡":5,"重情":4,"豪放":4,"婉约":3},"outcome":"tragic","summary":"唐玄宗最宠爱的妃子，通音律善歌舞，安史之乱中随玄宗西逃，死于马嵬坡。","common":["你和她一样爱美爱艺术，唱歌跳舞、打扮自己都能让你开心","你俩都重感情，爱上一个人就全身心投入，不计较得失","你和她一样活在当下，享受眼前的美好，很少想长远的事"],"analysis":"杨贵妃的悲剧，本质是宠爱没配上权力。她凭歌舞和美貌赢得玄宗独宠，杨家跟着鸡犬升天，堂兄杨国忠把持朝政。安史之乱爆发，叛军直逼长安，玄宗携她西逃。到马嵬坡，禁军哗变，逼死杨国忠，又怕她日后报复，非要她死。玄宗保不住她，一代美人成了替罪羊。这说明：靠别人给的宠爱立足，风一吹就散，命运始终捏在别人手里。","lesson":["靠山山会倒，别把人生全押在一个人或一段关系上","享受生活没问题，但记得留点清醒，多留意周围的变化和风险","越顺风顺水越要管好身边的'猪队友'，别让家人朋友给你埋雷"],"type":"风流","title":"惊才绝艳的风流人物"},{"id":"zhaokuangyin","name":"赵匡胤","era":"北宋","region":"中国","role":"开国皇帝/军事家","tags":{"谋略":5,"谨慎":4,"务实":3,"变通":3,"理性":2},"outcome":"success","summary":"陈桥兵变黄袍加身建立宋朝，杯酒释兵权终结五代乱世。","common":["你懂得收放，该强势时绝不手软","你做事讲究方法，能文能武","你重实际，不爱空谈"],"analysis":"他在五代乱世中脱颖而出，靠的不是蛮力，而是每一步都算得清：陈桥兵变前威望已立、兵权在握；杯酒释兵权更是用最小代价解决最大隐患。他深知武将拥立是祸根，宁可自损兵权也要换长治久安。重文抑武带来文治辉煌，也埋下积弱隐患——任何选择都有代价，聪明在于看清并承担代价。","lesson":["实力是底气，但更要懂得在顶峰时主动收手","解决问题要挑成本最低的时机和方式","制度设计比个人能力更能决定长远的成败"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"fanzhongyan","name":"范仲淹","era":"北宋","region":"中国","role":"政治家/文学家","tags":{"兼济":5,"理想":4,"坚韧":4,"自律":3,"革新":3},"outcome":"success","summary":"先天下之忧而忧的一代名臣，庆历新政的发起者。","common":["你心里装着更大的事，不甘于只为自己活","你对自己要求高，生活简朴","你认准的道理，撞了南墙也不回头"],"analysis":"他出身贫寒，划粥断齑苦读成才，比谁都懂民间疾苦。入仕后敢说敢做，三起三落不改“先忧后乐”的初心。庆历新政推行一年多便失败，却为后来王安石变法探了路。他一生未真正大权在握，但人格与文章立住了千年声望——有些成功不在当世，而在身后。","lesson":["理想主义者的底气，是把苦日子过成自己的资本","被贬不可怕，可怕的是被贬之后没了自己","有些事现在做不成，也要做，因为后人会接着做"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"wanganshi","name":"王安石","era":"北宋","region":"中国","role":"政治家/文学家","tags":{"革新":5,"固执":4,"理想":4,"坚韧":3,"务实":2},"outcome":"fail","summary":"“拗相公”王安石，主持熙宁变法却最终人亡政息。","common":["你认定的事，十头牛也拉不回来","你相信制度能改变世界","你不太在意别人的脸色"],"analysis":"他有改变国家的决心和完整蓝图，青苗、免役、市易都直指积弊，但太相信自己的判断，听不进反对声，用人又识人不明，把投机者当心腹。神宗一死，旧党反扑，新法尽废。他的失败不是理想错了，而是推行太急太硬——改革是门技术活，光有正确和勇气远远不够。","lesson":["方向对不等于方法对，推行节奏比蓝图更重要","听不进反对意见，等于给对手递刀子","用人失察是改革者最贵的学费"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"simaguang","name":"司马光","era":"北宋","region":"中国","role":"史学家/政治家","tags":{"谨慎":5,"循规":4,"务实":3,"自省":3,"守旧":3},"outcome":"success","summary":"砸缸救人的神童，用十九年写成《资治通鉴》。","common":["你做事稳，先想清楚再动手","你尊重规则和传统","你肯下笨功夫，耐得住寂寞"],"analysis":"他和王安石针锋相对，一个激进改革，一个稳健守成。反对变法或有保守之处，但他不是空喊——花十九年编成《资治通鉴》，用历代兴亡给皇帝上课，这种踏实本身就是力量。他掌权后尽废新法未必全对，但始终坚持自己相信的东西。稳是他最大的武器，也是他的局限。","lesson":["快有快的风险，慢有慢的复利","反对一件事，最好先拿出比对方更扎实的东西","耐得住寂寞的人，时间会给他答案"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"sushi","name":"苏轼","era":"北宋","region":"中国","role":"文学家/书画家","tags":{"乐观":5,"随性":4,"豪放":4,"重情":3,"自省":2},"outcome":"retreat","summary":"一蓑烟雨任平生，把贬谪人生过成诗酒江湖的千古第一文人。","common":["你心态好，天塌下来当被盖","你爱吃爱玩，生活有滋有味","你朋友多，走到哪儿都有人惦记"],"analysis":"他一生三次被贬，最远到海南，换别人早垮了。但他每到一个地方就吃当地、写当地、修当地，把流放地变成作品产地。秘诀是把人生目标从“当大官”调成“好好活”，加上诗词书画样样顶尖，走到哪都有价值。他不是没痛苦，而是选择用旷达消化痛苦——这是被命运反复捶打练出的真功夫。","lesson":["改变不了环境，就改变活法，日子照样能过出花","有一门真本事，走到哪儿都不慌","幽默和美食，是治愈人生的两味良药"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"liqingzhao","name":"李清照","era":"南宋","region":"中国","role":"词人","tags":{"婉约":5,"重情":4,"坚韧":3,"抗争":2,"自省":2},"outcome":"tragic","summary":"千古第一才女，从“争渡争渡”的明媚到“凄凄惨惨戚戚”的苍凉。","common":["你情感细腻，对人对事都走心","你才华藏不住，但感情是你最大的软肋","你外表柔软，骨子里却硬气"],"analysis":"她前半生是才女配才子的神仙爱情，后半生国破、夫亡、再嫁遇人不淑、文物散尽，把人间苦都尝遍。但她没沉下去，晚年还在整理《金石录》，写下“生当作人杰”。她的悲剧是时代给的：乱世里才华横溢的女人，护不住自己在乎的一切。才华和深情救不了你，能救你的只有实力和清醒。","lesson":["深情可以，但别把整个人生押在另一个人身上","乱世靠才华活命，太平盛世更要给自己攒底气","痛苦会来，但写作和热爱能接住你"],"gender":"female","type":"文宗","title":"名垂青史的文宗"},{"id":"yuefei","name":"岳飞","era":"南宋","region":"中国","role":"军事家/民族英雄","tags":{"重义":5,"坚韧":4,"自律":4,"理想":4,"务实":2},"outcome":"tragic","summary":"精忠报国的抗金名将，直捣黄龙前夜被十二道金牌召回。","common":["你认死理，对就是对，错就是错","你带团队靠身先士卒，自己先做到","你心里有家国，装不下蝇营狗苟"],"analysis":"他军事上几乎无敌，岳家军打得金军喊“撼山易撼岳家军难”，却输在政治上：一心迎回二圣，却看不懂宋高宗怕什么——真把徽钦二帝迎回来，皇位怎么办？他不站队、不妥协、直言犯上，最后“莫须有”三字送命。军事天才死于政治幼稚：能力再强，也要先看懂牌桌上真正的规则。","lesson":["业务能力是保命符，但看不懂政治格局照样出局","可以正直，但别在复杂的局里做透明人","选择平台时，先看清老板真正的底线和恐惧"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"qinhui","name":"秦桧","era":"南宋","region":"中国","role":"宰相","tags":{"谋略":5,"重利":4,"变通":3,"现实":3,"隐忍":2},"outcome":"fail","summary":"以“莫须有”罪名害死岳飞，遗臭万年的千古奸臣。","common":["你精于算计，做事永远先算自己的账","你识时务，风向一变你比谁都快","你目标感极强，为达目的不惜代价"],"analysis":"论能力他不差，两度拜相，在南宋政坛翻云覆雨二十年。但他的成功全部建立在迎合皇帝私心、铲除异己之上：高宗不想打，他就力主和议；岳飞碍事，他就构陷杀害。他赢了权力，却输掉了名字——千年跪在岳庙前，人人唾骂。人生这笔账，算得再精，把良心赔进去，最后清算时输得精光。","lesson":["能力用在歪处，爬得越高摔得越惨","别把“识时务”当成没有底线的借口","历史会给每个人记账，别只看眼前这一笔"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"xinqiji","name":"辛弃疾","era":"南宋","region":"中国","role":"词人/将领","tags":{"豪放":5,"理想":5,"抗争":4,"重义":3,"坚韧":2},"outcome":"fail","summary":"“醉里挑灯看剑”的文武全才，一生请缨北伐却报国无门。","common":["你一身本事，却总觉得没被用对地方","你热血未凉，谈起理想眼睛会发光","你心里憋着一股劲，说不出来就写出来"],"analysis":"二十出头就带五十骑闯金营擒叛徒，是真刀真枪干过的人。南归后不断上书北伐，《美芹十论》把战略讲得清清楚楚，但南宋只想偏安，他被闲置二十年，只能把热血写进词里。他的失败不在能力，在时代——一个主战派生在一个不想打的国家。才华无处安放是折磨，但他把折磨变成了千古词章。","lesson":["平台不对时，先保住本事，别把才华浪费在抱怨上","大环境不支持时，小目标也能安放热血","写下来，说出来，憋着的东西会变成内伤"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"luyou","name":"陆游","era":"南宋","region":"中国","role":"诗人","tags":{"理想":5,"坚韧":4,"抗争":3,"重情":3,"固执":2},"outcome":"fail","summary":"一生渴望收复中原的爱国诗人，“王师北定中原日”的绝笔遗恨。","common":["你心里一直装着没完成的事","你痴情又长情，有些事一辈子放不下","你活得久，是因为心里有火"],"analysis":"他活到八十五岁，写诗上万首，大半辈子在喊北伐、盼统一。他见过沦陷区的惨状，也见过朝廷的苟且，一次次上书一次次失望。他和唐婉的爱情是毕生之痛，想要的两样——收复中原、与爱人相守——都没成。但他把遗憾酿成了诗，成了南宋诗坛最亮的星。有些失败，换个维度看就是另一种圆满。","lesson":["放不下的执念，可以变成持续的动力","大愿未了，就先做好眼前能做的小事","把遗憾写出来、说出来，别让它烂在心里"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"wentianxiang","name":"文天祥","era":"南宋","region":"中国","role":"丞相/民族英雄","tags":{"重义":5,"抗争":5,"理想":4,"坚韧":3,"直率":2},"outcome":"tragic","summary":"“人生自古谁无死，留取丹心照汗青”的南宋最后一任丞相。","common":["你骨子里有股宁折不弯的劲","你认准的道义，拿命换也愿意","你活得通透，早就想明白了生死"],"analysis":"南宋灭亡时他本可像其他人一样投降，元朝开出的条件不差，忽必烈亲自劝降，许他宰相之位，但他选择死。不是不怕死，他写“留取丹心照汗青”，把死当成给历史的交代。他输了战争，却赢了中国读书人千年的脊梁。他的悲剧是给灭亡的王朝陪葬，但正是这种“傻”，让投降派在他面前无地自容。","lesson":["有些底线，比命重要","在所有人都妥协时，坚持原则就是最大的力量","你选择怎么死，往往定义了你怎么活"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"baozheng","name":"包拯","era":"北宋","region":"中国","role":"名臣/清官","gender":"male","tags":{"直率":5,"自律":4,"务实":4,"理性":3,"循规":2},"outcome":"success","summary":"北宋名臣，铁面无私、明察秋毫，断案重证据轻口供，人称'包青天'。","common":["你和他一样眼里揉不得沙子，看到不公平的事就想站出来","你俩都是认规矩的人，觉得照章办事比讲人情更踏实","你和他一样说到做到，答应别人的事就一定办到"],"analysis":"包拯的成功，靠'不贪'和'敢说'做到极致。他做官几十年，从不收礼徇私，弹劾权贵不看脸色，皇亲国戚也敢告，皇帝的面子也敢驳。办案不信口供信证据，亲自查证，冤案自然少。宋仁宗时代风气宽松，容得下硬骨头，朝廷也需要清官制衡权贵。天时、性格、口碑凑齐，他一路升到枢密副使，死后成了百姓供奉的'包青天'。","lesson":["原则要硬，方法要软，他刚直但不莽撞，弹劾前先把证据查实","把'不贪'当底线，短期看吃亏，长期看是最稳的护身符","想服人别靠嗓门，靠事实和证据，学他重调查、轻猜疑"],"type":"谋主","title":"运筹帷幄的谋主"},{"id":"chengjisihan","name":"成吉思汗","era":"蒙古","region":"中国","role":"军事家/政治家","tags":{"冒险":5,"谋略":5,"坚韧":4,"自信":4,"务实":2},"outcome":"success","summary":"从草原孤儿到横跨欧亚的帝国之主，一代天骄成吉思汗。","common":["你目标感极强，认准的事不惜一切代价","你越挫越勇，低谷反而让你更狠","你重实际，不看过程看结果"],"analysis":"他九岁丧父，被部落抛弃，和母亲在河边捡果子活命，却把苦难变成燃料：团结能团结的，消灭敢消灭的，用千户制把松散部落拧成战争机器。他打仗不莽，情报、谋略、心理战样样精通，把个人复仇升级成制度优势。草原上最强的不是最勇的，而是最能组织的——残忍是他的阴影，组织天才是他的底色。","lesson":["苦难不是用来抱怨的，是用来练级的","个人英雄走不远，把一群人组织成系统才是真本事","目标要狠，手段要理性，情绪要放一边"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"hublie","name":"忽必烈","era":"元","region":"中国","role":"开国皇帝","tags":{"变通":5,"入世":4,"谋略":4,"务实":4,"自信":2},"outcome":"success","summary":"建立元朝、定都大都的马上皇帝，也是第一个认真学汉法的蒙古大汗。","common":["你开放包容，什么有用学什么","你不拘一格，敢用不同背景的人","你眼光长远，愿意为大局弯腰"],"analysis":"他能赢下汗位之争，关键是比对手更懂“变”：别人只想放马，他学着种地、用汉臣、建都城，把游牧政权转型成能统治农耕中国的王朝。他重用汉人儒臣，也保留蒙古传统，是实用主义混搭。成吉思汗能打天下，只有忽必烈这种肯弯腰学汉法的才坐得住天下。真正的高手不是坚持自己，而是吸收一切能让自己赢的东西。","lesson":["换个环境先别急着较劲，先学人家的规矩","包容不是软弱，是把别人的长处变成自己的武器","转型期最忌端着老一套不放"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"zhuyuanzhang","name":"朱元璋","era":"明","region":"中国","role":"开国皇帝","tags":{"坚韧":5,"务实":4,"节俭":4,"爆发":3,"谨慎":2},"outcome":"success","summary":"从放牛娃、和尚到开国皇帝，中国历史上出身最低的帝王。","common":["你白手起家，最懂底层的不容易","你对自己狠，对别人也狠","你记性好，谁帮过你谁坑过你，都记得清清楚楚"],"analysis":"他讨过饭、当过和尚，靠敢拼敢杀走到权力顶峰，又靠“高筑墙、广积粮、缓称王”的低调策略熬死所有对手。登基后惩治贪官、减免赋税，对老百姓是真上心。但他的成功藏着巨大代价：极度的不安全感让他晚年大杀功臣，把帝国变成家天下。从乞丐到皇帝是奇迹，但童年的创伤让他永远无法信任别人。","lesson":["出身低不是天花板，是让你更懂人心的资本","成功路上学会藏锋，树大招风","别让过去的伤害，变成对所有人的不信任"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"zhudi","name":"朱棣","era":"明","region":"中国","role":"皇帝","tags":{"冒险":5,"谋略":4,"自信":4,"革新":3,"务实":2},"outcome":"success","summary":"靖难之役夺位登基，迁都北京、派郑和下西洋的永乐大帝。","common":["你敢赌，别人不敢动的局你敢掀桌","你执行力极强，说干就干","你坐不住，天生是要干大事的人"],"analysis":"他本没资格当皇帝，侄子一削藩他就反了，以燕王一隅对抗全国，四年翻盘。登基后把赌性变成国力：迁都北京、修《永乐大典》、派郑和七下西洋、五征漠北，件件大手笔。但他赢在果断，也狠在残暴，诛方孝孺十族。历史记住他的文治武功，代价是无数人的血——赌徒赢了，输家只能认命。","lesson":["机会是抢来的，不是等来的","大动作要配大格局，不然就是瞎折腾","赢要赢得干净，手段太脏会写进历史"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"zhenghe","name":"郑和","era":"明","region":"中国","role":"航海家/外交家","tags":{"冒险":5,"务实":3,"坚韧":3,"社交":3,"自信":2},"outcome":"success","summary":"七下西洋、最远抵达非洲东海岸的明代大航海家。","common":["你好奇心重，世界那么大你想去看看","你善于跟各种人打交道","你做事细致，大事小事都安排得明明白白"],"analysis":"他本是云南的回族少年，被明军掳为太监，却靠才能成为朱棣最信任的人。七下西洋，船队两万多人，最远到非洲，比哥伦布早近百年。他能成功，一是背后有强大国力，二是外交手腕一流——不抢不占，以和平贸易为主，走到哪儿朋友交到哪儿。遗憾是航海没变成国策，船队被废弃，但他证明了中国曾站在世界航海顶端。","lesson":["个人的舞台背后，是平台的实力","会做人比会打仗更能走远","趁平台支持时，把想做的事做透，别留遗憾"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"wangyangming","name":"王阳明","era":"明","region":"中国","role":"思想家/军事家","tags":{"自省":5,"坚韧":4,"革新":4,"入世":3,"谋略":3,"理性":2},"outcome":"success","summary":"龙场悟道创立心学，“知行合一”影响了整个东亚的思想家。","common":["你爱琢磨自己，遇事先问心","你相信内心的力量","你嘴上说躺平，心里其实想成事"],"analysis":"他得罪刘瑾被贬贵州龙场，一个鸟不拉屎的地方，随从都病倒了，他反而在那里悟出“心即理”。此后一边讲学一边打仗，平宁王之乱、平匪患，文臣带兵百战百胜，靠的就是知行合一——想明白就去做，做中学、学中做。他一生坎坷却越挫越强，把一切磨难当成修心的材料。心学是他用一辈子验证过的操作系统。","lesson":["困境不是来打败你的，是来给你悟道的","知道和做到之间，隔着整个人生","事上练，才是最快的成长方式"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"tangyin","name":"唐寅","era":"明","region":"中国","role":"画家/诗人","tags":{"随性":5,"豪放":4,"直率":3,"奢靡":2,"乐观":2},"outcome":"fail","summary":"“江南第一风流才子”，一场科场案断送仕途，从此放浪形骸。","common":["你才气外露，藏都藏不住","你活得随性，讨厌被规矩绑着","你得意时挥霍，失意时颓废，情绪大起大落"],"analysis":"他二十多岁乡试第一，人人说状元非他莫属，结果会试卷入科场舞弊案，虽查无实据，功名却永远没了。这件事把他打崩了：老婆跑了，他从此纵情声色、卖画为生，“别人笑我太疯癫，我笑他人看不穿”。他的画越来越好，人也越来越颓。一次挫折就放弃所有向上的可能，才华反而成了逃避现实的借口。","lesson":["一次挫折毁不掉你，能毁掉你的是从此不再努力","才华是天赋，自律才是把天赋变现的能力","风流可以，别拿堕落当洒脱"],"gender":"male","type":"风流","title":"惊才绝艳的风流人物"},{"id":"lishizhen","name":"李时珍","era":"明","region":"中国","role":"医药学家","tags":{"务实":5,"坚韧":4,"创新":4,"谨慎":3,"独处":2},"outcome":"success","summary":"用二十七年走遍山川、尝遍百草，编成《本草纲目》的药圣。","common":["你做事较真，数据不对你睡不着","你愿意为一件大事搭上十年二十年","你不迷信权威，只信亲眼所见"],"analysis":"他家世代行医，自己也考过功名，却因体弱多病弃官从医。当时医书错误百出，他决定自己重编，二十七年间走遍大江南北，亲自采药尝药，连太医院院判的职位都辞了——药典错一个字，害的是千条人命。他的成功没有捷径，就是笨功夫加真较真，把《本草纲目》磨成了世界级经典。","lesson":["慢功夫才是真功夫，快钱买不来真本事","权威的话也要拿事实检验","把一件事做到极致，时间会给你背书"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"qijiguang","name":"戚继光","era":"明","region":"中国","role":"军事家","tags":{"创新":5,"务实":4,"自律":4,"谋略":3,"抗争":2},"outcome":"success","summary":"组建戚家军、横扫倭寇的民族英雄，也是军事改革的先行者。","common":["你不信老一套，总想搞点新打法","你带队伍有一套，人人服你","你既能冲锋陷阵，也能坐下来算账"],"analysis":"明朝军队当时烂到打不过海盗，他偏不信邪：从义乌招矿工组新军，发明鸳鸯阵，针对倭寇特点设计武器阵法，还自掏腰包搞装备。戚家军百战百胜，倭寇闻风丧胆。他既懂战术创新，又会经营人脉，在张居正支持下放开手脚，晚年却被牵连郁郁而终。他的成功证明：改变不了大环境，就先把一亩三分地干到极致。","lesson":["抱怨环境不如改造自己的一亩三分地","创新不是灵光一现，是对细节的死磕","再能打也要有支持你的人，别孤军奋战"],"gender":"male","type":"名将","title":"驰骋沙场的名将"},{"id":"kangxi","name":"康熙","era":"清","region":"中国","role":"皇帝","tags":{"务实":4,"坚韧":4,"变通":4,"自律":3,"自信":3},"outcome":"success","summary":"八岁登基、擒鳌拜、平三藩、收台湾、打沙俄的千古一帝。","common":["你学什么都快，而且肯下苦功","你该忍时忍，该狠时狠，分寸拿捏得准","你精力旺盛，兴趣广泛"],"analysis":"他八岁登基，十四岁亲政，十六岁擒鳌拜，二十岁开始平三藩，八年苦战硬扛下来。他厉害在务实：一边学汉文化，一边保持骑射传统；对沙俄边打边谈，签《尼布楚条约》划清边界。用人也大胆，汉人满人谁行用谁。他的成功是“全都要”的成功——文治武功、隐忍果断样样兼顾，把清朝推上第一个盛世。","lesson":["多学多练，跨界能力是你的护城河","该忍的时候忍得住，该出手时别犹豫","定下大目标，用十年时间去打"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"qianlong","name":"乾隆","era":"清","region":"中国","role":"皇帝","tags":{"自信":5,"奢靡":4,"务实":3,"守旧":3,"自律":2},"outcome":"success","summary":"自称“十全老人”的盛世之君，把清朝推向顶峰也埋下衰落伏笔。","common":["你运气好，接手的就是好牌","你爱享受，也舍得花钱","你自我感觉良好，听不得太多批评"],"analysis":"他接手康熙雍正攒下的家底，本身也勤政，六下江南、十全武功，把清朝推向极盛。但成功里藏着巨大隐患：好大喜功，晚年宠和珅，吏治腐败；闭关锁国，把西方工业革命关在门外；文字狱搞得人人自危。他活着时是盛世，死后五十年鸦片战争就来了。站在顶峰时最危险，因为你看到的世界全是自己的倒影。","lesson":["顺风局更要听逆耳的话","享受可以，别把家底花光","你看不上的新事物，可能是未来在敲门"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"heshen","name":"和珅","era":"清","region":"中国","role":"权臣","tags":{"谋略":5,"重利":5,"社交":4,"奢靡":4,"隐忍":2},"outcome":"fail","summary":"乾隆第一宠臣，富可敌国的大贪官，嘉庆登基十五天就被赐死。","common":["你情商极高，领导想什么你秒懂","你对钱有执念，越多越踏实","你善于经营关系，人人夸你会来事"],"analysis":"他出身寒微，靠揣摩圣意、办事漂亮一步步成为乾隆最离不开的人。他确实有能力：精通满汉藏语，理财是把好手，乾隆明知道他贪也舍不得动。但他贪得没边，家产抵得上国库二十年收入，乾隆一死，嘉庆抄家赐死。他输在把“被需要”当成“不可替代”——靠山会倒，本事才是自己的，而他的本事全长在讨好上。","lesson":["会来事是加分项，核心竞争力才是保命符","贪来的都是替别人攒的，早晚连本带利还","别把命运押在一个人身上，哪怕他再宠你"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"linzexu","name":"林则徐","era":"清","region":"中国","role":"政治家","tags":{"抗争":5,"务实":4,"重义":4,"直率":3,"坚韧":2},"outcome":"fail","summary":"虎门销烟的民族英雄，“苟利国家生死以”的禁烟大臣。","common":["你认准大是大非，敢站出来","你做事有担当，不推锅","你重原则，代价再大也不含糊"],"analysis":"他受命禁烟，虎门一把火烧掉两万箱鸦片。但他低估了两件事：英国人的炮，朝廷的软。鸦片战争一败，道光立刻拿他当替罪羊，革职流放伊犁。他走前留下“苟利国家生死以，岂因祸福避趋之”。他个人失败了，却让中国人第一次看见睁眼看世界的必要。他的悲剧是：先觉醒的人，总是先挨打。","lesson":["坚持对的事，但也要算清楚对手的实力","功劳可能被抢，锅一定会被甩，提前想好退路","清醒的人被误解是常态，别因此怀疑自己"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"zengguofan","name":"曾国藩","era":"清","region":"中国","role":"政治家/军事家","tags":{"自省":5,"坚韧":5,"自律":4,"务实":3,"隐忍":2},"outcome":"success","summary":"屡败屡战练出湘军，平定太平天国，中兴名臣之首。","common":["你信“笨功夫”，觉得聪明不如坚持","你每天反省自己，写日记那种","你越挫越勇，被打趴下还能爬起来"],"analysis":"他天资不算高，考秀才考了七次才中，练兵也老打败仗，投江自杀过两回。但他有个绝活：复盘，每次失败都写日记骂自己，再调整打法，硬把湘军磨成劲旅。平定太平天国后主动裁军、交出权力，躲过兔死狗烹。他一生“尚拙”，靠自省和坚持完成从笨人到圣人的逆袭——把每件小事做到极致，剩下的交给时间。","lesson":["笨不可怕，怕的是不反省","复盘是普通人最便宜的成长方式","功高震主时，主动退一步反而走得远"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"lihongzhang","name":"李鸿章","era":"清","region":"中国","role":"政治家/外交家","tags":{"务实":5,"变通":4,"隐忍":4,"谋略":3,"现实":3},"outcome":"fail","summary":"晚清“裱糊匠”，办洋务、签条约，背了一辈子骂名。","common":["你总在收拾烂摊子，干最难的活","你深知现实残酷，说话做事都留余地","你忍辱负重，被人骂也不辩解"],"analysis":"他是晚清最能干也最憋屈的人：办北洋水师、建工厂、搞外交，一个人缝补将塌的王朝。甲午战败、割地赔款全是他签的字，背上一世骂名。他心里清楚洋务救不了大清，但别无选择。他的失败是时代的失败：在错误的系统里，个人能力越强，只是把崩溃推迟一点。裱糊匠再高明，也糊不住塌下来的天。","lesson":["别在注定下沉的船上耗尽一生，及时评估止损","背锅的人要留好自保的证据和退路","系统错了，个人再努力也是白费，选对平台很重要"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"zuozongtang","name":"左宗棠","era":"清","region":"中国","role":"军事家/政治家","tags":{"自信":5,"务实":4,"抗争":4,"直率":3,"坚韧":3},"outcome":"success","summary":"抬棺出征收复新疆，“身无半亩，心忧天下”的硬骨头。","common":["你脾气大，但本事更大","你说话直，但句句在点子上","你认准的事，豁出命也要干成"],"analysis":"他四十岁才出山，科举没考上，全靠真本事打出来。最精彩的一仗是收复新疆：朝廷上下都主张放弃，只有他坚持寸土不让，借钱打仗、抬棺出征，硬把新疆从阿古柏手里抢回来。他性格火爆，跟曾国藩、李鸿章都吵过，吵完事照干。他的成功靠“自信加实干”：认死理，敢拍板，打下来的土地就是自己的底气。","lesson":["别怕跟人吵，把事办成了才是硬道理","别人都放弃时，坚持的人会赢","实力是你说话最大声的底气"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"cixi","name":"慈禧","era":"清","region":"中国","role":"太后/掌权者","tags":{"谋略":5,"现实":4,"隐忍":4,"守旧":3,"自信":3},"outcome":"success","summary":"从秀女到垂帘听政近半个世纪，晚清实际上的掌舵人。","common":["你权力欲强，喜欢掌控局面","你识人用人有一套，恩威并施","你现实冷酷，感情放一边，利益放中间"],"analysis":"她靠生下同治上位，又发动辛酉政变除掉顾命八大臣，掌权近五十年。她确实有政治手腕：平衡满汉、驾驭大臣、在列强间周旋。但她守旧误国，挪用海军军费过寿，把国家拖进深渊。她赢了自己的人生，输了大清的江山——精致的利己的终极代价，就是赢了当下，输了历史。","lesson":["权力是把双刃剑，拿到手之前先想好用来干什么","私欲和国家利益冲突时，选错一次就万劫不复","活得久、忍得狠，是政治家的基本功，但不是美德"],"gender":"female","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"kangyouwei","name":"康有为","era":"清","region":"中国","role":"思想家/改革家","tags":{"理想":5,"革新":5,"自信":4,"冒险":3,"务虚":2},"outcome":"fail","summary":"戊戌变法的旗手，“公车上书”拉开维新序幕，百日维新而败。","common":["你脑洞大，敢想别人不敢想的","你口才好，能说服一群人跟你走","你理想丰满，但对现实阻力估计不足"],"analysis":"他思想超前，写《新学伪经考》重解儒家经典为变法造势，公车上书更是知识分子集体参政的开山之举。光绪被他说动，百日维新轰轰烈烈，一百零三天就失败：他低估了慈禧和守旧派，也拿不出可落地的方案。流亡海外后思想停滞，保皇保到民国。改革不能只靠嘴和皇帝，要有人、有枪、有方案。","lesson":["喊口号之前，先想清楚怎么落地","改革要团结一切能团结的，别树敌太多","理想会过时，别停在二十岁的自己"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"liangqichao","name":"梁启超","era":"近代","region":"中国","role":"思想家/学者","tags":{"变通":5,"创新":4,"社交":4,"入世":3,"乐观":3},"outcome":"success","summary":"维新变法的急先锋，也是思想启蒙的大师，“少年强则国强”的作者。","common":["你脑子转得快，风向变了你第一个转弯","你爱交朋友，走到哪都有一群同道","你乐观，相信明天会更好"],"analysis":"他和康有为一起搞维新，失败后流亡日本，但他比老师高明：康有为停在保皇，他却一路进化，从改良到革命、从保皇到共和，思想永远跟着时代跑。办《新民说》，用一支笔唤醒一代青年，“少年强则国强”至今回响。政治上他屡战屡败，思想上的成功却远超政治——输掉每场具体的仗，赢了一个时代的人心。","lesson":["昨天的正确可能成为今天的枷锁，要敢于自我推翻","写出来、说出来，影响力是另一种成功","跟上时代不是墙头草，是活到老学到老"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"sunzhongshan","name":"孙中山","era":"近代","region":"中国","role":"革命家","tags":{"理想":5,"坚韧":5,"抗争":4,"冒险":3,"自信":3},"outcome":"success","summary":"领导辛亥革命推翻两千多年帝制的国父，“天下为公”的践行者。","common":["你心里有远大理想，且愿意搭上一辈子","你失败了无数次，但从不认输","你走到哪儿都有人愿意跟你干"],"analysis":"他早年学医，看清“医人不如医国”，从此走上革命路。从1895年到1911年，十六年间十次起义十次失败，一直流亡海外，却一次次筹款、组党、再来。武昌起义成功，他当上临时大总统，很快让位袁世凯，革命果实被窃取。他至死都在奋斗，留下“革命尚未成功，同志仍须努力”。一个人用信念撬动了整个时代。","lesson":["大目标要拆成无数次小行动，失败只是数据","理想主义要配上“再来一次”的韧性","把个人得失放小，把事业做大，才有人跟你走"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"luxun","name":"鲁迅","era":"近代","region":"中国","role":"文学家/思想家","tags":{"直率":5,"抗争":5,"自省":4,"悲观":3,"坚韧":2},"outcome":"success","summary":"以笔为刀的“民族魂”，用《呐喊》《彷徨》解剖国民性。","common":["你看问题一针见血，说话不爱绕弯","你眼里揉不得沙子，看不惯就写","你外表冷漠，内心其实滚烫"],"analysis":"他弃医从文，因为发现中国人病的不在身体而在精神。一支笔写透国民性：阿Q、孔乙己、祥林嫂，每个形象都是一把手术刀。他被人骂、被通缉、被围攻，但“横眉冷对千夫指”，越骂越写。他自称悲观，却一辈子没停止战斗。他的成功不在生前——活着时他常觉得自己失败，但他用文字给几代人装了脊梁。","lesson":["有话直说，但要说到点子上","看清了黑暗还选择战斗，才是真乐观","文字和思想，是普通人最锋利的武器"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"qiujin","name":"秋瑾","era":"清末","region":"中国","role":"革命家/女权先驱","gender":"female","tags":{"抗争":5,"革新":5,"理想":4,"豪放":4,"直率":3},"outcome":"tragic","summary":"近代民主革命志士，自号'鉴湖女侠'，赴日留学、加入同盟会，创办《中国女报》呼吁男女平权，组织起义事败，就义于绍兴轩亭口。","common":["你和她一样，看见不平事就热血上头，想拍案而起","你俩都敢想敢干，认定了'这事该改'，就绝不只停在嘴上","你和她一样不愿意被旧规矩困住，想要活出自己的样子"],"analysis":"秋瑾生在一个女人必须缠足、嫁人、相夫教子的年代，却把'反抗'活成了人生主题。抛下包办婚姻去日本留学，加入同盟会，办《中国女报》喊出'男女平权'，还亲自策划起义。起义事泄后她本可脱身，却留下来说'革命要流血才会成功'，在绍兴轩亭口从容就义，年仅三十二岁。她败给了时代的黑暗，却用血唤醒了一代人。","lesson":["理想再大也要先保全自己，'留得青山在'才能继续战斗","为群体发声值得尊敬，但行动前先评估风险，别做无谓的牺牲","别等条件都成熟才开始，很多事等不起，边干边创造条件"],"type":"革新者","title":"开风气的革新者"},{"id":"songqingling","name":"宋庆龄","era":"近现代","region":"中国","role":"政治家/革命家","gender":"female","tags":{"理想":5,"坚韧":5,"兼济":5,"重情":3},"outcome":"success","summary":"孙中山先生夫人，近现代杰出女性领袖，毕生追随革命理想，新中国成立后担任国家名誉主席，被誉为'国之瑰宝'。","common":["你和她一样心里装着更大的事，不满足于只过好自己的小日子","你俩都认死理：认准的信念，一辈子不动摇","你和她一样，越是艰难越站得直，从不向压力低头"],"analysis":"宋庆龄出身上海富商家庭，留学时听说辛亥革命成功，激动写下《二十世纪最伟大的事件》。她不顾全家反对嫁给孙中山，把命运绑在革命上。孙中山去世后，她顶住压力坚持三大政策，抗战时组织保卫中国同盟支援前线。她一生屡遭威逼利诱，从不改志。她赢在理想足够大、心志足够坚：别人看她失去很多，她说这是她唯一想要的路。","lesson":["找到一件值得托付一生的事，人生就不容易空虚","理想主义者也要有钢铁般的意志，光有热情撑不到最后","真正的幸福不是拥有多少，而是你坚信自己走在正确的路上"],"type":"谋主","title":"运筹帷幄的谋主"},{"id":"zhuowenjun","name":"卓文君","era":"西汉","region":"中国","role":"才女/音乐家","gender":"female","tags":{"随性":5,"抗争":4,"重情":3,"乐观":2},"outcome":"success","summary":"西汉才女，与司马相如一见倾心后连夜私奔，当垆卖酒不惧清贫，一首《白头吟》挽回变心的丈夫，白首偕老。","common":["你和她一样认准了人就敢赌，别人眼里的'不靠谱'你偏要试试","你俩都不太在乎世俗眼光，日子是自己的，不是过给别人看的","你和她一样，感情里受了委屈不会忍气吞声，会想办法把话说开"],"analysis":"卓文君守寡在家，一场宴会上司马相如弹了首《凤求凰》，她当场动心，当晚就跟他私奔。父亲气得断绝关系，她就去街上卖酒，逼得父亲为面子认了这门亲。后来司马相如想纳妾，她一首《白头吟》把丈夫劝了回来。她赢在敢爱敢赌，更赢在有才华撑腰——没有真本事，夜奔就只是一时冲动。","lesson":["为爱冲动可以，但先掂量自己有没有'兜底'的本事，才华和独立永远是你的底气","想要什么就主动争取，别把主动权交给别人，她连私奔都敢，你还怕开口吗","关系出问题别只哭闹，学她用一首诗把理讲透——沟通要讲策略"],"type":"文宗","title":"名垂青史的文宗"},{"id":"caiwenji","name":"蔡文姬","era":"东汉","region":"中国","role":"才女/音乐家","gender":"female","tags":{"坚韧":5,"重情":4,"婉约":3,"悲观":3},"outcome":"tragic","summary":"东汉才女，父亲蔡邕遇害、丈夫早逝，被匈奴掳走十二年，曹操重金赎回，凭记忆默写四百余篇古籍，作《悲愤诗》《胡笳十八拍》。","common":["你和她一样，痛过的事不会忘，但也不会被它压垮","你俩都重感情，每一次离别都要在心里消化很久","你和她一样心里装着很多话，只是不轻易对人说"],"analysis":"蔡文姬一生都被乱世推着走：父亲被杀，丈夫早死，自己被匈奴兵掳到塞外十二年，还生了两个孩子。曹操把她赎回来，她又得抛下亲生骨肉，改嫁给董祀。她从头到尾没得选，但她没垮：凭记忆默写出四百多篇散佚的古籍，把半生苦难写进《悲愤诗》。她的悲剧是时代的，她的坚韧是她自己的。","lesson":["人生无常，唯一能攥在手里的，是任何时候都不放弃的本事","被迫做选择时，先把眼前能做的事做好，路会慢慢宽起来","心里苦别硬扛，写下来、说出来，像她写诗一样给情绪一个出口"],"type":"文宗","title":"名垂青史的文宗"},{"id":"huamulan","name":"花木兰","era":"北魏","region":"中国","role":"传说女将/巾帼英雄","gender":"female","tags":{"豪放":5,"冒险":4,"抗争":4,"重情":4,"务实":2},"outcome":"success","summary":"北朝民歌《木兰辞》中的传奇女将，女扮男装代父从军，征战十二载，屡立战功，凯旋后拒受尚书郎之封，归乡侍奉双亲。","common":["你和她一样，家里有事第一个冲上去扛，嘴上还说不累","你俩都不喜欢被'女孩应该怎样'框住，想做的事就去做","你和她一样讲义气，答应别人的事，拼了命也会做到"],"analysis":"木兰的故事说到底是三件事：父亲年老体弱，她替父从军——这是担当；女扮男装混进军营，一藏十二年——这是胆识；功成名就，天子要封她尚书郎，她只要一匹千里马回家——这是清醒。她赢了战争，却没被功名冲昏头，知道家人比官职重要。一个既敢冲锋又懂收手的人，到哪儿都能赢。","lesson":["别让性别定义你的上限，能力到位了，谁都得服你","为家人扛事是担当，但也要量力而行，先保全好自己","功成名就时更要清醒，知道什么值得要、什么该放手"],"type":"名将","title":"驰骋沙场的名将"},{"id":"muguiying","name":"穆桂英","era":"北宋","region":"中国","role":"女将/统帅","gender":"female","tags":{"爆发":5,"自信":5,"抗争":4,"直率":3},"outcome":"success","summary":"杨家将中的传奇女将，原为穆柯寨寨主之女，武艺超群，与杨宗保结亲后归顺杨家，曾挂帅大破天门阵。","common":["你和她一样有本事就敢亮出来，从不藏着掖着","你俩都是急性子，看准了就上，不喜欢磨磨唧唧","你和她一样不服输，越是有人说你不行，你越要证明自己"],"analysis":"穆桂英本是穆柯寨的'山大王'，武艺高强、性子火爆。杨宗保去取降龙木，被她活捉，两人不打不相识结为夫妻。后来辽国摆下天门阵，杨家男将接连受挫，穆桂英临危受命挂帅，凭本事破了阵。她赢在从不因自己是女子就矮人一头：军令如山她敢接，千军万马她敢带，实力就是她最大的底气。","lesson":["别让'别人觉得你不行'定义你，用实力说话最硬气","机会来的时候别谦虚推让，先接住，再证明自己配得上","感情里旗鼓相当才长久，你和另一半都要能独当一面"],"type":"名将","title":"驰骋沙场的名将"},{"id":"lianghongyu","name":"梁红玉","era":"南宋","region":"中国","role":"女将/抗金英雄","gender":"female","tags":{"豪放":5,"抗争":5,"坚韧":4,"重义":3,"直率":2},"outcome":"tragic","summary":"南宋抗金女将，韩世忠之妻，黄天荡之战亲擂战鼓指挥水师，封安国夫人，后驻守楚州，金军来袭时力战殉国。","common":["你和她一样，认准的事就冲在最前面，绝不当缩头乌龟","你俩都爱憎分明，看不过眼的事一定要管","你和她一样，跟亲近的人并肩作战时最有力量"],"analysis":"梁红玉出身将门，嫁给抗金名将韩世忠后，没做养尊处优的夫人，而是跟着丈夫上战场。黄天荡一役，她站在船头擂鼓指挥，八千宋军硬是堵住十万金军四十八天，一战封'安国夫人'。可惜乱世不许英雄白头：绍兴五年她驻守楚州，金军来袭，她亲率人马迎战，力竭而亡。她的威名是自己挣的，她的死是那个时代欠她的。","lesson":["伴侣不是拿来依附的，是可以并肩作战的队友，一起成长才长久","关键时刻敢站出来的人，平时也要练好真本事，光靠热血撑不久","事业再拼，也要留一分小心保护自己，别把命都搭进去"],"type":"名将","title":"驰骋沙场的名将"},{"id":"lvhou","name":"吕后","era":"西汉","region":"中国","role":"政治家/皇后","gender":"female","tags":{"隐忍":5,"谋略":5,"爆发":3,"务实":4},"outcome":"success","summary":"刘邦之妻，从沛县农妇到临朝称制的第一位皇太后，诛韩信、囚戚夫人，掌权十五年，为'文景之治'打下底子。","common":["你和她一样能忍，受了委屈不急着发作，先记在心里掂量","你俩都是务实派，面子是虚的，把事办成才是真的","你和她一样，认准的目标会一条道走到黑，下手不含糊"],"analysis":"吕后嫁给刘邦时，刘邦一穷二白还带着私生子，她在家种地带孩子，一忍就是十几年。刘邦称帝后宠幸戚夫人，想废太子，她拉拢张良、保住刘盈，硬是把局势扳回来。刘邦一死，她立刻清算政敌，囚戚夫人、诛韩信，临朝称制十五年。她赢在把忍和狠用在了刀刃上：能忍时不冲动，能出手时绝不手软。","lesson":["受委屈不可怕，可怕的是沉不住气，先攒实力再谈翻盘","别把幸福全押在别人身上，自己手里有权有本事才靠得住","狠是手段不是目的，她晚年报复过头也留了骂名，见好就收"],"type":"谋主","title":"运筹帷幄的谋主"},{"id":"xiaozhuang","name":"孝庄太后","era":"清","region":"中国","role":"政治家/太后","gender":"female","tags":{"隐忍":5,"谋略":5,"变通":4,"理性":4},"outcome":"success","summary":"清太宗皇太极之妃、顺治帝生母、康熙帝祖母，历经三朝，辅佐幼主稳定政局，为'康乾盛世'奠基，史称'孝庄文皇后'。","common":["你和她一样能忍常人所不能忍，话到嘴边也能咽回去","你俩都看得透人心，谁是什么心思，你心里有本账","你和她一样不争虚名，只求把事情稳稳当当办成"],"analysis":"孝庄十三岁嫁给皇太极，在后宫熬了多年，儿子福临六岁登基时，内有摄政王多尔衮虎视眈眈，外有明朝残部未平。她周旋其间，稳住多尔衮，护住儿子，等顺治亲政。顺治早逝，她又把八岁的康熙扶上马，帮他除掉鳌拜、平定三藩。她赢在把'忍'用到了极致：该低头时低头，该出手时出手，两代幼主背后，都是她在掌舵。","lesson":["真正的强大不是事事争赢，而是能为了大局咽下委屈","教育下一代是最长线的投资，康熙的成就有她一半的功劳","局势不明时别急着亮底牌，先稳住局面，再等时机"],"type":"谋主","title":"运筹帷幄的谋主"},{"id":"linhuiyin","name":"林徽因","era":"近代","region":"中国","role":"建筑学家/诗人","gender":"female","tags":{"理想":5,"创新":4,"坚韧":4,"理性":3},"outcome":"success","summary":"中国第一代女建筑学家、诗人，与梁思成走遍全国考察古建筑，参与设计国徽、人民英雄纪念碑，病中仍为保护古建奔走。","common":["你和她一样心里有热爱，愿意为热爱吃苦受累","你俩都追求美，不管是建筑还是生活，都讲究个'讲究'","你和她一样，既有浪漫的一面，也有较真的一面"],"analysis":"林徽因十六岁随父游历欧洲，立下学建筑的志向，当时宾夕法尼亚大学建筑系不收女生，她注册美术系、选修建筑课，硬是把学分修满。回国后她和梁思成跑了十五省、两百多县，考察上千处古建筑，在颠簸骡车上测绘佛光寺。晚年她肺病缠身，还为保住北京城墙奔走。她赢在把浪漫和务实焊在了一起：爱美，更懂美是怎么造出来的。","lesson":["热爱是最好的老师，但光热爱不够，还要下笨功夫","规则不让你进时，先绕进去，用实力让规则为你改写","美和实用不冲突，理想和现实可以同时落地"],"type":"文宗","title":"名垂青史的文宗"},{"id":"zhangailing","name":"张爱玲","era":"近代","region":"中国","role":"作家","gender":"female","tags":{"独处":5,"理性":4,"悲观":4,"直率":3},"outcome":"retreat","summary":"中国现代文学史上独树一帜的女作家，出身没落贵族，少年成名，代表作《倾城之恋》《金锁记》，晚年深居简出，客死美国。","common":["你和她一样享受独处，人群里待久了会累，一个人反而自在","你俩都看得透，人情冷暖不用人教，你早看明白了","你和她一样嘴上有刺，心里有伤，但从不轻易示弱"],"analysis":"张爱玲出身没落名门，父母离异，父亲抽大烟、继母虐待，她十几岁就看清了人情冷暖。二十三岁凭《倾城之恋》《金锁记》一炮而红，写尽男女间的算计与凉薄。她爱胡兰成，爱得低到尘埃里，还是被辜负。晚年她移居美国，离群索居，几乎不见人。她赢在把创伤熬成了才华，输在她太清醒又太骄傲，宁可孤独也不肯和解。","lesson":["独处不是缺陷，是充电的方式，但别让孤独变成围墙","才华可以疗伤，但治不了所有伤，该求助时别硬扛","看透人情是本事，别因此失去爱的能力，那才是真的赢了"],"type":"文宗","title":"名垂青史的文宗"},{"id":"socrates","name":"苏格拉底（Socrates）","era":"公元前5世纪·古希腊","region":"欧洲","role":"哲学家","tags":{"自省":5,"直率":4,"理性":3,"抗争":2},"outcome":"tragic","summary":"古希腊哲学奠基人，靠提问戳破雅典人的虚荣，因挑战传统被判处死刑。","common":["你爱追根究底，他更是个'问题机器'，走到哪儿问到哪儿","你直言不讳，他也从不留情面，当众把'聪明人'问得哑口无言","你重视自我反省，他把'未经审视的人生不值得过'当成人生信条"],"analysis":"苏格拉底一辈子当'精神助产士'，靠提问拆穿雅典人的伪善，得罪的不是某个人，而是一整座城的体面——年轻人跟着他质疑权威，统治者觉得他动摇根基。被控'腐蚀青年'后，他本可认罪或逃走，却坦然喝下毒酒，用死证明原则比性命重要。他的悲剧不在结局，而在那个容不下真话的时代。","lesson":["提问是本事，但别只问不给答案，否则容易成为众矢之的","坚持原则值得尊敬，也要掂量现实代价，留得青山在","真正的智慧是承认自己无知，这能让你永远保持学习心态"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"plato","name":"柏拉图（Plato）","era":"公元前4世纪·古希腊","region":"欧洲","role":"哲学家","tags":{"理想":5,"理性":4,"独处":2,"自省":2},"outcome":"success","summary":"苏格拉底的学生，雅典学园创办者，用《理想国》描绘了西方最早的乌托邦。","common":["你心中有个理想世界，他画了一张更完整的蓝图——《理想国》","你喜欢深度思考，他主张'哲学王'治国，觉得世界该由智者说了算","你享受独处思考，他在学园门口立碑：不懂几何者不得入内"],"analysis":"柏拉图亲眼看着老师苏格拉底被雅典人处死，从此对群众政治彻底失望。他两度去叙拉古辅佐国王实现理想国，都失败，还差点被卖为奴。碰壁后他回雅典办学园，把政治理想写成《理想国》，用思想影响世界，学园延续九百年。现实走不通就换赛道，把理想变成可传承的知识，这就是他的成功。","lesson":["理想主义不是错，但要分清'改变现实'和'构建理论'是两条路","被现实毒打后别硬刚，换条赛道把想法沉淀成作品","想影响世界，先建立自己的'学园'——平台和传承比单打独斗强"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"aristotle","name":"亚里士多德（Aristotle）","era":"公元前4世纪·古希腊","region":"欧洲","role":"学者/哲学家","tags":{"务实":5,"理性":4,"创新":3,"谨慎":2},"outcome":"success","summary":"百科全书式学者，逻辑学、生物学、政治学奠基人，亚历山大大帝的老师。","common":["你讲究实际，他写书前先解剖五百多种动物，绝不空谈","你做事有条理，他首创三段论，把'讲道理'变成一门技术","你尊重事实，他坚持'吾爱吾师，吾更爱真理'，连老师柏拉图都敢反驳"],"analysis":"亚里士多德与老师柏拉图最大的不同：老师仰望星空，他低头看地。他不满足于'理念'，到处收集事实，从动物尸体到各国政体，全部分类研究。这套'观察—归纳—推理'的打法，让他一个人开创了逻辑学、生物学、政治学。他的成功在于务实：先搞清世界实际怎样，再谈应该怎样，所以两千年后他依然是西方学术的起点。","lesson":["空谈误事，先收集事实再下结论，你的观点会扎实很多","敢于反驳权威，但要用证据说话，而不是用情绪","广博不如成体系，把知识分类整理，才能变成可复用的能力"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"alexander","name":"亚历山大大帝（Alexander the Great）","era":"公元前4世纪·马其顿","region":"欧洲","role":"君主/军事家","tags":{"冒险":5,"自信":4,"豪放":3,"革新":2},"outcome":"success","summary":"马其顿国王，二十岁即位，十年间征服波斯，建立横跨欧亚非的大帝国。","common":["你相信'搏一搏单车变摩托'，他二十岁就敢带几万人远征东方","你天生自信，他坚信自己是宙斯之子，用信念带着士兵走了两万公里","你讨厌按部就班，他一路打一路建城，把希腊文化洒遍亚洲"],"analysis":"亚历山大二十岁登基，接手的是底子极好的马其顿。他最大的本事是把'疯狂'变成'战略'：别人觉得翻雪山、穿沙漠是送死，他觉得是出奇制胜，靠胆识横扫波斯，一路打到印度河边。但帝国扩张太快，全靠他个人威望撑着，三十三岁暴病而亡后立刻四分五裂。勇气能征服世界，但没有制度托底的功业，人亡即政息。","lesson":["敢想敢干能成大事，但要把胜利沉淀成制度，否则人走茶凉","自信是燃料，别让它烧成自负，听不进劝是帝王病也是职场病","扩张要配得上管理能力，步子迈太大，根基跟不上就会崩"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"caesar","name":"凯撒（Julius Caesar）","era":"公元前1世纪·古罗马","region":"欧洲","role":"政治家/军事家","tags":{"谋略":5,"冒险":4,"自信":3,"革新":2},"outcome":"tragic","summary":"罗马共和国末期的军事天才和政治家，征服高卢、击败政敌，成为终身独裁官后被刺杀。","common":["你眼光毒、下手快，他渡过卢比孔河时说'骰子已经掷下'，赌上整个罗马","你擅长看透人心，他一边打仗一边写《高卢战记》给自己做政治宣传","你敢于打破常规，他敢把元老院当摆设，自己说了算"],"analysis":"凯撒的成功靠'军事+政治'双开：前线打胜仗，后方写《高卢战记》搞宣传。内战打赢后他集大权于一身，推行改革，连历法都改了。但他把元老们逼到墙角，又公开接受'终身独裁官'头衔，让贵族觉得他要称王。公元前44年3月15日，六十多个元老合谋把他刺死在元老院。他输在功高震主还不懂藏锋。","lesson":["能力再强也别把所有人都得罪光，给对手留活路就是给自己留退路","功劳越大越要低调，树大招风，众矢之的往往死于明枪","改革要照顾利益格局，触动一群人饭碗时，先想好怎么安抚他们"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"napoleon","name":"拿破仑（Napoleon Bonaparte）","era":"19世纪·法国","region":"欧洲","role":"军事家/政治家","tags":{"冒险":5,"自信":4,"抗争":3,"入世":2},"outcome":"fail","summary":"法国军事家、政治家，从炮兵少尉一路成为法兰西皇帝，横扫欧洲，最终兵败滑铁卢。","common":["你相信'我命由我不由天'，他一个科西嘉小个子，硬是当上了法兰西皇帝","你行动力爆棚，他三天能打三场胜仗，军队在他手里快如闪电","你目标感强，他说'不想当将军的士兵不是好士兵'，自己就是最好的例子"],"analysis":"拿破仑的成功是时代加个人能力：法国大革命打碎旧秩序，给了平民出身的他上升通道；而他军事天赋极高，用兵如神，二十多岁当上将军。但野心没有上限：远征俄国，六十万大军冻死雪原；兵败莱比锡被流放，又杀回巴黎上演'百日王朝'，最终在滑铁卢输光所有。他输在把胜利当习惯，忘了战争打的是国力和后勤。","lesson":["逆袭靠实力也靠时代，抓住风口的同时别高估自己","连续赢的时候最危险，狂妄会让人看不见后勤和国力的短板","野心要有边界，学会见好就收，别把所有人逼成你的敌人"],"gender":"male","type":"谋主","title":"运筹帷幄的谋主"},{"id":"buddha","name":"释迦牟尼（Siddhartha Gautama）","era":"公元前6世纪·古印度","region":"亚洲","role":"佛教创始人","tags":{"出世":5,"自省":4,"坚韧":3,"独善":2},"outcome":"retreat","summary":"古印度迦毗罗卫国太子，舍弃王位出家修行，悟道成佛，创立佛教。","common":["你厌倦名利场的喧闹，他贵为太子却觉得锦衣玉食都是牢笼","你喜欢向内看，他放弃苦修和享乐两条极端，悟出'中道'","你追求内心平静，他用四十九年讲法，教人怎么放下执念"],"analysis":"释迦牟尼本是含着金汤匙出生的太子，出城四次看见生老病死，意识到荣华富贵救不了人，二十九岁抛下妻儿出家。苦行六年没开悟，最后在菩提树下静坐四十九天，想通'执念才是苦的根源'。他没有停在自渡，说法四十九年渡所有人。他走'出世'的路，却用出世的心做了最入世的事：先把自己修明白，再去渡别人。","lesson":["物质丰裕不等于内心安宁，定期给自己'断舍离'的时间","走极端最容易崩，找到自己的'中道'才能长久","想帮助别人，先把自己活明白，渡人先渡己"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"jesus","name":"耶稣（Jesus）","era":"1世纪·巴勒斯坦地区","region":"亚洲","role":"基督教创始人","tags":{"兼济":5,"理想":4,"抗争":3,"重情":2},"outcome":"tragic","summary":"基督教创始人，在巴勒斯坦地区传道三年，被罗马当局钉死在十字架上，其思想改变世界。","common":["你心怀悲悯，他专跟税吏、妓女、病人打交道，把爱给了最边缘的人","你坚持信念，他明知上耶路撒冷是死路，依然骑着驴进了城","你重视真诚，他最恨伪善，把道貌岸然的宗教领袖骂作'粉饰的坟墓'"],"analysis":"耶稣出身木匠家庭，三十岁开始传道，核心就一句话：上帝爱每一个人，包括罪人。这套'爱敌人、宽恕人'的学说在底层迅速传开，却让犹太祭司和罗马总督同时紧张——一个怕他挑战权威，一个怕他煽动民变。他被门徒出卖，受审时拒绝辩解，被钉上十字架。但门徒坚信他复活，三百年后基督教成了罗马国教。","lesson":["为信念牺牲值得尊敬，但先想清楚：你的牺牲能不能换来更大价值","撼动旧秩序的人，一定要预估既得利益者的反扑力度","真诚和善良是力量，但要配上自我保护，别让信任成为软肋"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"muhammad","name":"穆罕默德（Muhammad）","era":"7世纪·阿拉伯半岛","region":"亚洲","role":"伊斯兰教创始人","tags":{"坚韧":5,"谋略":4,"革新":3,"务实":2},"outcome":"success","summary":"伊斯兰教创始人，阿拉伯半岛的统一者，将一盘散沙的部落凝聚成一个国家。","common":["你认定的事九头牛拉不回，他在麦加传教十三年，被排挤也不改口","你既有理想又有手段，他既讲经也带兵，信仰和现实两手抓","你重视团结，他把互相仇杀的阿拉伯部落拧成一股绳"],"analysis":"穆罕默德四十岁在希拉山洞得到启示，开始传'认主独一'的一神教，被麦加贵族排挤后带信徒迁往麦地那——这次'迁徙'成了伊斯兰历元年。在麦地那他既是宗教领袖也是政治领袖，把信仰、利益、部落恩怨揉进一套体系。八年后和平光复麦加，阿拉伯半岛基本统一。理想主义者很多，但他把天启变成了切实可行的社会制度。","lesson":["光有理想不够，把理念变成制度、组织和利益分配才立得住","遇到打压别硬碰，战略性转移往往能打开新局面","团结人心要靠共同愿景，也要靠实实在在的利益安排"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"da-vinci","name":"达·芬奇（Leonardo da Vinci）","era":"15世纪·意大利","region":"欧洲","role":"画家/科学家/发明家","tags":{"创新":5,"随性":4,"独处":3,"务虚":2},"outcome":"success","summary":"文艺复兴全才，画家、科学家、发明家，代表作《蒙娜丽莎》《最后的晚餐》。","common":["你好奇心爆棚，他从人体解剖到飞行器什么都想搞明白","你喜欢边玩边学，他画鸡蛋能琢磨光影，研究鸟翅膀就画飞行器草图","你不太在乎别人眼光，他画画经常烂尾，却件件是传世之作"],"analysis":"达·芬奇没上过正规大学，全靠自学。他看见什么研究什么：解剖尸体画肌肉，观察水流画漩涡，研究鸟飞设计扑翼机，手稿超前时代几百年。他也有'毛病'：兴趣太广，画作经常烂尾，《蒙娜丽莎》磨了十几年。但他把好奇心变成方法论——先观察、再提问、再实验，一辈子只留十几幅画，却幅幅改变艺术史。","lesson":["好奇心是最好的老师，保持'这玩意怎么回事'的追问习惯","兴趣广不是毛病，但要挑一两个方向深挖到极致","慢工出细活，真正值钱的作品值得你反复打磨"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"columbus","name":"哥伦布（Christopher Columbus）","era":"15世纪·西班牙","region":"欧洲","role":"航海家","tags":{"冒险":5,"固执":4,"自信":3,"务实":2},"outcome":"success","summary":"热那亚航海家，坚信地球是圆的，横渡大西洋'发现'美洲，开启大航海时代。","common":["你认准的事谁说都不听，他坚信向西能到东方，被葡萄牙、西班牙拒了多次也不放弃","你敢于冒险，他带着三条船就敢闯未知的大西洋","你目标感极强，他航行的目的很纯粹：黄金、香料，还有名气"],"analysis":"哥伦布的理论不新鲜，问题是他把地球周长算小了，以为向西几千里就是日本——这个'错误'反而成就了他。1492年他带三艘船出发，漂了两个月，船员差点哗变，终于踩上巴哈马群岛，至死都以为到了印度。他的远航打通新旧大陆，也开启殖民掠夺。一个坚信错误信念却足够固执的人，撞开了新时代的大门。","lesson":["有时候'算错'不可怕，敢于行动比算得精确更重要","被拒绝十次别气馁，换个赞助人继续推销你的方案","光有信念不够，还要会管理团队——船员哗变比风浪更致命"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"galileo","name":"伽利略（Galileo Galilei）","era":"17世纪·意大利","region":"欧洲","role":"天文学家/物理学家","tags":{"创新":5,"抗争":4,"理性":3,"固执":2},"outcome":"tragic","summary":"意大利天文学家、物理学家，用望远镜观测天空力挺日心说，被宗教裁判所审判。","common":["你只信证据，他亲手磨镜片造望远镜，看见木星卫星才敢下结论","你敢质疑权威，他说'圣经教人怎样进天堂，不教天体怎样运行'","你有点倔，教廷让他闭嘴，他写了本对话录继续宣传日心说"],"analysis":"伽利略赶上好时代：望远镜刚发明，他改进后指向星空，看到木星卫星和月球环形山，直接打脸'地心说'。他高调宣传日心说，1616年被教廷警告。消停几年后，他以为老朋友当上教皇就安全了，写了本对话录继续论证，教皇却发现自己被书里那个'傻瓜'影射，勃然大怒。1633年，七十岁的他被迫跪着悔罪，终身软禁。","lesson":["证据再硬，也要考虑对手的承受力，别高估理性能赢过权力","别把'老朋友上位'当成安全保证，人情在体制面前很脆弱","坚持真理要有策略，曲线救国有时比正面硬刚活得更久"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"newton","name":"牛顿（Isaac Newton）","era":"17世纪·英国","region":"欧洲","role":"物理学家/数学家","tags":{"理性":5,"独处":4,"固执":3,"务实":2},"outcome":"success","summary":"英国物理学家、数学家，提出万有引力和三大运动定律，科学史上最伟大的头脑之一。","common":["你习惯独处思考，他一思考就忘记吃饭，全身心扑进问题里","你追求本质，别人看见苹果落地，他看见了万有引力","你有点轴，他跟莱布尼茨争微积分发明权，争了几十年"],"analysis":"牛顿的成功有迹可循：他站在巨人肩上——伽利略的运动学、开普勒的行星定律都是现成素材，而他厉害在把零散事实统一成几条公式：万有引力一个公式，既解释苹果落地，又解释行星绕日。1665年瘟疫停课，他在乡下两年，微积分、光学、万有引力全在这段'隔离期'想出来了。","lesson":["站在前人肩膀上不是抄袭，消化透再创新才是正路","留出大块不被打扰的时间，深度思考才出大成果","专注一个领域做到极致，比处处开花更可能留下传世成就"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"darwin","name":"达尔文（Charles Darwin）","era":"19世纪·英国","region":"欧洲","role":"博物学家","tags":{"隐忍":5,"谨慎":4,"坚韧":3,"务实":2},"outcome":"success","summary":"英国博物学家，进化论奠基人，著有《物种起源》，用自然选择解释生命演化。","common":["你观察力强，他跟着军舰环球五年，一路收集标本一路记笔记","你做事谨慎，他把进化论压了二十年才发表，反复打磨证据","你耐得住寂寞，他躲在家里研究藤壶，一研究就是八年"],"analysis":"达尔文二十二岁登上'小猎犬号'环球航行五年，在加拉帕戈斯群岛发现不同岛屿的雀鸟喙形各不相同，这个细节在他脑子里发酵了几十年。回国后他大量收集证据，越研究越确信'物种会变'，但他深知这理论会引爆宗教界的怒火，稿子压了二十年，直到华莱士寄来相似观点才被迫加速发表《物种起源》。","lesson":["好点子要沉得住气，用时间把想法打磨成铁证","旅行和见世面是最好的灵感来源，观察力是核心竞争力","重要观点发布前做足准备，能扛住质疑的理论才立得住"],"gender":"male","type":"守成者","title":"稳守基业的守成者"},{"id":"marx","name":"马克思（Karl Marx）","era":"19世纪·德国","region":"欧洲","role":"思想家/经济学家","tags":{"理想":5,"抗争":4,"革新":3,"务虚":2},"outcome":"fail","summary":"德国思想家，马克思主义创始人，与恩格斯合著《共产党宣言》，著有《资本论》。","common":["你爱思考大问题，他从'人为什么穷'一路追问到整个资本主义制度","你眼里揉不得沙子，他看见工人一天干十六个小时却吃不饱，就决定写书讨公道","你认准的事九头牛拉不回，他流亡半生、穷得揭不开锅也没放弃写作"],"analysis":"马克思是富二代，二十四岁就立志'为人类工作'。他研究政治经济学，发现工人贫困不是运气问题，而是制度问题——资本家靠剥削剩余价值发财。他跟恩格斯合写《共产党宣言》，又花几十年写《资本论》。但他生前很惨：流亡伦敦，七个孩子夭折四个，靠恩格斯接济度日。思想太超前，就注定要在当世吃苦。","lesson":["超前半个世纪的思想，注定要忍受当世的冷落，想清楚再上路","研究问题要追到根子上，治标不治本不如不治","找个能托底的合作伙伴，理想才能撑过现实寒冬"],"gender":"male","type":"文宗","title":"名垂青史的文宗"},{"id":"edison","name":"爱迪生（Thomas Edison）","era":"19世纪·美国","region":"美洲","role":"发明家/企业家","tags":{"务实":5,"创新":4,"固执":3,"坚韧":2},"outcome":"success","summary":"美国发明大王，一生获得一千多项专利，改良电灯、留声机，创办通用电气前身。","common":["你讲究实用，他说'天才是1%的灵感加99%的汗水'，电灯是他试了上千种材料试出来的","你脸皮厚心态好，他失败上千次还说'我只是找到了一千种不行的方法'","你懂得把想法变成产品，他不光发明，还建发电厂、铺电网，让电灯真正点亮千家万户"],"analysis":"爱迪生不是第一个发明电灯的人，但第一个让电灯'能用、能卖'：他试了六千多种灯丝材料，最后用竹炭丝让灯泡亮一千多小时。更厉害的是商业头脑——他明白光有灯泡没用，得建发电站、拉电网，所以建了世界上第一座商用发电厂，把发明变成生意。但他晚年固执坚持直流电，跟交流电死磕，押错技术路线，还跟特斯拉闹翻。","lesson":["失败不可怕，把每次失败当成排除一个错误选项","创新要闭环：不光做出东西，还要让它能落地、能商用","技术路线别死磕，该转向就转向，固执己见会错过时代"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"einstein","name":"爱因斯坦（Albert Einstein）","era":"20世纪·美国","region":"美洲","role":"物理学家","tags":{"理性":5,"随性":4,"创新":3,"独处":2},"outcome":"success","summary":"德裔美国物理学家，提出相对论，重新定义时间、空间和引力，1921年获诺贝尔物理学奖。","common":["你爱打破常规，他十六岁就想：追上光会看到什么？这个'胡思乱想'成了相对论的起点","你喜欢独处，他小时候说话晚，长大却靠'孤独思考'想通了宇宙的规律","你不迷信权威，他说'想象力比知识更重要'，因为知识有限，想象无边"],"analysis":"爱因斯坦不是考试型选手，小时候被老师认为'不会有出息'，大学毕业后在专利局当小职员。但他有个习惯：别人下班休息，他下班做'思想实验'——想象追上光速会怎样，想象电梯自由落体会怎样。1905年他二十六岁，一年发表五篇改变物理学的论文；十年后广义相对论预言光线会被太阳弯曲，1919年被日食观测证实。","lesson":["别被'没出息'的评价困住，按自己的节奏成长","每天留点时间'胡思乱想'，伟大的问题都始于好奇","想象力加持续思考，比死记硬背的知识更能改变世界"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"tesla","name":"特斯拉（Nikola Tesla）","era":"20世纪·美国","region":"美洲","role":"发明家","tags":{"创新":5,"理想":4,"独处":3,"务虚":2},"outcome":"fail","summary":"塞尔维亚裔美国发明家，交流电之父，一生有上千项发明，晚年却穷困潦倒。","common":["你脑子里全是奇思妙想，他在脑海中就能完整'运行'一台机器，号称不需要图纸","你有点社恐，他终身未婚，晚年独自住在酒店，跟鸽子做朋友","你不太在乎钱，他放弃了交流电的巨额专利费，说'我的贡献是给全人类的'"],"analysis":"特斯拉是天才中的天才：他发明交流电系统，让电可以远距离传输，直接赢了'电流之战'，这套方案沿用至今。但他是个糟糕的'商人'：把交流电专利费让给投资人，说'不要钱，只要名声'；又沉迷宏大烧钱的项目，无线输电塔建到一半没钱烂尾。晚年靠养老金度日，1943年孤身死在纽约酒店。","lesson":["才华要配上商业头脑，清高可以，但别拿生存开玩笑","想法太超前要会分步落地，一口吃不成胖子，塔建一半等于没建","人脉和合作是放大器，单打独斗的天才走不远"],"gender":"male","type":"革新者","title":"开风气的革新者"},{"id":"marie-curie","name":"居里夫人（Marie Curie）","era":"20世纪·法国","region":"欧洲","role":"物理学家/化学家","tags":{"坚韧":5,"务实":4,"理性":3,"独处":2},"outcome":"success","summary":"法国物理学家、化学家，发现钋和镭，两获诺贝尔奖，放射性研究的先驱。","common":["你专注起来六亲不认，她在漏雨的棚屋里搅拌几吨沥青矿渣，就为了提炼一克镭","你不在乎物质享受，诺贝尔奖奖金她转手就买实验室设备，连奖章都给孩子当玩具","你坚韧抗压，丈夫去世后她接过教鞭，成为巴黎大学第一位女教授"],"analysis":"居里夫人是'寒门贵子'的极致版本：出身寒门，在巴黎住阁楼、啃面包，冬天冷得把椅子压在被子上睡。她跟丈夫在漏雨的棚屋里，用最原始的方法从几吨沥青铀矿渣里提炼出镭，整整四年，手上全是放射性灼伤的疤。她两获诺贝尔奖，却把方法无偿公开，不申请专利。晚年因长期接触放射性物质患白血病去世。","lesson":["条件差不是借口，专注和坚持能弥补起点的差距","真正的大师都舍得分享，垄断知识走不远，开放反而赢得世界","热爱是有代价的，拼命工作的同时别忘了身体是本钱"],"gender":"female","type":"革新者","title":"开风气的革新者"},{"id":"washington","name":"华盛顿（George Washington）","era":"18世纪·美国","region":"美洲","role":"美国首任总统","tags":{"自律":5,"务实":4,"坚韧":3,"谨慎":2},"outcome":"success","summary":"美国国父、首任总统，领导独立战争获胜，主动放弃权力，开创总统任期不超过两届的传统。","common":["你沉稳靠谱，他打了八年独立战争，胜仗不多但没崩盘","你自律克制，他打赢了仗却拒绝称王，解甲归田","你顾全大局，他当了两任总统就主动交权，急流勇退"],"analysis":"华盛顿不是军事天才，独立战争输多赢少，但他有别人没有的本事：扛得住。八年战争，军队缺粮缺饷，他硬是把大陆军拖到法国援军到来。更难得的是他懂得'权力的边界'：手下军官想拥立他当国王，他拒绝；当了两任总统声望正盛，他主动卸任。他的成功不在胜仗，而在他用一次次放弃权力，为美国立下和平交接的规矩。","lesson":["不是每次都要赢，扛住不崩盘、笑到最后才是真本事","权力和名声最考验人，主动放手反而赢得更长久的尊重","给后人立规矩，比留一堆功劳更有价值"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"lincoln","name":"林肯（Abraham Lincoln）","era":"19世纪·美国","region":"美洲","role":"美国第16任总统","tags":{"坚韧":5,"变通":4,"重情":3,"务实":2},"outcome":"tragic","summary":"美国第16任总统，领导南北战争，废除奴隶制，维护联邦统一，后被刺杀。","common":["你认准方向就不动摇，他打赢南北战争靠的就是'联邦必须完整'的执念","你懂得变通，他为了大局先搁置废奴，时机成熟再签《解放宣言》","你重感情，他被刺杀那天还在笑，说要去剧院放松一下"],"analysis":"林肯出身贫寒，只上过不到一年学，靠自学当上律师。他当总统时美国正在裂开：南方七个州宣布独立。他先用'维护联邦统一'作开战理由稳住边界州，等战局需要时再签《解放宣言》，把战争变成'解放奴隶的战争'。战争赢了，联邦保住，奴隶解放，但他没能看到和平的果实——1865年4月在剧院被刺杀。","lesson":["目标可以坚定，手段必须灵活，分步走才能办成大事","把对手变成队友，是最高级的领导力","为宏大目标奋斗时，也别忘了自己的安全，胜利往往在最放松时失守"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"churchill","name":"丘吉尔（Winston Churchill）","era":"20世纪·英国","region":"欧洲","role":"英国首相","tags":{"坚韧":5,"抗争":4,"豪放":3,"自信":2},"outcome":"success","summary":"英国首相，二战中领导英国抵抗纳粹，著名的'铁幕演说'拉开了冷战序幕。","common":["你越到关键时刻越来劲，他在英国最黑暗的1940年说：'我们绝不投降'","你口才了得，他的演讲把整个英国拧成一股绳，连美国都被打动","你爱好广泛，他写书拿过诺贝尔文学奖，抽雪茄、画画、砌墙样样在行"],"analysis":"丘吉尔的前半生不顺：一战时策划的达达尼尔战役惨败，他引咎辞职，被嘲笑是'过气政客'。但1940年希特勒横扫欧洲，英国危在旦夕，六十五岁的他临危受命：用演讲稳住民心，用强硬态度拒绝投降，用私人交情拉美国入局，还跟斯大林结盟，把'不可能赢'的战争拖成'最后赢'的战争。战后他却被选民选了下去。","lesson":["低谷期别气馁，历史会给你第二次机会，关键是准备好","会表达是核心竞争力，把道理讲清楚就能调动人心","赢下战争也要学会赢下和平，功劳再大也要尊重民意"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"gandhi","name":"甘地（Mahatma Gandhi）","era":"20世纪·印度","region":"亚洲","role":"政治领袖","tags":{"抗争":5,"隐忍":4,"兼济":3,"坚韧":2},"outcome":"success","summary":"印度'圣雄'，非暴力不合作运动领袖，领导印度脱离英国殖民统治获得独立。","common":["你相信温和的力量，他不拿枪不流血，用绝食和纺车对抗大英帝国","你身体力行，他自己纺布、吃素、住贫民窟，要求别人做到的自己先做到","你极其坚韧，他坐牢坐了几十年，绝食抗议无数次，从没动摇过"],"analysis":"甘地对抗的是当时世界上最强的帝国，武器很特别：非暴力不合作——号召印度人不买英国布、不交盐税、不上英国学校，用'不配合'让殖民统治失去成本。暴力起义只会招来血腥镇压，而'打不还手'的民众反而赢得全世界同情。英国扛不住舆论和财政压力，1947年同意印度独立。但他没能善终：1948年被刺杀。","lesson":["真正的力量不是拳头，是'不合作'的勇气和千万人的团结","以身作则是最强的领导力，自己做不到就别要求别人","和平理想也要警惕极端势力，温和派往往最先受伤"],"gender":"male","type":"枭雄","title":"执掌乾坤的枭雄"},{"id":"joan-of-arc","name":"圣女贞德（Joan of Arc）","era":"15世纪·法国","region":"欧洲","role":"军事领袖/民族英雄","tags":{"抗争":5,"理想":4,"自信":3,"坚韧":2},"outcome":"tragic","summary":"法国民族英雄，农家少女率军解除奥尔良之围，助查理七世加冕，后被处以火刑。","common":["你认定的事敢豁出去，她一个十七岁农家女，说自己听见神谕，要去见太子","你信念感极强，她不懂军事，却凭着一股'上帝站在法国这边'的劲头鼓舞了全军","你宁折不弯，她被捕后受尽审讯，至死不肯否认自己的使命"],"analysis":"百年战争后期法国节节败退，英军围困奥尔良。十七岁的农家少女声称受神谕指引，跋涉几百公里见到太子，讨来一支军队。她举旗冲在阵前，奇迹般解了奥尔良之围，护送查理到兰斯加冕。但好运到巴黎城下为止：撤退时被勃艮第人俘虏，十九岁被烧死在鲁昂广场。被神迹推上神坛的少女，神迹不再显灵时，就成了各方清算的靶子。","lesson":["信念能创造奇迹，但奇迹不能当饭吃，实力和退路都得备着","被捧上神坛时最危险，保持清醒 function dotScore(userTags, ancientTags) {
  let s = 0
  for (const [t, a] of Object.entries(ancientTags || {})) s += (userTags[t] || 0) * a
  return s
}
function matchAncients(userTags, ancients, topN) {
  const scored = ancients.map((a) => {
    const score = dotScore(userTags, a.tags || {})
    const matchedTags = Object.keys(userTags)
      .filter((t) => (a.tags || {})[t] && userTags[t] > 0)
      .sort((x, y) => userTags[y] - userTags[x])
    return { ancient: a, score, matchedTags }
  })
  scored.sort((x, y) => y.score - x.score)
  return scored.slice(0, topN)
}
function matchWithGender(userTags, ancients, topN, gender) {
  const global = matchAncients(userTags, ancients, topN + 3)
  const main = global[0]
  const mainId = main ? main.ancient.id : null
  const matches = global.slice(0, topN)
  const usedIds = new Set(matches.map((r) => r.ancient.id))
  let sameGender = null
  if (gender && main && main.ancient.gender && main.ancient.gender !== gender) {
    sameGender = global.find((r) => r.ancient.gender === gender && !usedIds.has(r.ancient.id)) || null
    if (!sameGender) {
      const scored = ancients.map((a) => {
        const score = dotScore(userTags, a.tags || {})
        const matchedTags = Object.keys(userTags)
          .filter((t) => (a.tags || {})[t] && userTags[t] > 0)
          .sort((x, y) => userTags[y] - userTags[x])
        return { ancient: a, score, matchedTags }
      })
      scored.sort((x, y) => y.score - x.score)
      sameGender = scored.find((r) => r.ancient.gender === gender && !usedIds.has(r.ancient.id)) || null
    }
  }
  return { matches: matches, sameGender }
}
function accumulateTags(userTags, optionTags) {
  const out = { ...userTags }
  for (const [tag, score] of Object.entries(optionTags || {})) out[tag] = (out[tag] || 0) + score
  return out
}
function buildQuestionNorm(questions) {
  const total = {}
  for (const q of questions) {
    for (const o of q.options) {
      for (const [t, s] of Object.entries(o.tags)) total[t] = (total[t] || 0) + s
    }
  }
  return total
}
function normalizeTags(userTags, norm) {
  const out = {}
  for (const [t, s] of Object.entries(userTags)) out[t] = (s / (norm[t] || 1)) * 10
  return out
}

function shuffle(arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}
function coverageScore(picked) {
  const cnt = {}
  for (const q of picked) for (const o of q.options) for (const t of Object.keys(o.tags)) cnt[t] = (cnt[t] || 0) + 1
  const vals = Object.values(cnt)
  if (vals.length < 25) return Infinity
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length
  return vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length
}
function pickQuestions(all, count) {
  const attention = all.filter(q => q.attention)
  const normal = all.filter(q => !q.attention)
  const need = Math.max(0, count - attention.length)
  if (need >= normal.length) return shuffle([...attention, ...normal])
  let best = null, bestScore = Infinity
  for (let i = 0; i < 100; i++) {
    const picked = shuffle(normal).slice(0, need)
    const score = coverageScore(picked)
    if (score < bestScore) { bestScore = score; best = picked }
  }
  return shuffle([...attention, ...best])
}

const $ = (id) => document.getElementById(id)

// ===== 视图切换 =====
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'))
  $(id).classList.add('active')
  window.scrollTo(0, 0)
}

// ===== 首页 =====
function start() {
  current = 0; userTags = {}; answers = []; chosenIdx = -1; attentionMiss = 0
  quizQuestions = pickQuestions(QUESTIONS, 30) // 随机抽题, 反复测不重复
  renderQ(); show('quiz')
}

// ===== 答题 =====
function renderQ() {
  const q = quizQuestions[current]
  $('q-progress').textContent = (current + 1) + ' / ' + total
  $('q-bar-fill').style.width = ((current) / total * 100) + '%'
  $('q-text').textContent = q.scenario
  const opts = $('q-options')
  opts.innerHTML = ''
  chosenIdx = -1
  q.options.forEach((opt, i) => {
    const el = document.createElement('div')
    el.className = 'option'
    el.innerHTML = '<span class="opt-mark">' + MARKS[i] + '</span><span class="opt-text">' + opt.text + '</span>'
    el.onclick = () => choose(i, el)
    opts.appendChild(el)
  })
  $('q-back').style.visibility = current === 0 ? 'hidden' : 'visible'
}

function choose(i, el) {
  if (chosenIdx !== -1) return
  chosenIdx = i
  el.classList.add('chosen')
  const q = quizQuestions[current]
  if (q.attention) {
    if (i !== q.correctIndex) attentionMiss++
  } else {
    userTags = accumulateTags(userTags, q.options[i].tags)
  }
  answers.push(i)
  setTimeout(() => {
    if (current >= total - 1) finish()
    else { current++; renderQ() }
  }, 260)
}

function goBack() {
  if (current === 0) return
  const last = answers.pop()
  const prevQ = quizQuestions[current - 1]
  if (prevQ.attention) {
    if (last !== prevQ.correctIndex) attentionMiss = Math.max(0, attentionMiss - 1)
  } else {
    const tags = prevQ.options[last].tags
    for (const [t, s] of Object.entries(tags)) {
      userTags[t] = (userTags[t] || 0) - s
      if (userTags[t] <= 0) delete userTags[t]
    }
  }
  current--
  renderQ()
}

function finish() {
  show('loading')
  // 归一化用户画像: 高频标签因选项多而得分虚高, 归一化后反映相对偏好
  userTags = normalizeTags(userTags, QUESTION_NORM)
  setTimeout(() => {
    matches = matchAncients(userTags, ANCIENTS, 3)
    renderResult()
    show('result')
  }, 1500)
}

// ===== 结果 =====
// 排名降档制: Top1 95-98 / Top2 84-89 / Top3 75-80, 体现差异
function pct(score, rank) {
  const max = matches[0] ? matches[0].score : 1
  if (!max) return 90
  const ratio = score / max
  const base = [95, 86, 77][rank] || 70
  const adj = Math.round((ratio - 0.8) * 12)
  return Math.min(98, Math.max(60, base + adj))
}

function renderResult() {
  const top = matches[0]
  if (!top) return
  const a = top.ancient
  // 作答可信度提示
  const warnBox = $('r-attention')
  if (attentionMiss > 0) {
    warnBox.textContent = '⚠️ 检测到 ' + attentionMiss + ' 道注意力检测题回答不一致，结果可能不完全准确，建议重新测一次'
    warnBox.style.display = 'block'
  } else {
    warnBox.style.display = 'none'
  }
  $('r-title').textContent = a.title || ''
  $('r-name').textContent = a.name
  $('r-role').textContent = a.era + ' · ' + a.region + ' · ' + a.role
  $('r-pct').textContent = '匹配度 ' + pct(top.score, 0) + '%'
  $('r-summary').textContent = a.summary
  // 共同点
  $('r-common').innerHTML = a.common.map((c, i) =>
    '<div class="line"><span class="ln">' + (i + 1) + '</span><span>' + c + '</span></div>').join('')
  // 成败分析
  $('r-analysis-title').textContent = outcomeTitle(a.outcome, a.gender)
  $('r-analysis').textContent = a.analysis
  // 启示
  $('r-lesson').innerHTML = a.lesson.map((l, i) =>
    '<div class="line"><span class="ln">' + (i + 1) + '</span><span>' + l + '</span></div>').join('')
  // 相似古人
  const others = matches.slice(1)
  $('r-others').innerHTML = others.length ? others.map((o, i) =>
    '<div class="other" onclick="showDetail(' + (i + 1) + ')"><span class="o-name">' + o.ancient.name + '</span><span class="o-info">' + o.ancient.era + ' · ' + (o.ancient.title || o.ancient.role) + '</span><span class="o-pct">' + pct(o.score, i + 1) + '%</span><span class="o-arrow">›</span></div>'
  ).join('') : '<div class="other">仅此一位，历史独一份</div>'
  $('r-share-text').textContent = '我测出了最像我的古人是「' + a.name + '」（' + (a.title || '') + '），你也来试试！'
}

function openSame() {
  if (sameGender) showDetailFor(sameGender)
}

// ===== 相似古人详情弹层 =====
function showDetail(idx) {
  showDetailFor(matches[idx])
}
function showDetailFor(m) {
  if (!m) return
  const a = m.ancient
  $('d-name').textContent = a.name
  $('d-role').textContent = a.era + ' · ' + a.region + ' · ' + a.role
  $('d-pct').textContent = '匹配度 ' + pct(m.score, 1) + '%'
  $('d-summary').textContent = a.summary
  $('d-common').innerHTML = a.common.map((c, i) =>
    '<div class="line"><span class="ln">' + (i + 1) + '</span><span>' + c + '</span></div>').join('')
  $('d-analysis-title').textContent = outcomeTitle(a.outcome, a.gender)
  $('d-analysis').textContent = a.analysis
  $('d-lesson').innerHTML = a.lesson.map((l, i) =>
    '<div class="line"><span class="ln">' + (i + 1) + '</span><span>' + l + '</span></div>').join('')
  $('modal').classList.add('show')
  document.body.style.overflow = 'hidden'
}

function closeDetail() {
  $('modal').classList.remove('show')
  document.body.style.overflow = ''
}

</script>
